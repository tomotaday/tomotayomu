<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ Narou API JSONP鑑定 v6.26</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:16px;line-height:1.5;background:#f7f7f7;color:#222}
h1{font-size:20px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #bbb}
button{font-size:16px;padding:10px 14px;margin:4px;border-radius:10px;border:1px solid #aaa;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🧪 ともたよむ Narou API JSONP鑑定・切り込み隊 v6.26</h1>

<div class="card">
<h2>目的</h2>
<p>v6.25でscriptタグによる通信が成功したため、Narou APIが<strong>JSONP（callback）方式</strong>でデータをJavaScriptへ渡せるか確認する。</p>
<p>軽い1件取得条件で、callback名を指定してscriptタグから読み込む。</p>
<p class="small">本棚・R18・GASは使用しない。</p>
</div>

<div class="card">
<button id="run">▶ JSONP鑑定開始</button>
<button id="copy">📋 結果をコピー</button>
<button id="clear">🧹 ログ消去</button>
</div>

<div class="card"><pre id="log">【待機中】</pre></div>

<script>
const BASE="https://api.syosetu.com/novelapi/api/";
const logEl=document.getElementById("log");
let seq=0;
let received=false;

function add(s){if(logEl.textContent==="【待機中】")logEl.textContent="";logEl.textContent+=s+"\\n";}

window.tomotaYomuJsonp=function(data){
 received=true;
 add("🟢 callback実行: tomotaYomuJsonp");
 try{
   add("受信データ型: "+typeof data);
   add("allcount: "+(data?.[0]?.allcount ?? "なし"));
   add("先頭データ: "+JSON.stringify(data?.[1] ?? data?.[0] ?? null));
 }catch(e){add("callback処理中エラー: "+String(e));}
};

function runJsonp(){
 const id="jsonp_"+(++seq);
 const s=document.createElement("script");
 const p=new URLSearchParams();
 p.set("lastup","sevenday");
 p.set("of","n-gl-ga");
 p.set("lim","1");
 p.set("st","1");
 p.set("out","json");
 p.set("callback","tomotaYomuJsonp");
 const url=BASE+"?"+p.toString()+"&_cb="+Date.now();
 add("URL: "+url);
 add("開始: "+new Date().toLocaleString("ja-JP"));
 const t=performance.now();
 s.id=id;s.src=url;
 s.onload=()=>{
   add("loadイベント: 発生 / "+Math.round(performance.now()-t)+"ms");
   if(received)add("判定: 🟢 JSONPでデータ受信成功");
   else add("判定: 🟡 script通信は成功したがcallbackは実行されず");
   try{s.remove()}catch(e){}
   add("【テスト完了】");
 };
 s.onerror=()=>{
   add("errorイベント: 発生 / "+Math.round(performance.now()-t)+"ms");
   add("判定: 🔴 JSONP読み込み失敗");
   try{s.remove()}catch(e){}
   add("【テスト完了】");
 };
 document.head.appendChild(s);
}

document.getElementById("run").onclick=()=>{
 const b=document.getElementById("run");b.disabled=true;logEl.textContent="";received=false;
 add("【v6.26 開始】");
 add("Narou API JSONP鑑定");
 runJsonp();
 setTimeout(()=>{if(!received && !logEl.textContent.includes("【テスト完了】")){add("⏱ callback待機時間終了");add("判定: 🔴 callbackは確認できず");add("【テスト完了】"}b.disabled=false},5000);
 setTimeout(()=>{b.disabled=false},5200);
};

document.getElementById("clear").onclick=()=>logEl.textContent="【待機中】";
document.getElementById("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText(logEl.textContent);document.getElementById("copy").textContent="✅ コピーしました";setTimeout(()=>document.getElementById("copy").textContent="📋 結果をコピー",1200)}
 catch(e){alert("コピーできませんでした。ログを長押ししてコピーしてください。")}
};
</script>
</body>
</html>
