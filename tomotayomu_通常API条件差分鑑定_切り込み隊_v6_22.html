<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ 通常API 条件差分鑑定 v6.22</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:16px;line-height:1.5;background:#f7f7f7;color:#222}
h1{font-size:20px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #bbb}
button{font-size:16px;padding:10px 14px;margin:4px;border-radius:10px;border:1px solid #aaa;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🧪 ともたよむ 通常API 条件差分鑑定・切り込み隊 v6.22</h1>
<div class="card">
<p><b>目的：</b> v6.21で失敗した長期間lastupと、過去に成功した短期間条件を同じページから比較する。</p>
<p>① 直近48時間　② 直近7日間（sevenday）③ 直近48時間＋JSONP風out=javascriptではなくJSONのまま、の3条件。</p>
<p class="small">API以外は実行しない。各URL・HTTP・本文先頭を記録する。</p>
</div>
<div class="card">
<button id="run">▶ 条件差分鑑定</button>
<button id="copy">📋 結果をコピー</button>
<button id="clear">🧹 ログ消去</button>
</div>
<div class="card"><pre id="log">【待機中】</pre></div>
<script>
const BASE="https://api.syosetu.com/novelapi/api/";
const logEl=document.getElementById("log");
function add(s){if(logEl.textContent==="【待機中】")logEl.textContent="";logEl.textContent+=s+"\\n";}
function urlFor(kind){
 const now=Math.floor(Date.now()/1000);
 const p=new URLSearchParams();
 if(kind==="48h")p.set("lastup",(now-48*3600)+"-"+now);
 if(kind==="7d")p.set("lastup","sevenday");
 p.set("of","n-gl-ga");p.set("lim","500");p.set("st","1");p.set("out","json");
 return BASE+"?"+p.toString();
}
async function one(label,url){
 add("\\n===== "+label+" =====");
 add("URL: "+url);
 const t=performance.now();
 try{
  const r=await fetch(url,{cache:"no-store"});
  const body=await r.text();
  add("HTTP "+r.status+" / "+Math.round(performance.now()-t)+"ms");
  add("本文先頭: "+body.slice(0,500));
 }catch(e){
  add("🔴 fetch失敗: "+String(e));
 }
}
async function run(){
 const b=document.getElementById("run");b.disabled=true;logEl.textContent="";
 add("【v6.22 開始】");
 add("通常APIの条件差分のみ");
 await one("① 直近48時間",urlFor("48h"));
 await new Promise(r=>setTimeout(r,700));
 await one("② sevenday",urlFor("7d"));
 await new Promise(r=>setTimeout(r,700));
 const u=urlFor("48h").replace("&out=json","");
 add("\\n===== ③ 直近48時間・out省略 =====");
 add("URL: "+u);
 const t=performance.now();
 try{
  const r=await fetch(u,{cache:"no-store"});
  const body=await r.text();
  add("HTTP "+r.status+" / "+Math.round(performance.now()-t)+"ms");
  add("本文先頭: "+body.slice(0,500));
 }catch(e){add("🔴 fetch失敗: "+String(e));}
 add("\\n【テスト完了】");b.disabled=false;
}
document.getElementById("run").onclick=run;
document.getElementById("clear").onclick=()=>logEl.textContent="【待機中】";
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(logEl.textContent);document.getElementById("copy").textContent="✅ コピーしました";setTimeout(()=>document.getElementById("copy").textContent="📋 結果をコピー",1200)}catch(e){alert("コピーできませんでした。ログを長押ししてコピーしてください。")}};
</script>
</body>
</html>
