<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ Narou API JSONP鑑定 v6.26 修正版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:16px;line-height:1.5;background:#f7f7f7;color:#222}
h1{font-size:20px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #bbb}
button{font-size:16px;padding:10px 14px;margin:4px;border-radius:10px;border:1px solid #aaa;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🧪 ともたよむ Narou API JSONP鑑定・切り込み隊 v6.26 修正版</h1>
<div class="card">
<h2>目的</h2>
<p>scriptタグ経由でNarou APIからJSONPとしてデータを受け取れるか確認する。</p>
<p class="small">本棚・R18・GASは使用しない。前版のボタン処理を単純化した修正版。</p>
</div>
<div class="card">
<button type="button" id="run">▶ JSONP鑑定開始</button>
<button type="button" id="copy">📋 結果をコピー</button>
<button type="button" id="clear">🧹 ログ消去</button>
</div>
<div class="card"><pre id="log">【待機中】</pre></div>
<script>
var API="https://api.syosetu.com/novelapi/api/?lastup=sevenday&of=n-gl-ga&lim=1&st=1&out=json&callback=tomotaYomuJsonp";
var logEl=document.getElementById("log");
var received=false;
var finished=false;

function add(s){
  if(logEl.textContent==="【待機中】") logEl.textContent="";
  logEl.textContent += s + "\n";
}

window.tomotaYomuJsonp=function(data){
  received=true;
  add("🟢 callback実行: tomotaYomuJsonp");
  add("受信データ型: "+typeof data);
  try{
    add("allcount: "+(data && data[0] ? data[0].allcount : "なし"));
    add("先頭データ: "+JSON.stringify(data && data[1] ? data[1] : data));
  }catch(e){
    add("callback表示エラー: "+e);
  }
};

function finish(msg){
  if(finished)return;
  finished=true;
  add(msg);
}

document.getElementById("run").addEventListener("click",function(){
  if(!this.disabled){
    this.disabled=true;
    logEl.textContent="";
    received=false;
    finished=false;
    add("【v6.26 開始】");
    add("Narou API JSONP鑑定");
    add("URL: "+API);
    add("開始: "+new Date().toLocaleString("ja-JP"));

    var s=document.createElement("script");
    var started=performance.now();
    s.src=API+"&_cb="+Date.now();
    s.onload=function(){
      add("loadイベント: 発生 / "+Math.round(performance.now()-started)+"ms");
      if(received) finish("判定: 🟢 JSONPでデータ受信成功");
      else finish("判定: 🟡 script通信は成功したがcallbackは実行されず");
      add("【テスト完了】");
      document.getElementById("run").disabled=false;
      try{s.remove();}catch(e){}
    };
    s.onerror=function(){
      add("errorイベント: 発生 / "+Math.round(performance.now()-started)+"ms");
      finish("判定: 🔴 JSONP読み込み失敗");
      add("【テスト完了】");
      document.getElementById("run").disabled=false;
      try{s.remove();}catch(e){}
    };
    document.head.appendChild(s);

    setTimeout(function(){
      if(!finished){
        finish("⏱ 5秒経過：callback/load/errorを待っても確定できず");
        add("【テスト完了】");
        document.getElementById("run").disabled=false;
      }
    },5000);
  }
});

document.getElementById("clear").addEventListener("click",function(){
  logEl.textContent="【待機中】";
});

document.getElementById("copy").addEventListener("click",async function(){
  try{
    await navigator.clipboard.writeText(logEl.textContent);
    var b=this,old=b.textContent;
    b.textContent="✅ コピーしました";
    setTimeout(function(){b.textContent=old;},1200);
  }catch(e){
    alert("コピーできませんでした。ログを長押ししてコピーしてください。");
  }
});
</script>
</body>
</html>
