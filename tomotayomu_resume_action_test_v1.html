<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ 復帰処理テスト v1</title>
<style>
body{margin:0;background:#f6f4ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;padding:22px 18px 16px;border-bottom:1px solid #ddd}h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;color:#777}
main{padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.big{font-size:24px;font-weight:800}.ok{font-size:18px;font-weight:700;margin-top:8px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
#log{white-space:pre-wrap;font:12px monospace;max-height:240px;overflow:auto}.note{font-size:13px;color:#777;line-height:1.6}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;background:#ddd}
</style></head><body>
<header><h1>📚 ともたよむ 復帰処理テスト v1</h1><div class="sub">復帰を検知したら「処理」を1回だけ実行する実験</div></header>
<main>
<div class="card"><div class="big" id="state">現在：表示中</div><div class="ok" id="result">まだ復帰処理はありません</div></div>
<div class="card">
<div class="row"><span>復帰処理回数</span><strong id="resumeCount">0</strong></div>
<div class="row"><span>visibilitychange回数</span><strong id="vcCount">0</strong></div>
<div class="row"><span>最後の復帰時刻</span><strong id="lastResume">---</strong></div>
</div>
<div class="card"><div class="note">このページを表示したままBraveの別ページへ移動し、戻ってください。「復帰処理回数」が1増え、「復帰を検知しました」と表示されれば成功です。</div></div>
<div class="card"><div id="log">ログなし</div></div>
<button id="reset">リセット</button>
</main>
<script>
const KEY="tomotayomu_resume_action_test_v1";
const data={resumeCount:0,vcCount:0,lastResume:"",log:[]};
let wasHidden=false;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)Object.assign(data,s)}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){document.getElementById("state").textContent="現在："+(document.visibilityState==="visible"?"表示中":"非表示");document.getElementById("resumeCount").textContent=data.resumeCount;document.getElementById("vcCount").textContent=data.vcCount;document.getElementById("lastResume").textContent=data.lastResume||"---";document.getElementById("log").textContent=data.log.length?data.log.join("\n"):"ログなし"}
function log(t){const n=new Date().toLocaleTimeString("ja-JP",{hour12:false});data.log.unshift(n+"  "+t);data.log=data.log.slice(0,80)}
function runResumeAction(){data.resumeCount++;data.lastResume=new Date().toLocaleTimeString("ja-JP",{hour12:false});log("★ 復帰処理を実行");save();document.getElementById("result").textContent="✅ 復帰を検知しました";render()}
document.addEventListener("visibilitychange",()=>{data.vcCount++;if(document.visibilityState==="hidden"){wasHidden=true;log("hidden");save()}else{log("visible");if(wasHidden){wasHidden=false;runResumeAction()}else{save();render()}}});
document.getElementById("reset").addEventListener("click",()=>{localStorage.removeItem(KEY);location.reload()});
load();render();
</script></body></html>
