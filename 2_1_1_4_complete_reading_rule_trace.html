<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完結・読了判定診断</title><style>body{font-family:-apple-system,sans-serif;padding:16px;background:#f7f4ef;color:#222}button{padding:11px 14px;margin:5px 0}pre{white-space:pre-wrap;background:#fff;padding:12px;border-radius:10px;border:1px solid #bbb;line-height:1.55}</style><h2>🔎 完結・読了判定診断</h2><p>全年齢3作品について、完結状態と読書位置から🆙判定を直接確認します。</p><button id="run">▶ 判定する</button><button id="copy">📋 結果をコピー</button><pre id="out">まだ実行していません。</pre><script>const WORKS=[{ncode:"N7998LI",lastup:"2026-09-26 11:05:07",total:52,read:0,end:1,unclassified:true},{ncode:"N6106LC",lastup:"2026-09-25 19:50:00",total:58,read:0,end:1,unclassified:false},{ncode:"N1028JP",lastup:"2026-09-25 12:00:00",total:84,read:82,end:1,unclassified:false}];const BASE="2026-09-25T00:00:00+09:00";function run(){let s="【完結・読了判定診断】\n基準日="+BASE+"\n\n";WORKS.forEach((w,i)=>{const newer=new Date(w.lastup.replace(" ","T")).getTime()>new Date(BASE).getTime();const unread=w.read<w.total;const completed=w.end===1;const unclassified=w.unclassified;const up=newer&&unread&&!unclassified;s+=(i+1)+". "+w.ncode+"\n  lastup="+w.lastup+"\n  完結(end)= "+w.end+" → "+(completed?"完結":"連載") +"\n  読書位置="+w.read+"/"+w.total+" → 未読残り="+unread+"\n  未分類="+unclassified+"\n  基準日より新しい="+newer+"\n  🆙判定(更新＋未読＋未分類除外)="+up+"\n\n"});s+="【完結作品を🆙から除外する場合】\n上記の3作品はすべて完結なので、全て除外になります。\n【完結していても未読分を🆙対象にする場合】\nN6106LC / N1028JP は🆙対象、N7998LIは未分類なので除外です。";document.getElementById("out").textContent=s}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(document.getElementById("out").textContent);alert("コピーしました")};run();</script></html>
