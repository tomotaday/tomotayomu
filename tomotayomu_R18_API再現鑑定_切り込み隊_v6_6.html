<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ R18 API 再現鑑定 v6.6</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;padding:16px;background:#f7f7f7;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:24px}
button{font-size:16px;padding:12px 14px;margin:5px 4px 5px 0;border-radius:10px;border:1px solid #bbb;background:#fff}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}
.note{background:#fff3cd;padding:12px;border-radius:10px}
.ok{color:green}.ng{color:#c00}
</style>
</head>
<body>
<h1>🧪 ともたよむ R18 API 再現鑑定 v6.6</h1>

<div class="note">
<b>目的：</b>以前成功した N0175GW の条件を、現在もう一度そのまま再現し、
N0175GW と N9735HP を同条件で比較する。<br>
JSONP / callback / of=n-gl / lim=1 を使用。各試験30秒timeout。
</div>

<h2>比較条件</h2>
<ul>
<li>API: https://api.syosetu.com/novel18api/api/</li>
<li>出力: JSONP</li>
<li>項目: n-gl</li>
<li>件数: 1</li>
<li>N0175GW：前回成功実績あり</li>
<li>N9735HP：今回の項目別鑑定対象</li>
</ul>

<button onclick="runOne('N0175GW')">▶ N0175GWを試す</button>
<button onclick="runOne('N9735HP')">▶ N9735HPを試す</button>
<button onclick="runBoth()">▶ 2作品を連続比較</button>
<button onclick="copyLog()">📋 結果をコピー</button>
<button onclick="clearLog()">🗑 クリア</button>

<h2>結果</h2>
<pre id="log">待機中</pre>

<script>
let logLines=[];
let seq=0;

function log(s){
  const line=new Date().toLocaleTimeString()+" "+s;
  logLines.push(line);
  document.getElementById("log").textContent=logLines.join("\\n");
}

function runOne(ncode){
  seq++;
  const cb="tomotaYomuApiTest_"+seq;
  const started=performance.now();
  const script=document.createElement("script");
  let finished=false;

  const params=new URLSearchParams({
    ncode:ncode,
    of:"n-gl",
    lim:"1",
    out:"jsonp",
    callback:cb
  });

  const url="https://api.syosetu.com/novel18api/api/?"+params.toString();

  window[cb]=function(data){
    if(finished)return;
    finished=true;
    const ms=Math.round(performance.now()-started);
    cleanup();
    log("✅ SUCCESS / "+ms+" ms");
    log("URL: "+url);
    log("response: "+JSON.stringify(data));
  };

  const timer=setTimeout(()=>{
    if(finished)return;
    finished=true;
    cleanup();
    log("❌ TIMEOUT / "+Math.round(performance.now()-started)+" ms");
    log("URL: "+url);
  },30000);

  function cleanup(){
    clearTimeout(timer);
    try{delete window[cb]}catch(e){window[cb]=undefined}
    script.remove();
  }

  log("【開始】"+ncode+" / callback="+cb);
  log("条件: of=n-gl / out=jsonp / lim=1 / timeout=30s");
  log("URL: "+url);
  document.head.appendChild(script);
}

async function runBoth(){
  runOne("N0175GW");
  await new Promise(r=>setTimeout(r,500));
  runOne("N9735HP");
}

async function copyLog(){
  const text=document.getElementById("log").textContent;
  try{
    await navigator.clipboard.writeText(text);
    log("📋 コピーしました");
  }catch(e){
    prompt("以下をコピーしてください",text);
  }
}

function clearLog(){
  logLines=[];
  document.getElementById("log").textContent="クリアしました";
}
</script>
</body>
</html>
