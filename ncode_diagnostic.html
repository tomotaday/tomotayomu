<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ｜Nコード診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:20px;background:#f7f7f7;color:#222}
main{max-width:720px;margin:auto}h1{font-size:22px;margin:0 0 4px}.sub{color:#666;font-size:13px;margin-bottom:18px}
button{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:15px}
pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:12px;line-height:1.55}
</style>
</head>
<body><main>
<h1>ともたよむ</h1>
<div class="sub">Nコード抽出診断｜index.html 読み取り専用</div>
<button id="run">① Nコードを診断</button>
<button id="copy">診断結果をコピー</button>
<h2>診断結果</h2>
<pre id="out">まだ診断していません。</pre>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
function norm(v){return String(v||"").trim().toUpperCase()}
function log(m){$("out").textContent+=($("out").textContent.includes("まだ診断")?"":"\n")+m}
$("run").onclick=async()=>{
  $("out").textContent="";
  try{
    const res=await fetch("index.html?diagnostic="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw new Error("index.html の取得に失敗しました："+res.status);
    const html=await res.text();
    const doc=new DOMParser().parseFromString(html,"text/html");

    const elems=[...doc.querySelectorAll("[data-ncode]")];
    const attrCodes=elems.map(e=>norm(e.getAttribute("data-ncode"))).filter(Boolean);
    const attrSet=new Set(attrCodes);

    const allCodes=[...html.matchAll(/\bN[A-Z0-9]{6}\b/gi)].map(m=>norm(m[0]));
    const allSet=new Set(allCodes);

    log("診断元：index.html");
    log("data-ncode要素数："+elems.length);
    log("data-ncode 有効数："+attrCodes.length);
    log("data-ncode ユニーク数："+attrSet.size);
    log("data-ncode 重複数："+(attrCodes.length-attrSet.size));
    log("Nコード正規表現ヒット数："+allCodes.length);
    log("Nコード正規表現ユニーク数："+allSet.size);
    log("Nコード正規表現 重複数："+(allCodes.length-allSet.size));

    const missingAttr=[...allSet].filter(n=>!attrSet.has(n));
    const extraAttr=[...attrSet].filter(n=>!allSet.has(n));
    log("正規表現にはあるが data-ncode にない："+missingAttr.length);
    if(missingAttr.length)log("  "+missingAttr.slice(0,30).join(", ")+(missingAttr.length>30?" …":""));
    log("data-ncodeにはあるが正規表現にない："+extraAttr.length);
    if(extraAttr.length)log("  "+extraAttr.slice(0,30).join(", ")+(extraAttr.length>30?" …":""));

    const ok=attrSet.size===2104 && attrCodes.length===2104 && (attrCodes.length-attrSet.size)===0;
    log(ok?"判定：2104件・重複0 → 期待値一致":"判定：期待値と一致しません。ここで停止して確認してください。");
  }catch(e){log("✗ エラー："+e.message)}
};
$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText($("out").textContent);$("copy").textContent="コピーしました";setTimeout(()=>$("copy").textContent="診断結果をコピー",1200)}
  catch(e){alert("コピーできませんでした。診断結果を長押ししてコピーしてください。")}
};
</script>
</body></html>
