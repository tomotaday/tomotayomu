<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ v2.1.1.18｜生API状態診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:16px;line-height:1.6;background:#fafafa;color:#222}
h1{font-size:20px;margin:0 0 4px} .ver{font-size:13px;color:#666;margin-bottom:16px}
button{font-size:16px;padding:10px 14px;margin:4px 4px 10px 0;border:1px solid #bbb;border-radius:10px;background:#fff}
pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:12px}
.ok{color:#176b35}.ng{color:#a22}.row{border-top:1px solid #ddd;padding:10px 0}.small{font-size:12px;color:#666}
</style>
</head>
<body>
<h1>ともたよむ</h1>
<div class="ver">v2.1.1.18｜生API状態診断</div>
<p>目的：v2.1.1.17の「API返却件数はあるのに対象Nコードへ対応できない」問題を切り分ける。<br>既知の正規指定 <b>of=n-t-nt-e-ga-gl</b> を使用し、API→Nコード→生フィールドを1作品ずつ確認する。</p>
<button id="run">診断開始</button>
<button id="copy">診断結果をコピー</button>
<pre id="out">未実行</pre>
<script>
const VERSION="v2.1.1.18";
const TARGETS=["N0753HR","N7998LI","N6106LC","N1028JP","N6066KQ","N8462KW"];
const API_GENERAL="https://api.syosetu.com/novelapi/api/";
const API_R18="https://api.syosetu.com/novel18api/api/";
const out=document.getElementById("out");
function jsonp(api,ncode){return new Promise((resolve,reject)=>{
  const cb="tomotaYomuDiag_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const s=document.createElement("script"); let done=false;
  const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error("timeout"));},15000);
  function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()}
  window[cb]=(data)=>{if(done)return;done=true;cleanup();resolve(data)};
  s.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error("script error"))};
  s.src=api+"?out=jsonp&callback="+encodeURIComponent(cb)+"&ncode="+encodeURIComponent(ncode)+"&of=n-t-nt-e-ga-gl";
  document.head.appendChild(s);
});}
async function fetchOne(api,ncode){
  const data=await jsonp(api,ncode);
  return data;
}
function rowsFrom(data){return Array.isArray(data)?data.filter(x=>x&&typeof x==="object"):[]}
function pick(data,ncode){
  const key=ncode.toUpperCase();
  return rowsFrom(data).find(x=>String(x.ncode||"").toUpperCase()===key)||null;
}
function status(w){
  if(!w)return "—";
  if(String(w.noveltype??"").trim()==="2")return "🟣 短編";
  return String(w.end)==="0"?"🔵 完結":"🟢 連載中";
}
function clean(w){
  if(!w)return null;
  return {ncode:w.ncode,title:w.title,noveltype:w.noveltype,end:w.end,general_all_no:w.general_all_no,general_lastup:w.general_lastup,keys:Object.keys(w)};
}
async function run(){
  out.textContent="診断中…";
  const chunks=["【"+VERSION+"｜生API状態診断】","正規API指定：of=n-t-nt-e-ga-gl","対象："+TARGETS.join(", "),""];
  for(const ncode of TARGETS){
    chunks.push("■ "+ncode);
    for(const [label,api] of [["全年齢",API_GENERAL],["R18",API_R18]]){
      try{
        const raw=await fetchOne(api,ncode);
        const arr=rowsFrom(raw);
        const w=pick(raw,ncode);
        chunks.push(label+" API返却配列="+arr.length+" / 対象一致="+(w?"あり":"なし"));
        if(w){
          chunks.push("  状態="+status(w));
          chunks.push("  生フィールド="+JSON.stringify(clean(w)));
          chunks.push("  生JSON="+JSON.stringify(w));
        }else{
          chunks.push("  返却データ="+JSON.stringify(raw));
        }
      }catch(e){chunks.push(label+" ERROR="+e.message)}
    }
    chunks.push("");
  }
  chunks.push("【判定ルール】noveltype=2→短編 / end=0→完結 / end=1→連載中");
  chunks.push("【重要】この診断はlocalStorage・Master・カード表示を書き換えない。");
  out.textContent=chunks.join("\n");
}
document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);alert("コピーしました")}catch(e){alert("コピーできませんでした")}};
</script>
</body></html>
