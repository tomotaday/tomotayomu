<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ N7035MQ API診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px;line-height:1.5}
button{font-size:16px;padding:10px 14px;margin:6px 4px 10px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:8px}
.ok{font-weight:700}
</style>
</head>
<body>
<h1>ともたよむ｜N7035MQ API診断</h1>
<p>GitHub Pages上でR18 APIからN7035MQの作品情報を直接取得し、<b>end / novel_type / general_lastup / general_all_no</b>を確認します。</p>
<button id="run">API取得</button>
<button id="copy">結果をコピー</button>
<pre id="out">まだ取得していません。</pre>

<script>
const NCODE="N7035MQ";
const API="https://api.syosetu.com/novel18api/api/";

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("タイムアウト"));},20000);
    function cleanup(){clearTimeout(timer);s.remove();delete window[cb];}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error("JSONP通信エラー"));};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.body.appendChild(s);
  });
}

async function run(){
  const out=document.getElementById("out");
  out.textContent="取得中…";
  try{
    const d=await jsonp(API+"?ncode="+NCODE+"&of=n-t-s-gl-ga-e-e&lim=10");
    const rows=Array.isArray(d)?d.slice(1):[];
    const w=rows.find(x=>String(x.ncode||"").toUpperCase()===NCODE);
    if(!w) throw new Error("N7035MQがAPI結果にありません。取得件数="+rows.length);

    const result={
      ncode:w.ncode,
      title:w.title,
      novel_type:w.novel_type,
      end:w.end,
      general_lastup:w.general_lastup,
      general_all_no:w.general_all_no,
      story:w.story || "",
      fetched_at:new Date().toISOString()
    };
    out.textContent=JSON.stringify(result,null,2);
  }catch(e){
    out.textContent="ERROR\n"+e.message;
  }
}

document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
  try{
    await navigator.clipboard.writeText(document.getElementById("out").textContent);
    alert("コピーしました");
  }catch(e){alert("コピーできませんでした");}
};
</script>
</body>
</html>
