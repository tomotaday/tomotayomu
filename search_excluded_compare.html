<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ed"><title>取得失敗Nコード照合｜ともたよむ</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.55}main{width:min(100%,700px);margin:auto;padding:18px 14px 40px}h1{font-size:23px;margin:10px 0}p{font-size:14px}.muted{font-size:13px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}label{font-weight:700;display:block;margin:12px 0 6px}textarea{width:100%;min-height:180px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#222}button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);margin:6px 6px 0 0}.summary{font-weight:700;margin:12px 0}.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.hit{color:#7b2c25;font-weight:700}.count{font-variant-numeric:tabular-nums}
</style></head><body><main>
<a href="index.html">← ともたよむへ戻る</a><h1>🔎 取得失敗Nコード照合</h1>
<p class="muted">取得失敗として記録されたNコードを貼り付け、現在の検索除外Nコードと照合します。一致は「検索除外に該当」と表示するだけで、取得失敗の原因を断定しません。</p>
<section class="card">
<div class="summary">① 取得失敗Nコード</div>
<label for="failed">Nコードを貼り付け</label><textarea id="failed" placeholder="例：N1234AB&#10;N5678CD&#10;または、Nコードを含むログを貼り付け"></textarea>
<p class="muted">Nコードは文章やログの中に含まれていても抽出します。重複は自動でまとめます。</p>
<button id="compare">検索除外Nコードと照合</button><button id="clear">入力を消去</button>
</section>
<section class="card">
<div class="summary">② 照合結果</div><div id="summary" class="summary">まだ照合していません。</div>
<div id="excludedHits" class="result"></div>
<label>検索除外に該当しなかったNコード</label><div id="otherCodes" class="result"></div>
<div class="actions"><button id="copyHits">該当コードをコピー</button><button id="copyOther">非該当コードをコピー</button></div>
</section>
<p class="muted">照合対象は、このブラウザのともたよむに保存された検索除外フラグです。別の端末・ブラウザの情報とは同期されません。作品データ、棚の所属、読書位置、更新判定は変更しません。</p>
</main><script>
"use strict";
const KEY="tomotaYomu_search_excluded_ncodes_v1";
const $=id=>document.getElementById(id);
let hits=[],others=[];
function extract(text){return [...new Set((String(text||"").toUpperCase().match(/N[0-9A-Z]{4,}/g)||[]))];}
function getExcluded(){try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return new Set(Array.isArray(x)?x.map(v=>String(v).toUpperCase()):[])}catch(e){return new Set()}}
function compare(){const failed=extract($("failed").value),excluded=getExcluded();hits=failed.filter(n=>excluded.has(n));others=failed.filter(n=>!excluded.has(n));$("summary").textContent="取得失敗候補："+failed.length+"件 ／ 検索除外に該当："+hits.length+"件 ／ 非該当："+others.length+"件";$("excludedHits").innerHTML=hits.length?'<span class="hit">'+hits.join("\n")+'</span>':"該当なし";$("otherCodes").textContent=others.length?others.join("\n"):"該当なし";if(!failed.length)$("summary").textContent="Nコードを読み取れませんでした。入力内容を確認してください。";}
$("compare").addEventListener("click",compare);$("clear").addEventListener("click",()=>{$("failed").value="";hits=[];others=[];$("summary").textContent="入力を消去しました。";$("excludedHits").textContent="";$("otherCodes").textContent="";});
$("copyHits").addEventListener("click",()=>{if(hits.length)navigator.clipboard?.writeText(hits.join("\n")).then(()=>{$("summary").textContent+=" ／ 該当コードをコピーしました";}).catch(()=>{$("summary").textContent+=" ／ コピーできませんでした";});});
$("copyOther").addEventListener("click",()=>{if(others.length)navigator.clipboard?.writeText(others.join("\n")).then(()=>{$("summary").textContent+=" ／ 非該当コードをコピーしました";}).catch(()=>{$("summary").textContent+=" ／ コピーできませんでした";});});
</script></body></html>
