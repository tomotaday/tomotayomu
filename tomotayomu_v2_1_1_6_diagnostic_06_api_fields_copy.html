<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ v2.1.1.6 診断⑥ API項目調査</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;background:#f5f5f5;color:#222}
h1{font-size:20px;margin:0 0 8px}
.note{font-size:13px;line-height:1.6;background:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
button{font-size:15px;padding:10px 14px;border:0;border-radius:10px;background:#333;color:#fff;margin:4px 4px 4px 0}
button:disabled{opacity:.5}
#summary{margin:12px 0;font-size:14px}
.card{background:#fff;border-radius:12px;margin:12px 0;padding:12px;box-shadow:0 1px 4px #ccc}
.card h2{font-size:16px;margin:0 0 8px}
.ok{color:#187a18}.ng{color:#b00020}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #ddd;padding:6px;vertical-align:top;word-break:break-word}
th{background:#eee}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.45}
.small{font-size:12px;color:#555}
.copybox{background:#fff;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 1px 4px #ccc}
</style>
</head>
<body>
<h1>ともたよむ v2.1.1.6 診断⑥ ― API項目1個ずつ調査</h1>

<div class="note">
診断⑤で、<code>end</code> と <code>story</code> は取得できる一方、
<code>novel_type</code> / <code>general_all_no</code> / <code>general_lastup</code> /
<code>novelupdated_at</code> / <code>isstop</code> が返っていないことを確認しました。<br>
今回は <strong>of= に1項目だけ指定</strong>して、APIが何を返すかを比較します。<br>
判定や補正は行いません。
</div>

<button id="start">⑥ 調査開始</button>
<button id="copy" disabled>📋 調査結果を全部コピー</button>
<div id="summary">待機中</div>
<div id="results"></div>

<script>
const API_URL = "https://api.syosetu.com/novelapi/api/";
const R18_API_URL = "https://api.syosetu.com/novel18api/api/";

const targets = [
  ["N7035MQ","R18"],
  ["N9801CV","R18"],
  ["N9735HP","R18"],
  ["N0034LU","R18"],
  ["N0073ID","R18"],
  ["N0089JC","R18"],
  ["N0002IK","通常"],
  ["N0030HU","通常"]
];

const $ = id => document.getElementById(id);

const fields = [
  "novel_type",
  "general_all_no",
  "general_lastup",
  "novelupdated_at",
  "isstop"
];

let report = [];

function apiUrl(base,ncode,field){
  const cb = "diag6_" + ncode + "_" + field.replace(/[^a-zA-Z0-9]/g,"");
  return {
    cb,
    url: base
      + "?out=jsonp"
      + "&of=" + encodeURIComponent(field)
      + "&lim=1"
      + "&ncode=" + encodeURIComponent(ncode)
      + "&callback=" + cb
  };
}

function loadJsonp(url,cb){
  return new Promise((resolve,reject)=>{
    let done=false;
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      if(done)return;
      done=true; cleanup();
      reject(new Error("タイムアウト"));
    },10000);

    window[cb]=data=>{
      if(done)return;
      done=true; clearTimeout(timer); cleanup(); resolve(data);
    };

    function cleanup(){
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
    }

    script.onerror=()=>{
      if(done)return;
      done=true; clearTimeout(timer); cleanup();
      reject(new Error("JSONP通信エラー"));
    };

    script.src=url;
    document.head.appendChild(script);
  });
}

function getWork(data){
  if(!Array.isArray(data)) return null;
  for(let i=1;i<data.length;i++){
    if(data[i] && typeof data[i]==="object" && !Array.isArray(data[i])) return data[i];
  }
  return null;
}

function valueOf(work,field){
  if(!work) return undefined;
  return work[field];
}

function displayValue(v){
  if(v===undefined) return "undefined";
  if(v===null) return "null";
  if(typeof v==="string") return v;
  return JSON.stringify(v);
}

async function runField(ncode,type,field){
  const base=type==="R18" ? R18_API_URL : API_URL;
  const a=apiUrl(base,ncode,field);
  try{
    const data=await loadJsonp(a.url,a.cb);
    const work=getWork(data);
    return {
      ncode,type,field,
      ok:true,
      allcount:data?.[0]?.allcount ?? "",
      value:valueOf(work,field),
      keys:work ? Object.keys(work) : [],
      raw:work
    };
  }catch(e){
    return {ncode,type,field,ok:false,error:e.message};
  }
}

function addCard(ncode,type,rows){
  const card=document.createElement("section");
  card.className="card";
  const h=document.createElement("h2");
  h.textContent=ncode+" / "+type;
  card.appendChild(h);

  const table=document.createElement("table");
  table.innerHTML="<tr><th>項目</th><th>取得値</th><th>Object.keys(work)</th></tr>";

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    const val=displayValue(r.value);
    tr.innerHTML=
      "<td>"+r.field+"</td>"+
      "<td class='"+(r.ok?"ok":"ng")+"'>"+val+"</td>"+
      "<td>"+(r.keys ? r.keys.join(", ") : r.error)+"</td>";
    table.appendChild(tr);
  });

  card.appendChild(table);
  $("results").appendChild(card);
}

async function run(){
  $("start").disabled=true;
  $("copy").disabled=true;
  $("results").innerHTML="";
  report=[];
  $("summary").textContent="調査中… 8作品 × 5項目を順番に確認します。";

  for(const [ncode,type] of targets){
    const rows=[];
    for(const field of fields){
      const r=await runField(ncode,type,field);
      rows.push(r);
      report.push(r);
    }
    addCard(ncode,type,rows);
  }

  const lines=[];
  lines.push("ともたよむ v2.1.1.6 診断⑥ API項目1個ずつ調査");
  lines.push("==================================================");
  for(const [ncode,type] of targets){
    lines.push("");
    lines.push("[" + ncode + " / " + type + "]");
    report.filter(r=>r.ncode===ncode).forEach(r=>{
      lines.push(r.field + " = " + (r.ok ? displayValue(r.value) : "ERROR: "+r.error));
      lines.push("Object.keys(work) = " + (r.keys ? r.keys.join(", ") : ""));
      if(r.raw) lines.push("raw = " + JSON.stringify(r.raw));
    });
  }
  window.__copyText=lines.join("\\n");

  $("summary").textContent="調査完了。📋「調査結果を全部コピー」で、このページの結果を一括コピーできます。";
  $("copy").disabled=false;
  $("start").disabled=false;
}

$("start").onclick=run;

$("copy").onclick=async()=>{
  const text=window.__copyText || "";
  try{
    await navigator.clipboard.writeText(text);
    $("summary").textContent="📋 コピーしました。このままチャットに貼れます。";
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.left="-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    $("summary").textContent="📋 コピーしました。このままチャットに貼れます。";
  }
};
</script>
</body>
</html>
