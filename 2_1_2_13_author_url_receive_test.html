<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ｜v2.1.2.13 作者URL受信実験</title><style>body{font-family:-apple-system,sans-serif;margin:20px;line-height:1.6}h1{font-size:28px}#url{word-break:break-all;background:#f5f5f5;padding:16px;border-radius:10px}button{font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #aaa;background:white}</style></head><body><h1>ともたよむ</h1><h2>v2.1.2.13｜作者URL受信実験</h2><p>ショートカットから渡された <code>authorurl</code> を確認します。</p><div id="url">受信したURLを確認中…</div><p><button onclick="copyResult()">診断結果をコピー</button></p><script>const params=new URLSearchParams(location.search);const authorurl=params.get("authorurl")||"";const out=document.getElementById("url");out.textContent=authorurl||"authorurl がありません";let result="【ともたよむ v2.1.2.13｜作者URL受信実験】\nauthorurl="+(authorurl||"なし")+"\n現在URL="+location.href;async function copyResult(){try{await navigator.clipboard.writeText(result);alert("診断結果をコピーしました")}catch(e){alert("コピーできませんでした")}}</script></body></html>
