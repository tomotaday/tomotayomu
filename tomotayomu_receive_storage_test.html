<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ・受信保存テスト</title>
<style>
body{margin:0;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f7f5ef;color:#222}
main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d8d2c5;border-radius:18px;padding:24px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 24px}.row{margin:16px 0}.label{color:#777;font-size:14px}.value{font-size:24px;font-weight:700;margin-top:4px;word-break:break-all}
.note{margin-top:24px;padding:14px;background:#f2f0ea;border-radius:12px;font-size:14px;line-height:1.6}
.status{margin-top:18px;padding:12px;border-radius:12px;background:#eef6ee;font-weight:700}
</style>
</head>
<body>
<main>
<h1>📚 ともたよむ・受信保存テスト</h1>
<div class="row"><div class="label">Nコード</div><div class="value" id="ncode">（未受信）</div></div>
<div class="row"><div class="label">話数</div><div class="value" id="episode">（未受信）</div></div>
<div class="status" id="status">受信データを確認中…</div>
<div class="note">
これは実験用ページです。<br>
受け取ったNコードと話数を、このページ自身のlocalStorageに保存します。<br>
現時点では、ともたよむ本体の読書位置は変更しません。
</div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const ncode = params.get("ncode") || "";
  const episode = params.get("episode") || "";

  if (ncode && episode) {
    localStorage.setItem("tomotaYomu_receive_test", JSON.stringify({
      ncode,
      episode,
      savedAt: new Date().toISOString()
    }));
  }

  const saved = (() => {
    try {
      return JSON.parse(localStorage.getItem("tomotaYomu_receive_test") || "null");
    } catch(e) {
      return null;
    }
  })();

  document.getElementById("ncode").textContent = saved?.ncode || "（未受信）";
  document.getElementById("episode").textContent = saved?.episode || "（未受信）";
  document.getElementById("status").textContent =
    saved ? "💾 受信データをlocalStorageに保存しました" : "受信データなし";
})();
</script>
</body>
</html>
