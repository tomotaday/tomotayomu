<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>localStorage確認｜ともたよむ</title>
<style>
:root{color-scheme:light dark}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;margin:0 auto;max-width:900px;padding:18px}h1{font-size:1.35rem}h2{font-size:1.05rem;margin-top:1.5rem}.note{border:1px solid #8888;border-radius:10px;padding:12px;margin:12px 0}button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #888;margin:6px 6px 6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #8888;border-radius:10px;padding:12px;min-height:2rem}.muted{opacity:.8;font-size:.92rem}
</style></head>
<body>
<h1>ともたよむ｜保存データ確認</h1>
<p>指定された localStorage の値を読むだけの確認用ページです。保存データの変更・削除は行いません。</p>
<div class="note"><strong>確認するキー</strong><br><code id="keyName">tomotaYomu_work_edit_overrides_v1</code><p id="origin" class="muted"></p><p id="status" role="status">確認待ち</p><button id="readButton" type="button">もう一度読み取る</button><button id="copyButton" type="button">表示内容をコピー</button></div>
<h2>保存データ（整形表示）</h2><pre id="pretty">(まだ読み取っていません)</pre>
<h2>保存データ（元の文字列）</h2><pre id="raw">(まだ読み取っていません)</pre>
<p class="muted">本体と同じオリジン（scheme・host・port）で開いた場合に、その保存領域を確認できます。別のブラウザや別のホストで開くと異なる保存領域です。</p>
<script>
(()=>{'use strict';const KEY='tomotaYomu_work_edit_overrides_v1';const status=document.getElementById('status'),pretty=document.getElementById('pretty'),raw=document.getElementById('raw');document.getElementById('origin').textContent='現在のオリジン：'+location.origin;
function readValue(){try{const value=localStorage.getItem(KEY);if(value===null){status.textContent='この保存領域には、このキーは存在しません。';pretty.textContent='(キーなし)';raw.textContent='(キーなし)';return}raw.textContent=value;try{const parsed=JSON.parse(value);pretty.textContent=JSON.stringify(parsed,null,2);if(parsed&&typeof parsed==='object'){const count=Array.isArray(parsed)?parsed.length:Object.keys(parsed).length;status.textContent='キーあり。JSONとして読み取れました。最上位の件数：'+count}else status.textContent='キーあり。JSONとして読み取れました。'}catch(e){pretty.textContent='JSONとして解析できませんでした。\n\n'+value;status.textContent='キーは存在しますが、JSONとして解析できませんでした。'}}catch(e){status.textContent='読み取りエラー：'+String(e);pretty.textContent='(読み取り不可)';raw.textContent='(読み取り不可)'}}
document.getElementById('readButton').addEventListener('click',readValue);document.getElementById('copyButton').addEventListener('click',async()=>{const text='キー: '+KEY+'\nオリジン: '+location.origin+'\n状態: '+status.textContent+'\n\n整形表示:\n'+pretty.textContent+'\n\n元の文字列:\n'+raw.textContent;try{await navigator.clipboard.writeText(text);status.textContent+='（表示内容をクリップボードにコピーしました）'}catch(e){status.textContent+='（コピーできませんでした。画面の内容を確認してください）'}});readValue()})();
</script></body></html>
