<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ 本番直前 往復試験</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f6f2eb;color:#3b342d}
header{padding:18px 16px 10px;background:#fff}main{padding:12px 12px 40px}
h1{font-size:20px;margin:0 0 6px}.sub,.small{font-size:12px;color:#756b61}
button,a{font:inherit;border:1px solid #bdb3a8;border-radius:10px;background:#fff;padding:9px 12px;text-decoration:none;color:inherit}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.card{background:#fff;border:1px solid #ddd4ca;border-radius:14px;padding:13px;margin:10px 0}
.top{display:flex;justify-content:space-between}.title{font-weight:700}.ncode{font-size:11px;color:#81776e}.meta{font-size:12px;color:#6c635b;margin:7px 0}
.reading{font-size:18px;font-weight:700;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.resumeLink{background:#f1e7d8}
#log{background:#171717;color:#eee;border-radius:12px;padding:10px;font:11px/1.55 ui-monospace,monospace;white-space:pre-wrap;max-height:280px;overflow:auto}
</style></head>
<body><header><h1>ともたよむ・本番直前 往復試験</h1>
<div class="sub">複数作品 → 続きから → Brave → 共有ショートカット → GAS → ともたよむ復帰 → 読書位置受信</div></header>
<main><div class="toolbar"><button id="updateBtn">🔄 更新情報を確認</button><button id="refreshBtn">📖 読書位置を再取得</button></div>
<div id="status">待機中</div><div id="lastCheck" class="small">最終確認：—</div><section id="cards"></section>
<h2 style="font-size:16px">試験ログ</h2><div id="log">【テスト開始前】\n</div></main>
<script>
const GAS="https://script.google.com/macros/s/AKfycbxbvywLmy4aWh-_u_o_iDVDq_7AMxf9K2wPY-BhXphGbnaBp0JZ4R78_eplmYfXH3obHA/exec";
const ACTIVE="tomotaYomu_test_active_ncode";
const W=[
{n:"N0175GW",t:"試験作品 R18",a:"r18",u:"https://novel18.syosetu.com/n0175gw/",e:210},
{n:"N7998LI",t:"試験作品 通常A",a:"normal",u:"https://ncode.syosetu.com/n7998li/",e:52},
{n:"N1028JP",t:"試験作品 通常B",a:"normal",u:"https://ncode.syosetu.com/n1028jp/",e:84}];
const S={};W.forEach(w=>S[w.n]={r:null,l:"",e:w.e,g:"未取得"});
const log=x=>{let z=document.getElementById("log");z.textContent+=x+"\n";z.scrollTop=z.scrollHeight};
const now=()=>new Date().toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
function render(){document.getElementById("cards").innerHTML=W.map(w=>{let s=S[w.n],r=s.r===null?"—":s.r,h=s.r>0?w.u+s.r+"/":w.u;
return '<article class="card"><div class="top"><div class="title">'+w.t+'</div><div class="ncode">'+w.n+'</div></div><div class="meta">最新掲載：'+(s.l||"未取得")+'　最新話：'+s.e+'</div><div class="reading">📖 '+r+' / '+s.e+'話</div><div class="small">GAS：'+s.g+'　状態：'+(s.r===null?"📝 読書記録なし":(s.r<s.e?"🆙 更新/未読":"読了"))+'</div><div class="actions"><a class="resumeLink" data-n="'+w.n+'" href="'+h+'">続きから</a><button class="get" data-n="'+w.n+'">GAS再取得</button></div></article>'}).join("")}
async function gas(n){let t=performance.now(),r=await fetch(GAS+"?ncode="+n+"&_cb="+Date.now(),{cache:"no-store"}),b=(await r.text()).trim(),ms=Math.round(performance.now()-t);if(!r.ok)throw Error("HTTP "+r.status);
if(b.startsWith("READ ")){let e=Number(b.split(/\s+/)[2]);S[n].r=Number.isFinite(e)?e:null;S[n].g=b}else if(b.startsWith("NOT_FOUND ")){S[n].r=null;S[n].g=b}else S[n].g=b;
log("GAS "+n+" → "+b+" ("+ms+"ms)");render();return b}
function jsonp(api,n,label){return new Promise((ok,no)=>{let cb="ty_"+label+"_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script");
window[cb]=p=>{delete window[cb];s.remove();ok(Array.isArray(p)?p.slice(1):[])};s.onerror=()=>{delete window[cb];s.remove();no(Error(label+" API取得失敗"))};
s.src=api+"?ncode="+encodeURIComponent(n.join("-"))+"&of=n-gl-ga&lim=500&out=jsonp&callback="+cb+"&_cb="+Date.now();document.body.appendChild(s)})}
async function update(){document.getElementById("status").textContent="更新情報を確認中…";try{
let n=W.filter(x=>x.a=="normal").map(x=>x.n),r=W.filter(x=>x.a=="r18").map(x=>x.n);
let [a,b]=await Promise.all([jsonp("https://api.syosetu.com/novelapi/api/",n,"n"),jsonp("https://api.syosetu.com/novel18api/api/",r,"r")]);
[...a,...b].forEach(x=>{let n=String(x.ncode||"").toUpperCase();if(S[n]){S[n].e=Number(x.general_all_no)||S[n].e;S[n].l=x.general_lastup||""}});
document.getElementById("lastCheck").textContent="最終確認："+now();document.getElementById("status").textContent="更新情報取得完了";log("【Narou確認】"+now()+" / 通常"+a.length+"件・R18"+b.length+"件");render()
}catch(e){document.getElementById("status").textContent="更新情報取得失敗";log("Narou ERROR："+e.message)}}
async function active(){let n=(localStorage.getItem(ACTIVE)||"").toUpperCase();if(!n)return;log("【復帰検知】active N-code = "+n);if(S[n]){await gas(n);log("【読書位置受信】"+n+" をGASから反映")}else log("対象外N-code："+n)}
document.addEventListener("click",e=>{let a=e.target.closest(".resumeLink");if(a){let n=a.dataset.n.toUpperCase();localStorage.setItem(ACTIVE,n);log("【離脱準備】active N-code = "+n)}});
document.addEventListener("click",e=>{let b=e.target.closest(".get");if(b)gas(b.dataset.n.toUpperCase()).catch(x=>log("GAS ERROR："+x.message))});
document.getElementById("refreshBtn").onclick=()=>{let n=(localStorage.getItem(ACTIVE)||"").toUpperCase();n?gas(n).catch(x=>log("GAS ERROR："+x.message)):log("active N-code 未設定")};
document.getElementById("updateBtn").onclick=update;
window.onload=async()=>{render();log("【起動】"+now());await active()};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"){log("【visibilitychange】ともたよむ復帰");active()}});
</script></body></html>
