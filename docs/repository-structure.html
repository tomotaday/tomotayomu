## 10. 今後の整理ルール

1. 既存ファイルを移動する前に、リンク・相対パス・Workflow・Shortcut等の参照元を調べる。

3. 移動先にファイルを作成し、内容を確認してから参照元を更新する。

5. 本番データ、IndexedDB、GitHub Actions、Shortcut、Atom連携を壊さないことを最優先とする。
6. 構成整理だけではアプリのバージョン番号を変更しない。
7. 古いファイルは即時削除せず、まず `archive/delete_pending/` に退避する。
8. ルートの入口ファイルは、外部呼び出しへの影響を確認せず移動しない。
9. この表は構成変更のたびに更新し、実際のGitHub構成と食い違わないようにする。

<script>
(function(){
const source=document.getElementById("source").textContent.trim();
const root=document.getElementById("content");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const lines=source.split(/\r?\n/);let i=0;
while(i<lines.length){
 let line=lines[i].trim();
 if(!line){i++;continue;}
 if(/^\|/.test(line)){
  const rows=[];
  while(i<lines.length && /^\|/.test(lines[i].trim())){
   const cells=lines[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
   if(!cells.every(x=>/^:?-{3,}:?$/.test(x)))rows.push(cells);
   i++;
  }
  if(rows.length){
   const wrap=document.createElement("div");wrap.className="section table-wrap";
   const table=document.createElement("table");
   rows.forEach((row,ri)=>{const tr=document.createElement("tr");row.forEach(cell=>{const el=document.createElement(ri===0?"th":"td");el.innerHTML=inline(cell);tr.appendChild(el)});table.appendChild(tr)});
   wrap.appendChild(table);root.appendChild(wrap);
  }
  continue;
 }
 const h=line.match(/^(#{1,3})\s+(.+)$/);
 if(h){const el=document.createElement(h[1].length===1?"h1":"h2");el.innerHTML=inline(h[2]);root.appendChild(el);i++;continue;}
 if(/^[-*]\s+/.test(line)||/^\d+\.\s+/.test(line)){
  const ordered=/^\d+\./.test(line),list=document.createElement(ordered?"ol":"ul");
  while(i<lines.length && (/^\s*[-*]\s+/.test(lines[i])||/^\s*\d+\.\s+/.test(lines[i]))){const li=document.createElement("li");li.innerHTML=inline(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/,""));list.appendChild(li);i++;}
  const wrap=document.createElement("div");wrap.className="section";wrap.appendChild(list);root.appendChild(wrap);continue;
 }
 const p=document.createElement("p");p.innerHTML=inline(line);root.appendChild(p);i++;
}
})();
