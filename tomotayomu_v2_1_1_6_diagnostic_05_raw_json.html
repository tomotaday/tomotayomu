<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ v2.1.1.6 診断⑤ Raw JSON</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;background:#f5f5f5;color:#222}
h1{font-size:20px;margin:0 0 8px}
.note{font-size:13px;line-height:1.6;background:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
button{font-size:16px;padding:10px 16px;border:0;border-radius:10px;background:#333;color:#fff}
#summary{margin:12px 0;font-size:14px}
.card{background:#fff;border-radius:12px;margin:12px 0;padding:12px;box-shadow:0 1px 4px #ccc}
.card h2{font-size:16px;margin:0 0 8px}
.meta{font-size:13px;line-height:1.6;margin-bottom:8px}
.ok{color:#187a18}.ng{color:#b00020}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.45}
.field{background:#fafafa;border-left:4px solid #999;padding:8px;margin:4px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>ともたよむ v2.1.1.6 診断⑤ ― Narou API Raw JSON</h1>

<div class="note">
このページは<strong>判定を補正しません</strong>。<br>
Narou APIから返ってきた作品オブジェクトを、そのまま表示します。<br>
特に <code>end</code> / <code>novel_type</code> / <code>general_all_no</code> /
<code>general_lastup</code> / <code>novelupdated_at</code> / <code>isstop</code> /
<code>story</code> を確認します。
</div>

<button id="start">調査開始</button>
<div id="summary">待機中</div>
<div id="results"></div>

<script>
const API_URL = "https://api.syosetu.com/novelapi/api/";
const R18_API_URL = "https://api.syosetu.com/novel18api/api/";

const targets = [
  ["N7035MQ","R18"],
  ["N9801CV","R18"],
  ["N9735HP","R18"],
  ["N0034LU","R18"],
  ["N0073ID","R18"],
  ["N0089JC","R18"],
  ["N0002IK","通常"],
  ["N0030HU","通常"]
];

const $ = id => document.getElementById(id);

function apiUrl(base,ncode){
  const of = [
    "n","t","e","w","s","g","u",
    "novelupdated_at","end","novel_type",
    "general_all_no","general_lastup","isstop"
  ].join("-");
  return base
    + "?out=jsonp"
    + "&of=" + encodeURIComponent(of)
    + "&lim=1"
    + "&ncode=" + encodeURIComponent(ncode)
    + "&callback=narouDiag_" + ncode;
}

function loadJsonp(url, callbackName){
  return new Promise((resolve,reject)=>{
    let done=false;
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      if(done)return;
      done=true;
      cleanup();
      reject(new Error("タイムアウト"));
    },10000);

    window[callbackName]=data=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    function cleanup(){
      try{delete window[callbackName]}catch(e){window[callbackName]=undefined}
      script.remove();
    }

    script.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      reject(new Error("JSONP通信エラー"));
    };

    script.src=url;
    document.head.appendChild(script);
  });
}

function firstWork(data){
  if(!Array.isArray(data)) return null;
  for(let i=1;i<data.length;i++){
    if(data[i] && typeof data[i]==="object" && !Array.isArray(data[i])){
      return data[i];
    }
  }
  return null;
}

function showField(name,value){
  const d=document.createElement("div");
  d.className="field";
  let text;
  if(value===undefined) text="undefined";
  else if(value===null) text="null";
  else if(typeof value==="string") text=value;
  else text=JSON.stringify(value,null,2);
  d.textContent=name + " = " + text;
  return d;
}

async function runOne(ncode,type,index){
  const base=type==="R18" ? R18_API_URL : API_URL;
  const cb="narouDiag_"+ncode;
  const card=document.createElement("section");
  card.className="card";
  $("results").appendChild(card);

  const h=document.createElement("h2");
  h.textContent=(index+1)+". "+ncode+" / "+type;
  card.appendChild(h);

  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent="通信中...";
  card.appendChild(meta);

  try{
    const data=await loadJsonp(apiUrl(base,ncode),cb);
    const work=firstWork(data);

    meta.className="meta ok";
    meta.textContent=
      "JSONP成功 / API="+base+
      " / allcount="+(data && data[0] && data[0].allcount !== undefined ? data[0].allcount : "不明")+
      " / rows="+(work ? "1" : "0");

    if(!work){
      card.appendChild(showField("raw response",data));
      return;
    }

    const important=[
      "ncode","title","writer","end","novel_type",
      "general_all_no","general_lastup","novelupdated_at",
      "isstop","story","keyword","genre","userid"
    ];

    important.forEach(k=>card.appendChild(showField(k,work[k])));

    card.appendChild(showField("Object.keys(work)",Object.keys(work)));

    const rawTitle=document.createElement("h3");
    rawTitle.textContent="作品オブジェクト全文";
    card.appendChild(rawTitle);

    const pre=document.createElement("pre");
    pre.textContent=JSON.stringify(work,null,2);
    card.appendChild(pre);

  }catch(err){
    meta.className="meta ng";
    meta.textContent="取得失敗: "+err.message;
  }
}

$("start").onclick=async()=>{
  $("start").disabled=true;
  $("summary").textContent="調査中… 8作品を順番に取得します。";
  $("results").innerHTML="";

  for(let i=0;i<targets.length;i++){
    await runOne(targets[i][0],targets[i][1],i);
  }

  $("summary").textContent="調査完了。上から順に、APIが返した生データを確認してください。";
  $("start").disabled=false;
};
</script>
</body>
</html>
