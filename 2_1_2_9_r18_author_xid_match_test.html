<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜v2.1.2.9 R18作者XID照合実験</title>
<style>body{font-family:-apple-system,sans-serif;margin:16px;line-height:1.55}input,button{font-size:16px;padding:10px;margin:4px 0}button{width:100%}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px}</style></head>
<body>
<h2>ともたよむ v2.1.2.9</h2>
<h3>R18作者XID → 本棚照合実験</h3>
<p>XIDを登録すると、その作者の作品一覧をR18 APIから取得し、ともたよむ保存済み作品マスターと照合します。</p>
<input id="xid" value="X8754CQ" placeholder="X8754CQ">
<button onclick="run()">作者作品を取得して本棚照合</button>
<button onclick="copyResult()">診断結果をコピー</button>
<pre id="out">待機中</pre>
<script>
const MASTER_KEY="tomotaYomu_v214_works_master";
let last="";
function master(){
 try{return JSON.parse(localStorage.getItem(MASTER_KEY)||"{}")}catch(e){return {}}
}
function run(){
 const xid=(document.getElementById("xid").value||"").trim().toUpperCase();
 if(!xid){out("XIDを入力してください");return}
 out("API取得中…");
 const cb="cb_"+Date.now();
 window[cb]=data=>{
   try{
    const works=(data||[]).filter(x=>x&&x.ncode);
    const m=master(), keys=new Set(Object.keys(m).map(x=>String(x).toUpperCase()));
    const hits=works.filter(x=>keys.has(String(x.ncode).toUpperCase()));
    const missing=works.filter(x=>!keys.has(String(x.ncode).toUpperCase()));
    const lines=[
"【ともたよむ v2.1.2.9｜R18作者XID照合実験】",
"XID="+xid,
"API取得件数="+works.length,
"本棚マスター件数="+keys.size,
"本棚に存在="+hits.length,
"本棚に未登録="+missing.length,
"",
"【照合結果】",
...works.map(x=>(keys.has(String(x.ncode).toUpperCase())?"✅ ":"❌ ")+String(x.ncode).toUpperCase()+"｜"+(x.title||""))
   ];
   last=lines.join("\n");out(last);
  }catch(e){out("処理エラー："+e.message)}
  finally{delete window[cb];}
 };
 const s=document.createElement("script");
 s.src="https://api.syosetu.com/novel18api/api/?out=jsonp&of=n-t-w-gl-ga-nt-e&xid="+encodeURIComponent(xid)+"&lim=500&callback="+cb;
 s.onerror=()=>{out("JSONP取得失敗");delete window[cb]};
 document.body.appendChild(s);
}
async function copyResult(){if(!last){alert("先に診断を実行してください");return}try{await navigator.clipboard.writeText(last);alert("診断結果をコピーしました")}catch(e){alert("コピーできませんでした")}}
function out(s){document.getElementById("out").textContent=s}
</script></body></html>
