<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ｜v2.1.2.11 R18作者リンク実験</title><style>body{font-family:-apple-system,sans-serif;margin:16px;line-height:1.55}input,button{font-size:16px;padding:10px;margin:4px 0}button{width:100%}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px}</style></head><body><h2>ともたよむ v2.1.2.11</h2><h3>R18作品 → 作者Xマイページリンク実験</h3><p>作品ページHTMLを取得し、「作者Xマイページ」のリンクからXIDを拾えるか確認します。</p><input id="url" value="https://novel18.syosetu.com/n8248lz/"><button onclick="run()">作品ページから作者リンクを取得</button><button onclick="copyResult()">診断結果をコピー</button><pre id="out">待機中</pre><script>let last="";async function run(){const u=(document.getElementById("url").value||"").trim();out("取得中…\n"+u);try{const r=await fetch(u,{cache:"no-store"});const html=await r.text();const doc=new DOMParser().parseFromString(html,"text/html");const links=[...doc.querySelectorAll('a[href]')].map(a=>({text:(a.textContent||"").trim(),href:a.href}));const hits=links.filter(x=>/作者Xマイページ|xmypage\.syosetu\.com\/x/i.test(x.text+" "+x.href));const xids=[...new Set(hits.map(x=>{const m=x.href.match(/xmypage\.syosetu\.com\/(x[a-z0-9]+)/i);return m?m[1].toUpperCase():""}).filter(Boolean))];last="【ともたよむ v2.1.2.11｜R18作者リンク実験】\n作品URL="+u+"\nHTTP="+r.status+" "+r.statusText+"\nHTML文字数="+html.length+"\n作者リンク候補="+hits.length+"\n抽出XID="+(xids.join(",")||"なし")+"\n\n【候補】\n"+hits.slice(0,20).map(x=>x.text+"\n"+x.href).join("\n");out(last)}catch(e){last="【ともたよむ v2.1.2.11｜R18作者リンク実験】\n作品URL="+u+"\n取得失敗\nエラー="+e.message+"\n\n→ CORS等により、ともたよむから作品HTMLを直接読めない可能性があります。";out(last)}}function out(s){document.getElementById("out").textContent=s}async function copyResult(){if(!last)return;try{await navigator.clipboard.writeText(last);alert("診断結果をコピーしました")}catch(e){alert("コピーできませんでした")}}</script></body></html>
