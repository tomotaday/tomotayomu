<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ v6.30 本棚照合鑑定・切り込み隊</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;line-height:1.5}
button{font-size:16px;padding:10px 14px;margin:4px 4px 10px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
.note{padding:10px;border:1px solid #ccc;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<h1>v6.30 本棚照合鑑定</h1>
<div class="note">
v6.29で確立した「JSONP＋時間分割＋500件ページ取得」を使い、<br>
2026/09/25 00:00〜現在の更新候補を取得 → このHTML内に埋め込んだ本棚Nコードと照合します。<br>
一致作品について general_lastup / general_all_no を表示します。
</div>
<button id="start">鑑定開始</button>
<button id="copy">ログをコピー</button>
<pre id="log"></pre>

<script>
"use strict";

const API="https://api.syosetu.com/novelapi/api/";
const LIM=500;
const MAX=2000;
let cbSeq=0, lines=[];

/* v2.1.0確認済み本棚Nコード 2099件 */
const SHELF_CODES = [
/* ここは実行時に下記のSOURCE_TEXTから抽出 */
];

const SOURCE_TEXT = `
N0175GW
`;

function log(s){lines.push(s);document.getElementById("log").textContent=lines.join("\\n");}
function ymdhms(d){
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function toUnix(d){return Math.floor(d.getTime()/1000);}

function jsonp(urlBase){
  return new Promise((resolve,reject)=>{
    const name="tomotaYomuJsonp_"+(++cbSeq);
    const s=document.createElement("script");
    let timer;
    const started=performance.now();
    function cleanup(){
      clearTimeout(timer);
      try{s.remove();}catch(e){}
      try{delete window[name];}catch(e){window[name]=undefined;}
    }
    window[name]=data=>{const ms=performance.now()-started;cleanup();resolve({data,ms});};
    s.onerror=()=>{const ms=performance.now()-started;cleanup();reject(new Error("script load error ("+Math.round(ms)+"ms)"));};
    s.src=urlBase+"&out=jsonp&callback="+name+"&_cb="+Date.now()+"_"+cbSeq;
    document.head.appendChild(s);
    timer=setTimeout(()=>{cleanup();reject(new Error("timeout"));},15000);
  });
}

async function queryRange(start,end){
  const p=new URLSearchParams({lastup:toUnix(start)+"-"+toUnix(end),of:"n-gl-ga",lim:String(LIM),st:"1"});
  const r=await jsonp(API+"?"+p.toString());
  const allcount=Number(r.data?.[0]?.allcount||0);
  return {start,end,allcount};
}

async function fetchPages(range){
  const rows=[];
  for(let st=1;st<=range.allcount;st+=LIM){
    const p=new URLSearchParams({lastup:toUnix(range.start)+"-"+toUnix(range.end),of:"n-gl-ga",lim:String(LIM),st:String(st)});
    const r=await jsonp(API+"?"+p.toString());
    const page=Array.isArray(r.data)?r.data.slice(1):[];
    log("  page st="+st+" / data="+page.length+" / "+Math.round(r.ms)+"ms");
    if(!page.length) throw new Error("0件ページ: st="+st);
    rows.push(...page);
  }
  return rows;
}

async function splitFetch(start,end,depth=0){
  const q=await queryRange(start,end);
  const pad="  ".repeat(depth);
  log(pad+"範囲 "+ymdhms(start)+" → "+ymdhms(end)+" / allcount="+q.allcount);
  if(q.allcount<=MAX)return await fetchPages(q);
  const mid=new Date(Math.floor((start.getTime()+end.getTime())/2));
  if(mid<=start||mid>=end)throw new Error("時間分割不能");
  log(pad+"→ 分割");
  return (await splitFetch(start,mid,depth+1)).concat(await splitFetch(mid,end,depth+1));
}

function extractShelfCodes(){
  const set=new Set();
  const text=SOURCE_TEXT.toUpperCase();
  const re=/N[0-9A-Z]{6}/g;
  let m;
  while((m=re.exec(text)))set.add(m[0]);
  SHELF_CODES.forEach(x=>set.add(String(x).toUpperCase()));
  return [...set];
}

async function run(){
  document.getElementById("start").disabled=true;
  lines=[];
  log("【v6.30 開始】");
  log("JSONP＋時間分割＋500件ページ → 本棚照合");
  const shelf=extractShelfCodes();
  log("本棚Nコード数: "+shelf.length);
  if(shelf.length<2){
    log("注意: この鑑定ページには本棚Nコード本体が未搭載です。");
    log("まず通信方式・照合処理の動作確認として1件照合します。");
  }
  const end=new Date(), start=new Date("2026-09-25T00:00:00+09:00");
  try{
    const rows=await splitFetch(start,end);
    const map=new Map();
    rows.forEach(w=>{
      const n=String(w.ncode||"").toUpperCase();
      if(n)map.set(n,w);
    });
    const matches=[];
    shelf.forEach(n=>{if(map.has(n))matches.push(map.get(n));});
    matches.sort((a,b)=>String(b.general_lastup||"").localeCompare(String(a.general_lastup||"")));
    log("");
    log("===== 本棚照合 =====");
    log("更新候補ユニークNコード: "+map.size);
    log("本棚一致: "+matches.length);
    matches.forEach((w,i)=>{
      log((i+1)+". "+String(w.ncode||"").toUpperCase()+" / lastup="+(w.general_lastup||"")+" / all_no="+(w.general_all_no||""));
    });
    log("");
    log("===== 集計 =====");
    log("【テスト完了】");
  }catch(e){
    log("");
    log("ERROR: "+e.message);
    log("【テスト未完了】");
  }finally{
    document.getElementById("start").disabled=false;
  }
}
document.getElementById("start").onclick=run;
document.getElementById("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(document.getElementById("log").textContent);alert("ログをコピーしました");}
  catch(e){alert("コピーできませんでした");}
};
</script>
</body>
</html>
