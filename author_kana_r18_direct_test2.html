<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ｜R18かな照合・直接テスト2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;padding:16px;background:#fafafa;color:#222}h1{font-size:20px}.v{color:#888}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}button{font-size:16px;padding:12px 16px;border:0;border-radius:10px;background:#eee}.ok{color:#187a37}.ng{color:#a33}</style></head><body><h1>ともたよむ｜R18かな照合・直接テスト2</h1><div class="v">v0.1.1｜IndexedDB不使用</div><div class="card"><p><b>対象：</b>矢場めろ / X8754CQ</p><p>通常ユーザAPIの <code>word=矢場めろ</code> を直接照会します。</p><button onclick="test()">▶ 矢場めろを照合</button></div><div class="card"><h2>結果</h2><div id="out">まだ実行していません。</div></div><script>
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function jsonp(url,timeout=20000){return new Promise((resolve,reject)=>{const cb="tyDirect_"+Date.now()+"_"+Math.random().toString(36).slice(2);const s=document.createElement("script");let done=false;function clean(){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()}const timer=setTimeout(()=>{clean();reject(new Error("API timeout"))},timeout);window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error("API load error"))};s.src=url+"&callback="+cb;document.body.appendChild(s)})}
async function test(){const o=document.getElementById("out");o.innerHTML="照合中…";try{const url="https://api.syosetu.com/userapi/api/?out=jsonp&of=u-n-y-1&word="+encodeURIComponent("矢場めろ")+"&lim=20";const d=await jsonp(url);const rows=Array.isArray(d)?d.filter((x,i)=>i>0&&x&&x.userid):[];o.innerHTML='<div class="ok"><b>API応答あり</b></div><p>候補：'+rows.length+'件</p>'+(rows.length?rows.map(x=>esc(x.name||"")+"｜"+esc(x.yomikata||"")+"｜ID "+esc(x.userid||"")).join("<br>"):"候補なし");}catch(e){o.innerHTML='<div class="ng"><b>エラー</b><br>'+esc(e.message)+'</div>'}}
</script></body></html>
