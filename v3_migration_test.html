<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜v3.0.0 CSV→IndexedDB 初回移行版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px;background:#f7f7f7;color:#222}
main{max-width:700px;margin:auto}.sub{color:#555;font-size:13px;line-height:1.6;margin-bottom:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px;margin:10px 0}
button,input{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border:1px solid #bbb;border-radius:10px;background:#fff;font-size:15px}
button:disabled{opacity:.45}.danger{border-color:#d88;color:#a00}
.count{font-size:28px;font-weight:700;margin:6px 0}.small{font-size:12px;color:#666;line-height:1.55}
pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:12px;line-height:1.55}
.ok{color:#16733a}
</style></head><body><main>
<h1>ともたよむ</h1>
<div class="sub"><b>v3.0.0｜CSV→IndexedDB 初回移行</b><br>2026/10/04版｜CSVを正本としてNコードを移行</div>

<div class="card">
<b>① CSVを選択</b>
<div class="small">通常作品CSVとR18作品CSVを選択してください。CSV以外のデータは使用しません。</div>
<input id="csv1" type="file" accept=".csv,text/csv">
<input id="csv2" type="file" accept=".csv,text/csv">
<button id="prepare">CSVからNコードを抽出する</button>
</div>

<div class="card">
<b>② IndexedDBへ投入</b>
<div class="count" id="count">0件</div>
<button id="migrate" disabled>このNコードをIndexedDBへ保存</button>
</div>

<div class="card">
<b>③ 保存結果を確認</b>
<button id="verify" disabled>DB件数を確認</button>
<button id="cleanup" class="danger">DBを端末から削除</button>
</div>

<div class="card"><b>④ works_cache 1件テスト</b><div class="small">現在のshelf_placementからNコードを1件取り出し、通常API→取得できなければR18 APIの順で作品情報を取得して保存します。</div><button id="testWork">1件取得してworks_cacheへ保存</button></div>
<button id="copy">診断結果をコピー</button>
<h2>診断結果</h2>
<pre id="out">まだ開始していません。</pre>

<script>
"use strict";
const DB="tomotaYomuDB",VER=1;
const API_GENERAL="https://api.syosetu.com/novelapi/api/";
const API_R18="https://api.syosetu.com/novel18api/api/";
const PRODUCTION_URL="index.html?migration_filter_20261004";
const ST={shelf_names:"shelf_id",shelf_placement:"ncode",works_cache:"ncode",authors:"ncode",reading_position:"ncode"};
let db=null,target=[];
const $=id=>document.getElementById(id);
function log(x){$("out").textContent+=($("out").textContent==="まだ開始していません。"?"":"\n")+x}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{let d=e.target.result;for(let[k,v]of Object.entries(ST))if(!d.objectStoreNames.contains(k))d.createObjectStore(k,{keyPath:v});};r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error)})}
function readFile(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||""));r.onerror=()=>no(r.error||new Error("CSV読込失敗"));r.readAsText(file,"UTF-8")})}
function extractNcodes(csv){
  const out=[];
  const re=/(?:^|[,\t\r\n"])(N[0-9A-Z]+)(?=[,\t\r\n"]|$)/gi;
  let m; while((m=re.exec(csv))!==null) out.push(m[1].toUpperCase());
  return out;
}
async function getBookshelfNcodes(){
  const html=await (await fetch(PRODUCTION_URL,{cache:"no-store"})).text();
  const doc=new DOMParser().parseFromString(html,"text/html");
  return [...new Set([...doc.querySelectorAll("[data-ncode]")].map(e=>String(e.dataset.ncode||"").trim().toUpperCase()).filter(n=>/^N[0-9A-Z]+$/.test(n)))];
}
async function getOneNcode(){
  return new Promise((ok,no)=>{
    const r=db.transaction("shelf_placement","readonly").objectStore("shelf_placement").openCursor();
    r.onsuccess=()=>ok(r.result?r.result.value.ncode:null); r.onerror=()=>no(r.error);
  });
}
async function fetchApi(base,ncode){
  const u=base+"?out=json&of=t-n-u-w-s-bg-g-k-gf-gl-nt-e-ga-nu&ncode="+encodeURIComponent(ncode);
  const res=await fetch(u,{cache:"no-store"});
  if(!res.ok)throw Error("API HTTP "+res.status);
  const j=await res.json();
  return j;
}
$("testWork").onclick=async()=>{
  try{
    $("testWork").disabled=true;
    await openDB();
    const ncode=await getOneNcode();
    if(!ncode)throw Error("shelf_placementにNコードがありません");
    log("テスト対象："+ncode);
    let j=await fetchApi(API_GENERAL,ncode),source="general";
    if(!j[0]||j[0].allcount===0){
      log("通常API：該当なし → R18 APIを確認");
      j=await fetchApi(API_R18,ncode); source="r18";
    }
    if(!j[0]||j[0].allcount===0)throw Error("通常API/R18 APIのどちらにも該当作品がありません");
    const work=j[1];
    const record={ncode:String(work.ncode||ncode).toUpperCase(),source,api_fetched_at:new Date().toISOString(),...work};
    await new Promise((ok,no)=>{
      const t=db.transaction("works_cache","readwrite");
      t.objectStore("works_cache").put(record);
      t.oncomplete=ok;t.onerror=()=>no(t.error);
    });
    log("✓ API取得："+source);
    log("✓ title："+(record.title||"（タイトルなし）"));
    log("✓ works_cacheへ1件保存");
    $("testWork").disabled=false;
  }catch(e){log("✗ works_cacheテスト："+e.message);$("testWork").disabled=false}
};
$("prepare").onclick=async()=>{
  try{
    $("out").textContent="CSVを確認しています。";
    const f1=$("csv1").files[0],f2=$("csv2").files[0];
    if(!f1||!f2)throw Error("通常CSVとR18 CSVの2つを選択してください");
    const [c1,c2]=await Promise.all([readFile(f1),readFile(f2)]);
    const a=extractNcodes(c1),b=extractNcodes(c2);
    const csvCodes=new Set([...a,...b]);
    const shelf=await getBookshelfNcodes();
    target=shelf.filter(n=>csvCodes.has(n));
    log("通常CSV："+a.length+"件");
    log("R18 CSV："+b.length+"件");
    log("CSV重複除外後："+csvCodes.size+"件");
    log("現在の本棚："+shelf.length+"件");
    log("本棚に存在するCSV対象："+target.length+"件");
    log(target.length===shelf.length?"✓ 本棚分だけを移行対象として確定":"⚠ 本棚とCSVの一致件数が異なります");
    $("count").textContent=target.length+"件";
    $("migrate").disabled=target.length===0;
  }catch(e){log("✗ CSV確認エラー："+e.message)}
};
$("migrate").onclick=async()=>{
  try{
    $("migrate").disabled=true;
    await openDB();
    const t=db.transaction("shelf_placement","readwrite");
    const s=t.objectStore("shelf_placement");
    s.clear();
    for(const n of target)s.put({ncode:n,shelf_id:"shelf01"});
    await new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error("DB transaction aborted"))});
    log("✓ shelf_placementを一度クリア");
    log("✓ shelf_placement："+target.length+"件");
    log("✓ IndexedDBへのNコード保存完了");
    $("verify").disabled=false;
  }catch(e){log("✗ DB投入エラー："+e.message);$("migrate").disabled=false}
};
$("verify").onclick=async()=>{
  try{
    const n=await new Promise((ok,no)=>{const r=db.transaction("shelf_placement","readonly").objectStore("shelf_placement").count();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
    log("shelf_placement="+n);
    log(n===target.length?"✓ CSV件数とDB件数が一致":"✗ 件数不一致：CSV="+target.length+" / DB="+n);
  }catch(e){log("✗ DB確認エラー："+e.message)}
};
$("cleanup").onclick=()=>{
  if(db){db.close();db=null}
  const r=indexedDB.deleteDatabase(DB);
  r.onsuccess=()=>{$("out").textContent="✓ DBを端末から削除しました。";$("count").textContent="0件"};
  r.onerror=()=>log("✗ DB削除エラー");
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);alert("コピーしました")}catch(e){alert("コピーできませんでした")}};
</script></main></body></html>
