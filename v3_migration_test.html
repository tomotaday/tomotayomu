<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜v3.0.0 初回移行テスト</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px;background:#f7f7f7;color:#222}main{max-width:700px;margin:auto}.sub{color:#666;font-size:13px;margin-bottom:16px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}button{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:15px}button:disabled{opacity:.45}.danger{border-color:#d88;color:#a00}input{width:100%;box-sizing:border-box;margin:7px 0}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:12px;line-height:1.55}.small{font-size:12px;color:#666;line-height:1.55}</style></head><body><main>
<h1>ともたよむ</h1><div class="sub">v3.0.0｜初回移行テスト｜DB v1</div>
<div class="card"><b>CSVを2本選択</b><div class="small">全年齢CSV＋R18 CSV。「本棚あり」のNコードだけを移行対象にします。</div>
<input id="normal" type="file" accept=".csv,text/csv"><input id="r18" type="file" accept=".csv,text/csv"><button id="load">① CSVを読み込む</button></div>
<div class="card"><b>移行</b><div class="small">作品情報は旧CSVから移さずNarou APIから取得。APIで情報なしでもNコードは削除しません。</div>
<button id="migrate" disabled>② DB v1へ初回移行</button><button id="verify" disabled>③ 移行結果を検証</button><button id="cleanup" class="danger">DB v1を端末から削除</button></div>
<button id="copy">診断結果をコピー</button><h2>診断結果</h2><pre id="out">まだ開始していません。</pre>
<script>
"use strict";
const DB="tomotaYomuDB",VER=1,ST={shelf_names:"shelf_id",shelf_placement:"ncode",works_cache:"ncode",authors:"ncode",reading_position:"ncode"};
let db=null,rows=[];const $=id=>document.getElementById(id);
function log(x){$("out").textContent+=($("out").textContent==="まだ開始していません。"?"":"\n")+x}
function nc(x){return String(x??"").trim().toUpperCase()}
function split(s){let a=[],c="",q=false;for(let i=0;i<s.length;i++){let x=s[i];if(x=='"'){if(q&&s[i+1]=='"'){c+='"';i++}else q=!q}else if(x==","&&!q){a.push(c);c=""}else c+=x}a.push(c);return a}
function csv(t){t=t.replace(/^\uFEFF/,"");let l=t.split(/\r?\n/).filter(x=>x.trim()),h=split(l.shift());return l.map(x=>{let a=split(x),o={};h.forEach((k,i)=>o[k]=a[i]??"");return o})}
async function read(id){let f=$(id).files[0];if(!f)throw Error(id+" CSV未選択");return csv(await f.text())}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{let d=e.target.result;for(let[k,v]of Object.entries(ST))if(!d.objectStoreNames.contains(k))d.createObjectStore(k,{keyPath:v})};r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error)})}
function tx(ns,fn){return new Promise((ok,no)=>{let t=db.transaction(ns,"readwrite"),s=Object.fromEntries(ns.map(n=>[n,t.objectStore(n)]));try{fn(s)}catch(e){no(e);return}t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function api(site,ns){let b=site==="R18"?"https://api.syosetu.com/novel18api/api/":"https://api.syosetu.com/novelapi/api/",o=[];for(let i=0;i<ns.length;i+=500){let p=ns.slice(i,i+500),r=await fetch(b+"?out=json&of=n-t-s-gl-ga-e-e-nt-u-w&lim=500&ncode="+encodeURIComponent(p.join(",")));if(!r.ok)throw Error(site+" API "+r.status);let d=await r.json();for(let j=1;j<d.length;j++)if(d[j]&&typeof d[j]=="object")o.push(d[j]);log("API "+site+" "+Math.min(i+500,ns.length)+"/"+ns.length)}return o}
$("load").onclick=async()=>{try{$("out").textContent="";let[a,b]=await Promise.all([read("normal"),read("r18")]);rows=[...a.map(x=>({...x,__site:"通常"})),...b.map(x=>({...x,__site:"R18"}))].filter(x=>String(x.on_shelf).toLowerCase()==="true");let ns=rows.map(x=>nc(x.ncode)).filter(Boolean),u=new Set(ns);log("通常CSV "+a.length+" / R18 CSV "+b.length+" / 全CSV "+(a.length+b.length));log("本棚ありのみ："+rows.length);log("Nコード有効 "+ns.length+" / ユニーク "+u.size+" / 重複 "+(ns.length-u.size));log("→ 本棚あり2119件だけを移行対象にします");$("migrate").disabled=false}catch(e){log("✗ "+e.message)}};
$("migrate").onclick=async()=>{try{$("migrate").disabled=true;await openDB();let all=[...new Map(rows.map(x=>[nc(x.ncode),x])).values()],fs=[...new Set(all.filter(x=>String(x.on_shelf).toLowerCase()=="true"&&x.folder).map(x=>x.folder))];await tx(["shelf_names"],s=>fs.forEach((name,i)=>s.shelf_names.put({shelf_id:"shelf"+String(i+1).padStart(2,"0"),name})));await tx(["shelf_placement","reading_position"],s=>all.forEach(x=>{let n=nc(x.ncode),i=fs.indexOf(x.folder);if(String(x.on_shelf).toLowerCase()=="true"&&i>=0)s.shelf_placement.put({ncode:n,shelf_id:"shelf"+String(i+1).padStart(2,"0")});let p=Number(x.current_episode);if(Number.isFinite(p)&&p>0)s.reading_position.put({ncode:n,episode:p})}));let a=[...new Set(all.filter(x=>x.__site=="通常").map(x=>nc(x.ncode)))],b=[...new Set(all.filter(x=>x.__site=="R18").map(x=>nc(x.ncode)))],w=[...(await api("通常",a)),...(await api("R18",b))],got=new Set(w.map(x=>nc(x.ncode)));await tx(["works_cache","authors"],s=>w.forEach(x=>{let n=nc(x.ncode),r=b.includes(n);s.works_cache.put({ncode:n,title:x.title||"",writer:x.writer||"",keyword:x.keyword||"",genre:x.genre??0,userid:x.userid??0,noveltype:x.noveltype??x.novel_type??0,end:x.end??0,isstop:x.isstop??0,general_lastup:x.general_lastup||"",general_all_no:x.general_all_no??0,story:x.story||"",novelupdated_at:x.novelupdated_at||"",__r18:r});s.authors.put({ncode:n,type:r?"R18":"通常",userid:x.userid??0,xid:x.xid??""})}));let miss=[...new Set(all.map(x=>nc(x.ncode)).filter(n=>!got.has(n)))];log("works_cache取得 "+got.size+" / 情報なし "+miss.length);if(miss.length)log("⚠️ 情報なし: "+miss.join(", "));$("verify").disabled=false;log("✓ 初回移行完了。情報なしNコードも保持しています。")}catch(e){log("✗ 移行エラー："+e.message);$("migrate").disabled=false}};
$("verify").onclick=async()=>{let a=[];for(let s of Object.keys(ST))a.push(s+"="+await new Promise((ok,no)=>{let r=db.transaction(s,"readonly").objectStore(s).count();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));log("DB件数："+a.join(" / "))};
$("cleanup").onclick=()=>{if(db){db.close();db=null}let r=indexedDB.deleteDatabase(DB);r.onsuccess=()=>{$("out").textContent="✓ DBを端末から削除しました。"};r.onerror=()=>log("✗ DB削除エラー")};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);alert("コピーしました")}catch(e){alert("コピーできませんでした")}};
</script></main></body></html>
