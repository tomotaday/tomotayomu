<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ 復帰検知テスト v2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:20px;line-height:1.6;background:#f7f7f7;color:#222}
h1{font-size:22px;margin:0 0 16px}.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
.state{font-size:22px;font-weight:700}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0}.row:last-child{border-bottom:0}
button{font-size:16px;padding:10px 16px;border:0;border-radius:10px;background:#ddd}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;max-height:320px;overflow:auto}.note{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🔬 ともたよむ 復帰検知テスト v2</h1>
<div class="box"><div class="note">現在の document.visibilityState</div><div id="state" class="state">---</div></div>
<div class="box">
<div class="row"><span>visibilitychange</span><strong id="vc">0</strong></div>
<div class="row"><span>focus</span><strong id="focus">0</strong></div>
<div class="row"><span>pageshow</span><strong id="pageshow">0</strong></div>
<div class="row"><span>pagehide</span><strong id="pagehide">0</strong></div>
</div>
<div class="box"><div class="row"><span>最後のイベント</span><strong id="last">---</strong></div><div class="row"><span>最後のイベント時刻</span><strong id="time">---</strong></div></div>
<div class="box"><div id="log">ログなし</div></div>
<button id="reset">リセット</button>
<script>
const KEY="tomotayomu_visibility_test_v2";
const state={vc:0,focus:0,pageshow:0,pagehide:0,last:"",time:"",log:[]};
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved)Object.assign(state,saved)}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){
 document.getElementById("state").textContent=document.visibilityState;
 document.getElementById("vc").textContent=state.vc;
 document.getElementById("focus").textContent=state.focus;
 document.getElementById("pageshow").textContent=state.pageshow;
 document.getElementById("pagehide").textContent=state.pagehide;
 document.getElementById("last").textContent=state.last||"---";
 document.getElementById("time").textContent=state.time||"---";
 document.getElementById("log").textContent=state.log.length?state.log.join("\n"):"ログなし";
}
function record(name,detail=""){
 const now=new Date().toLocaleTimeString("ja-JP",{hour12:false});
 state[name]++;state.last=name;state.time=now;
 state.log.unshift(now+"  "+name+(detail?"  "+detail:""));
 state.log=state.log.slice(0,100);save();render();
}
document.addEventListener("visibilitychange",()=>record("vc","state="+document.visibilityState));
window.addEventListener("focus",()=>record("focus"));
window.addEventListener("pageshow",e=>record("pageshow","persisted="+e.persisted));
window.addEventListener("pagehide",()=>record("pagehide"));
document.getElementById("reset").addEventListener("click",()=>{localStorage.removeItem(KEY);location.reload()});
load();render();
</script>
</body>
</html>
