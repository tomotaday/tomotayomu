<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通常API 3作品診断</title><style>body{font-family:-apple-system,sans-serif;padding:18px;background:#f6f3ed;color:#252525}button{padding:10px;margin:6px 0}pre{white-space:pre-wrap;background:#fff;padding:12px;border:1px solid #aaa195;border-radius:10px}</style><h1>🔎 通常API 3作品診断</h1><p>N7998LI / N6106LC / N1028JP を通常APIへ直接ncode指定します。</p><button id="run">▶ 取得テスト</button><button id="copy">📋 結果をコピー</button><pre id="out">まだ診断していません。</pre><script>const API="https://api.syosetu.com/novelapi/api/";const NC=["N7998LI","N6106LC","N1028JP"];function jsonp(url){return new Promise((resolve,reject)=>{const cb="t_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),tm=setTimeout(()=>{cl();reject(new Error("JSONP timeout"))},20000);function cl(){clearTimeout(tm);s.remove();try{delete window[cb]}catch(e){}}window[cb]=d=>{cl();resolve(d)};s.onerror=()=>{cl();reject(new Error("JSONP load error"))};s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();document.head.appendChild(s)})}async function run(){const o=document.getElementById("out");o.textContent="通常API取得中…";try{const u=API+"?ncode="+encodeURIComponent(NC.join("-"))+"&of=n-gl-ga-e-e&lim=500";const d=await jsonp(u);const rows=Array.isArray(d)?d.slice(1):[];let s="【通常API 3作品診断】\nURL="+u+"\n取得行数="+rows.length+"\n\n";NC.forEach(n=>{const w=rows.find(x=>String(x.ncode||"").toUpperCase()===n);s+=n+"："+(w?"取得成功 | lastup="+w.general_lastup+" | 全話="+w.general_all_no:"取得なし")+"\n"});s+="\n【全取得Nコード】\n"+rows.map(x=>x.ncode).join(", ");o.textContent=s}catch(e){o.textContent="ERROR："+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(document.getElementById("out").textContent);alert("コピーしました")};</script></html>
