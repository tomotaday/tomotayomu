<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登録日時確認｜ともたよむ</title>
<style>
:root{color-scheme:light dark}body{font-family:system-ui,-apple-system,sans-serif;max-width:680px;margin:0 auto;padding:18px;line-height:1.65}h1{font-size:1.35rem}section{border:1px solid #8886;border-radius:14px;padding:14px;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:9px}input{width:100%;box-sizing:border-box;border:1px solid #888;margin:6px 0 10px}button{border:0;background:#287a55;color:white;font-weight:700;width:100%}.muted{opacity:.75;font-size:.9rem}.value{font-weight:700;overflow-wrap:anywhere}dt{font-size:.85rem;opacity:.7;margin-top:10px}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>🔎 登録日時の確認</h1>
<p>正本DB <code>tomotaYomuWorksDB</code> を<strong>読み取り専用</strong>で調べます。データの追加・変更・削除は行いません。</p>
<section>
<label for="ncode">確認するNコード</label>
<input id="ncode" value="N0552EP" autocomplete="off" spellcheck="false">
<button id="check">この作品を確認する</button>
<p class="muted">DB version 2 / works ストアを検索します。</p>
</section>
<section id="result" aria-live="polite">確認待ちです。</section>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB",DB_VERSION=2;
const $=id=>document.getElementById(id);
function openDb(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME);
  req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error("DBの更新が必要なため停止しました"))};
  req.onsuccess=()=>{const db=req.result;if(db.version!==DB_VERSION||!db.objectStoreNames.contains("works")){db.close();reject(new Error("DB構造が想定外です（version 2 / works が必要）"));return}resolve(db)};
  req.onerror=()=>reject(req.error||new Error("DBを開けません"));
  req.onblocked=()=>reject(new Error("DBが別タブで使用中です"));
 });
}
function norm(s){return String(s||"").trim().toUpperCase()}
function esc(s){return String(s??"（なし）").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateText(v){
 if(!v)return "（未設定）";
 const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v)+"（日時として解釈できません）";
 return d.toISOString()+"\nJST: "+new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);
}
async function check(){
 const code=norm($("ncode").value);
 if(!code){$("result").textContent="Nコードを入力してね。";return}
 $("check").disabled=true;$("result").textContent="正本DBを読み取り中…";
 let db;
 try{
  db=await openDb();
  const rows=await new Promise((resolve,reject)=>{
   const tx=db.transaction("works","readonly"),req=tx.objectStore("works").getAll();
   req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error||new Error("読み取りに失敗しました"));
  });
  const hits=rows.filter(w=>{
   const candidates=[w.ncode,w.nCode,w.Ncode,w.id,w.workId,w.workID,w.code];
   if(candidates.some(v=>norm(v)===code))return true;
   const url=[w.url,w.sourceUrl,w.siteData?.sourceUrl].filter(Boolean).join(" ");
   return new RegExp("(^|[/_-])"+code+"($|[/?#._-])","i").test(url);
  });
  if(!hits.length){$("result").innerHTML="<strong>該当作品が見つかりませんでした。</strong><p>入力コード："+esc(code)+"</p><p class='muted'>登録先のDBが異なる、まだ同期されていない、またはNコードの保存フィールドが別形式の可能性があります。</p>";return}
  $("result").innerHTML=hits.map((w,i)=>`
   <h2>確認結果 ${i+1} / ${hits.length}</h2>
   <dl>
   <dt>作品名</dt><dd class="value">${esc(w.title||w.workTitle||w.name)}</dd>
   <dt>Nコード / ID</dt><dd>${esc(w.ncode||w.nCode||w.Ncode||w.id||w.workId||w.code)}</dd>
   <dt>サイト</dt><dd>${esc(w.site)}</dd>
   <dt>registeredAt</dt><dd class="value">${esc(dateText(w.registeredAt))}</dd>
   <dt>registeredAtType</dt><dd class="value">${esc(w.registeredAtType)}</dd>
   </dl>`).join("<hr>");
 }catch(e){$("result").textContent="確認できませんでした："+e.message}
 finally{if(db)db.close();$("check").disabled=false}
}
$("check").addEventListener("click",check);
</script>
</body></html>
