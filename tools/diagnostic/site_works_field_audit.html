<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ともたよむ｜note・カクヨム項目照合</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f4f6fb;color:#182b4d;font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5}main{max-width:760px;margin:auto}.panel{background:white;border:1px solid #ccd5e2;border-radius:12px;padding:14px;margin:12px 0}button{width:100%;padding:13px;border:0;border-radius:9px;background:#17458a;color:white;font-size:16px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#eef2f8;padding:12px;border-radius:8px}small{color:#52647a}</style></head>
<body><main><h1>note・カクヨム項目照合</h1><section class="panel"><b>読み取り専用</b><p>新DBと旧localStorageのnote・カクヨム作品情報を比較します。保存・変更・削除は一切しません。</p><button id="run">項目を照合する</button></section><section class="panel"><div id="status">未実行</div><pre id="out"></pre></section></main>
<script>
const KEYS={note:"tomotaYomu_note_magazines_v1",kakuyomu:"tomotaYomu_kakuyomu_works_v1"};
function parse(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return {parseError:String(e)}}}
function summarize(x){if(!x)return null;return {id:x.id,workId:x.workId,title:x.title,author:x.author,authorName:x.authorName,updatedAt:x.updatedAt,lastUpdated:x.lastUpdated,lastPublishedAt:x.lastPublishedAt,status:x.status,episodeCount:x.episodeCount,totalEpisodes:x.totalEpisodes,bookmarkEpisode:x.bookmarkEpisode,bookmarkEpisodeId:x.bookmarkEpisodeId,bookmarkEpisodeUrl:x.bookmarkEpisodeUrl,shelfId:x.shelfId,siteData:x.siteData,legacyFields:x.siteData?.legacyFields}}
async function run(){const status=document.getElementById("status"),out=document.getElementById("out");status.textContent="照合中…";try{const req=indexedDB.open("tomotaYomuWorksDB");req.onupgradeneeded=()=>{req.transaction.abort()};const db=await new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)});if(db.version!==2||!db.objectStoreNames.contains("works"))throw Error("新DB構造が想定外です");const rows=await new Promise((ok,no)=>{const tx=db.transaction("works","readonly"),q=tx.objectStore("works").getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)});db.close();const result={newDB:{note:rows.filter(x=>x.site==="note").map(summarize),kakuyomu:rows.filter(x=>x.site==="kakuyomu").map(summarize)},legacyLocalStorage:{note:(parse(KEYS.note)||[]).map(summarize),kakuyomu:(parse(KEYS.kakuyomu)||[]).map(summarize)}};out.textContent=JSON.stringify(result,null,2);status.textContent="照合完了。表示された内容をスクリーンショットで送ってね。"}catch(e){status.textContent="照合失敗："+e.message;out.textContent=String(e.stack||e)}}document.getElementById("run").addEventListener("click",run);
</script></body></html>
