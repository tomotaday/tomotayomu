<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜旧作者台帳・読取専用診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;padding:16px;background:#fafafa;color:#222;line-height:1.5}
h1{font-size:20px}h2{font-size:16px;margin-top:22px}
p{color:#555}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}
.row:last-child{border:0}.num{font-weight:700;font-variant-numeric:tabular-nums}
.warn{background:#fff5d6;padding:12px;border-radius:10px}
button,a{display:inline-block;padding:10px 13px;border:0;border-radius:8px;background:#eee;color:#222;text-decoration:none}
</style>
</head>
<body>
<a href="../../index.html">← 本棚へ戻る</a>
<h1>旧作者台帳・読取専用診断</h1>
<p>新IndexedDBと旧localStorageの作者情報を照合します。<strong>このページはデータを書き換えず、削除もしません。</strong></p>
<div id="status" class="warn">診断中…</div>
<div id="result"></div>
<script>
const DB_NAME="tomotaYomuWorksDB";
const KEYS={
 master:"tomotayomu_v214_works_master",
 authors:"tomotaYomu_authors",
 links:"tomotaYomu_author_links",
 v215Authors:"tomotaYomu_v215_author_registry",
 v215Done:"tomotaYomu_v215_author_done_ncodes"
};
const $=id=>document.getElementById(id);
function readJson(key,fallback){try{const raw=localStorage.getItem(key);return raw===null?fallback:(JSON.parse(raw)??fallback)}catch(e){return fallback}}
function ncode(v){return String(v||"").trim().toUpperCase().replace(/^NAROU:/,"")}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME);r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("新DBが未作成です"))};r.onsuccess=()=>{const db=r.result;if(db.version!==2||!db.objectStoreNames.contains("works")){db.close();reject(new Error("新DB構造が想定外です"));return}resolve(db)};r.onerror=()=>reject(r.error||new Error("新DBを開けません"))})}
function readAll(db){return new Promise((resolve,reject)=>{const out=[],r=db.transaction("works","readonly").objectStore("works").openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error("作品読込失敗"))})}
function metric(label,value){return '<div class="row"><span>'+label+'</span><span class="num">'+value+'</span></div>'}
(async()=>{
 try{
  const legacyA=readJson(KEYS.authors,{}),legacyL=readJson(KEYS.links,{}),legacyM=readJson(KEYS.master,{});
  const v215A=readJson(KEYS.v215Authors,{}),v215D=readJson(KEYS.v215Done,[]);
  const db=await openDB(),all=await readAll(db);db.close();
  const works=all.filter(w=>w.site==="narou"),byCode=new Map(works.map(w=>[ncode(w.workId||w.ncode),w]));
  const missing=works.filter(w=>!String(w.authorId||"").trim());
  const linked=works.length-missing.length;
  let match=0,already=0,conflict=0,noWork=0,noAuthor=0,invalid=0;
  const candidateAuthors=new Set();
  for(const [code0,id0] of Object.entries(legacyL)){
   const code=ncode(code0),id=String(id0||"").trim();
   if(!code||!id){invalid++;continue}
   const author=legacyA[id],work=byCode.get(code);
   if(!work){noWork++;continue}
   if(!author){noAuthor++;continue}
   candidateAuthors.add(id);
   const current=String(work.authorId||"").trim();
   if(!current)match++;
   else if(current===id)already++;
   else conflict++;
  }
  const fmt=v=>Number(v||0).toLocaleString("ja-JP");
  $("status").textContent="診断完了。読み取りのみ実行しました。";
  $("result").innerHTML=
   '<section class="card"><h2>新DB（tomotaYomuWorksDB）</h2>'+
   metric("全作品",fmt(all.length))+metric("なろう作品",fmt(works.length))+metric("作者IDあり",fmt(linked))+metric("作者IDなし",fmt(missing.length))+'</section>'+
   '<section class="card"><h2>旧作者台帳（localStorage）</h2>'+
   metric("旧作者マスター",fmt(Object.keys(legacyA).length))+
   metric("旧作品→作者ID紐付け",fmt(Object.keys(legacyL).length))+
   metric("旧作品マスター",fmt(Object.keys(legacyM).length))+
   metric("v2.1.5作者台帳",fmt(Object.keys(v215A).length))+
   metric("v2.1.5処理済みNコード",fmt(Array.isArray(v215D)?v215D.length:0))+
   metric("旧紐付けに登場する作者数",fmt(candidateAuthors.size))+'</section>'+
   '<section class="card"><h2>旧紐付けと新DBの照合</h2>'+
   metric("新DBの作者IDなし作品へ補完候補",fmt(match))+
   metric("既に同じ作者IDで一致",fmt(already))+
   metric("新DBと作者IDが不一致",fmt(conflict))+
   metric("新DBに作品がない",fmt(noWork))+
   metric("旧作者台帳に作者情報がない",fmt(noAuthor))+
   metric("空欄・不正な紐付け",fmt(invalid))+'</section>'+
   '<section class="card"><h2>判定の見方</h2><p>「補完候補」が0なら、旧作者台帳から新DBへ追加できる紐付けは見つかっていません。「不一致」が1以上なら、内容を個別確認するまで旧台帳を手放せません。v2.1.5台帳と旧作品マスターは、このページでは件数のみ確認し、内容の移行・変更は行いません。</p></section>'+
   '<p class="warn">この診断結果は件数のみ表示します。作者名・Nコード・作者IDの一覧は表示・送信しません。</p>';
 }catch(e){$("status").textContent="診断失敗："+e.message+"。データ変更は行っていません。"}
})();
</script>
</body>
</html>
