<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fb">
<title>ともたよむ｜Nコード抽出診断</title>
<style>
:root{color-scheme:light;--ink:#273044;--muted:#687386;--line:#dfe4ed;--paper:#fff;--bg:#f5f7fb;--accent:#526b9a}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{border:0;border-radius:10px;background:var(--accent);color:white;padding:11px 16px;font-size:1rem;margin:4px 4px 4px 0}
button:disabled{opacity:.5}
.status{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
textarea{width:100%;min-height:180px;padding:10px;font:13px/1.5 ui-monospace,monospace}
.small{font-size:.82rem;color:var(--muted)}
strong.num{font-size:1.5rem}
</style>
</head>
<body>
<main>
<p style="margin:0 0 14px"><a href="../../index.html" style="display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--accent);text-decoration:none;font-weight:600">← ともたよむに戻る</a></p>
<h1>ともたよむ｜Nコード抽出診断</h1>
<p class="lead">本棚DBから小説家になろう作品のNコードを抽出する読み取り専用診断です。</p>
<section class="panel">
<p><strong>対象DB：</strong>tomotaYomuDB（既存DBのみ）</p>
<p class="small">shelf_placement と works_cache を読み取ります。追加・変更・削除・API照会は行いません。DBが存在しない場合も新規作成しません。</p>
<button id="run" type="button">Nコード抽出を実行</button>
</section>
<section class="panel">
<h2>抽出結果</h2>
<div id="status" class="status" role="status" aria-live="polite">まだ実行していません。</div>
<div id="counts"></div>
</section>
<section class="panel">
<h2>抽出Nコード（先頭20件）</h2>
<div id="preview" class="status">実行後に表示します。</div>
</section>
<section class="panel">
<h2>全Nコード</h2>
<p class="small">抽出結果を確認・コピーするための表示欄です。ここで編集しても本棚DBには反映されません。</p>
<textarea id="allCodes" readonly placeholder="抽出後にNコード一覧が表示されます。"></textarea>
<button id="copy" type="button" disabled>照会対象Nコードをコピー</button>
<div id="copyStatus" class="small"></div>
</section>
</main>
<script>
(() => {
"use strict";
const DB_NAME = "tomotaYomuDB";
const DB_VERSION = 1;
const $ = id => document.getElementById(id);

function openExistingDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("本棚DBを開けませんでした。"));
    request.onblocked = () => reject(new Error("DBが別の画面で使用中です。ほかのともたよむ画面を閉じて再試行してください。"));
    request.onupgradeneeded = () => {
      request.transaction.abort();
      reject(new Error("本棚DBが存在しないため、新規作成せずに中止しました。ともたよむ本体を先に開いてください。"));
    };
  });
}

function readAll(db, storeName) {
  return new Promise((resolve, reject) => {
    let request;
    try {
      request = db.transaction(storeName, "readonly").objectStore(storeName).getAll();
    } catch (error) {
      reject(error);
      return;
    }
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error || new Error(storeName + " の読み取りに失敗しました。"));
  });
}

async function extract() {
  const button = $("run");
  button.disabled = true;
  $("status").textContent = "既存の本棚DBを読み取り中…";
  $("counts").replaceChildren();
  $("preview").textContent = "";
  $("allCodes").value = "";
  $("copy").disabled = true;
  $("copyStatus").textContent = "";
  let db;
  try {
    db = await openExistingDB();
    const names = Array.from(db.objectStoreNames);
    if (!names.includes("shelf_placement") || !names.includes("works_cache")) {
      throw new Error("必要なストア（shelf_placement / works_cache）が見つかりません。DB構造を確認してください。");
    }
    const [placements, works] = await Promise.all([
      readAll(db, "shelf_placement"),
      readAll(db, "works_cache")
    ]);

    const placementCodes = placements
      .map(row => String(row && row.ncode || "").trim().toUpperCase())
      .filter(Boolean);
    const validCodes = placementCodes.filter(code => /^N[0-9A-Z]+$/.test(code));
    const uniqueCodes = [...new Set(validCodes)].sort();
    const invalidRows = placements.length - placementCodes.length + placementCodes.filter(code => !/^N[0-9A-Z]+$/.test(code)).length;

    const workCodes = new Set(works.map(row => String(row && row.ncode || "").trim().toUpperCase()).filter(code => /^N[0-9A-Z]+$/.test(code)));
    const targetCodes = uniqueCodes.filter(code => workCodes.has(code));
    const noWorkCache = uniqueCodes.filter(code => !workCodes.has(code));
    const workOnlyCodes = [...workCodes].filter(code => !new Set(uniqueCodes).has(code));

    $("status").textContent =
      "抽出完了。データの変更は行っていません。\n" +
      "DB：" + db.name + "（version " + db.version + "）\n" +
      "確認日時：" + new Date().toLocaleString("ja-JP");
    const lines = [
      ["shelf_placement レコード", placements.length],
      ["Nコードあり", placementCodes.length],
      ["形式不正・Nコードなし", invalidRows],
      ["有効なNコード（重複除去前）", validCodes.length],
      ["配置側ユニークNコード", uniqueCodes.length],
      ["works_cache レコード", works.length],
      ["works_cache内ユニークNコード", workCodes.size],
      ["照会対象Nコード（両方に存在）", targetCodes.length],
      ["配置あり・作品本体なし（対象外）", noWorkCache.length],
      ["作品本体あり・配置なし", workOnlyCodes.length]
    ];
    const list = document.createElement("ul");
    for (const [label, value] of lines) {
      const li = document.createElement("li");
      li.textContent = label + "：";
      const strong = document.createElement("strong");
      strong.className = "num";
      strong.textContent = String(value);
      li.appendChild(strong);
      $("counts").appendChild(li);
    }
    $("preview").textContent = targetCodes.slice(0, 20).join("\n") || "照会対象Nコードは見つかりませんでした。";
    $("allCodes").value = targetCodes.join("\n");
    $("copy").disabled = targetCodes.length === 0;
  } catch (error) {
    $("status").textContent = "抽出できませんでした。\n" + (error && error.message ? error.message : String(error));
  } finally {
    if (db) db.close();
    button.disabled = false;
  }
}

$("run").addEventListener("click", extract);
$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("allCodes").value);
    $("copyStatus").textContent = "照会対象Nコードをクリップボードにコピーしました。";
  } catch (_) {
    $("allCodes").focus();
    $("allCodes").select();
    $("copyStatus").textContent = "自動コピーできませんでした。選択された一覧を手動でコピーしてください。";
  }
});
})();
</script>
</body>
</html>
