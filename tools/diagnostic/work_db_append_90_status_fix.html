<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ともたよむ｜追加90作品の状態修正</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#183153;line-height:1.6}main{width:min(100%,720px);margin:auto;padding:20px 14px 44px}.panel{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:15px;margin:13px 0}.warn{border-left:5px solid #d97706;background:#fffaf0}button{width:100%;padding:13px;border:0;border-radius:10px;background:#17458a;color:white;font:inherit;font-weight:700;margin-top:10px}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3fa;border-radius:10px;padding:12px;font-size:13px}</style></head><body><main><h1>追加90作品｜完結状態の修正</h1><section class="panel warn"><b>テストDB限定・状態項目のみ更新</b><p>対象：<code>tomotaYomu_work_test_v1</code> の90作品。作品名・作者名・URL・棚・読書位置・siteDataは変更しません。本番DBと旧DBには触れません。</p><p>なろうAPI仕様：<code>end=0</code> は完結、<code>end=1</code> は連載中。</p></section><section class="panel"><button id="run">APIのend値に基づき90作品の状態を修正</button><div id="log">未実行</div></section></main><script>"use strict";const DB="tomotaYomu_work_test_v1",IDS=["narou:N0066HQ","narou:N0261FM","narou:N0311FS","narou:N0639GY","narou:N0701HP","narou:N0799HR","narou:N0977HS","narou:N1242HR","narou:N1287HH","narou:N1349HK","narou:N1360HS","narou:N1560HR","narou:N1745HF","narou:N1929HB","narou:N2056HO","narou:N2195GJ","narou:N2386HQ","narou:N2408HS","narou:N2412HO","narou:N2442HM","narou:N2625HP","narou:N2692HS","narou:N2938HS","narou:N3074HR","narou:N3077HS","narou:N3121HO","narou:N3231HR","narou:N3281HS","narou:N3442HB","narou:N3557HN","narou:N3692HB","narou:N4409HO","narou:N4414HA","narou:N4422HR","narou:N4485HP","narou:N4489HM","narou:N4508HP","narou:N4556HO","narou:N4590HP","narou:N4841HQ","narou:N5340HQ","narou:N5475GP","narou:N5701HS","narou:N5785DZ","narou:N5827HE","narou:N5896HA","narou:N6067HR","narou:N6074HF","narou:N6111HO","narou:N6114GX","narou:N6165DR","narou:N6175HO","narou:N6335HQ","narou:N6451GW","narou:N6494GY","narou:N6522HO","narou:N6565HP","narou:N6571HP","narou:N6572HQ","narou:N6685EP","narou:N6764HG","narou:N6849HO","narou:N6893HS","narou:N6971FY","narou:N7096HP","narou:N7535HN","narou:N7591HL","narou:N7656EO","narou:N7696HN","narou:N7775HR","narou:N7975CR","narou:N8250HQ","narou:N8281HR","narou:N8291HP","narou:N8363HN","narou:N8383HR","narou:N8413GN","narou:N8472HO","narou:N8491HQ","narou:N9141GT","narou:N9147FM","narou:N9178HO","narou:N9384HP","narou:N9428HC","narou:N9453HK","narou:N9623HP","narou:N9695HR","narou:N9795HN","narou:N9856HO","narou:N9874HP"];const $=id=>document.getElementById(id);function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{q.transaction.abort();no(Error("テストDBがありません"))};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error||Error("DBを開けません"))})}function all(db){return new Promise((ok,no)=>{const t=db.transaction("works","readonly"),q=t.objectStore("works").getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}$("run").onclick=async()=>{let db;$("run").disabled=true;try{db=await openDB();const rows=await all(db);if(rows.length!==3600)throw Error("DB件数が3,600件ではありません："+rows.length);const map=new Map(rows.map(r=>[r.id,r]));const targets=IDS.map(id=>map.get(id));if(targets.some(r=>!r))throw Error("対象90作品が揃っていません");if(targets.some(r=>!["0","1"].includes(String(r.siteData?.end))))throw Error("end値不明。更新中止");await new Promise((ok,no)=>{const tx=db.transaction("works","readwrite"),st=tx.objectStore("works");for(const r of targets)st.put({...r,status:String(r.siteData.end)==="0"?"完結":"連載中"});tx.oncomplete=ok;tx.onerror=()=>no(tx.error||Error("更新失敗"));tx.onabort=()=>no(tx.error||Error("更新中断"))});const after=await all(db),m=new Map(after.map(r=>[r.id,r]));const checked=IDS.map(id=>m.get(id));const counts=checked.reduce((a,r)=>{a[r.status]=(a[r.status]||0)+1;return a},{});if(after.length!==3600||checked.some(r=>r.status!==(String(r.siteData.end)==="0"?"完結":"連載中")))throw Error("更新後照合失敗");$("log").textContent="テストDBの修正・再読込・照合成功\n対象：90作品\n状態内訳："+JSON.stringify(counts)+"\n全作品のstatusとsiteData.endが一致\nDB合計：3,600件\n本番DBは未変更です。"}catch(e){$("log").textContent="中止："+e.message+"\n本番DBは未変更です。"}finally{db?.close();$("run").disabled=false}};</script></section></main></body></html>
