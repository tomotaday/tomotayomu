<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fb">
<title>ともたよむ｜DB診断</title>
<style>
:root{color-scheme:light;--ink:#273044;--muted:#687386;--line:#dfe4ed;--paper:#fff;--bg:#f5f7fb;--accent:#526b9a}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{border:0;border-radius:10px;background:var(--accent);color:white;padding:11px 16px;font-size:1rem}
.status{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
code{overflow-wrap:anywhere}
.small{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<p style="margin:0 0 14px"><a href="../../index.html" style="display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--accent);text-decoration:none;font-weight:600">← ともたよむに戻る</a></p>
<h1>ともたよむ｜DB診断</h1>
<p class="lead">IndexedDBの構造と件数を確認する読み取り専用ページです。</p>
<section class="panel">
<p>対象データベース：<strong>tomotaYomuDB</strong></p>
<p class="small">データの追加・変更・削除は行いません。DBが存在しない場合も、新規作成せずに終了します。</p>
<button id="run" type="button">診断を実行</button>
</section>
<section class="panel">
<h2>診断結果</h2>
<div id="status" class="status" role="status" aria-live="polite">まだ診断していません。</div>
<div id="result"></div>
<div id="orphanResult"></div>
</section>
<p class="small">診断専用ファイル：tools/diagnostic/diagnostic_db.html</p>
</main>
<script>
(() => {
  "use strict";
  const DB_NAME = "tomotaYomuDB";
  const DB_VERSION = 1;
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const orphanResultEl = document.getElementById("orphanResult");
  const runButton = document.getElementById("run");

  function openExistingDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("本棚DBを開けませんでした。"));
      request.onblocked = () => reject(new Error("DBが別の画面で使用中です。ほかのともたよむ画面を閉じて再試行してください。"));
      request.onupgradeneeded = () => {
        request.transaction.abort();
        reject(new Error("本棚DBが存在しないため、新規作成せずに中止しました。ともたよむ本体を先に開いてください。"));
      };
    });
  }

  function countStore(db, storeName) {
    return new Promise((resolve, reject) => {
      let tx;
      try {
        tx = db.transaction(storeName, "readonly");
        const request = tx.objectStore(storeName).count();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error(storeName + " の件数取得に失敗しました。"));
        tx.onabort = () => reject(tx.error || new Error(storeName + " の読み取りが中断されました。"));
      } catch (error) {
        reject(error);
      }
    });
  }

  function addCell(row, value, tag) {
    const cell = document.createElement(tag || "td");
    cell.textContent = String(value);
    row.appendChild(cell);
  }

  async function diagnose() {
    runButton.disabled = true;
    statusEl.textContent = "診断中…";
    resultEl.replaceChildren();
    orphanResultEl.replaceChildren();
    let db;
    try {
      db = await openExistingDB();
      const names = Array.from(db.objectStoreNames);
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const header = document.createElement("tr");
      ["ストア名", "keyPath", "インデックス", "レコード件数"].forEach(x => addCell(header, x, "th"));
      thead.appendChild(header);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");

      for (const name of names) {
        const tx = db.transaction(name, "readonly");
        const store = tx.objectStore(name);
        const keyPath = store.keyPath === null ? "(なし)" :
          Array.isArray(store.keyPath) ? store.keyPath.join(", ") : store.keyPath;
        const indexes = Array.from(store.indexNames).map(indexName => {
          const index = store.index(indexName);
          const path = Array.isArray(index.keyPath) ? index.keyPath.join(", ") : index.keyPath;
          return indexName + " → " + path +
            (index.unique ? " [unique]" : "") +
            (index.multiEntry ? " [multiEntry]" : "");
        });
        const count = await countStore(db, name);
        const row = document.createElement("tr");
        addCell(row, name);
        addCell(row, keyPath);
        addCell(row, indexes.length ? indexes.join("\n") : "なし");
        addCell(row, count);
        tbody.appendChild(row);
      }
      table.appendChild(tbody);
      resultEl.appendChild(table);

      // 配置情報はあるが作品本体がないNコードを読み取り専用で抽出する
      if (names.includes("shelf_placement") && names.includes("works_cache")) {
        const tx = db.transaction(["shelf_placement", "works_cache"], "readonly");
        const placementKeysRequest = tx.objectStore("shelf_placement").getAllKeys();
        const cacheKeysRequest = tx.objectStore("works_cache").getAllKeys();
        const [placementKeys, cacheKeys] = await Promise.all([
          new Promise((resolve, reject) => {
            placementKeysRequest.onsuccess = () => resolve(placementKeysRequest.result);
            placementKeysRequest.onerror = () => reject(placementKeysRequest.error);
          }),
          new Promise((resolve, reject) => {
            cacheKeysRequest.onsuccess = () => resolve(cacheKeysRequest.result);
            cacheKeysRequest.onerror = () => reject(cacheKeysRequest.error);
          })
        ]);
        const cacheSet = new Set(cacheKeys.map(String));
        const missingWorks = placementKeys.map(String).filter(ncode => !cacheSet.has(ncode)).sort();

        const heading = document.createElement("h2");
        heading.textContent = "作品本体が見つからない配置データ";
        orphanResultEl.appendChild(heading);
        const note = document.createElement("p");
        note.className = "small";
        note.textContent = "shelf_placement には存在し、works_cache には存在しないNコードです。件数差だけでなく、主キーを照合して抽出しています。ここでは削除しません。";
        orphanResultEl.appendChild(note);

        const orphanStatus = document.createElement("p");
        orphanStatus.textContent = "該当件数：" + missingWorks.length;
        orphanResultEl.appendChild(orphanStatus);

        if (missingWorks.length) {
          const orphanTable = document.createElement("table");
          const orphanHead = document.createElement("tr");
          ["No.", "Nコード", "作品ページ"].forEach(x => addCell(orphanHead, x, "th"));
          orphanTable.appendChild(orphanHead);
          missingWorks.forEach((ncode, index) => {
            const row = document.createElement("tr");
            addCell(row, index + 1);
            addCell(row, ncode);
            const cell = document.createElement("td");
            if (/^n[0-9a-z]+$/i.test(ncode)) {
              const link = document.createElement("a");
              link.href = "https://ncode.syosetu.com/" + encodeURIComponent(ncode.toLowerCase()) + "/";
              link.textContent = "作品ページを開く";
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              cell.appendChild(link);
            } else {
              cell.textContent = "Nコード形式を確認してください";
            }
            row.appendChild(cell);
            orphanTable.appendChild(row);
          });
          orphanResultEl.appendChild(orphanTable);
        } else {
          const none = document.createElement("p");
          none.textContent = "該当する配置データはありません。";
          orphanResultEl.appendChild(none);
        }
      }

      statusEl.textContent =
        "取得成功\nDB名：" + db.name +
        "\nDBバージョン：" + db.version +
        "\nObject Store数：" + names.length +
        "\n確認日時：" + new Date().toLocaleString("ja-JP");
    } catch (error) {
      statusEl.textContent = "診断できませんでした\n" + (error && error.message ? error.message : String(error));
    } finally {
      if (db) db.close();
      runButton.disabled = false;
    }
  }

  runButton.addEventListener("click", diagnose);
})();
</script>
</body>
</html>
