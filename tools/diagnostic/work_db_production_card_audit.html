<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ｜本番作品DBカード表示監査</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fc;color:#102a5c;line-height:1.55}
main{width:min(100%,760px);margin:auto;padding:18px 14px 40px}
h1{font-size:24px;margin:0 0 6px}.note{font-size:13px;color:#596579;margin:0 0 16px}
.panel{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:14px;margin:12px 0}
.warning{border-left:4px solid #d97706;background:#fffaf0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button{font:inherit;padding:10px;border:1px solid #aab7cc;border-radius:9px;background:white;color:inherit;min-width:0}
button{background:#17458a;color:white;font-weight:700}
#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#eef2f8;border-radius:9px;padding:10px}
.card{background:#f5f8ff;border:1px solid #153568;border-radius:18px;padding:15px;margin:12px 0;color:#102a5c}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;min-width:0;font-size:12px;color:#60666f;margin-bottom:8px}
.meta .date{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .statusLabel{flex:0 0 auto}
.meta .shelfLabel{flex:0 1 auto;min-width:3em;overflow:hidden;text-overflow:ellipsis}
.managementBody{white-space:pre-line;line-height:1.8}
h2{font-size:18px;line-height:1.45;margin:0 0 8px}
.author{display:flex;align-items:center;gap:7px;font-size:15px;color:#555;min-width:0}
.excludedMark{flex:none;font-size:15px}.authorName{flex:1;min-width:0;overflow-wrap:anywhere}
.siteBadge{flex:none;min-width:60px;text-align:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.narou{background:#ddf3e7;color:#278454}.noteBadge{background:#eee0fa;color:#7542a7}.kakuyomu{background:#dceeff;color:#2465a5}
details{margin-top:10px;font-size:14px}summary{cursor:pointer}.synopsis{white-space:pre-wrap;color:#555;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:14px}
a{color:inherit;text-decoration:none;border-bottom:1px solid #aaa}
.readState{display:inline-block;padding:5px 15px;border:1px solid #e1bd48;border-radius:12px;background:#fff0a6;color:#805400;font-weight:700}
.readState.read{border-color:#c8c8c8;background:#e8e8e8;color:#333}
.r18Mark{font-size:14px;color:#555;margin-left:5px}
.management{margin-top:12px;border-top:1px solid #cbd5e1;padding-top:8px;font-size:14px}
.managementBody{padding:8px 0;color:#596579;overflow-wrap:anywhere}
.detailCode{margin:4px 0 10px;font-size:14px}
.detailActions{display:flex;flex-wrap:wrap;gap:8px}
.detailActions button{background:#f5f8ff;color:#102a5c;border:1px solid #c8c1b5;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.detailActions button:disabled{opacity:1}
.noteField{display:block;margin:14px 0 8px}.noteField input,.noteField textarea{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid #aaa195;border-radius:9px;background:#f5f8ff;color:#102a5c}.noteWorkCard .noteIndexDetails{margin:8px 0;min-width:0;max-width:100%}.noteWorkCard .noteIndexDetails>summary{cursor:pointer;padding:7px 9px;border:1px solid #153568;border-radius:8px}.noteWorkCard .noteIndexList{display:grid;gap:3px;margin-top:6px;min-width:0;max-width:100%;overflow:hidden}.noteWorkCard .noteIndexEntry{display:block;position:relative;min-width:0;max-width:100%;padding:4px 7px;border:1px solid #153568;border-radius:6px;color:#102a5c;text-decoration:none;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.noteWorkCard .noteIndexEntry.bookmarked{background:#e5f2e7;border-color:#79a985;color:#245b35;padding-right:28px}.noteWorkCard .noteIndexBookmarkMark{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px}.metrics{font-size:13px;color:#596579}
</style>
</head>
<body>
<main>
<h1>本番作品DB｜カード表示監査</h1>
<p class="note">本番用統合作品DBから作品レコードを読み取り、作品カード表示を確認します。</p>
<div class="panel warning">
<strong>安全確認</strong>
<p>このページは <code>tomotaYomuWorksDB</code> を読み取り専用で開きます。作品データの追加・変更・削除は行いません。現行DB、Atom DB、メモDB、localStorageには触れません。</p>
</div>
<div class="panel">
<strong>検索・絞り込み</strong>
<div class="controls" style="margin-top:10px">
<input id="query" placeholder="作品名・作者名・作品ID">
<select id="site"><option value="all">すべてのサイト</option><option value="narou">なろう</option><option value="note">note</option><option value="kakuyomu">カクヨム</option></select>
</div>
<p id="summary" class="metrics">本番作品DBを読み込み中…</p>
</div>
<div id="cards"></div>
<div class="panel"><strong>処理ログ</strong><p id="status">待機中</p></div>
</main>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB", STORE="works";
let allRecords=[];
const $=id=>document.getElementById(id);
const shelfMarks={"shelf01":"📌","shelf02":"🌀ま行","shelf03":"🌀さ行","shelf04":"🌀や行","shelf05":"🌀か行","shelf06":"🌀あ行","shelf07":"🌀た行","shelf08":"🌀は行","shelf10":"⏰","shelf14":"🌀な行","shelf_07a0b1f3f9c9":"🌀わ行","shelf_1cadde5522eb":"🗑️","shelf_cfcd536f3b56":"🌀ら行","shelf_ded1af671fd0":"退会"}
function openReadonly(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error("テストDBを開けません"));
  req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error("本番作品DBがありません。初期構築ページで保存してください。"));};
 });
}
function readAll(db){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).getAll();
  req.onsuccess=()=>resolve(req.result||[]);
  req.onerror=()=>reject(req.error||new Error("作品レコードを読み込めません"));
 });
}
function siteLabel(site){return site==="narou"?"なろう":site==="note"?"note":site==="kakuyomu"?"カクヨム":"その他"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function dateLabel(v){if(!v)return "日付なし";return esc(String(v).replace("T"," ").slice(0,16));}
function render(){
 const q=$("query").value.trim().toLocaleLowerCase(),site=$("site").value;
 const found=allRecords.filter(r=>(site==="all"||r.site===site)&&(!q||[r.title,r.authorName,r.id,r.workId].some(v=>String(v||"").toLocaleLowerCase().includes(q))));
 $("summary").textContent="登録 "+allRecords.length.toLocaleString()+"件 ／ 該当 "+found.length.toLocaleString()+"件（最大30件表示）";
 const target=$("cards");target.replaceChildren();
 for(const r of found.slice(0,30)){
  const badge=r.site==="narou"?"narou":r.site==="note"?"noteBadge":"kakuyomu";
  const card=document.createElement("article");card.className="card"+(r.site==="note"?" noteWorkCard":"");
  const rawStatus=String(r.status||"");
  const statusText=(rawStatus==="完結"||rawStatus==="完結済")?"🔵 完結":rawStatus==="連載中"?"🟢 連載中":rawStatus==="短編"?"🟣 短編":esc(rawStatus||"ステータス未設定");
  const date=r.updatedAt?dateLabel(r.updatedAt):"更新日なし";
  const shelfMark=shelfMarks[String(r.shelfId||"")]||"";
  const displayShelfMark=r.site==="note"?(shelfMark||"未分類"):shelfMark;
  const isSearchExcluded=r.site==="narou"&&(String(r.siteData?.disclosure??r.siteData?.legacyFields?.disclosure??"").includes("検索除外"));
  const short=r.site==="narou"&&String(r.siteData?.noveltype??"").trim()==="2";
  const isR18=r.site==="narou"&&(r.siteData?.isR18===true||r.siteData?.legacyFields?.__r18===true||r.siteData?.authorType==="r18");
  let reading="";
  if(short){reading='<span class="readState '+(r.reading?.isRead?"read":"")+'">'+(r.reading?.isRead?"読了":"未読")+'</span>';}
  else if(r.site==="narou"){
    const ncode=String(r.workId||"").toLowerCase();
    const baseUrl=isR18?"https://novel18.syosetu.com/"+encodeURIComponent(ncode)+"/":"https://ncode.syosetu.com/"+encodeURIComponent(ncode)+"/";
    const position=Number(r.reading?.position);
    const resumeUrl=Number.isFinite(position)&&position>0?baseUrl+position+"/":baseUrl;
    reading='<a class="narouResume" href="'+esc(resumeUrl)+'" target="_blank" rel="noopener">続き 📖 '+(r.reading?.position==null?"記録なし":esc(r.reading.position))+'/'+(r.episodeCount??"—")+'話'+(isR18?' <span class="r18Mark">®️</span>':'')+'</a>';
  }
  else if(r.site==="kakuyomu"){reading='<span class="kakuyomuReading">続き📖話数を確認中… / '+(r.episodeCount??"—")+'話</span>';}
  else if(r.site==="note"){reading='<a class="noteResume" target="_blank" rel="noopener">続き 📖 位置を確認中…</a>';}
  const synopsis=String(r.synopsis||"");
  const extra=r.site==="narou"?"Nコード："+r.workId+"\n作者ID："+(r.authorId??"未登録")+"\n本棚："+shelfMark+"\nR18："+(isR18?"はい":"いいえ")+"\nnoveltype："+(r.siteData?.noveltype??"不明")+"\nend："+(r.siteData?.end??"不明"):"作品ID："+r.workId+"\n作者ID："+(r.authorId??"未登録")+"\n本棚："+shelfMark;
  card.innerHTML='<div class="meta"><span class="date">'+date+'</span><span>｜</span><span class="statusLabel">'+statusText+'</span><span>｜</span><span class="shelfLabel">'+esc(displayShelfMark)+'</span></div><h2></h2><div class="author">作者：<span class="authorName"></span>'+(isSearchExcluded?'<span class="excludedMark" aria-label="検索除外">🚫</span>':'')+'<span class="siteBadge '+badge+'">'+siteLabel(r.site)+'</span></div><details><summary>あらすじを読む</summary><p class="synopsis"></p></details><div class="actions"><a class="openWork" target="_blank" rel="noopener">作品を開く</a>'+reading+'</div><details class="management"><summary>詳細を開く</summary><div class="managementBody"></div></details>';
  card.querySelector("h2").textContent=r.title||"";
  card.querySelector(".authorName").textContent=r.authorName||"";
  card.querySelector(".synopsis").textContent=synopsis||"あらすじなし";
  if(r.site==="narou"){
    card.querySelector(".managementBody").innerHTML='<div class="detailCode">Nコード：'+esc(r.workId)+'</div><div class="detailActions"><button type="button" disabled>本棚を移動</button><button type="button" disabled>'+(isSearchExcluded?'🔎 検索除外を解除':'🔎 検索除外にする')+'</button><button type="button" disabled>削除</button></div>';
  }else if(r.site==="kakuyomu"){
    card.querySelector(".managementBody").innerHTML='<div class="detailCode">作品ID：'+esc(r.workId)+'</div><div class="detailActions"><button type="button" disabled>本棚を移動</button><button type="button" disabled>削除</button></div>';
  }else if(r.site==="note"){
    const bookmarkUrl=String(r.bookmark?.url||"");
    const indexFile=String(r.siteData?.indexFile||("data/note-index-"+String(r.workId||"")+".json"));
    const resume=card.querySelector(".noteResume");
    if(resume){
      resume.href=bookmarkUrl||r.url||"#";
      if(indexFile){
        fetch("../../"+indexFile,{cache:"no-store"}).then(res=>{if(!res.ok)throw new Error();return res.json();}).then(data=>{
          const items=Array.isArray(data.items)?data.items:[];
          const key=(bookmarkUrl.match(/\/n\/([a-z0-9]+)/i)||[])[1]||"";
          const position=key?items.findIndex(entry=>String(entry.key||"")===key):-1;
          resume.textContent=position>=0?"続き 📖 "+(position+1)+"/"+items.length+"話":"続き 📖 しおり未設定";
        }).catch(()=>{resume.textContent="続き 📖 目次未取得";});
      }else resume.textContent="続き 📖 しおり未設定";
    }
    card.querySelector(".managementBody").innerHTML=
      '<details class="noteIndexDetails"><summary>目次（読み込み前）</summary><div class="noteIndexList" aria-live="polite"></div></details>'+
      '<div class="detailCode">マガジンID：'+esc(r.id)+'</div>'+
      '<div class="detailActions"><button type="button" disabled>本棚を移動</button></div>'+
      '<label class="noteField">作品状態<input type="text" disabled value="'+esc(rawStatus)+'"></label>'+
      '<label class="noteField">あらすじ<textarea rows="5" disabled>'+esc(synopsis)+'</textarea></label>'+
      '<button type="button" disabled>作品情報を保存</button>'+
      '<label class="noteField">しおりURL<input type="url" disabled value="'+esc(bookmarkUrl)+'"></label>'+
      '<button type="button" disabled>しおりを保存</button>'+
      '<p class="metrics">読み取り専用テスト：編集・保存は無効です。</p>';
    const indexDetails=card.querySelector(".noteIndexDetails");
    const noteSummary=indexDetails.querySelector("summary");
    const noteList=indexDetails.querySelector(".noteIndexList");
    indexDetails.addEventListener("toggle",async()=>{
      if(!indexDetails.open||indexDetails.dataset.loaded==="1"||indexDetails.dataset.loading==="1")return;
      indexDetails.dataset.loading="1";
      noteSummary.textContent="目次を読み込み中…";
      try{
        if(!indexFile)throw new Error("目次ファイル情報がありません");
        const response=await fetch("../../"+indexFile,{cache:"no-store"});
        if(!response.ok)throw new Error("目次ファイルを取得できません");
        const data=await response.json();
        const items=Array.isArray(data.items)?data.items:[];
        const bookmarkKey=(bookmarkUrl.match(/\/n\/([a-z0-9]+)/i)||[])[1]||"";
        noteList.replaceChildren();
        for(const entry of items){
          const row=document.createElement("a");
          row.className="noteIndexEntry";
          row.href=entry.url||"#";
          row.target="_blank";
          row.rel="noopener noreferrer";
          row.textContent=String(entry.name||"（タイトルなし）");
          if(bookmarkKey&&String(entry.key||"")===bookmarkKey){
            row.classList.add("bookmarked");
            const mark=document.createElement("span");
            mark.className="noteIndexBookmarkMark";
            mark.textContent="📌";
            row.appendChild(mark);
          }
          noteList.appendChild(row);
        }
        noteSummary.textContent="目次（"+items.length+"話）";
        indexDetails.dataset.loaded="1";
      }catch(error){noteSummary.textContent="目次を読み込めません："+error.message;}
      finally{indexDetails.dataset.loading="";}
    });
  }else{
    card.querySelector(".managementBody").textContent=extra;
  }
  card.querySelector(".openWork").href=r.url||"#";
  if(r.site==="kakuyomu"){
    const resume=card.querySelector(".kakuyomuReading");
    const episodeId=String(r.bookmark?.episodeId ?? r.bookmark?.siteData?.episodeId ?? r.siteData?.bookmarkEpisodeId ?? "").trim();
    const bookmarkUrl=String(r.bookmark?.url ?? r.bookmark?.episodeUrl ?? r.siteData?.bookmarkEpisodeUrl ?? "").trim();
    const total=Number(r.episodeCount)||0;
    if(resume){
      // しおりURLは目次の取得成否にかかわらず常にリンク先として保持する。
      if(bookmarkUrl){
        const link=document.createElement("a");
        link.className="kakuyomuResumeLink";
        link.href=bookmarkUrl;
        link.target="_blank";
        link.rel="noopener noreferrer";
        link.textContent="続き📖しおり位置を確認中… / "+(total?total.toLocaleString("ja-JP"):"—")+"話";
        resume.replaceWith(link);
      }else if(!episodeId){
        resume.textContent="続き📖記録なし / "+(total?total.toLocaleString("ja-JP"):"—")+"話";
      }else{
        resume.textContent="続き📖しおりURLなし / "+(total?total.toLocaleString("ja-JP"):"—")+"話";
      }
    }
    const link=card.querySelector(".kakuyomuResumeLink");
    if(link){
      if(!episodeId){
        link.textContent="続き📖しおり位置未設定 / "+(total?total.toLocaleString("ja-JP"):"—")+"話";
      }else{
        // このHTMLは tools/diagnostic/ 配下。目次JSONはリポジトリ直下の data/ にある。
        fetch("../../data/kakuyomu-toc/"+encodeURIComponent(String(r.workId))+".json",{cache:"no-store"})
          .then(res=>{if(!res.ok)throw new Error("目次未取得");return res.json();})
          .then(toc=>{
            const found=Array.isArray(toc.episodes)?toc.episodes.find(ep=>String(ep.episode_id)===episodeId):null;
            link.textContent=found
              ?"続き📖"+Number(found.number).toLocaleString("ja-JP")+"/"+(total||Number(toc.public_episode_count)||"—").toLocaleString("ja-JP")+"話"
              :"続き📖話数未照合 / "+(total?total.toLocaleString("ja-JP"):"—")+"話";
          })
          .catch(()=>{
            // 目次がなくても保存済みURLからしおり位置へ移動できる。
            link.textContent="続き📖しおりへ / "+(total?total.toLocaleString("ja-JP"):"—")+"話";
          });
      }
    }
  }
  target.appendChild(card);
 }
 if(!found.length)target.textContent="該当する作品はありません。";
}
async function start(){
 try{
  const db=await openReadonly();
  allRecords=await readAll(db);db.close();
  if(!allRecords.length)throw new Error("本番作品DBに作品がありません。");
  $("status").textContent="読み取り専用で読み込みました。\nDB: "+DB_NAME+"\n作品数: "+allRecords.length+"件\nデータ変更: なし";
  render();
 }catch(e){$("status").textContent="読み込み失敗: "+e.message;$("summary").textContent="テストDBを確認できません";}
}
$("query").addEventListener("input",render);$("site").addEventListener("change",render);start();
</script>
</body>
</html>
