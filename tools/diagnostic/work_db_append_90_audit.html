<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ともたよむ｜追加90作品表示監査</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#183153;line-height:1.55}main{width:min(100%,760px);margin:auto;padding:18px 14px 44px}h1{font-size:23px}.panel,.card{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:14px;margin:12px 0}.warn{border-left:5px solid #d97706;background:#fffaf0}.metrics{font-size:13px;white-space:pre-wrap;background:#eef3fa;border-radius:10px;padding:12px}.card{background:#f8faff;border-color:#153568}.meta{font-size:12px;color:#52647a}.card h2{font-size:17px;margin:7px 0}.author{font-size:14px;color:#555}.site{display:inline-block;background:#ddf3e7;color:#278454;border-radius:20px;padding:2px 9px;font-size:12px;margin-left:8px}.synopsis{font-size:13px;color:#555;white-space:pre-wrap}a{color:#17458a;overflow-wrap:anywhere}button{font:inherit;background:#17458a;color:white;border:0;border-radius:9px;padding:11px;width:100%;font-weight:700}#status{white-space:pre-wrap;font-size:13px}</style></head><body><main><h1>追加90作品｜新DBカード表示監査</h1><p>テストDBの90作品を読み取り、必須項目とカード表示を確認します。</p><section class="panel warn"><b>読み取り専用</b><p>対象：<code>tomotaYomu_work_test_v1</code> のみ。本番DB・旧DB・localStorageには触れません。</p></section><section class="panel"><button id="run">90作品を読み込んで監査</button><div id="summary" class="metrics">未実行</div></section><div id="cards"></div></main><script>"use strict";const DB="tomotaYomu_work_test_v1",EXPECTED=3600,IDS=["narou:N0066HQ","narou:N0261FM","narou:N0311FS","narou:N0639GY","narou:N0701HP","narou:N0799HR","narou:N0977HS","narou:N1242HR","narou:N1287HH","narou:N1349HK","narou:N1360HS","narou:N1560HR","narou:N1745HF","narou:N1929HB","narou:N2056HO","narou:N2195GJ","narou:N2386HQ","narou:N2408HS","narou:N2412HO","narou:N2442HM","narou:N2625HP","narou:N2692HS","narou:N2938HS","narou:N3074HR","narou:N3077HS","narou:N3121HO","narou:N3231HR","narou:N3281HS","narou:N3442HB","narou:N3557HN","narou:N3692HB","narou:N4409HO","narou:N4414HA","narou:N4422HR","narou:N4485HP","narou:N4489HM","narou:N4508HP","narou:N4556HO","narou:N4590HP","narou:N4841HQ","narou:N5340HQ","narou:N5475GP","narou:N5701HS","narou:N5785DZ","narou:N5827HE","narou:N5896HA","narou:N6067HR","narou:N6074HF","narou:N6111HO","narou:N6114GX","narou:N6165DR","narou:N6175HO","narou:N6335HQ","narou:N6451GW","narou:N6494GY","narou:N6522HO","narou:N6565HP","narou:N6571HP","narou:N6572HQ","narou:N6685EP","narou:N6764HG","narou:N6849HO","narou:N6893HS","narou:N6971FY","narou:N7096HP","narou:N7535HN","narou:N7591HL","narou:N7656EO","narou:N7696HN","narou:N7775HR","narou:N7975CR","narou:N8250HQ","narou:N8281HR","narou:N8291HP","narou:N8363HN","narou:N8383HR","narou:N8413GN","narou:N8472HO","narou:N8491HQ","narou:N9141GT","narou:N9147FM","narou:N9178HO","narou:N9384HP","narou:N9428HC","narou:N9453HK","narou:N9623HP","narou:N9695HR","narou:N9795HN","narou:N9856HO","narou:N9874HP"];const $=id=>document.getElementById(id);function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{q.transaction.abort();no(Error("テストDBがありません"))};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error||Error("DBを開けません"))})}function read(db){return new Promise((ok,no)=>{const t=db.transaction("works","readonly"),q=t.objectStore("works").getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error||Error("読込失敗"))})}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}$("run").onclick=async()=>{let db;$("run").disabled=true;try{db=await openDB();const all=await read(db);if(all.length!==EXPECTED)throw Error("DB全体が3,600件ではありません："+all.length);const map=new Map(all.map(r=>[r.id,r]));if(map.size!==all.length)throw Error("全体にID重複があります");const missing=IDS.filter(id=>!map.has(id));if(missing.length)throw Error("追加90作品の欠落："+missing.length+"件 / "+missing.slice(0,5).join(", "));const rows=IDS.map(id=>map.get(id));const errors=[];const count={blankTitle:0,blankAuthor:0,noUrl:0,badShelf:0,badReading:0,noSiteData:0,noSynopsis:0,noEpisodeCount:0,noUpdatedAt:0,wrongStatus:0};for(const r of rows){if(!r.title)count.blankTitle++;if(!r.authorName)count.blankAuthor++;if(!r.url)count.noUrl++;if(r.shelfId!=="")count.badShelf++;if(r.reading?.position!==null||r.reading?.isRead!==null)count.badReading++;if(!r.siteData||typeof r.siteData!=="object")count.noSiteData++;if(!r.synopsis)count.noSynopsis++;if(!Number.isFinite(Number(r.episodeCount)))count.noEpisodeCount++;if(!r.updatedAt)count.noUpdatedAt++;if(!["完結","連載中"].includes(r.status))count.wrongStatus++}const authors=new Set(rows.map(r=>r.authorName));const finished=rows.filter(r=>r.status==="完結").length;const serial=rows.filter(r=>r.status==="連載中").length;const urlBad=rows.filter(r=>!/^https:\/\/ncode\.syosetu\.com\/[a-z0-9]+\/?$/i.test(r.url||""));const badTotal=Object.values(count).reduce((a,b)=>a+b,0);$("summary").textContent="監査成功：DB全体 3,600件\n追加90作品：90/90件を確認\n重複ID：0件\n\n必須項目の不備（項目別件数）\n"+Object.entries(count).map(([k,v])=>k+"："+v).join("\n")+"\n\n完結："+finished+"件 / 連載中："+serial+"件\n作者数："+authors.size+"人\nURL形式不一致："+urlBad.length+"件\n\n※あらすじ・更新日等の欠損は元データ由来の可能性があるため、別途表示で確認。";const root=$("cards");root.replaceChildren();for(const r of rows){const el=document.createElement("article");el.className="card";el.innerHTML='<div class="meta">'+esc(r.updatedAt||"更新日なし")+' ｜ '+esc(r.status||"状態不明")+' ｜ 未分類</div><h2></h2><div class="author">作者：<span></span><span class="site">なろう</span></div><p class="synopsis"></p><p>続き 📖 記録なし / '+esc(r.episodeCount??"—")+'話</p><p><a target="_blank" rel="noopener">作品を開く</a></p><details><summary>詳細データ</summary><p class="synopsis"></p></details>';el.querySelector("h2").textContent=r.title||"（作品名なし）";el.querySelector(".author span").textContent=r.authorName||"（作者名なし）";el.querySelectorAll(".synopsis")[0].textContent=r.synopsis||"あらすじなし";el.querySelector("a").href=r.url||"#";el.querySelectorAll(".synopsis")[1].textContent="Nコード："+r.workId+"\n作者ID："+(r.authorId??"なし")+"\nサイトデータ："+JSON.stringify(r.siteData,null,2);root.append(el)}if(badTotal||urlBad.length)errors.push("項目不備があります。上の件数を確認してください。");$("summary").textContent+=errors.length?"\n\n要確認：不備あり":"\n\n基本項目監査：合格";}catch(e){$("summary").textContent="監査中止："+e.message}finally{db?.close();$("run").disabled=false}};</script></main></body></html>
