<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ともたよむ｜追加90作品テスト</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#183153;line-height:1.6}main{width:min(100%,720px);margin:auto;padding:20px 14px 44px}.panel{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:15px;margin:13px 0}.warn{border-left:5px solid #d97706;background:#fffaf0}button,input{font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#17458a;color:white;font-weight:700;margin-top:10px}button:disabled{opacity:.45}input{width:100%;margin:10px 0}.small{font-size:13px;color:#52647a}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3fa;border-radius:10px;padding:12px;font-size:13px;min-height:70px}</style></head><body><main><h1>追加90作品｜テストDB投入・照合</h1><p class="small">既存3,510作品のテストDBへ90作品を追加し、3,600件になることを確認します。</p><section class="panel warn"><b>安全確認</b><ul><li>操作対象は <code>tomotaYomu_work_test_v1</code> のみ。</li><li>本番DB・旧DB・localStorage・Atom DB・Memo DBには触れません。</li><li>既存件数が3,510件でない場合、またはID重複がある場合は中止します。</li><li>既存作品は更新・削除せず、90件を追加します。</li></ul></section><section class="panel"><b>1. 追加JSONを選択</b><input id="file" type="file" accept=".json,application/json"><div id="info" class="small">ファイル未選択</div></section><section class="panel"><b>2. 事前検査</b><button id="check" disabled>既存3,510件と照合</button></section><section class="panel"><b>3. テストDBへ追加</b><button id="add" disabled>90作品をテストDBへ追加</button></section><section class="panel"><b>検査ログ</b><div id="log">待機中です。</div></section></main><script>"use strict";const DB="tomotaYomu_work_test_v1",STORE="works";const $=id=>document.getElementById(id);let payload=null,baseline=null;function log(s){$("log").textContent=s}function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{q.transaction.abort();no(Error("テストDBがありません。作成せず停止しました。"))};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error||Error("DBを開けません"));q.onblocked=()=>no(Error("別タブでDB使用中です"))})}function all(db){return new Promise((ok,no)=>{const t=db.transaction(STORE,"readonly"),q=t.objectStore(STORE).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error||Error("読み込み失敗"))})}function validate(p){if(p?.format!=="tomotayomu-additional-works-v1"||!Array.isArray(p.records)||p.records.length!==90)throw Error("90作品用JSONではありません");const ids=new Set();for(const r of p.records){if(r.site!=="narou"||!r.id?.startsWith("narou:")||!r.workId||!r.title||!r.authorName||!r.url||r.shelfId!==""||r.reading?.position!==null||r.reading?.isRead!==null||!r.siteData)throw Error("必須項目不正："+(r.id||"IDなし"));if(ids.has(r.id))throw Error("追加JSON内でID重複："+r.id);ids.add(r.id)}return ids}$("file").onchange=async()=>{payload=null;baseline=null;$("check").disabled=true;$("add").disabled=true;const f=$("file").files?.[0];if(!f)return;try{payload=JSON.parse(await f.text());validate(payload);$("info").textContent=f.name+" / 90件";$("check").disabled=false;log("JSON基本検査合格。DBは未変更です。")}catch(e){$("info").textContent="検査失敗";log(e.message)}};$("check").onclick=async()=>{let db;$("check").disabled=true;$("add").disabled=true;try{const ids=validate(payload);db=await openDB();const rows=await all(db);if(rows.length!==3510)throw Error("既存テストDBが3,510件ではありません："+rows.length);const old=new Set(rows.map(x=>x.id));if(old.size!==rows.length)throw Error("既存DBにID重複あり");const overlap=[...ids].filter(x=>old.has(x));if(overlap.length)throw Error("既存作品と重複："+overlap.slice(0,5).join(", "));baseline=old;log("事前検査合格\n既存：3,510件\n追加予定：90件\nID重複：0件\n追加後予定：3,600件\n\n追加ボタンを押すまでDBは変更しません。");$("add").disabled=false}catch(e){log("中止："+e.message)}finally{db?.close();$("check").disabled=false}};$("add").onclick=async()=>{let db;$("add").disabled=true;try{if(!baseline)throw Error("先に事前検査してください");db=await openDB();const before=await all(db),idsNow=new Set(before.map(x=>x.id));if(before.length!==3510||idsNow.size!==baseline.size||[...baseline].some(x=>!idsNow.has(x)))throw Error("事前検査後に既存DBが変化。中止");const ids=validate(payload);if([...ids].some(x=>idsNow.has(x)))throw Error("ID重複。中止");await new Promise((ok,no)=>{const tx=db.transaction(STORE,"readwrite"),st=tx.objectStore(STORE);for(const r of payload.records)st.add(r);tx.oncomplete=ok;tx.onerror=()=>no(tx.error||Error("追加失敗"));tx.onabort=()=>no(tx.error||Error("追加中断"))});const after=await all(db),afterIds=new Set(after.map(x=>x.id));if(after.length!==3600||afterIds.size!==3600||![...baseline].every(x=>afterIds.has(x))||![...ids].every(x=>afterIds.has(x)))throw Error("追加後照合不一致："+after.length+"件");log("テストDB追加・再読込・照合成功！\n既存：3,510件（全ID保持）\n追加：90件（全ID確認）\n合計：3,600件\n重複：0件\n\n本番DBは変更していません。")}catch(e){log("処理中止："+e.message+"\n本番DBは変更していません。")}finally{db?.close()}};</script></body></html>
