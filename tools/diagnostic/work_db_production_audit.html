<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ｜本番作品DB 読み取り検査</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fc;color:#183153;line-height:1.65}
main{width:min(100%,720px);margin:auto;padding:20px 14px 44px}
h1{font-size:23px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}
p{margin:7px 0}.small{font-size:13px;color:#52647a}
.panel{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:15px;margin:13px 0}
.safe{border-left:5px solid #16a34a;background:#f0fdf4}
.warn{border-left:5px solid #d97706;background:#fffaf0}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.metric{background:#eef3fa;border-radius:10px;padding:11px;overflow-wrap:anywhere}
.metric b{display:block;font-size:21px}
#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3fa;border-radius:10px;padding:12px;font-size:13px;min-height:70px}
.ok{color:#166534;font-weight:700}.ng{color:#b91c1c;font-weight:700}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>ともたよむ｜本番作品DB 読み取り検査</h1>
<p class="small">v3.7.0移行準備用。新DBの保存内容を別ページから読み取り専用で点検します。</p>
<section class="panel safe">
<strong>読み取り専用・安全確認</strong>
<ul>
<li>対象：<code>tomotaYomuWorksDB</code> / <code>works</code> のみ</li>
<li>トランザクションは readonly のみ。追加・更新・削除は行いません。</li>
<li>旧DB、localStorage、Atom DB、Memo DB、本体の読み書き先には触れません。</li>
<li>DBが見つからない場合は、新規作成せず停止します。</li>
</ul>
</section>
<section class="panel">
<h2>検査結果</h2>
<div id="summary" class="small">検査を開始しています…</div>
<div id="metrics" class="metrics"></div>
</section>
<section class="panel">
<h2>DB構造・データ整合性</h2>
<div id="details" class="small">確認中…</div>
</section>
<section class="panel">
<h2>処理ログ</h2>
<div id="log">待機中です。</div>
</section>
</main>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB", VERSION=1, STORE="works";
const EXPECTED={narou:3506,note:2,kakuyomu:2};
const $=id=>document.getElementById(id);
function openExistingDB(){
 return new Promise(async(resolve,reject)=>{
  if(!indexedDB||typeof indexedDB.databases!=="function"){
   reject(new Error("このブラウザでは既存DB一覧を確認できません。安全のため検査を停止しました。"));return;
  }
  try{
   const list=await indexedDB.databases();
   const found=list.some(x=>x.name===DB_NAME);
   if(!found){reject(new Error("本番用新DBが見つかりません。新規作成は行わず停止しました。"));return;}
   const req=indexedDB.open(DB_NAME,VERSION);
   req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error("DBバージョンが想定外です。変更せず停止しました。"));};
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||new Error("DBを開けませんでした。"));
   req.onblocked=()=>reject(new Error("別タブがDBを使用中です。"));
  }catch(e){reject(e);}
 });
}
function readAll(db){
 return new Promise((resolve,reject)=>{
  if(!db.objectStoreNames.contains(STORE)){reject(new Error("worksストアがありません。"));return;}
  const tx=db.transaction(STORE,"readonly"),store=tx.objectStore(STORE),req=store.getAll();
  req.onsuccess=()=>resolve({records:req.result||[],indexes:Array.from(store.indexNames)});
  req.onerror=()=>reject(req.error||new Error("作品データを読み込めません。"));
  tx.onerror=()=>reject(tx.error||new Error("読み取りトランザクションに失敗しました。"));
 });
}
function runChecks(records,indexes){
 const counts={narou:0,note:0,kakuyomu:0},ids=new Set();
 let blankTitle=0,blankAuthor=0,badId=0,badReading=0,badBookmark=0;
 let narouPosition=0,shortRead=0,shortUnread=0,kakuyomuUrl=0,noteUrl=0,emptyShelf=0;
 for(const w of records){
  if(!w||typeof w!=="object") {badId++;continue;}
  if(Object.prototype.hasOwnProperty.call(counts,w.site))counts[w.site]++;else badId++;
  if(typeof w.id!=="string"||!w.id||ids.has(w.id))badId++;
  ids.add(w.id);
  if(!String(w.title||"").trim())blankTitle++;
  if(!String(w.authorName||"").trim())blankAuthor++;
  if(typeof w.shelfId!=="string")badId++;
  if(w.shelfId==="")emptyShelf++;
  if(!w.reading||typeof w.reading!=="object"||
     !(w.reading.position===null||Number.isFinite(w.reading.position))||
     !(w.reading.isRead===null||typeof w.reading.isRead==="boolean"))badReading++;
  if(w.bookmark!==undefined&&(!w.bookmark||typeof w.bookmark!=="object"||Array.isArray(w.bookmark)))badBookmark++;
  if(w.site==="narou"){
   if(!String(w.id).startsWith("narou:"+String(w.workId)))badId++;
   if(String(w.siteData?.noveltype??"").trim()==="2"){
    if(w.reading?.isRead===true)shortRead++;
    else if(w.reading?.isRead===false)shortUnread++;
    else badReading++;
   }else if(Number.isFinite(w.reading?.position))narouPosition++;
  }else if(w.site==="note"){
   if(!String(w.id).startsWith("note:"+String(w.workId)))badId++;
   if(w.bookmark?.url)noteUrl++;
  }else if(w.site==="kakuyomu"){
   if(!String(w.id).startsWith("kakuyomu:"+String(w.workId)))badId++;
   if(w.bookmark?.url)kakuyomuUrl++;
  }
 }
 const expectedIndexes=["site","workId","authorId","shelfId"];
 const missingIndexes=expectedIndexes.filter(x=>!indexes.includes(x));
 const issues=[];
 if(records.length!==3510)issues.push("総件数が3,510件ではありません");
 for(const s of Object.keys(EXPECTED))if(counts[s]!==EXPECTED[s])issues.push(s+"件数が想定と異なります");
 if(ids.size!==records.length)issues.push("ID重複または不正レコードがあります");
 if(blankTitle)issues.push("作品名空欄があります");
 if(blankAuthor)issues.push("作者名空欄があります");
 if(badId)issues.push("IDまたは棚ID形式に問題があります");
 if(badReading)issues.push("読書状態データに問題があります");
 if(badBookmark)issues.push("しおりデータ形式に問題があります");
 if(missingIndexes.length)issues.push("不足インデックス："+missingIndexes.join(", "));
 return {counts,blankTitle,blankAuthor,badId,badReading,badBookmark,duplicates:records.length-ids.size,
  narouPosition,shortRead,shortUnread,kakuyomuUrl,noteUrl,emptyShelf,missingIndexes,issues};
}
function metric(label,value){return '<div class="metric"><span>'+label+'</span><b>'+value+'</b></div>';}
async function start(){
 let db;
 try{
  db=await openExistingDB();
  const read=await readAll(db);
  const v=runChecks(read.records,read.indexes);
  $("summary").innerHTML=v.issues.length
   ?'<span class="ng">確認事項あり：'+v.issues.length+'項目</span>'
   :'<span class="ok">全項目の読み取り検査に合格</span>';
  $("metrics").innerHTML=[
   metric("合計",read.records.length.toLocaleString()+"件"),
   metric("なろう",v.counts.narou+"件"),
   metric("note",v.counts.note+"件"),
   metric("カクヨム",v.counts.kakuyomu+"件"),
   metric("なろう通常・読書位置",v.narouPosition+"件"),
   metric("なろう短編・既読 / 未読",v.shortRead+" / "+v.shortUnread),
   metric("カクヨムしおりURL",v.kakuyomuUrl+"件"),
   metric("noteしおりURL",v.noteUrl+"件")
  ].join("");
  $("details").innerHTML=
   "DB：<code>"+DB_NAME+"</code><br>Store：<code>"+STORE+"</code><br>"+
   "インデックス："+read.indexes.join(" / ")+"<br>"+
   "作品名空欄："+v.blankTitle+"件 / 作者名空欄："+v.blankAuthor+"件<br>"+
   "重複ID："+v.duplicates+"件 / ID・棚ID不正："+v.badId+"件<br>"+
   "読書状態不正："+v.badReading+"件 / しおり形式不正："+v.badBookmark+"件<br>"+
   "棚ID空欄："+v.emptyShelf+"件<br>"+
   "不足インデックス："+(v.missingIndexes.length?v.missingIndexes.join(", "):"なし");
  $("log").textContent="既存DBを読み取り専用で開き、全件を読み込みました。\n"+
   "読込件数："+read.records.length+"件\n"+
   "データ変更：なし\n"+
   (v.issues.length?"確認事項：\n・"+v.issues.join("\n・"):"検査結果：全項目合格")+
   "\n\n旧DB・localStorage・Atom DB・Memo DB・本体の読み書き先は変更していません。";
 }catch(e){
  $("summary").innerHTML='<span class="ng">検査を完了できませんでした</span>';
  $("details").textContent="データは変更していません。";
  $("log").textContent="停止理由："+e.message+"\n\nDBの新規作成・変更・削除は行っていません。";
 }finally{if(db)db.close();}
}
start();
</script>
</body>
</html>
