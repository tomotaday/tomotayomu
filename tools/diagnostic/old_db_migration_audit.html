<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fb">
<title>ともたよむ｜旧DB・新DB照合診断</title>
<style>
:root{color-scheme:light;--ink:#273044;--muted:#687386;--line:#dfe4ed;--paper:#fff;--bg:#f5f7fb;--accent:#526b9a}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto}h1{font-size:1.3rem;margin:10px 0 5px}h2{font-size:1.05rem;margin:0 0 10px}
.lead,.small{color:var(--muted)}.lead{margin:0 0 16px}.small{font-size:.82rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}
button,a.back{display:inline-block;border:0;border-radius:10px;background:var(--accent);color:white;padding:11px 15px;font-size:1rem;text-decoration:none}
button:disabled{opacity:.5}.status{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}
.metric{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.value{font-weight:700;font-variant-numeric:tabular-nums}
.warn{background:#fff5d6;border-radius:10px;padding:11px}
</style>
</head>
<body>
<main>
<a class="back" href="../../index.html">← 本棚へ戻る</a>
<h1>旧DB・新DB 照合診断</h1>
<p class="lead">旧DBの5ストアを新DBと照合する読み取り専用診断です。</p>
<section class="panel">
<p><strong>対象：</strong>tomotaYomuDB v1 と tomotaYomuWorksDB v2</p>
<p class="small">データの追加・変更・削除は行いません。旧DBが存在しない場合は新規作成せず中止します。作者名・作品名・Nコードなどの個別一覧は表示しません。</p>
<button id="run" type="button">照合を実行</button>
</section>
<section class="panel"><h2>実行状況</h2><div id="status" class="status">まだ実行していません。</div></section>
<div id="result"></div>
<section class="panel"><h2>判定上の注意</h2><p class="small">照合はレコード内の代表的なID項目を使った件数比較です。旧データのキー名・値の形式が想定と異なる場合は「照合できない」として扱い、削除可能とは判定しません。診断結果だけで旧DBを削除しないでください。</p></section>
</main>
<script>
(()=>{"use strict";
const OLD="tomotaYomuDB",NEW="tomotaYomuWorksDB";
const $=id=>document.getElementById(id);
function reqResult(req){return new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error||new Error("IndexedDB読込失敗"))})}
function openKnown(name,version){return new Promise((ok,no)=>{const r=version?indexedDB.open(name,version):indexedDB.open(name);r.onupgradeneeded=()=>{r.transaction.abort();no(new Error(name+" が存在しない、または指定バージョンと異なるため中止しました"))};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error||new Error(name+" を開けません"));r.onblocked=()=>no(new Error(name+" が別画面で使用中です"))})}
async function all(db,name){return reqResult(db.transaction(name,"readonly").objectStore(name).getAll())}
function codeOf(x){if(x===null||x===undefined)return "";if(typeof x==="string")return x.toUpperCase().replace(/^NAROU:/,"");if(typeof x!=="object")return "";for(const k of ["ncode","workId","work_id","novel_id","id","key"])if(x[k]!==undefined){const v=String(x[k]).toUpperCase().replace(/^NAROU:/,"");if(/^N[0-9A-Z]{4,}$/.test(v))return v;}return ""}
function authorIdOf(x){if(!x||typeof x!=="object")return "";for(const k of ["authorId","author_id","userid","user_id","id"])if(x[k]!==undefined){const v=String(x[k]).trim();if(v)return v}return ""}
function shelfIdOf(x){if(!x||typeof x!=="object")return "";for(const k of ["shelfId","shelf_id","id"])if(x[k]!==undefined){const v=String(x[k]).trim();if(v)return v}return ""}
function readingExists(x){if(!x||typeof x!=="object")return false;const r=x.reading;if(r&&typeof r==="object")return r.position!==null&&r.position!==undefined||r.isRead!==null&&r.isRead!==undefined;return x.readingPosition!==undefined||x.position!==undefined||x.isRead!==undefined}
function metric(label,value){return '<div class="metric"><span>'+label+'</span><span class="value">'+value+'</span></div>'}
function card(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'}
async function run(){
 const btn=$("run");btn.disabled=true;$("status").textContent="DBの存在確認中…";$("result").replaceChildren();
 let oldDb,newDb;
 try{
  if(typeof indexedDB.databases!=="function")throw new Error("このブラウザではDB一覧確認に対応していません。安全のため診断を中止しました。");
  const known=await indexedDB.databases(),oldInfo=known.find(x=>x.name===OLD),newInfo=known.find(x=>x.name===NEW);
  if(!oldInfo?.version)throw new Error("旧DB "+OLD+" が見つかりません。DBは作成していません。");
  if(!newInfo?.version)throw new Error("新DB "+NEW+" が見つかりません。");
  oldDb=await openKnown(OLD,oldInfo.version);newDb=await openKnown(NEW,newInfo.version);
  const oldNames=[...oldDb.objectStoreNames],newNames=[...newDb.objectStoreNames];
  const required=["shelf_names","shelf_placement","works_cache","authors","reading_position"];
  const absent=required.filter(x=>!oldNames.includes(x));
  const oldRows={},newRows={};
  for(const name of oldNames)oldRows[name]=await all(oldDb,name);
  for(const name of newNames)newRows[name]=await all(newDb,name);
  const works=(newRows.works||[]).filter(x=>x.site==="narou");
  const workMap=new Map(works.map(x=>[codeOf(x.workId||x.ncode),x]).filter(x=>x[0]));
  const shelfRows=newRows.shelves||[],shelfMap=new Map(shelfRows.map(x=>[String(x.shelf_id??""),x]));
  const newAuthorIds=new Set(works.map(x=>String(x.authorId||"").trim()).filter(Boolean));
  const oldWorks=oldRows.works_cache||[],oldPlacement=oldRows.shelf_placement||[],oldReading=oldRows.reading_position||[],oldAuthors=oldRows.authors||[],oldShelves=oldRows.shelf_names||[];
  function workCompare(rows,kind){
   let identifiable=0,found=0,missing=0,notComparable=0,extra=0;
   for(const x of rows){const code=codeOf(x);if(!code){notComparable++;continue}identifiable++;const w=workMap.get(code);if(w){found++;if(kind==="reading"&&!readingExists(w))extra++;if(kind==="placement"&&String(w.shelfId||"")!==String(x.shelfId??x.shelf_id??""))extra++;}else missing++}
   return {total:rows.length,identifiable,found,missing,notComparable,extra};
  }
  const wc=workCompare(oldWorks,"cache"),pc=workCompare(oldPlacement,"placement"),rc=workCompare(oldReading,"reading");
  const authorCompare={total:oldAuthors.length,identifiable:0,found:0,missing:0,notComparable:0};
  for(const x of oldAuthors){const id=authorIdOf(x);if(!id){authorCompare.notComparable++;continue}authorCompare.identifiable++;if(newAuthorIds.has(id))authorCompare.found++;else authorCompare.missing++}
  const shelfCompare={total:oldShelves.length,identifiable:0,found:0,missing:0,notComparable:0};
  for(const x of oldShelves){const id=shelfIdOf(x);if(!id){shelfCompare.notComparable++;continue}shelfCompare.identifiable++;if(shelfMap.has(id))shelfCompare.found++;else shelfCompare.missing++}
  const fmt=n=>Number(n||0).toLocaleString("ja-JP");
  const storeRows=oldNames.map(name=>{const rows=oldRows[name]||[];const st=oldDb.transaction(name,"readonly").objectStore(name);const kp=Array.isArray(st.keyPath)?st.keyPath.join(", "):st.keyPath??"(なし)";return '<tr><td>'+name+'</td><td>'+kp+'</td><td>'+fmt(rows.length)+'</td></tr>'}).join("");
  let html=card("DBとストアの構成",'<p>旧DB：v'+oldDb.version+'／新DB：v'+newDb.version+'</p><table><thead><tr><th>旧ストア</th><th>keyPath</th><th>件数</th></tr></thead><tbody>'+storeRows+'</tbody></table>'+ (absent.length?'<p class="warn">見つからない旧ストア：'+absent.join("、")+'</p>':''));
  html+=card("旧 works_cache → 新 works",metric("旧キャッシュ作品",fmt(wc.total))+metric("Nコードを識別できた旧作品",fmt(wc.identifiable))+metric("新DBにも存在",fmt(wc.found))+metric("新DBに見つからない",fmt(wc.missing))+metric("照合できない",fmt(wc.notComparable)));
  html+=card("旧 shelf_placement → 新 works.shelfId",metric("旧棚配置",fmt(pc.total))+metric("作品コードを識別",fmt(pc.identifiable))+metric("新DBに作品あり",fmt(pc.found))+metric("新DBに作品なし",fmt(pc.missing))+metric("新DBと棚IDが異なる",fmt(pc.extra))+metric("照合できない",fmt(pc.notComparable)));
  html+=card("旧 reading_position → 新 works.reading",metric("旧読書位置",fmt(rc.total))+metric("作品コードを識別",fmt(rc.identifiable))+metric("新DBに作品あり",fmt(rc.found))+metric("新DBに作品なし",fmt(rc.missing))+metric("新DB側に読書位置らしき値なし",fmt(rc.extra))+metric("照合できない",fmt(rc.notComparable)));
  const missingReading=oldReading.filter(x=>{const code=codeOf(x);return code&&!workMap.has(code)});
  const oldCacheCodes=new Set(oldWorks.map(x=>codeOf(x.ncode||x.workId||x.id)).filter(Boolean));
  const oldPlacementCodes=new Set(oldPlacement.map(x=>codeOf(x.ncode||x.workId||x.id)).filter(Boolean));
  const orphanStatus=missingReading.map(x=>{const code=codeOf(x);return {code,inOldCache:oldCacheCodes.has(code),inOldPlacement:oldPlacementCodes.has(code)}});
  const readingDetails=missingReading.length?'<table><thead><tr><th>Nコード</th><th>旧読書位置の主な値</th></tr></thead><tbody>'+missingReading.map(x=>{const code=codeOf(x);const values={};for(const k of ["position","episode","episodeNo","page","isRead","updatedAt","reading"])if(x[k]!==undefined)values[k]=x[k];return '<tr><td>'+code+'</td><td><code>'+JSON.stringify(values)+'</code></td></tr>'}).join("")+'</tbody></table>':'<p>新DBに存在しない読書位置レコードはありません。</p>';
  html+=card("新DBに作品が見つからなかった読書位置",readingDetails+'<p class="small">この一覧は旧DBの読み取り結果です。データの変更・削除は行いません。</p>');
  const statusTable=orphanStatus.length?'<table><thead><tr><th>Nコード</th><th>旧works_cache</th><th>旧shelf_placement</th></tr></thead><tbody>'+orphanStatus.map(x=>'<tr><td>'+x.code+'</td><td>'+(x.inOldCache?'あり':'なし')+'</td><td>'+(x.inOldPlacement?'あり':'なし')+'</td></tr>').join("")+'</tbody></table>':'';
  html+=card("3件の旧DB内での残存状況",statusTable+'<p class="small">旧works_cacheにも配置情報にも存在しなければ、読書位置だけが残った孤立レコードの可能性があります。存在する場合は、作品IDや登録経路を追加調査します。</p>');
  html+=card("旧 authors → 新 works.authorId",metric("旧作者レコード",fmt(authorCompare.total))+metric("作者IDを識別",fmt(authorCompare.identifiable))+metric("新DBに同じ作者IDあり",fmt(authorCompare.found))+metric("新DBに同じ作者IDなし",fmt(authorCompare.missing))+metric("照合できない",fmt(authorCompare.notComparable)));
  html+=card("旧 shelf_names → 新 shelves",metric("旧棚マスター",fmt(shelfCompare.total))+metric("棚IDを識別",fmt(shelfCompare.identifiable))+metric("新DBに同じ棚IDあり",fmt(shelfCompare.found))+metric("新DBに同じ棚IDなし",fmt(shelfCompare.missing))+metric("照合できない",fmt(shelfCompare.notComparable)));
  html+=card("全体の見方",'<p class="small">「新DBに見つからない」「棚IDが異なる」「読書位置らしき値なし」「照合できない」が0以外なら、旧DBを削除せず、該当データの形式や移行状況を追加調査します。件数一致だけでは内容一致を保証しません。このページは読み取り専用で、旧DB・新DBを変更していません。</p>');
  $("result").innerHTML=html;
  $("status").textContent="照合完了。読み取り専用で "+oldNames.length+" ストアを確認しました。\n確認日時："+new Date().toLocaleString("ja-JP");
 }catch(e){$("status").textContent="診断を中止しました。\n"+e.message+"\nデータの変更・新規作成は行っていません。"}
 finally{if(oldDb)oldDb.close();if(newDb)newDb.close();btn.disabled=false}
}
$("run").addEventListener("click",run);
})();
</script>
</body>
</html>
