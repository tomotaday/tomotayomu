<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ・確認→保存テスト</title>
<style>
body{
  margin:0;
  padding:32px 20px;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f7f5ef;
  color:#222;
}
main{
  max-width:560px;
  margin:0 auto;
  background:#fff;
  border:1px solid #d8d2c5;
  border-radius:18px;
  padding:24px;
  box-sizing:border-box;
}
h1{font-size:22px;margin:0 0 24px}
.row{margin:18px 0}
.label{color:#777;font-size:14px}
.value{font-size:24px;font-weight:700;margin-top:4px;word-break:break-all}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:17px;
  font-weight:700;
  background:#222;
  color:#fff;
  margin-top:10px;
}
button:disabled{opacity:.45}
.status{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#f2f0ea;
  font-weight:700;
  line-height:1.5;
}
.note{
  margin-top:24px;
  padding:14px;
  background:#f2f0ea;
  border-radius:12px;
  font-size:14px;
  line-height:1.6;
}
</style>
</head>
<body>
<main>
<h1>📚 ともたよむ・確認→保存テスト</h1>

<div class="row">
  <div class="label">受信したNコード</div>
  <div class="value" id="ncode">（未受信）</div>
</div>

<div class="row">
  <div class="label">受信した話数</div>
  <div class="value" id="episode">（未受信）</div>
</div>

<button id="saveButton" disabled>この読書位置を保存する</button>

<div class="status" id="status">受信データを確認中…</div>

<div class="note">
これは実験用ページです。<br>
「保存する」を押したときだけ、このページ自身のlocalStorageへ保存します。<br>
現時点では、ともたよむ本体の読書位置は変更しません。
</div>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const ncode = (params.get("ncode") || "").trim().toLowerCase();
  const episode = (params.get("episode") || "").trim();

  const ncodeEl = document.getElementById("ncode");
  const episodeEl = document.getElementById("episode");
  const saveButton = document.getElementById("saveButton");
  const status = document.getElementById("status");

  ncodeEl.textContent = ncode || "（未受信）";
  episodeEl.textContent = episode || "（未受信）";

  if (ncode && episode) {
    saveButton.disabled = false;
    status.textContent = "📨 受信しました。内容を確認してから保存してください。";
  } else {
    status.textContent = "⚠️ Nコードまたは話数を受信できませんでした。";
  }

  saveButton.addEventListener("click", () => {
    if (!ncode || !episode) return;

    const data = {
      ncode,
      episode,
      savedAt: new Date().toISOString()
    };

    localStorage.setItem("tomotaYomu_receive_apply_test", JSON.stringify(data));

    status.textContent = "💾 保存しました。";
    saveButton.disabled = true;
  });
})();
</script>
</body>
</html>
