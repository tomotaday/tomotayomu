async function moveWorkToShelf(ncode,newShelfId){

const ATOM_DB_NAME="tomotaYomuAtomDB", ATOM_DB_VERSION=1;

async function importPublishedAuthorFeeds(){
 if(atomImportBusy)return false;atomImportBusy=true;
 const status=document.getElementById("authorAtomStatus");
 try{
  if(status)status.textContent="公開済みの作者情報を読み込み中…";
  const res=await fetch(ATOM_PUBLISHED_JSON_URL+"?t="+Date.now(),{cache:"no-store"});

  let skippedOld=0;
  for(const a of snapshot.authors){
   const author=authorMap.get((a.author_type==="r18"?"r18":"normal")+":"+String(a.author_id||""));
   for(const feed of (Array.isArray(a.feeds)?a.feeds:[]))for(const item of (Array.isArray(feed.entries)?feed.entries:[])){
    const feedType=feed.kind==="activity"?"activity":"novel",updated=String(item.updated||item.published||""),url=String(item.url||""),title=String(item.title||"").trim();
    if(!title)continue;

    const row={entryId,authorId:String(a.author_id),authorName:String(author?.authorName||a.author_id),authorType:a.author_type==="r18"?"r18":"normal",feedType,workNcode:(url.match(/(N[0-9A-Z]{4,})/i)||[])[1]?.toUpperCase()||"",title,url,updated,summary:"",read:!!previous?.read,storedAt:previous?.storedAt||new Date().toISOString()};
    pending.set(entryId,row);oldById.set(entryId,row);

   }
  }

  }

  return true;
 }catch(e){console.warn("公開済み作者情報の読込失敗",e);if(status)status.textContent="Atom取込失敗："+e.message+"（前回の保存データは保持しています）";return false}
 finally{atomImportBusy=false}
}

       if(run.conclusion!=="success"){
        sessionStorage.removeItem("tomotaYomu_atom_wait_after");sessionStorage.removeItem("tomotaYomu_atom_wait_started");
        if(status)status.textContent="GitHub Actionsが正常終了しませんでした（"+String(run.conclusion||"結果不明")+"）。作者情報は取り込まず、保存済みデータを保持しています。";
        return;
       }
       if(!successAt)successAt=Date.now();
       const ok=await importPublishedAuthorFeeds();
       if(ok){
        const db=await openAtomDB(),meta=(await atomAll(db,"meta")).find(x=>x.key==="publishedFetchedAt"),current=String(meta?.value||"");
        if(current>after&&Date.parse(current)>=started){
         sessionStorage.removeItem("tomotaYomu_atom_wait_after");sessionStorage.removeItem("tomotaYomu_atom_wait_started");
         if(status)status.textContent="作者情報の更新と取込みが完了しました。";
         return;
        }
       }
       if(Date.now()-successAt>10*60*1000){
        sessionStorage.removeItem("tomotaYomu_atom_wait_after");sessionStorage.removeItem("tomotaYomu_atom_wait_started");
        if(status)status.textContent="GitHub Actionsは成功しましたが、新しい公開JSONをまだ確認できません。少し待ってから再度お試しください。既存データは保持しています。";
        return;
       }
       if(status)status.textContent="GitHub Actionsは完了。公開データの反映を待ってから取込みます…";
      }else if(status)status.textContent="GitHub Actions実行中。完了を確認してから自動で取り込みます…";
     }else if(status)status.textContent="GitHub Actionsの起動を確認しています…";
     lastApiError="";
    }catch(e){
     lastApiError=e.message||String(e);
     if(status)status.textContent="GitHub Actionsの状態確認を再試行しています（"+lastApiError+"）。作者情報はまだ取り込みません。";
    }
   }
   await new Promise(resolve=>setTimeout(resolve,15000));
  }
  sessionStorage.removeItem("tomotaYomu_atom_wait_after");sessionStorage.removeItem("tomotaYomu_atom_wait_started");
  if(status)status.textContent=runSeen?"処理の完了確認が時間切れになりました。GitHub Actionsの実行結果を確認してください。既存データは保持しています。":"GitHub Actionsの起動を確認できませんでした"+(lastApiError?"（"+lastApiError+"）":"")+"。ショートカットが実行されたか確認して、もう一度お試しください。既存データは保持しています。";
 }finally{atomWorkflowWaitBusy=false}
}
function openAtomDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(ATOM_DB_NAME,ATOM_DB_VERSION);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains("entries"))db.createObjectStore("entries",{keyPath:"entryId"});
      if(!db.objectStoreNames.contains("meta"))db.createObjectStore("meta",{keyPath:"key"});
    };
    r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("Atom DBを開けません"));
  });
}
function atomAll(db,store){
  return new Promise((resolve,reject)=>{
    const out=[],r=db.transaction(store,"readonly").objectStore(store).openCursor();
    r.onsuccess=()=>{if(r.result){out.push(r.result.value);r.result.continue()}else resolve(out)};
    r.onerror=()=>reject(r.error||new Error("Atomデータ読込失敗"));
  });
}
function atomPut(db,store,row){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(row);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("Atom保存失敗"));
  });
}
function atomAuthorKey(a){return (a.authorType==="r18"?"r18":"normal")+":"+String(a.authorId||"").trim();}
async function readAtomAuthors(){
  const db=await new Promise((ok,no)=>{const r=indexedDB.open("tomotaYomuDB",1);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  const rows=await new Promise((ok,no)=>{const out=[],r=db.transaction("authors","readonly").objectStore("authors").openCursor();r.onsuccess=()=>{if(r.result){out.push(r.result.value);r.result.continue()}else ok(out)};r.onerror=()=>no(r.error)});
  const map=new Map();
  rows.forEach(a=>{const id=String(a?.authorId||"").trim();if(!id)return;const type=a.authorType==="r18"?"r18":"normal",key=type+":"+id;if(!map.has(key))map.set(key,{authorId:id,authorType:type,authorName:a.authorName||a.writer||id,authorUrl:a.authorUrl||""})});
  return [...map.values()].sort((a,b)=>atomAuthorKey(a).localeCompare(atomAuthorKey(b)));
}
async function renderAuthorAtom(){
  const db=await openAtomDB(),allEntries=(await atomAll(db,"entries")).sort((a,b)=>String(b.updated||"").localeCompare(String(a.updated||"")));
  const list=document.getElementById("authorAtomList");if(!list)return;
  const savedDays=Number(localStorage.getItem("tomotaYomu_atom_display_days")||7),days=Math.min(30,Math.max(1,Number.isFinite(savedDays)?savedDays:7));
  const cutoff=Date.now()-days*24*60*60*1000;
  const entries=allEntries.filter(e=>{const t=Date.parse(e.updated||"");return Number.isFinite(t)&&t>=cutoff;});
  const unread=entries.filter(e=>!e.read).length;
  document.getElementById("authorFeedTitle").textContent="👤作者 🆙 "+unread.toLocaleString("ja-JP");
  list.innerHTML="";
  if(!entries.length){list.textContent="直近"+days+"日間の作者更新はありません。";return}
  const categories=[
    {key:"novel",label:"📖 作品更新"},
    {key:"activity",label:"📝 活動報告"}
  ];
  for(const category of categories){
    const categoryEntries=entries.filter(e=>(e.feedType==="activity"?"activity":"novel")===category.key);
    const categoryUnread=categoryEntries.filter(e=>!e.read).length;
    const section=document.createElement("details");section.className="atomCategory";
    const heading=document.createElement("summary");heading.textContent=category.label+"　未読 "+categoryUnread+" / 全 "+categoryEntries.length+"件";
    section.appendChild(heading);
    if(!categoryEntries.length){
      const empty=document.createElement("div");empty.className="atomMeta";empty.textContent="この分類の更新はありません。";section.appendChild(empty);
    }else{
      const visible=categoryEntries.slice(0,500),groups=new Map();
      for(const e of visible){const day=String(e.updated||"").slice(0,10)||"日付不明";if(!groups.has(day))groups.set(day,[]);groups.get(day).push(e)}
      for(const [day,dayEntries] of groups){
        const dayUnread=dayEntries.filter(e=>!e.read).length;
        const daySection=document.createElement("details");daySection.className="atomDate";
        const dayHeading=document.createElement("summary");dayHeading.textContent=day+"　未読 "+dayUnread+" / 全 "+dayEntries.length+"件";
        daySection.appendChild(dayHeading);
        for(const e of dayEntries){
          const row=document.createElement("div");row.className="atomEntry"+(e.read?"":" unread");row.dataset.entryId=e.entryId;
          const a=document.createElement("a");a.href=e.url||"#";a.target="_blank";a.rel="noopener noreferrer";a.textContent=e.title;
          if(e.url&&!e.read)a.addEventListener("click",()=>markAtomRead(e.entryId));
          row.appendChild(a);
          const meta=document.createElement("div");meta.className="atomMeta";meta.textContent=(e.authorType==="r18"?"R18 · ":"")+e.authorName;
          row.appendChild(meta);
          const state=document.createElement("span");state.className="atomReadState"+(e.read?" is-read":" is-unread");state.textContent=e.read?"✓ 既読":"● 未読";row.appendChild(state);
          if(!e.read){const b=document.createElement("button");b.type="button";b.textContent="既読にする";b.addEventListener("click",()=>markAtomRead(e.entryId));row.appendChild(b)}
          daySection.appendChild(row);
        }
        section.appendChild(daySection);
      }
      if(categoryEntries.length>500){const more=document.createElement("div");more.className="atomMeta";more.textContent="この分類は新しい順に500件まで表示しています（表示期間："+days+"日）。";section.appendChild(more)}
    }
    list.appendChild(section);
  }
}
async function markAtomRead(id){
  const db=await openAtomDB(),all=await atomAll(db,"entries"),entry=all.find(x=>x.entryId===id);
  if(!entry||entry.read)return;
  entry.read=true;
  await atomPut(db,"entries",entry);
  const row=[...document.querySelectorAll("#authorAtomList .atomEntry")].find(el=>el.dataset.entryId===id);
  if(!row)return;
  row.classList.remove("unread");
  const state=row.querySelector(".atomReadState");
  if(state){state.classList.remove("is-unread");state.classList.add("is-read");state.textContent="✓ 既読";}
  row.querySelector("button")?.remove();
  const countUnread=container=>container.querySelectorAll(".atomEntry.unread").length;
  const countAll=container=>container.querySelectorAll(".atomEntry").length;
  const daySection=row.closest(".atomDate");
  if(daySection){
    const heading=daySection.querySelector(":scope > summary");
    if(heading){const label=heading.textContent.split("　未読 ")[0];heading.textContent=label+"　未読 "+countUnread(daySection)+" / 全 "+countAll(daySection)+"件";}
  }
  const category=row.closest(".atomCategory");
  if(category){
    const heading=category.querySelector(":scope > summary");
    if(heading){const label=heading.textContent.split("　未読 ")[0];heading.textContent=label+"　未読 "+countUnread(category)+" / 全 "+countAll(category)+"件";}
  }
  const list=document.getElementById("authorAtomList");
  const totalUnread=countUnread(list);
  const title=document.getElementById("authorFeedTitle");
  if(title)title.textContent="👤作者 🆙 "+totalUnread.toLocaleString("ja-JP");
}
window.addEventListener("load",async()=>{try{setupAtomDisplayDays();await renderAuthorAtom();if(sessionStorage.getItem("tomotaYomu_atom_wait_started"))waitForPublishedAuthorFeeds();else await importPublishedAuthorFeeds()}catch(e){console.warn("作者Atom表示準備失敗",e)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&sessionStorage.getItem("tomotaYomu_atom_wait_started"))waitForPublishedAuthorFeeds()});
window.addEventListener("focus",()=>{if(sessionStorage.getItem("tomotaYomu_atom_wait_started"))waitForPublishedAuthorFeeds()});

</script>
