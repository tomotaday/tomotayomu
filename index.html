function loadJSON(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; } catch(e) { return fallback; } }
function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function getGlobalBaseline(){ return localStorage.getItem(GLOBAL_BASELINE_KEY) || INITIAL_GLOBAL_BASELINE; }
function setGlobalBaseline(value){ localStorage.setItem(GLOBAL_BASELINE_KEY, value); }
function getUpdateCandidates(){ return loadJSON(UPDATE_CANDIDATES_KEY,{}); }
function saveUpdateCandidates(value){ saveJSON(UPDATE_CANDIDATES_KEY,value); }
function getLatestWorks(){ return loadJSON(LATEST_WORKS_KEY,{}); }
function saveLatestWorks(value){ saveJSON(LATEST_WORKS_KEY,value); }
function slimWork(w){
  return {
    ncode:String(w.ncode||"").toUpperCase(),
    general_lastup:w.general_lastup||"",
    general_all_no:w.general_all_no||0,
    end:w.end??0,
    story:w.story||"",
    title:w.title||"",
    writer:w.writer||"",
    keyword:w.keyword||"",
    genre:w.genre??0,
    userid:w.userid??0,
    noveltype:w.noveltype??0,
    isstop:w.isstop??0,
    novelupdated_at:w.novelupdated_at||"",
    __r18:!!w.__r18
  };
}
function restoreLatestWorks(){
  const latest=getLatestWorks(), cards=getCardsByNcode();
  Object.keys(latest).forEach(n=>{
    const c=cards[n];
    if(c) updateCard(c,latest[n]);
  });
}
function renderGlobalBaseline(){ const el=document.getElementById("baselineDate"); if(el){ const v=getGlobalBaseline(); el.textContent=v?("基準日："+formatDate(v)):"基準日：反映待ち"; } }
async function hydrateCandidateWorks(){
  const candidates=getUpdateCandidates();
  const ncodes=Object.keys(candidates||{});
  if(!ncodes.length)return;
  try{
    const [normal,r18]=await Promise.all([
      fetchByNcodes(API_URL,ncodes,"normal"),
      fetchByNcodes(R18_API_URL,ncodes,"r18")
    ]);
    r18.forEach(w=>w.__r18=true);
    const rows=[...normal,...r18], cards=getCardsByNcode(), latest=getLatestWorks();
    rows.forEach(w=>{
      const n=String(w.ncode||"").toUpperCase();
      if(!candidates[n])return;
      if(w.general_lastup && new Date(String(w.general_lastup).replace(" ","T")).getTime() >= new Date(String(candidates[n]).replace(" ","T")).getTime()){
        const saved=slimWork(w);
        latest[n]=saved;
        const c=cards[n];
        if(c)updateCard(c,saved);
      }
    });
    saveLatestWorks(latest);
  }catch(e){ console.warn("候補作品の最新情報取得に失敗",e); }
}

    s.onerror=()=>no(new Error("shelf restore map load failed"));
    document.head.appendChild(s);
  });
}
let v3Shelves=[];
let v3ShelfText=null;
async function buildV3CardsFromIndexedDB(){
  const status=document.getElementById("apiStatus");
  if(status)status.textContent="本棚情報反映中";
  await loadShelfRestoreMap();
  const db=await new Promise((ok,no)=>{
    const r=indexedDB.open("tomotaYomuDB",1);
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>no(r.error);
  });
  const readAll=name=>new Promise((ok,no)=>{
    const a=[],r=db.transaction(name,"readonly").objectStore(name).openCursor();
    r.onsuccess=()=>{if(r.result){a.push(r.result.value);r.result.continue()}else ok(a)};
    r.onerror=()=>no(r.error);
  });
  const [shelfRows,placements,works,authors,positions]=await Promise.all([
    readAll("shelf_names"),readAll("shelf_placement"),readAll("works_cache"),readAll("authors"),readAll("reading_position")
  ]);
  v3Shelves=shelfRows;
  const shelves=v3Shelves;
  const wm=new Map(works.map(v=>[String(v.ncode||"").toUpperCase(),v]));
  const am=new Map(authors.map(v=>[String(v.ncode||"").toUpperCase(),v]));
  const pm=new Map(positions.map(v=>[String(v.ncode||"").toUpperCase(),v]));
  const sm=new Map(shelves.map(v=>[String(v.shelf_id||"").trim(),v]));
  const shelfText=v=>{
    const direct=v?.shelf_name??v?.name??v?.title??v?.label??v?.display_name;
    if(direct!=null&&String(direct).trim())return String(direct).trim();
    const values=Object.values(v||{});
    const hit=values.find(x=>typeof x==="string"&&/読書中|未分類|あ〜お|か〜こ|さ〜そ|た〜と|な〜の|は〜ほ|ま〜も|や〜ん|更新待ち/.test(x));
    return String(hit??v?.shelf_id??"").trim();
  };
  v3ShelfText=shelfText;
  const shelfCore=raw=>{
    const s=String(raw||"").replace(/[🟠🔵🌀🎈📚⏰]/g,"").replace(/\s+/g,"");
    if(s.includes("読書中"))return "読書中";
    if(s.includes("未分類"))return "未分類";
    for(const k of ["あ〜お","か〜こ","さ〜そ","た〜と","な〜の","は〜ほ","ま〜も","や〜ん","更新待ち"]) if(s.includes(k)||s.includes(k.replace("〜","-"))) return k;
    return "";
  };
  const shelfLabel=raw=>{
    const core=shelfCore(raw);
    if(core==="読書中")return "🟠読書中";
    if(core==="未分類")return "未分類";
    if(core==="更新待ち")return "⏰更新待ち";
    if(core)return "🎈"+core;
    return String(raw||"").trim();
  };
  const shelfIdByCore=new Map();
  const shelfIdsByCore=new Map();
  shelves.forEach(v=>{
    const id=String(v.shelf_id||"").trim(),core=shelfCore(shelfText(v));
    if(!id||!core)return;
    if(!shelfIdByCore.has(core))shelfIdByCore.set(core,id);
    if(!shelfIdsByCore.has(core))shelfIdsByCore.set(core,new Set());
    shelfIdsByCore.get(core).add(id);
  });

  const originalShelfByNcode=window.ORIGINAL_SHELF_BY_NCODE||{};
  const readShelfId=shelfIdByCore.get("読書中")||"";
  const unclassifiedShelfId=shelfIdByCore.get("未分類")||"";

  {
    const validShelfIds=new Set(shelves.map(v=>String(v.shelf_id||"").trim()).filter(Boolean));
    const repaired=placements.map(p=>{
      const currentSid=String(p.shelf_id||"").trim();
      if(currentSid===""||validShelfIds.has(currentSid)) return {...p,shelf_id:currentSid};
      const n=String(p.ncode||"").toUpperCase();
      const originalLabel=String(originalShelfByNcode[n]||"").trim();
      const originalCore=shelfCore(originalLabel);
      const sid=originalCore?shelfIdByCore.get(originalCore)||"":"";
      return {...p,shelf_id:sid};
    });
    const changed=repaired.some((p,i)=>String(p.shelf_id||"")!==String(placements[i].shelf_id||""));
    if(changed){
      await new Promise((ok,no)=>{
        const tx=db.transaction("shelf_placement","readwrite"),st=tx.objectStore("shelf_placement");
        repaired.forEach(p=>st.put(p));
        tx.oncomplete=ok;
        tx.onerror=()=>no(tx.error);
        tx.onabort=()=>no(tx.error||new Error("shelf repair aborted"));
      });
      placements.splice(0,placements.length,...repaired);
    }
  }

  const readMap=readingMap();
  positions.forEach(v=>{
    const n=String(v.ncode||"").toUpperCase();
    if(/^N[0-9A-Z]+$/.test(n)&&Number.isFinite(Number(v.episode)))readMap[n]=Number(v.episode);
  });
  saveJSON(READ_KEY,readMap);

  const source=document.getElementById("shelf");
  source.innerHTML="";
  let made=0,deleted=0,unmapped=0;

  for(const p of placements){
    const n=String(p.ncode||"").toUpperCase(),w=wm.get(n);
    if(!w){deleted++;continue;}
    const sid=String(p.shelf_id||"").trim();
    const rawShelf=shelfText(sm.get(sid));
    const shelf=rawShelf;
    if(sid && !sm.has(sid))unmapped++;

    const card=document.createElement("article");
    card.className="card";
    card.dataset.ncode=n;
    card.dataset.shelfId=sid;
    card.dataset.shelf=shelf;
    card.dataset.current=pm.has(n)?String(pm.get(n).episode||""):"";
    const writer=am.get(n)?.writer||w.writer||"";

    card.innerHTML='<div class="meta"><span class="newMark" hidden>🆙 </span><span class="lastUpdated">—</span> ｜ <span class="status">—</span> ｜ '+shelf+'</div><h2></h2><div class="author"></div><details><summary>あらすじを読む</summary><p class="synopsis"></p></details><div class="actions"><a class="workLink" rel="noopener" target="_blank">作品を開く</a><a class="resumeLink" rel="noopener" target="_blank">続きから　📖 未読 / —話</a></div><details class="managementDetails"><summary>詳細を開く</summary><div class="managementBody"><div class="ncode">Nコード：'+n+'</div><button type="button" class="moveShelfBtn">本棚を移動</button><button type="button" class="deleteWorkBtn">削除</button></div></details></article>';
    card.querySelector("h2").textContent=w.title||"";
    card.querySelector(".author").textContent="作者："+writer;
    updateCard(card,{...w,writer});
    source.appendChild(card);
    made++;
  }

  const s=document.getElementById("apiStatus");
  if(s){ s.textContent=""; }
  const sum=document.getElementById("bookshelfSummary");
  if(sum)sum.textContent="📚 本棚 "+made;
  if(status)status.textContent="本棚情報反映済み";
  return {shelves:v3Shelves,placements,made,deleted,works,authors,positions,unmapped};
}
function formatDate(v) { if (!v) return "—"; const d = new Date(String(v).replace(" ", "T")); if (isNaN(d)) return String(v).slice(0,10).replaceAll("-","/"); return d.toLocaleString("ja-JP", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}); }
function nowUnix(){ return Math.floor(Date.now()/1000); }
function setStatus(w) {
  if (String(w.noveltype ?? "").trim() === "2") return "🟣 短編";
  return String(w.end) === "0" ? "🔵 完結" : "🟢 連載中";
}
function siteUrl(w) { return w.__r18 ? "https://novel18.syosetu.com/" + String(w.ncode).toLowerCase() + "/" : "https://ncode.syosetu.com/" + String(w.ncode).toLowerCase() + "/"; }
function restoreReadingFromQuery(){
  const params = new URLSearchParams(location.search);
  const n = (params.get("ncode") || "").trim().toUpperCase();
  const episode = params.get("episode") || "";

  if(!/^N[0-9A-Z]+$/.test(n) || !/^\d+$/.test(episode)) return false;

  setReading(n, Number(episode));
  localStorage.removeItem(ACTIVE_KEY);

  const cleanUrl = new URL(location.href);
  cleanUrl.searchParams.delete("ncode");
  cleanUrl.searchParams.delete("episode");
  history.replaceState(null, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);

  return true;
}

function restoreReadingPositions(){
  document.querySelectorAll("#shelf .card").forEach(card=>{
    const n = card.dataset.ncode.toUpperCase();
    const current = readingFor(n);
    const total = Number(card.dataset.totalEpisodes || 0);
    const resumeLink = card.querySelector(".resumeLink");

    card.dataset.current = current == null ? "" : String(current);

    if(!resumeLink) return;

    const workUrl = card.querySelector(".workLink")?.href || "";

    if(current == null){
      resumeLink.textContent =
        "続きから　📖 📝 読書記録なし / " + (total || "—") + "話";
      resumeLink.href = workUrl;
    }else{
      resumeLink.textContent =
        "続きから　📖 " + current + " / " + (total || "—") + "話";
      resumeLink.href =
        current > 0 ? workUrl + String(current) + "/" : workUrl;
    }
  });
}

function readingMap(){ return loadJSON(READ_KEY,{}); }
function readingFor(n){ const r=readingMap()[String(n).toUpperCase()]; return Number.isFinite(Number(r)) ? Number(r) : null; }
function setReading(n,episode){ const key=String(n).toUpperCase(), value=Number(episode); const m=readingMap(); m[key]=value; saveJSON(READ_KEY,m); saveReadingToIndexedDB(key,value); }
function saveReadingToIndexedDB(n,episode){ try{ const r=indexedDB.open("tomotaYomuDB",1); r.onsuccess=()=>{ const d=r.result; if(!d.objectStoreNames.contains("reading_position"))return; const t=d.transaction("reading_position","readwrite"); t.objectStore("reading_position").put({ncode:n,episode:Number(episode)}); }; }catch(e){ console.warn("reading_position保存失敗",e); } }
function seedReadingCache(){
  const m=readingMap(); let changed=false;
  document.querySelectorAll("#shelf .card").forEach(card=>{
    const n=card.dataset.ncode.toUpperCase();
    if(!(n in m)){
      const v=card.dataset.current;
      if(v!=="" && /^\d+$/.test(v)) m[n]=Number(v); else m[n]=null;
      changed=true;
    }
  });
  if(changed)saveJSON(READ_KEY,m);
}
function updateCard(card,w){
  const n=String(w.ncode||card.dataset.ncode).toUpperCase();
  const titleEl=card.querySelector("h2"); if(titleEl&&w.title)titleEl.textContent=w.title;
  const authorEl=card.querySelector(".author"); if(authorEl&&w.writer)authorEl.textContent="作者："+w.writer;
  card.dataset.lastUpdated = w.general_lastup || card.dataset.lastUpdated || "";
  card.dataset.totalEpisodes = w.general_all_no || card.dataset.totalEpisodes || "";
  card.querySelector(".lastUpdated").textContent = formatDate(card.dataset.lastUpdated);
  if(Object.prototype.hasOwnProperty.call(w,"end") || Object.prototype.hasOwnProperty.call(w,"novel_type") || Object.prototype.hasOwnProperty.call(w,"noveltype")) card.querySelector(".status").textContent = setStatus(w);
  card.querySelector(".synopsis").textContent = w.story || "あらすじなし";
  const workUrl = siteUrl(w); card.querySelector(".workLink").href = workUrl;
  const current = readingFor(n), total = Number(w.general_all_no || card.dataset.totalEpisodes || 0), resumeLink = card.querySelector(".resumeLink");
  card.dataset.current = current==null ? "" : String(current);
  const isShortStory = String(w.noveltype ?? "").trim() === "2";
  if(current==null){ resumeLink.textContent = "続きから　📖 📝 読書記録なし / " + (total||"—") + "話"; resumeLink.href = workUrl; }
  else { resumeLink.textContent = "続きから　📖 " + current + " / " + (total||"—") + "話"; resumeLink.href = isShortStory ? workUrl : (current>0 ? workUrl + String(current) + "/" : workUrl); }
  applyCardState(card);
}
function applyCardState(card){
  const n=card.dataset.ncode.toUpperCase(), candidates=getUpdateCandidates(), candidate=candidates[n], current=readingFor(n), total=Number(card.dataset.totalEpisodes||0);
  const isShelfRegistered=String(card.dataset.shelfId||"").trim()!=="";
  const unread=current!=null && total>0 && current<total;
  const mark=card.querySelector(".newMark");
  if(mark)mark.hidden=!isShelfRegistered || !(!!candidate && unread);
}
function buildShelfFolders(){
  const root=document.getElementById("shelfSections"), source=document.getElementById("shelf"); if(!root||!source)return; root.innerHTML="";
  const order=[];
  v3Shelves.forEach(v=>{const id=String(v.shelf_id||"").trim(),name=v3ShelfText(v);if(id&&name)order.push({id:id,name:String(name).trim(),sort:Number.isFinite(Number(v.display_order))?Number(v.display_order):999999});});
  order.sort((a,b)=>a.sort-b.sort);
  order.push({id:"",name:"未分類",sort:Infinity});
  const cards=[...source.querySelectorAll(":scope > .card")];
  const getFolder=card=>{const sid=String(card.dataset.shelfId||"").trim();return order.some(x=>x.id===sid)?sid:"";};
  for(const x of order){const members=cards.filter(c=>getFolder(c)===x.id).sort((a,b)=>(b.dataset.lastUpdated||"").localeCompare(a.dataset.lastUpdated||""));if(!members.length)continue;const d=document.createElement("details");d.className="folderDetails";const sm=document.createElement("summary");sm.textContent=x.name+" "+members.length;const wrap=document.createElement("div");wrap.className="folderCards";members.forEach(c=>wrap.appendChild(c.cloneNode(true)));d.append(sm,wrap);root.appendChild(d);}
  source.hidden=true;
  const management=document.createElement("details");
  management.className="managementSettingsDetails";
  const managementSummary=document.createElement("summary");
  managementSummary.textContent="⚙️管理設定用";
  const managementBody=document.createElement("div");
  managementBody.className="managementSettingsBody";
  managementBody.innerHTML='<a href="v3.0.0_shelf_manager_test.html">本棚管理</a><a href="author.html">作者整理（ふりがな）</a><div><strong>🎨 お着替え</strong><div class="dressup"><button type="button" data-theme-choice="default">🌿 生成り</button><button type="button" data-theme-choice="seiji">🌊 青磁</button><button type="button" data-theme-choice="night">🌙 夜の図鑑</button><button type="button" data-theme-choice="autumn">🍂 秋色</button></div></div>';
  management.append(managementSummary,managementBody);
  root.appendChild(management);
}
function applyDressup(theme){
  const t=theme==="seiji"||theme==="night"||theme==="autumn"?theme:"default";
  document.body.dataset.theme=t;
  localStorage.setItem("tomotaYomu_theme",t);
  document.querySelectorAll("[data-theme-choice]").forEach(b=>b.classList.toggle("active",(b.dataset.themeChoice||"default")===t));
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=t==="night"?"#20242a":t==="seiji"?"#edf4f1":t==="autumn"?"#f5eee4":"#f6f3ed";
}
function initDressup(){
  applyDressup(localStorage.getItem("tomotaYomu_theme")||"default");
}
document.addEventListener("DOMContentLoaded",initDressup);
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-theme-choice]");
  if(!b)return;
  applyDressup(b.dataset.themeChoice);
});

function buildUpdateView(){
  const candidates=getUpdateCandidates(), cards=[...document.querySelectorAll("#shelf .card")], updates=[];
  cards.forEach(card=>{
    applyCardState(card);
    const n=card.dataset.ncode.toUpperCase(), candidate=candidates[n], current=readingFor(n), total=Number(card.dataset.totalEpisodes||0);
    const unread=current!=null && total>0 && current<total;
    const isShelfRegistered=String(card.dataset.shelfId||"").trim()!=="";
    if(candidate&&unread&&isShelfRegistered)updates.push(card);
  });
  updates.sort((a,b)=>(candidates[b.dataset.ncode.toUpperCase()]||"").localeCompare(candidates[a.dataset.ncode.toUpperCase()]||""));
  const list=document.getElementById("updateList"); list.innerHTML=""; updates.forEach(c=>list.appendChild(c.cloneNode(true)));
  document.getElementById("updateTitle").textContent="🆙 更新"+updates.length;
  document.getElementById("updateEmpty").classList.toggle("hidden",updates.length!==0);
}
function jsonp(url){ return new Promise((resolve,reject)=>{ const cb="tomotaYomu_v211_"+Date.now()+"_"+Math.random().toString(36).slice(2); const s=document.createElement("script"), timer=setTimeout(()=>{cleanup();reject(new Error("JSONP timeout"))},20000); function cleanup(){clearTimeout(timer);try{s.remove()}catch(e){};try{delete window[cb]}catch(e){window[cb]=undefined}} window[cb]=d=>{cleanup();resolve(d)}; s.onerror=()=>{cleanup();reject(new Error("JSONP load error"))}; s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now(); document.head.appendChild(s); }); }
function range(a,b){ return Math.floor(a)+"-"+Math.floor(b); }
async function countRange(base,a,b){ const d=await jsonp(base+"?lastup="+range(a,b)+"&of=n-t-s-gl-ga-e-e&lim=1&st=1"); return Number(d?.[0]?.allcount||0); }
async function collectRange(base,a,b,depth=0){
  const n=await countRange(base,a,b); if(n===0)return []; if(n<=MAX_ST){ let out=[]; for(let st=1;st<=n;st+=500){ const lim=Math.min(500,n-st+1),d=await jsonp(base+"?lastup="+range(a,b)+"&of=n-t-s-gl-ga-e-e&lim="+lim+"&st="+st); out.push(...(d||[]).filter(x=>x.ncode)); } return out; }
  if(depth>20)throw new Error("lastup時間分割上限"); const m=Math.floor((a+b)/2); return (await collectRange(base,a,m,depth+1)).concat(await collectRange(base,m+1,b,depth+1));
}
async function fetchByNcodes(apiUrl,ncodes,label){
  const chunks=[]; for(let i=0;i<ncodes.length;i+=400)chunks.push(ncodes.slice(i,i+400)); const results=[];
  for(let i=0;i<chunks.length;i++){ const chunk=chunks[i]; const d=await jsonp(apiUrl+"?ncode="+encodeURIComponent(chunk.join("-"))+"&of=n-t-s-gl-ga-e-e-nt&lim=500"); results.push(...(Array.isArray(d)?d.slice(1):[])); }
  return results;
}
function getCardsByNcode(){ const m={}; document.querySelectorAll("#shelf .card").forEach(c=>m[c.dataset.ncode.toUpperCase()]=c); return m; }
async function initializeBaseline(){
  const status=document.getElementById("apiStatus"); status.textContent="初回同期：作品情報を取得中…";
  const [works,r18]=await Promise.all([fetchByNcodes(API_URL,NCODES,"normal"),fetchByNcodes(R18_API_URL,R18_NCODES,"r18")]); r18.forEach(w=>w.__r18=true);
  const by={}; [...works,...r18].forEach(w=>by[String(w.ncode).toUpperCase()]=w); const cards=getCardsByNcode(), baseline={};
  [...works,...r18].forEach(w=>{const n=String(w.ncode).toUpperCase(); baseline[n]=w.general_lastup||""; if(cards[n])updateCard(cards[n],w);}); saveJSON(STORAGE_KEY,baseline); saveJSON(LAST_CHECK_KEY,new Date().toISOString()); buildUpdateView(); buildShelfFolders(); return [...works,...r18].length;
}
async function updateInfo(){
  const btn=document.getElementById("updateBtn"),status=document.getElementById("apiStatus");
  btn.disabled=true;
  try{
    seedReadingCache();
    const oldBaseline=getGlobalBaseline();
    const newBaseline=new Date().toISOString();
    const start=Math.floor(new Date(oldBaseline).getTime()/1000);
    const end=Math.floor(new Date(newBaseline).getTime()/1000);
    if(!Number.isFinite(start)||!Number.isFinite(end))throw new Error("基準日の日時が不正です");
    status.textContent="更新候補を確認中…";
    const [normal,r18]=await Promise.all([collectRange(API_URL,start,end),collectRange(R18_API_URL,start,end)]);
    r18.forEach(w=>w.__r18=true);
    const rows=[...normal,...r18];
    const cards=getCardsByNcode(), candidates=getUpdateCandidates(), latest=getLatestWorks();
    let reflected=0;
    rows.forEach(w=>{
      const n=String(w.ncode||"").toUpperCase(), c=cards[n];
      if(!c)return;
      const lastup=w.general_lastup||"";
      if(lastup&&new Date(lastup.replace(" ","T")).getTime()>new Date(oldBaseline).getTime()){
        const saved=slimWork(w);
        latest[n]=saved;
        updateCard(c,saved);
        if(String(c.dataset.shelfId||"").trim()!==""){
          candidates[n]=lastup;
        }else{
          delete candidates[n];
        }
        reflected++;
      }
    });
    saveLatestWorks(latest);
    saveUpdateCandidates(candidates);
    setGlobalBaseline(newBaseline);
    saveJSON(LAST_CHECK_KEY,newBaseline);
    renderGlobalBaseline();
    buildUpdateView();
    buildShelfFolders();
    status.textContent=`更新確認完了：取得 ${rows.length}作品｜反映 ${reflected}作品｜更新候補 ${Object.keys(candidates).length}作品｜最新情報を保存｜新基準日 ${formatDate(newBaseline)}`;
  }catch(e){
    console.error(e);
    status.textContent="更新確認に失敗しました："+e.message;
  }finally{btn.disabled=false;}
}
function gasRead(n){ return new Promise((resolve,reject)=>{ const x=new XMLHttpRequest(); x.open("GET",GAS_URL+"?ncode="+encodeURIComponent(n),true); x.timeout=20000; x.onload=()=>resolve({status:x.status,text:x.responseText.trim()}); x.onerror=()=>reject(new Error("GAS通信エラー")); x.ontimeout=()=>reject(new Error("GASタイムアウト")); x.send(); }); }
async function refreshActiveFromGAS(){ const n=(localStorage.getItem(ACTIVE_KEY)||"").toUpperCase(); if(!n)return; const card=document.querySelector(`#shelf .card[data-ncode="${n}"]`); if(!card)return; try{ const r=await gasRead(n); const p=r.text.split(/\s+/); if(r.status===200&&p[0]==="READ"&&/^\d+$/.test(p[2])){ setReading(n,Number(p[2])); updateCard(card,{ncode:n,general_lastup:card.dataset.lastUpdated,general_all_no:card.dataset.totalEpisodes,story:card.querySelector(".synopsis")?.textContent||"",__r18:card.querySelector(".r18Badge")!=null}); } else if(r.status===200&&p[0]==="NOT_FOUND"){ const m=readingMap(); m[n]=null; saveJSON(READ_KEY,m); updateCard(card,{ncode:n,general_lastup:card.dataset.lastUpdated,general_all_no:card.dataset.totalEpisodes,story:card.querySelector(".synopsis")?.textContent||"",__r18:card.querySelector(".r18Badge")!=null}); } else throw new Error("GAS応答不明："+r.text); buildUpdateView(); buildShelfFolders(); localStorage.removeItem(ACTIVE_KEY); }catch(e){ console.warn(e); }
}
async function moveWorkToShelf(ncode,newShelfId){
  const db=await new Promise((ok,no)=>{
    const r=indexedDB.open("tomotaYomuDB",1);
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>no(r.error);
  });
  const rows=await new Promise((ok,no)=>{
    const a=[],r=db.transaction("shelf_placement","readonly").objectStore("shelf_placement").openCursor();
    r.onsuccess=()=>{if(r.result){const v=r.result.value;if(String(v?.ncode||"").toUpperCase()===String(ncode).toUpperCase())a.push(v);r.result.continue()}else ok(a)};
    r.onerror=()=>no(r.error);
  });
  if(!rows.length)throw new Error("本棚所属データが見つかりません");
  const row={...rows[0],shelf_id:String(newShelfId||"").trim()};
  await new Promise((ok,no)=>{
    const tx=db.transaction("shelf_placement","readwrite"),st=tx.objectStore("shelf_placement");
    st.put(row);
    tx.oncomplete=ok;
    tx.onerror=()=>no(tx.error);
    tx.onabort=()=>no(tx.error||new Error("本棚移動を保存できませんでした"));
  });
}
function showShelfMoveDialog(card){
  const n=String(card?.dataset?.ncode||"").toUpperCase();
  if(!n)return;
  if(card.querySelector(".shelfMovePanel"))return;

  const usable=(v3Shelves||[])
    .map(v=>({
      id:String(v?.shelf_id||"").trim(),
      name:String(v?.shelf_name??v?.name??v?.title??v?.label??v?.display_name??v?.shelf_id??"").trim(),
      order:Number(v?.display_order)||999999
    }))
    .filter(v=>v.id&&v.name)
    .sort((a,b)=>a.order-b.order);

  if(!usable.length){
    alert("本棚マスターが読み込まれていません。");
    return;
  }

  const currentId=String(card.dataset.shelfId||"").trim();
  const panel=document.createElement("div");
  panel.className="shelfMovePanel";
  panel.innerHTML='<div class="shelfMoveLabel">移動先の本棚</div><select class="shelfMoveSelect"></select><div class="shelfMoveActions"><button type="button" class="shelfMoveSave">移動する</button><button type="button" class="shelfMoveCancel">キャンセル</button></div>';

  const select=panel.querySelector(".shelfMoveSelect");
  usable.forEach(v=>{
    const o=document.createElement("option");
    o.value=v.id;
    o.textContent=v.name+(v.id===currentId?"（現在）":"");
    o.selected=v.id===currentId;
    select.appendChild(o);
  });

  const unclassified=document.createElement("option");
  unclassified.value="";
  unclassified.textContent="本棚から外す（未登録）";
  unclassified.selected=currentId==="";
  select.appendChild(unclassified);

  const body=card.querySelector(".managementBody");
  if(!body)return;
  body.appendChild(panel);

  panel.querySelector(".shelfMoveCancel").addEventListener("click",()=>panel.remove());
  panel.querySelector(".shelfMoveSave").addEventListener("click",async()=>{
    const newId=String(select.value||"").trim();
    if(newId===currentId){panel.remove();return;}
    try{
      await moveWorkToShelf(n,newId);
      await buildV3CardsFromIndexedDB();
      seedReadingCache();
      restoreReadingPositions();
      renderGlobalBaseline();
      restoreLatestWorks();
      buildUpdateView();
      buildShelfFolders();
      document.getElementById("apiStatus").textContent="本棚を移動しました："+(newId?select.options[select.selectedIndex].textContent:"未登録");
    }catch(e){
      console.error(e);
      alert("本棚移動に失敗しました："+e.message);
    }
  });
}
function rememberActive(card){ localStorage.setItem(ACTIVE_KEY,card.dataset.ncode.toUpperCase()); }
function placeR18Badges(){
  document.querySelectorAll("#shelf .card").forEach(card=>{
    const badge=card.querySelector(".r18Badge"), ncode=card.querySelector(".ncode");
    if(badge && ncode && !ncode.contains(badge)) ncode.appendChild(badge);
  });
}
document.getElementById("updateBtn").addEventListener("click",updateInfo);
document.addEventListener("click",e=>{
  const move=e.target.closest(".moveShelfBtn");
  if(move){
    const card=e.target.closest(".card");
    if(card)showShelfMoveDialog(card);
    return;
  }
  const a=e.target.closest(".resumeLink");
  if(!a)return;
  const card=e.target.closest(".card");
  if(!card)return;
  rememberActive(card);
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshActiveFromGAS(); });
window.addEventListener("load",async()=>{ try{ const s=document.getElementById("apiStatus"); if(s)s.textContent="本棚情報反映中"; await buildV3CardsFromIndexedDB(); seedReadingCache(); restoreReadingFromQuery(); restoreReadingPositions(); renderGlobalBaseline(); restoreLatestWorks(); buildUpdateView(); buildShelfFolders(); setTimeout(refreshActiveFromGAS,300); }catch(e){ console.warn("v3 IndexedDB本棚再構築失敗",e); const s=document.getElementById("apiStatus"); if(s)s.textContent="v3 IndexedDB接続失敗："+e.message; } });
</script>
