<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>Brave起動テスト｜ともたよむ</title>
<style>
:root{color-scheme:light}
body{margin:0;padding:24px 18px 40px;background:#f6f3ed;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.65}
main{max-width:560px;margin:auto}
h1{font-size:1.35rem}
p{font-size:.95rem}
label{display:block;font-weight:600;margin:20px 0 6px}
input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #c9c3b8;border-radius:10px;font-size:15px;background:white}
button{display:block;width:100%;margin:12px 0;padding:14px;border:0;border-radius:12px;background:#e3effb;color:#245b8d;font-size:16px;font-weight:700}
button:active{opacity:.7}
.note{padding:12px 14px;border-radius:10px;background:#fff;border:1px solid #e4ded3;font-size:.88rem}
small{color:#666}
</style>
</head>
<body>
<main>
<h1>🦁 Brave起動テスト</h1>
<p>ともたよむからカクヨムを開くと専用アプリが起動する問題を調べるための、独立したテストページです。<strong>本体のindex.htmlは変更していません。</strong></p>
<label for="target">開きたいカクヨムURL</label>
<input id="target" type="url" value="https://kakuyomu.jp/works/1177354054891965415" autocomplete="url" spellcheck="false">
<p class="note">まずは「① 1回エンコード」を試してください。うまく開かなければ戻って、②、③を順に試します。Braveが起動してカクヨムのWEBページが表示されれば成功です。</p>
<button type="button" id="once">① Braveで開く（1回エンコード）</button>
<button type="button" id="twice">② Braveで開く（2回エンコード）</button>
<button type="button" id="raw">③ Braveで開く（エンコードなし）</button>
<p><small>テスト対象：Brave iOSの brave://open-url?url= URLスキーム</small></p>
</main>
<script>
(function(){
  const field=document.getElementById('target');
  function getTarget(){
    const value=field.value.trim();
    if(!/^https:\/\/kakuyomu\.jp\//i.test(value)){
      alert('https://kakuyomu.jp/ から始まるURLを入力してください。');
      return null;
    }
    return value;
  }
  function openBrave(mode){
    const target=getTarget();
    if(!target)return;
    let value=target;
    if(mode===1)value=encodeURIComponent(target);
    if(mode===2)value=encodeURIComponent(encodeURIComponent(target));
    window.location.href='brave://open-url?url='+value;
  }
  document.getElementById('once').addEventListener('click',()=>openBrave(1));
  document.getElementById('twice').addEventListener('click',()=>openBrave(2));
  document.getElementById('raw').addEventListener('click',()=>openBrave(0));
})();
</script>
</body>
</html>
