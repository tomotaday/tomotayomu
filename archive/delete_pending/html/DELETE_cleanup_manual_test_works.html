<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ｜仮登録3作品の整理</title><style>body{margin:0;background:#f6f3ed;color:#252525;font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.6}main{max-width:640px;margin:auto;padding:24px 16px}section{background:#fffdf9;border:1px solid #aaa195;border-radius:14px;padding:18px}h1{font-size:23px}li{margin:12px 0}button{font:inherit;font-weight:700;padding:12px 16px;border:1px solid #aaa195;border-radius:9px;background:#fffdf9;margin-top:12px}#status{white-space:pre-wrap;margin-top:16px}</style></head><body><main><p><a href="index.html">← ともたよむ本棚へ戻る</a></p><section><h1>仮登録3作品の整理</h1><p>次の3件について、IndexedDB の <code>works_cache</code> にある作品情報だけを削除します。</p><ul><li>N0960MX — 日々これ日々</li><li>N7111BG — 第八公女奮闘記その二</li><li>N9653IJ — どんなのか見たくて。</li></ul><p><strong>棚配置・読書位置・作者データ・検索除外リストは変更しません。</strong></p><button id="inspect">対象データを確認</button> <button id="remove" disabled>確認した3作品のデータだけ削除</button><div id="status" role="status"></div></section></main><script>
const DB_NAME="tomotaYomuDB",TARGETS=["N0960MX","N7111BG","N9653IJ"],$=id=>document.getElementById(id);let verified=[];
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"));r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("本棚DBが見つかりません。削除処理は行っていません。"))}})}
function inspectStore(db){return new Promise((resolve,reject)=>{if(!db.objectStoreNames.contains("works_cache")){reject(new Error("works_cacheが見つかりません。削除していません。"));return}const tx=db.transaction("works_cache","readonly"),st=tx.objectStore("works_cache"),found=[];let i=0;const next=()=>{if(i>=TARGETS.length){resolve(found);return}const code=TARGETS[i++],r=st.get(code);r.onsuccess=()=>{found.push({ncode:code,exists:r.result!==undefined,title:r.result?.title||""});next()};r.onerror=()=>reject(r.error||new Error(code+"の確認に失敗"))};next();tx.onerror=()=>reject(tx.error||new Error("確認に失敗"))})}
$("inspect").onclick=async()=>{$("remove").disabled=true;$("status").textContent="対象を確認中…";try{const db=await openDB();verified=await inspectStore(db);db.close();$("status").textContent=verified.map(x=>x.ncode+"："+(x.exists?"登録あり"+(x.title?" — "+x.title:""):"登録なし")).join("\n")+"\n\n登録ありの対象だけを削除できます。";$("remove").disabled=!verified.some(x=>x.exists)}catch(e){$("status").textContent="中止しました： "+e.message}};
$("remove").onclick=async()=>{if(!verified.length||!verified.some(x=>x.exists))return;if(!confirm("確認済みの3作品について、works_cacheのレコードだけを削除します。棚配置・読書位置・作者データ・検索除外リストは変更しません。実行しますか？"))return;$("remove").disabled=true;$("inspect").disabled=true;try{const db=await openDB(),found=await inspectStore(db),tx=db.transaction("works_cache","readwrite"),st=tx.objectStore("works_cache"),removed=[];for(const x of found)if(x.exists){st.delete(x.ncode);removed.push(x.ncode)}await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("削除に失敗"));tx.onabort=()=>reject(tx.error||new Error("削除が中止されました"))});db.close();$("status").textContent="削除処理が完了しました。\nworks_cacheから削除："+(removed.join("、")||"該当なし")+"\n\n他のストアと検索除外リストは変更していません。\n本棚へ戻って表示を更新してください。"}catch(e){$("status").textContent="処理結果を確認してください： "+e.message;$("inspect").disabled=false;$("remove").disabled=false}};
</script></body></html>
