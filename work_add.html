<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜作品追加</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:28px 16px 48px}
h1{font-size:27px;margin:0 0 6px}.note{font-size:13px;color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.status{font-size:16px;white-space:pre-wrap;word-break:break-word}
.work{margin-top:16px;padding-top:16px;border-top:1px solid #ddd5ca}
.title{font-size:20px;font-weight:700}.meta{font-size:13px;color:var(--muted);margin-top:4px}
.ok{font-size:18px;font-weight:700}.error{color:#9b3d32}
label{display:block;font-weight:700;margin:12px 0 4px}input,textarea{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{resize:vertical}#manualSave{margin-top:14px;padding:10px 14px;background:#fffdf9;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:700}
</style>
</head>
<body>
<main>
<h1>📚 作品追加</h1>
<div class="note">作品ページから受け取った作品を、ともたよむの本棚へ追加します。</div>
<div class="card">
<div id="status" class="status">作品URLを受信しています…</div>
<div id="work" class="work" hidden></div>
<details id="manualBox" class="work" open>
<summary class="title">✍️ 手動で作品を登録</summary>
<p class="meta">検索除外作品など、Narou APIから情報を取得できない作品はこちらから登録できます。Nコードと作品タイトルは必須です。</p>
<label for="manualNcode">Nコード</label>
<input id="manualNcode" autocomplete="off" placeholder="例：N1234AB">
<label for="manualTitle">作品タイトル</label>
<input id="manualTitle" autocomplete="off" placeholder="作品タイトル">
<label for="manualWriter">作者名（任意）</label>
<input id="manualWriter" autocomplete="off" placeholder="作者名">
<label for="manualUrl">作品URL（任意）</label>
<input id="manualUrl" autocomplete="url" placeholder="https://ncode.syosetu.com/...">
<label for="manualSynopsis">あらすじ（任意）</label>
<textarea id="manualSynopsis" rows="4" placeholder="あとから編集・補足できます"></textarea>
<button id="manualSave" type="button">検索除外作品として登録</button>
<div id="manualStatus" class="status" aria-live="polite"></div>
</details>
</div>
</main>
<script>
const VERSION="3.2.0";
const DB_NAME="tomotaYomuDB",DB_VERSION=1;
const API_URL="https://api.syosetu.com/novelapi/api/";
const R18_API_URL="https://api.syosetu.com/novel18api/api/";
const LEGACY_TARGET_SHELF_NAME="🏝️とりあえず";
const SEARCH_EXCLUDED_KEY="tomotaYomu_search_excluded_ncodes_v1";

function setStatus(t,cls=""){const e=document.getElementById("status");e.textContent=t;e.className="status "+cls}
function ncodeFromUrl(raw){
  const s=String(raw||"").trim();
  let m=s.match(/(?:https?:\/\/)?(?:ncode|novel18)\.syosetu\.com\/([a-z0-9_-]+)/i);
  if(m)return m[1].toUpperCase().replace(/[^A-Z0-9]/g,"");
  m=s.match(/\b(N\d{1,}[A-Z]{1,5})\b/i);
  return m?m[1].toUpperCase():"";
}
function apiUrlFor(raw,ncode){
  const s=String(raw||"").toLowerCase();
  return s.includes("novel18.syosetu.com")||s.includes("novel18")?R18_API_URL:API_URL;
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="tyWorkCb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");let done=false;
    const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()};
    const timer=setTimeout(()=>{cleanup();reject(new Error("作品API timeout"))},20000);
    window[cb]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error("作品API load error"))};
    s.src=url+"&callback="+cb;
    document.body.appendChild(s);
  });
}
async function fetchWork(api,ncode){
  const apis=[api,api===API_URL?R18_API_URL:API_URL];
  let last=null;
  for(const base of apis){
    const u=base+"?out=jsonp&of=n-t-s-w-gl-ga-nt-e-u&ncode="+encodeURIComponent(ncode)+"&lim=1";
    try{
      const j=await jsonp(u);
      const hit=Array.isArray(j)?j.find(x=>x&&x.ncode):null;
      if(hit)return {...hit,__r18:base===R18_API_URL};
    }catch(e){last=e}
  }
  if(last)throw last;
  throw new Error("作品情報が見つかりません："+ncode);
}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"));})}
function readAll(db,name){return new Promise((resolve,reject)=>{const tx=db.transaction(name,"readonly"),st=tx.objectStore(name),out=[];const r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error(name+"読込失敗"));})}
function putRow(tx,store,row,key){
  const st=tx.objectStore(store);
  return st.keyPath==null?st.put(row,key):st.put(row);
}
async function saveWork(work,rawUrl){
  const db=await openDB();
  const shelves=await readAll(db,"shelf_names");
  // 登録先は棚名ではなく、棚マスターに保存された固定の指定で判断する。
  // 初回移行時だけ旧名称を使い、見つかった棚を登録先として記憶する。
  const shelf=shelves.find(v=>v?.work_add_target===true)
    || shelves.find(v=>String(v?.shelf_name??v?.name??v?.title??"").trim()===LEGACY_TARGET_SHELF_NAME);
  if(!shelf?.shelf_id)throw new Error("作品登録先の本棚が指定されていません。本棚管理で「作品登録先にする」を選んでください。");
  const ncode=String(work.ncode||"").toUpperCase();
  const placements=await readAll(db,"shelf_placement");
  const authors=await readAll(db,"authors");
  const existing=placements.find(v=>String(v?.ncode??"").toUpperCase()===ncode);
  const isR18=apiUrlFor(rawUrl,ncode)===R18_API_URL;
  const writer=String(work.writer||"").trim();
  const authorIds=[...new Set(authors
    .filter(a=>a&&a.authorId&&((a.authorType==="r18")===isR18)&&String(a.authorName||a.writer||"").trim()===writer)
    .map(a=>String(a.authorId).trim())
    .filter(Boolean))];
  const matchedAuthorId=authorIds.length===1?authorIds[0]:"";
  const matchedAuthor=matchedAuthorId?authors.find(a=>String(a?.authorId||"").trim()===matchedAuthorId&&((a?.authorType==="r18")===isR18))||{}:{};
  const tx=db.transaction(["works_cache","shelf_placement","authors","shelf_names"],"readwrite");
  const saved={...work,ncode,__r18:isR18};
  putRow(tx,"works_cache",saved,ncode);
  // 旧名称で初回検出した棚も、固定の登録先として保存しておく。
  for(const item of shelves){
    const updatedShelf={...item,work_add_target:String(item?.shelf_id)===String(shelf.shelf_id)};
    putRow(tx,"shelf_names",updatedShelf,shelf.shelf_id);
  }
  const placement={...(existing||{}),ncode,shelf_id:String(existing?.shelf_id||shelf.shelf_id)};
  putRow(tx,"shelf_placement",placement,ncode);
  if(matchedAuthorId){
    const authorRow={ncode,writer,authorId:matchedAuthorId,authorType:isR18?"r18":"normal",authorName:String(matchedAuthor.authorName||writer),authorUrl:String(matchedAuthor.authorUrl||"")};
    putRow(tx,"authors",authorRow,ncode);
  }
  await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("保存失敗"));tx.onabort=()=>reject(tx.error||new Error("保存中止"));});
  return {shelfName:String(shelf.shelf_name??shelf.name??shelf.title??"本棚"),existing:!!existing,work:saved,authorId:matchedAuthorId};
}
function setManualStatus(text,cls=""){const e=document.getElementById("manualStatus");e.textContent=text;e.className="status "+cls}
function normalizeNcode(raw){const m=String(raw||"").toUpperCase().match(/N[0-9]{1,}[A-Z]{1,5}/);return m?m[0]:""}
async function saveManualWork(){
 const btn=document.getElementById("manualSave");btn.disabled=true;
 try{
  const ncode=normalizeNcode(document.getElementById("manualNcode").value);
  const title=String(document.getElementById("manualTitle").value||"").trim();
  const writer=String(document.getElementById("manualWriter").value||"").trim();
  const rawUrl=String(document.getElementById("manualUrl").value||"").trim();
  const story=String(document.getElementById("manualSynopsis").value||"").trim();
  if(!ncode)throw new Error("Nコードを入力してください（例：N1234AB）。");
  if(!title)throw new Error("作品タイトルを入力してください。");
  if(rawUrl && !/^(https?:\/\/)?(ncode|novel18)\.syosetu\.com\//i.test(rawUrl))throw new Error("作品URLは「ncode.syosetu.com」または「novel18.syosetu.com」のURLを入力してください。");
  const work={ncode,title,writer,story,keyword:"",general_all_no:0,general_lastup:"",general_firstup:"",end:0,noveltype:0,isstop:0,userid:0,genre:0,novelupdated_at:"",__r18:rawUrl.toLowerCase().includes("novel18.syosetu.com")};
  setManualStatus("作品情報を保存中…");
  const r=await saveWork(work,rawUrl||"");
  const excluded=new Set(JSON.parse(localStorage.getItem(SEARCH_EXCLUDED_KEY)||"[]"));
  excluded.add(ncode);localStorage.setItem(SEARCH_EXCLUDED_KEY,JSON.stringify([...excluded]));
  setManualStatus("✅ 手動登録しました。検索除外一覧にも登録済みです。\n保存先："+r.shelfName+"\nNコード："+ncode+"\n"+(r.existing?"既存の棚配置と読書位置は維持しました。":"作品情報が未取得のため、タイトルなど入力内容を保存しました。"),"ok");
 }catch(e){console.error(e);setManualStatus("⚠️ 登録できませんでした："+e.message,"error")}
 finally{btn.disabled=false}
}
document.getElementById("manualSave").addEventListener("click",saveManualWork);
async function handle(){
  const params=new URLSearchParams(location.search);
  const raw=params.get("workurl")||params.get("url")||params.get("input")||params.get("text")||"";
  if(!raw){
    const qs=location.search||"（クエリなし）";
    setStatus("作品URLを受信できませんでした。\n\n受信URL：\n"+location.href+"\n\nクエリ：\n"+qs+"\n\nworkurl / url / input のいずれにも値がありません。","error");
    return
  }
  const ncode=ncodeFromUrl(raw);
  if(!ncode){setStatus("Nコードを作品URLから取得できませんでした。\n"+raw,"error");return}
  try{
    setStatus("作品 "+ncode+" を確認中…（Narou API）");
    const work=await fetchWork(apiUrlFor(raw,ncode),ncode);
    const r=await saveWork(work,raw);
    const box=document.getElementById("work");box.hidden=false;
    box.innerHTML="";
    const t=document.createElement("div");t.className="title";t.textContent=work.title||ncode;
    const m=document.createElement("div");m.className="meta";m.textContent="Nコード："+ncode+"｜作者："+(work.writer||"不明")+"｜保存先："+r.shelfName;
    box.append(t,m);
    const authorMsg=r.authorId?"｜登録作者へ自動紐付け済み":"｜作者は未登録";
    setStatus((r.existing?"✅ 作品情報を更新し、":"✅ 作品を")+"「"+r.shelfName+"」へ登録しました。"+authorMsg,"ok");
    history.replaceState({},document.title,location.pathname);
  }catch(e){console.error(e);setStatus("⚠️ 作品追加失敗｜"+e.message,"error")}
}
handle();
</script>
</body>
</html>
