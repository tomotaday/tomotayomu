<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜メタデータ取込</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:28px 16px 48px}
h1{font-size:27px;margin:0 0 6px}.note{font-size:13px;color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.status{font-size:16px;white-space:pre-wrap;word-break:break-word}
.work{margin-top:16px;padding-top:16px;border-top:1px solid #ddd5ca}
.title{font-size:20px;font-weight:700}.meta{font-size:13px;color:var(--muted);margin-top:4px}
.ok{font-size:18px;font-weight:700}.error{color:#9b3d32}
label{display:block;font-weight:700;margin:12px 0 4px}input,textarea{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{resize:vertical}#manualSave{margin-top:14px;padding:10px 14px;background:#fffdf9;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:700}
</style>
</head>
<body>
<p style="margin:0 0 14px"><a href="index.html" style="display:inline-block;padding:9px 12px;border-radius:8px;background:#eee;color:#111;text-decoration:none">← ともたよむ本棚へ戻る</a></p>

<main>
<h1>📚 メタデータ取込</h1>
<div class="note">ショートカットで取得した作品メタデータを確認・補完し、検索除外作品として本棚に登録します。</div>
<div class="card">
<div id="status" class="status">作品URLを受信しています…</div>
<div id="work" class="work" hidden></div>
<section class="work">
<h2 class="title">作品メタデータ</h2>
<p class="meta">JSONを読み込み、取得できなかった項目を補ってから登録します。</p>
<div id="metadataCheck" class="status" aria-live="polite"></div>
<label for="metaJson">メタデータJSON</label>
<textarea id="metaJson" rows="5" placeholder="ショートカットのJSONを貼り付け"></textarea>
<button id="loadMetadata" type="button">JSONを読み込む</button>
<label for="manualNcode">Nコード</label><input id="manualNcode" autocomplete="off" placeholder="例：N1234AB">
<label for="manualTitle">作品タイトル</label><input id="manualTitle" autocomplete="off" placeholder="作品タイトル">
<label for="manualWriter">作者名</label><input id="manualWriter" autocomplete="off" placeholder="作者名">
<label for="manualUrl">取得元URL</label><input id="manualUrl" autocomplete="url" placeholder="作品情報ページのURL">
<label for="manualSynopsis">あらすじ</label><textarea id="manualSynopsis" rows="4" placeholder="あらすじ"></textarea>
<label for="manualStatusValue">作品状態</label><input id="manualStatusValue" placeholder="連載中・完結済・短編など">
<label for="manualEpisodeCount">エピソード数</label><input id="manualEpisodeCount" inputmode="numeric" placeholder="エピソード数">
<label for="manualGenre">ジャンル（将来用）</label><input id="manualGenre" placeholder="ジャンル">
<label for="manualPublishedAt">掲載日時</label><input id="manualPublishedAt" placeholder="掲載日時">
<label for="manualLatestAt">最新掲載日時</label><input id="manualLatestAt" placeholder="最新掲載日時">
<label for="manualCharacterCount">文字数</label><input id="manualCharacterCount" inputmode="numeric" placeholder="文字数">
<label for="manualDisclosure">開示設定</label><input id="manualDisclosure" placeholder="検索除外中 など">
<button id="manualSave" type="button">確認して検索除外作品として登録</button>
<div id="manualStatus" class="status" aria-live="polite"></div>
</section>
</div>
</main>
<script>
const VERSION="3.2.0";
const DB_NAME="tomotaYomuDB",DB_VERSION=1;
const API_URL="https://api.syosetu.com/novelapi/api/";
const R18_API_URL="https://api.syosetu.com/novel18api/api/";
const LEGACY_TARGET_SHELF_NAME="🏝️とりあえず";
const SEARCH_EXCLUDED_KEY="tomotaYomu_search_excluded_ncodes_v1";

function setStatus(t,cls=""){const e=document.getElementById("status");e.textContent=t;e.className="status "+cls}
function ncodeFromUrl(raw){
  const s=String(raw||"").trim();
  let m=s.match(/(?:https?:\/\/)?(?:ncode|novel18)\.syosetu\.com\/([a-z0-9_-]+)/i);
  if(m)return m[1].toUpperCase().replace(/[^A-Z0-9]/g,"");
  m=s.match(/\b(N\d{1,}[A-Z]{1,5})\b/i);
  return m?m[1].toUpperCase():"";
}
function apiUrlFor(raw,ncode){
  const s=String(raw||"").toLowerCase();
  return s.includes("novel18.syosetu.com")||s.includes("novel18")?R18_API_URL:API_URL;
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="tyWorkCb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");let done=false;
    const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()};
    const timer=setTimeout(()=>{cleanup();reject(new Error("作品API timeout"))},20000);
    window[cb]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error("作品API load error"))};
    s.src=url+"&callback="+cb;
    document.body.appendChild(s);
  });
}
async function fetchWork(api,ncode){
  const apis=[api,api===API_URL?R18_API_URL:API_URL];
  let last=null;
  for(const base of apis){
    const u=base+"?out=jsonp&of=n-t-s-w-gl-ga-nt-e-u&ncode="+encodeURIComponent(ncode)+"&lim=1";
    try{
      const j=await jsonp(u);
      const hit=Array.isArray(j)?j.find(x=>x&&x.ncode):null;
      if(hit)return {...hit,__r18:base===R18_API_URL};
    }catch(e){last=e}
  }
  if(last)throw last;
  throw new Error("作品情報が見つかりません："+ncode);
}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"));})}
function readAll(db,name){return new Promise((resolve,reject)=>{const tx=db.transaction(name,"readonly"),st=tx.objectStore(name),out=[];const r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error(name+"読込失敗"));})}
function putRow(tx,store,row,key){
  const st=tx.objectStore(store);
  return st.keyPath==null?st.put(row,key):st.put(row);
}
async function saveWork(work,rawUrl){
  const db=await openDB();
  const shelves=await readAll(db,"shelf_names");
  // 登録先は棚名ではなく、棚マスターに保存された固定の指定で判断する。
  // 初回移行時だけ旧名称を使い、見つかった棚を登録先として記憶する。
  const shelf=shelves.find(v=>v?.work_add_target===true)
    || shelves.find(v=>String(v?.shelf_name??v?.name??v?.title??"").trim()===LEGACY_TARGET_SHELF_NAME);
  if(!shelf?.shelf_id)throw new Error("作品登録先の本棚が指定されていません。本棚管理で「作品登録先にする」を選んでください。");
  const ncode=String(work.ncode||"").toUpperCase();
  const placements=await readAll(db,"shelf_placement");
  const authors=await readAll(db,"authors");
  const existing=placements.find(v=>String(v?.ncode??"").toUpperCase()===ncode);
  const isR18=apiUrlFor(rawUrl,ncode)===R18_API_URL;
  const writer=String(work.writer||"").trim();
  const authorIds=[...new Set(authors
    .filter(a=>a&&a.authorId&&((a.authorType==="r18")===isR18)&&String(a.authorName||a.writer||"").trim()===writer)
    .map(a=>String(a.authorId).trim())
    .filter(Boolean))];
  const matchedAuthorId=authorIds.length===1?authorIds[0]:"";
  const matchedAuthor=matchedAuthorId?authors.find(a=>String(a?.authorId||"").trim()===matchedAuthorId&&((a?.authorType==="r18")===isR18))||{}:{};
  const tx=db.transaction(["works_cache","shelf_placement","authors","shelf_names"],"readwrite");
  const saved={...work,ncode,__r18:isR18};
  putRow(tx,"works_cache",saved,ncode);
  // 旧名称で初回検出した棚も、固定の登録先として保存しておく。
  for(const item of shelves){
    const updatedShelf={...item,work_add_target:String(item?.shelf_id)===String(shelf.shelf_id)};
    putRow(tx,"shelf_names",updatedShelf,shelf.shelf_id);
  }
  const placement={...(existing||{}),ncode,shelf_id:String(existing?.shelf_id||shelf.shelf_id)};
  putRow(tx,"shelf_placement",placement,ncode);
  if(matchedAuthorId){
    const authorRow={ncode,writer,authorId:matchedAuthorId,authorType:isR18?"r18":"normal",authorName:String(matchedAuthor.authorName||writer),authorUrl:String(matchedAuthor.authorUrl||"")};
    putRow(tx,"authors",authorRow,ncode);
  }
  await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("保存失敗"));tx.onabort=()=>reject(tx.error||new Error("保存中止"));});
  return {shelfName:String(shelf.shelf_name??shelf.name??shelf.title??"本棚"),existing:!!existing,work:saved,authorId:matchedAuthorId};
}
function setManualStatus(text,cls=""){const e=document.getElementById("manualStatus");e.textContent=text;e.className="status "+cls}
function setMetadataCheck(text,cls=""){const e=document.getElementById("metadataCheck");e.textContent=text;e.className="status "+cls}
function normalizeNcode(raw){const m=String(raw||"").toUpperCase().match(/N[0-9]{1,}[A-Z]{1,5}/);return m?m[0]:""}
function applyMetadata(data){
 if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("JSONオブジェクトを指定してください。");
 const fields=[
  ["ncode","manualNcode","Nコード"],["title","manualTitle","作品タイトル"],["author","manualWriter","作者名"],
  ["source_url","manualUrl","取得元URL"],["synopsis","manualSynopsis","あらすじ"],["status","manualStatusValue","作品状態"],
  ["episode_count","manualEpisodeCount","エピソード数"],["genre","manualGenre","ジャンル"],
  ["published_at","manualPublishedAt","掲載日時"],["latest_episode_at","manualLatestAt","最新掲載日時"],
  ["character_count","manualCharacterCount","文字数"],["disclosure","manualDisclosure","開示設定"]
 ];
 for(const [key,id] of fields){
  const value=data[key];
  document.getElementById(id).value=value==null?"":String(value);
 }
 const missing=fields.filter(([key])=>!Object.prototype.hasOwnProperty.call(data,key)).map(([, ,label])=>label);
 const empty=fields.filter(([key])=>Object.prototype.hasOwnProperty.call(data,key)&&(data[key]==null||String(data[key]).trim()==="")).map(([, ,label])=>label);
 const d=String(data.disclosure||"").trim();
 let message="JSONを読み込みました。";
 if(missing.length)message+="\nJSONに項目がありません："+missing.join("、")+"。";
 if(empty.length)message+="\n値が空の項目："+empty.join("、")+"。";
 if(!d)message+="\n⚠️ 開示設定が未確認です。作品情報ページで確認し、開示設定欄を補ってください。";
 else if(d.includes("検索除外中"))message+="\n✅ 検索除外中を確認しました。内容を確認し、不足項目を補ってください。";
 else message+="\n⚠️ 開示設定は「"+d+"」です。検索除外中か確認できないため、登録は保留します。";
 setMetadataCheck(message,(!d||!d.includes("検索除外中")||missing.length||empty.length)?"error":"ok");
}
function loadMetadata(){
 const raw=String(document.getElementById("metaJson").value||"").trim();
 if(!raw)throw new Error("メタデータJSONを入力してください。");
 const data=JSON.parse(raw);applyMetadata(data);return data;
}
document.getElementById("loadMetadata").addEventListener("click",()=>{try{loadMetadata()}catch(e){setMetadataCheck("⚠️ JSONを読み込めません："+e.message,"error")}});
async function saveManualWork(){
 const btn=document.getElementById("manualSave");btn.disabled=true;
 try{
  const ncode=normalizeNcode(document.getElementById("manualNcode").value);
  const title=String(document.getElementById("manualTitle").value||"").trim();
  const writer=String(document.getElementById("manualWriter").value||"").trim();
  const rawUrl=String(document.getElementById("manualUrl").value||"").trim();
  const story=String(document.getElementById("manualSynopsis").value||"").trim();
  const disclosure=String(document.getElementById("manualDisclosure").value||"").trim();
  if(!ncode)throw new Error("Nコードを入力してください。");
  if(!title)throw new Error("作品タイトルを入力してください。");
  if(!disclosure)throw new Error("開示設定が未確認です。作品情報ページで確認してください。");
  if(!disclosure.includes("検索除外中"))throw new Error("「検索除外中」と確認できないため登録できません。作品情報ページを確認してください。");
  if(!/^https?:\/\/(ncode|novel18)\.syosetu\.com\/novelview\/infotop\/ncode\//i.test(rawUrl))throw new Error("取得元の作品情報ページURLを確認してください。");
  const num=id=>{const v=String(document.getElementById(id).value||"").trim();return v!==""&&Number.isFinite(Number(v))?Number(v):0};
  const status=String(document.getElementById("manualStatusValue").value||"").trim();
  const published=String(document.getElementById("manualPublishedAt").value||"").trim();
  const latest=String(document.getElementById("manualLatestAt").value||"").trim();
  const genreText=String(document.getElementById("manualGenre").value||"").trim();
  const work={ncode,title,writer,story,keyword:"",general_all_no:0,general_lastup:latest,general_firstup:published,end:status.includes("完結")?1:0,noveltype:status.includes("短編")?2:1,isstop:0,userid:0,genre:0,genre_text:genreText,novelupdated_at:latest,episode_count:num("manualEpisodeCount"),character_count:num("manualCharacterCount"),published_at:published,latest_episode_at:latest,disclosure,__r18:rawUrl.toLowerCase().includes("novel18.syosetu.com")};
  setManualStatus("作品情報を保存中…");
  const r=await saveWork(work,rawUrl);
  const excluded=new Set(JSON.parse(localStorage.getItem(SEARCH_EXCLUDED_KEY)||"[]"));excluded.add(ncode);localStorage.setItem(SEARCH_EXCLUDED_KEY,JSON.stringify([...excluded]));
  setManualStatus("✅ メタデータを使って検索除外作品を登録しました。\n保存先："+r.shelfName+"\nNコード："+ncode+"\n"+(r.existing?"既存の棚配置を維持しました。":"作品情報を保存しました。"),"ok");
 }catch(e){console.error(e);setManualStatus("⚠️ 登録できませんでした："+e.message,"error")}finally{btn.disabled=false}
}
document.getElementById("manualSave").addEventListener("click",saveManualWork);
async function handle(){
 const params=new URLSearchParams(location.search);
 const raw=params.get("metadata")||params.get("json")||"";
 if(raw){
  try{const data=JSON.parse(raw);document.getElementById("metaJson").value=JSON.stringify(data,null,2);applyMetadata(data);setStatus("メタデータを受信しました。内容を確認し、不足項目を補ってください。","ok");history.replaceState({},document.title,location.pathname)}
  catch(e){setStatus("メタデータを読み込めませんでした："+e.message,"error")}
  return;
 }
 setStatus("メタデータを待っています。JSONを読み込むとフォームに反映されます。");
}
handle();
</script>
</body>
</html>
