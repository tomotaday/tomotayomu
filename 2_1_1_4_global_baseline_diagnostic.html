<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ 2.1.1.4 基準日一本化診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;padding:20px;background:#f7f7f7;color:#222}
h1{font-size:20px;margin:0 0 12px}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #ddd}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#222;color:#fff;font-size:16px;margin-top:8px}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}
.ok{font-weight:700}
</style>
</head>
<body>
<h1>🔎 ともたよむ 2.1.1.4<br>基準日一本化診断</h1>

<div class="box">
  <div>基準日は「作品ごと」ではなく「全作品共通で1個」にする。</div>
  <div>初期基準日：2026/09/25 00:00</div>
  <button id="run">▶ 基準日一本化を検証</button>
  <button id="copy">📋 結果をコピー</button>
</div>

<div class="box">
<pre id="out">まだ診断していません。</pre>
</div>

<script>
const GLOBAL_BASELINE = "2026-09-25T00:00:00+09:00";

const samples = [
  {
    ncode:"N6117JH",
    lastup:"2024-08-22T20:12:04+09:00",
    reading:23,
    total:55
  },
  {
    ncode:"N3192IO",
    lastup:"2026-09-29T00:09:40+09:00",
    reading:null,
    total:0
  }
];

function fmt(v){
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return "不正";
  return d.getFullYear()+"/"+
    String(d.getMonth()+1).padStart(2,"0")+"/"+
    String(d.getDate()).padStart(2,"0")+" "+
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+":"+
    String(d.getSeconds()).padStart(2,"0");
}

function run(){
  const lines=[];
  lines.push("【基準日一本化診断】");
  lines.push("基準日 = "+fmt(GLOBAL_BASELINE));
  lines.push("");

  let allStructureOk=true;

  samples.forEach(w=>{
    const newer = new Date(w.lastup).getTime() > new Date(GLOBAL_BASELINE).getTime();
    const unread = w.reading !== null && w.total > 0 && w.reading < w.total;
    const mark = newer && unread;

    lines.push("【"+w.ncode+"】");
    lines.push("作品lastup = "+fmt(w.lastup));
    lines.push("読書位置 = "+(w.reading===null ? "なし" : w.reading));
    lines.push("全話数 = "+w.total);
    lines.push("lastup > 基準日 = "+newer);
    lines.push("未読あり = "+unread);
    lines.push("🆙判定 = "+mark);
    lines.push("");
  });

  const a=samples[0];
  const b=samples[1];

  const expectedA = false;
  const expectedB = true;

  const actualA = new Date(a.lastup).getTime() > new Date(GLOBAL_BASELINE).getTime();
  const actualB = new Date(b.lastup).getTime() > new Date(GLOBAL_BASELINE).getTime();

  if(actualA!==expectedA || actualB!==expectedB) allStructureOk=false;

  lines.push("【判定】");
  lines.push("N6117JH：基準日より古い → "+(actualA===false ? "OK" : "NG"));
  lines.push("N3192IO：基準日より新しい → "+(actualB===true ? "OK" : "NG"));
  lines.push("");
  lines.push(allStructureOk
    ? "✅ 基準日一本化の比較ロジックは成立"
    : "❌ 比較ロジックに問題あり");
  lines.push("");
  lines.push("※このページはAPI・GAS・localStorage・本棚データを変更しません。");
  lines.push("※読書位置は診断用サンプル値です。実データの読書位置を確認するページではありません。");

  document.getElementById("out").textContent=lines.join("\n");
}

document.getElementById("run").addEventListener("click",run);

document.getElementById("copy").addEventListener("click",async()=>{
  const text=document.getElementById("out").textContent;
  try{
    await navigator.clipboard.writeText(text);
    alert("コピーしました。");
  }catch(e){
    alert("コピーできませんでした。");
  }
});
</script>
</body>
</html>
