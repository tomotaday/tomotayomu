<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>buildUpdateView 判定追跡</title><style>body{font-family:-apple-system,sans-serif;padding:16px;background:#f7f4ef;color:#222}button{padding:11px 14px;margin:5px 0}pre{white-space:pre-wrap;background:#fff;padding:12px;border-radius:10px;border:1px solid #bbb;line-height:1.55}</style><h2>🔬 buildUpdateView 判定追跡</h2><p>本体の更新棚で使う判定を、保存データ相当の3作品について1項目ずつ追跡します。</p><button id="run">▶ 追跡</button><button id="copy">📋 結果をコピー</button><pre id="out">実行待ち</pre><script>const BASE="2026-09-25T00:00:00+09:00";const W=[{n:"N7998LI",last:"2026-09-26 11:05:07",total:52,read:0,unc:true},{n:"N6106LC",last:"2026-09-25 19:50:00",total:58,read:0,unc:false},{n:"N1028JP",last:"2026-09-25 12:00:00",total:84,read:82,unc:false}];function run(){let s="【buildUpdateView 判定追跡】\n基準日="+BASE+"\n\n";W.forEach(w=>{const newer=new Date(w.last.replace(" ","T")).getTime()>new Date(BASE).getTime();const unread=w.read<w.total;const visible=!w.unc;const update=newer&&unread&&visible;s+=w.n+"\n";s+="  latestWork存在=true\n";s+="  updateCandidate存在=true\n";s+="  lastup="+w.last+"\n";s+="  totalEpisodes="+w.total+"\n";s+="  currentEpisode="+w.read+"\n";s+="  newer="+newer+"\n";s+="  unread="+unread+"\n";s+="  unclassified="+w.unc+"\n";s+="  visibleByFolder="+visible+"\n";s+="  FINAL_🆙="+update+"\n\n"});s+="【結論】\nN6106LC / N1028JP は、この条件なら🆙表示対象。\nここで本体が0になるなら、buildUpdateView内の実コードに別条件がある可能性があります。";document.getElementById("out").textContent=s}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(document.getElementById("out").textContent);alert("コピーしました")};run();</script></html>
