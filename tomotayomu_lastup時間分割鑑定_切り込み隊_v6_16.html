<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ lastup 時間分割鑑定 v6.16</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.5}
button{display:block;width:100%;padding:13px;margin:8px 0;font-size:16px}
pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:10px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h2>ともたよむ lastup 時間分割鑑定 v6.16</h2>
<p class="small">
目的：lastup期間の検索結果がst上限2000件を超える場合、
期間を自動で半分に分割し、各区間のallcountを2000以下にできるか確認する。
今回は本棚照合は行わず、時間分割→全件取得だけを鑑定する。
</p>

<button onclick="run('normal')">🔎 通常API 時間分割テスト</button>
<button onclick="run('r18')">🔞 R18 API 時間分割テスト</button>
<button onclick="run('both')">🚀 通常＋R18 時間分割テスト</button>
<button onclick="copyLog()">📋 ししょー用に結果をコピー</button>
<button onclick="clearLog()">🗑 ログ消去</button>

<pre id="log"></pre>

<script>
const APIS={
  normal:"https://api.syosetu.com/novelapi/api/",
  r18:"https://api.syosetu.com/novel18api/api/"
};
const OF="n-gl-ga";
const LIM=500;
const MAX_ST=2000;
const TIMEOUT=30000;

// 2026/09/25 00:00 JST → ページを開いた時点
const START_UNIX=1790262000;
const END_UNIX=Math.floor(Date.now()/1000);

function now(){return new Date().toLocaleTimeString("ja-JP",{hour12:false})}
function log(x){document.getElementById("log").textContent+=now()+" "+x+"\n"}
function clearLog(){document.getElementById("log").textContent=""}

async function request(api,start,end,st=1){
  const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const p=new URLSearchParams({
    lastup:start+"-"+end,
    of:OF,
    lim:String(LIM),
    st:String(st),
    out:"jsonp",
    callback:cb
  });
  const started=performance.now();

  return await new Promise(resolve=>{
    let done=false;
    const sc=document.createElement("script");
    const timer=setTimeout(()=>finish({
      ok:false,error:"timeout",
      ms:Math.round(performance.now()-started)
    }),TIMEOUT);

    function finish(v){
      if(done)return;
      done=true;
      clearTimeout(timer);
      delete window[cb];
      sc.remove();
      resolve(v);
    }

    window[cb]=data=>finish({
      ok:true,data,
      ms:Math.round(performance.now()-started)
    });
    sc.onerror=()=>finish({
      ok:false,error:"script error",
      ms:Math.round(performance.now()-started)
    });
    sc.src=api+"?"+p.toString();
    document.body.appendChild(sc);
  });
}

async function getAllInRange(api,label,start,end,depth){
  const r=await request(api,start,end,1);

  if(!r.ok){
    log("❌ "+label+" timeout/error depth="+depth+
        " / "+r.error+" / "+r.ms+" ms");
    return null;
  }

  const rows1=Array.isArray(r.data)?
    r.data.filter(x=>x&&x.ncode):[];
  const allcount=Number(r.data[0]?.allcount||0);

  log("区間 depth="+depth+
      " allcount="+allcount+
      " first="+new Date(start*1000).toLocaleString("ja-JP")+
      " ～ "+new Date(end*1000).toLocaleString("ja-JP"));

  // 2000件以下ならstで全取得
  if(allcount<=2000){
    const all=[...rows1];
    let st=1+rows1.length;

    while(all.length<allcount){
      const p=await request(api,start,end,st);
      if(!p.ok){
        log("❌ st="+st+" ERROR: "+p.error+" / "+p.ms+" ms");
        return null;
      }
      const rows=Array.isArray(p.data)?
        p.data.filter(x=>x&&x.ncode):[];
      all.push(...rows);
      log("  st="+st+" rows="+rows.length+" / "+p.ms+" ms");
      if(rows.length===0)break;
      st+=rows.length;
    }

    return {rows:all,leaf:true,allcount};
  }

  // 2000件を超えたら時間を半分に分割
  if(end-start<=60){
    log("❌ 1分未満まで細分化しても2000件超");
    return null;
  }

  const mid=Math.floor((start+end)/2);
  log("  ↳ 2000件超のため時間分割");

  const left=await getAllInRange(api,label,start,mid,depth+1);
  if(!left)return null;

  const right=await getAllInRange(api,label,mid+1,end,depth+1);
  if(!right)return null;

  return {
    rows:left.rows.concat(right.rows),
    leaf:false,
    allcount:left.allcount+right.allcount
  };
}

async function run(kind){
  clearLog();
  log("【時間分割テスト開始】");
  log("基準: 2026/09/25 00:00 JST");
  log("START_UNIX="+START_UNIX);
  log("END_UNIX="+END_UNIX);

  const kinds=kind==="both"?["normal","r18"]:[kind];

  for(const k of kinds){
    log("【"+k+" 開始】");
    const r=await getAllInRange(APIS[k],k,START_UNIX,END_UNIX,0);

    if(!r){
      log("【"+k+" テスト中断】");
      return;
    }

    const map=new Map();
    for(const x of r.rows)
      map.set(String(x.ncode).toUpperCase(),x);

    log("【"+k+" 完了】");
    log("取得総行数: "+r.rows.length);
    log("ユニークNコード: "+map.size);
    log("重複: "+(r.rows.length-map.size));
    log("区間allcount合計: "+r.allcount);
  }

  log("【テスト完了】");
}

async function copyLog(){
  try{
    await navigator.clipboard.writeText(
      document.getElementById("log").textContent
    );
    alert("コピーしました");
  }catch(e){
    alert("コピー失敗: "+e);
  }
}
</script>
</body>
</html>
