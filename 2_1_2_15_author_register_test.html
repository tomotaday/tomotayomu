<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ v2.1.2.15｜作者登録実験</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:16px;line-height:1.5}h1{font-size:20px}.box{background:#f5f5f5;border-radius:10px;padding:12px;margin:10px 0}button{font-size:16px;padding:10px 14px;border:0;border-radius:8px;margin:4px 4px 4px 0}pre{white-space:pre-wrap;word-break:break-all}</style></head><body><h1>ともたよむ v2.1.2.15</h1><div class="box"><b>作者登録 → 作者作品取得 → 本棚作品へ自動吸収</b></div><div id="result"><pre>処理開始中…</pre></div><button onclick="copyResult()">診断結果をコピー</button><script>
const MASTER_KEY="tomotaYomu_v214_works_master",AUTHOR_KEY="tomotaYomu_v215_author_registry";let resultText="";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function show(a){resultText=a.join("\n");document.getElementById("result").innerHTML="<pre>"+esc(resultText)+"</pre>"}
function xidFrom(url){const m=String(url).match(/xmypage\.syosetu\.com\/(x[a-z0-9]+)\/?/i);return m?m[1].toUpperCase():""}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="tyCb_"+Date.now();const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("JSONP timeout"))},20000);function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error("JSONP load error"))};s.src=url+"&callback="+cb;document.body.appendChild(s)})}
async function run(){
 const authorUrl=new URLSearchParams(location.search).get("authorurl")||"",xid=xidFrom(authorUrl),lines=["【ともたよむ v2.1.2.15｜作者登録実験】","受信作者URL="+(authorUrl||"なし"),"抽出XID="+(xid||"抽出できず")];
 if(!xid){show(lines);return}
 let reg={};try{reg=JSON.parse(localStorage.getItem(AUTHOR_KEY)||"{}")}catch(e){}
 const before=Object.keys(reg).length;
 reg[xid]={xid:xid,authorUrl:authorUrl,registeredAt:new Date().toISOString()};
 localStorage.setItem(AUTHOR_KEY,JSON.stringify(reg));
 lines.push("作者図鑑仮登録=成功");
 lines.push("登録作者数="+Object.keys(reg).length+"人（登録前"+before+"人）");
 const api="https://api.syosetu.com/novel18api/api/?out=jsonp&of=n-t-w-gl-ga-nt-e&xid="+encodeURIComponent(xid)+"&lim=500";
 try{
  const data=await jsonp(api),works=Array.isArray(data)?data.filter((x,i)=>i>0&&x.ncode):[];
  let master={};try{master=JSON.parse(localStorage.getItem(MASTER_KEY)||"{}")}catch(e){}
  const hits=works.filter(w=>master[String(w.ncode||"").toUpperCase()]);
  lines.push("作者作品取得="+works.length+"作品");
  lines.push("本棚マスター自動吸収候補="+hits.length+"作品");
  lines.push("本棚外="+(works.length-hits.length)+"作品");
  lines.push("","");
  lines.push("【この作者に紐づく本棚作品】");
  hits.forEach((w,i)=>lines.push((i+1)+" "+String(w.ncode).toUpperCase()+"｜"+(w.title||"")));
  lines.push("","","※今回は「仮登録」だけ。既存の本棚データ自体は変更していません。");
 }catch(e){lines.push("作者作品取得失敗="+e.message,"API="+api)}
 show(lines);
}
async function copyResult(){try{await navigator.clipboard.writeText(resultText);alert("診断結果をコピーしました")}catch(e){alert("コピーできませんでした")}}
run();
</script></body></html>
