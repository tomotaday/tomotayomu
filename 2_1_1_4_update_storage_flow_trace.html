<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新保存経路診断</title><style>body{font-family:-apple-system,sans-serif;padding:16px;background:#f7f4ef;color:#222}button{padding:11px 14px;margin:5px 0}pre{white-space:pre-wrap;background:#fff;padding:12px;border-radius:10px;border:1px solid #bbb;line-height:1.5}</style><h2>🧪 更新保存経路診断</h2><p>3作品を更新候補・最新情報へ保存し、保存後の内容を確認します。</p><button id="run">▶ 保存テスト</button><button id="clear">🗑 この診断データを消す</button><button id="copy">📋 結果をコピー</button><pre id="out">まだ実行していません。</pre><script>const CKEY="tomotaYomu_v214_trace_candidates";const LKEY="tomotaYomu_v214_trace_latest";const WORKS=[{ncode:"N7998LI",lastup:"2026-09-26 11:05:07",all_no:52,end:1},{ncode:"N6106LC",lastup:"2026-09-25 19:50:00",all_no:58,end:1},{ncode:"N1028JP",lastup:"2026-09-25 12:00:00",all_no:84,end:1}];function load(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function run(){const c=load(CKEY,{}),l=load(LKEY,{});WORKS.forEach(w=>{c[w.ncode]=w.lastup;l[w.ncode]=w});save(CKEY,c);save(LKEY,l);let s="【保存直後】\n";WORKS.forEach(w=>s+=w.ncode+"\n  更新候補="+(c[w.ncode]||"なし")+"\n  最新情報="+(l[w.ncode]?"保存あり":"なし")+"\n");s+="\n【localStorage確認】\n候補件数="+Object.keys(c).length+"\n最新情報件数="+Object.keys(l).length+"\n\n※このページを一度閉じて再度開き、下の「保存テスト」を押さずにページを開いた状態でもlocalStorageが残ることを確認できます。";document.getElementById("out").textContent=s}function show(){const c=load(CKEY,{}),l=load(LKEY,{});let s="【現在保存されている診断データ】\n候補件数="+Object.keys(c).length+"\n最新情報件数="+Object.keys(l).length+"\n\n";WORKS.forEach(w=>s+=w.ncode+"：候補="+(c[w.ncode]||"なし")+"｜最新="+(l[w.ncode]?"あり":"なし")+"\n");document.getElementById("out").textContent=s}document.getElementById("run").onclick=run;document.getElementById("clear").onclick=()=>{localStorage.removeItem(CKEY);localStorage.removeItem(LKEY);show()};document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(document.getElementById("out").textContent);alert("コピーしました")};show();</script></html>
