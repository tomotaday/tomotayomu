<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜ncode方式 vs lastup方式 比較診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:16px;line-height:1.5}
h1{font-size:20px}
button{font-size:16px;padding:10px 14px;margin:6px 0;border-radius:10px}
.box{background:#f5f5f5;padding:12px;border-radius:10px;margin:10px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<h1>🔎 ncode方式 vs lastup方式 比較診断</h1>

<div class="box">
<p><b>対象：N6117JH</b></p>
<p class="small">
① ncode直接指定 → 作品を取得できるか<br>
② lastup期間検索 → 同じN6117JHを捕捉できるか
</p>
<p class="small">※ 本棚2117作品・基準日・読書位置・GAS・更新判定は使いません。</p>
</div>

<button id="copyAll">📋 テスト結果をまとめてコピー</button>
<button id="run">▶ 比較テスト開始</button>
<pre id="log">【待機中】</pre>

<script>
const API="https://api.syosetu.com/novel18api/api/";
const TARGET="N6117JH";

function log(s){
  document.getElementById("log").textContent += s + "\\n";
}

function jsonp(url, timeout=30000){
  return new Promise((resolve,reject)=>{
    const cb=(url.match(/callback=([^&]+)/)||[])[1];
    const script=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>{
      if(done)return;
      done=true; cleanup();
      reject(new Error("timeout"));
    },timeout);

    window[cb]=data=>{
      if(done)return;
      done=true; clearTimeout(timer); cleanup();
      resolve(data);
    };

    function cleanup(){
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
    }

    script.onerror=()=>{
      if(done)return;
      done=true; clearTimeout(timer); cleanup();
      reject(new Error("script error"));
    };

    script.src=url;
    document.body.appendChild(script);
  });
}

function unix(y,m,d,h,min,s){
  return Math.floor(new Date(y,m-1,d,h,min,s).getTime()/1000);
}

async function run(){
  const out=document.getElementById("log");
  out.textContent="";
  log("【開始】N6117JH 取得方式比較");
  log("API: "+API);
  log("");

  // ① ncode直接指定
  log("① ncode直接指定");
  try{
    const cb="tomotaNcode_"+Date.now();
    const url=API+
      "?ncode="+encodeURIComponent(TARGET)+
      "&out=jsonp&callback="+cb;
    const data=await jsonp(url);
    const rows=Array.isArray(data)?data.slice(1):[];
    log("allcount = "+(data?.[0]?.allcount ?? "—"));
    log("取得行数 = "+rows.length);
    log("N6117JH = "+(rows.some(x=>String(x.ncode).toUpperCase()===TARGET)?"捕捉成功":"なし"));
    if(rows[0]) log("取得データ = "+JSON.stringify(rows[0],null,2));
  }catch(e){
    log("❌ ncode方式 ERROR: "+e.message);
  }

  log("");
  log("────────────────");
  log("");

  // ② lastup期間検索
  // N6117JH の既知 general_lastup: 2024-08-22 20:12:04
  // 十分広く、その日を含む期間を指定
  log("② lastup期間検索");
  log("期間：2024/08/22 00:00 ～ 2024/08/23 23:59");
  try{
    const start=unix(2024,8,22,0,0,0);
    const end=unix(2024,8,23,23,59,59);
    const cb="tomotaLastup_"+Date.now();
    const url=API+
      "?lastup="+start+"-"+end+
      "&of=n-gl-ga&lim=500"+
      "&out=jsonp&callback="+cb;
    const data=await jsonp(url);
    const rows=Array.isArray(data)?data.slice(1):[];
    const hit=rows.filter(x=>String(x.ncode).toUpperCase()===TARGET);

    log("allcount = "+(data?.[0]?.allcount ?? "—"));
    log("取得行数 = "+rows.length);
    log("N6117JH = "+(hit.length?"捕捉成功":"なし"));

    if(hit.length) log("捕捉データ = "+JSON.stringify(hit[0],null,2));
  }catch(e){
    log("❌ lastup方式 ERROR: "+e.message);
  }

  log("");
  log("────────────────");
  log("【比較テスト完了】");
}

document.getElementById("run").addEventListener("click",run);
function buildCopyText(){
  const logEl=document.getElementById("log");
  const visible=logEl ? logEl.textContent.trim() : "";
  return [
    "【ともたよむ API取得方法 比較テスト】",
    "",
    "対象作品：N6117JH",
    "",
    "■ テスト内容",
    "① ncode直接指定",
    "② lastup期間検索",
    "",
    "■ テスト結果",
    visible || "（結果なし）",
    "",
    "■ 画面上の判定",
    "上記ログをそのまま記録"
  ].join("\n");
}

document.getElementById("copyAll").addEventListener("click",async()=>{
  const text=buildCopyText();
  try{
    await navigator.clipboard.writeText(text);
    const btn=document.getElementById("copyAll");
    const old=btn.textContent;
    btn.textContent="✅ コピーしました";
    setTimeout(()=>btn.textContent=old,1500);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand("copy");
      const btn=document.getElementById("copyAll");
      const old=btn.textContent;
      btn.textContent="✅ コピーしました";
      setTimeout(()=>btn.textContent=old,1500);
    }catch(err){
      alert("コピーできませんでした。結果欄を長押ししてコピーしてください。");
    }finally{
      ta.remove();
    }
  }
});

</script>
</body>
</html>
