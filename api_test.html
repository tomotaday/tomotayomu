<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜API取得テスト v4</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:24px 16px 48px}h1{font-size:25px;margin:0 0 6px}.note{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
label{display:block;font-weight:700;margin:8px 0 4px}input,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}input{width:100%}button{font-weight:700;margin-top:10px;width:100%;background:#eee8dd}
.status{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}.result{border-top:1px solid #ddd5ca;margin-top:14px;padding-top:12px}.row{margin:9px 0}.key{font-size:12px;color:var(--muted)}.value{overflow-wrap:anywhere}.error{color:#9b3d32;font-weight:700}.ok{color:#276749;font-weight:700}
</style>
</head>
<body>
<main>
<p><a href="index.html">← ともたよむ本棚へ戻る</a></p>
<h1>🔎 なろうAPI取得テスト v4</h1>
<div class="note">v4：noveltype（短編・連載区分）とend（完結状態）を組み合わせて表示します。取得確認のみで、本棚・IndexedDBへの保存は行いません。</div>
<section class="card">
<label for="ncode">Nコード</label>
<input id="ncode" autocomplete="off" placeholder="例：N9622MV">
<button id="fetchBtn" type="button">APIから作品情報を取得</button>
<div id="status" class="status" aria-live="polite" style="margin-top:12px">Nコードを入力してください。</div>
<div id="result" class="result" hidden></div>
</section>
<p class="muted">通常作品APIのみを使用します。検索除外作品の手動登録や本棚への保存は行いません。</p>
</main>
<script>
const API_URL="https://api.syosetu.com/novelapi/api/";
const $=id=>document.getElementById(id);
function normalizeNcode(raw){const m=String(raw||"").trim().match(/N[0-9]{1,}[A-Z]{1,5}/i);return m?m[0].toUpperCase():"";}
function setStatus(text,cls=""){ $("status").className="status "+cls; $("status").textContent=text; }
function jsonp(url){return new Promise((resolve,reject)=>{
 const cb="tomotaApiTestV2_"+Date.now()+"_"+Math.random().toString(36).slice(2);
 const script=document.createElement("script");let done=false;
 const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}script.remove();};
 const timer=setTimeout(()=>{cleanup();reject(new Error("APIの応答がタイムアウトしました。時間をおいて再試行してください。"));},20000);
 window[cb]=data=>{cleanup();resolve(data);};
 script.onerror=()=>{cleanup();reject(new Error("APIへの接続に失敗しました。通信状態を確認してください。"));};
 script.src=url+"&callback="+cb;document.body.appendChild(script);
});}
function showWork(w){
 const fields=[["Nコード",w.ncode],["作品タイトル",w.title],["作者名",w.writer],["あらすじ",w.story],["作品区分（API生値）",w.noveltype],["作品状態（API判定）",Number(w.noveltype)===2?"短編":Number(w.end)===1?"連載中":Number(w.end)===0?"完結":"不明"],["API生値：end",w.end],["エピソード数",w.general_all_no],["初回掲載日時",w.general_firstup],["最新掲載日時",w.general_lastup],["文字数",w.length==null?null:Number(w.length).toLocaleString("ja-JP")+" 字"],["ジャンルコード",w.genre],["大ジャンルコード",w.biggenre]];
 const box=$("result");box.replaceChildren();box.hidden=false;
 for(const [label,value] of fields){const row=document.createElement("div");row.className="row";const k=document.createElement("div");k.className="key";k.textContent=label;const v=document.createElement("div");v.className="value";v.textContent=value==null||value===""?"（取得データなし）":String(value);row.append(k,v);box.append(row);}
}
async function run(){
 const ncode=normalizeNcode($("ncode").value);
 $("result").hidden=true;
 if(!ncode){setStatus("Nコードを確認してください。例：N9622MV","error");return;}
 $("ncode").value=ncode;$("fetchBtn").disabled=true;setStatus(ncode+" の作品情報を取得しています…");
 try{
  // l=文字数、g=ジャンル、bg=大ジャンル。従来項目も維持する。
  const fields="n-t-s-w-gf-gl-ga-nt-e-u-l-g-bg";
  const url=API_URL+"?out=jsonp&of="+fields+"&ncode="+encodeURIComponent(ncode)+"&lim=1";
  const data=await jsonp(url);
  const work=Array.isArray(data)?data.find(x=>x&&x.ncode):null;
  if(!work){setStatus("作品情報を取得できませんでした（APIの検索結果が0件）。Nコード、または検索除外作品ではないかを確認してください。","error");return;}
  setStatus("API取得成功。今回は表示確認のみで、本棚には保存していません。","ok");showWork(work);
 }catch(e){setStatus("作品情報を取得できませんでした。\n"+e.message,"error");}
 finally{$("fetchBtn").disabled=false;}
}
$("fetchBtn").addEventListener("click",run);
const params=new URLSearchParams(location.search);const incoming=normalizeNcode(params.get("ncode")||params.get("code")||"");
if(incoming){$("ncode").value=incoming;run();}
</script>
</body>
</html>
