<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜R18作者かな照合テスト</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;padding:16px;line-height:1.45;background:#fafafa;color:#222}
h1{font-size:20px;margin:0 0 4px}.version{font-size:12px;color:#888;margin-bottom:12px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;margin:10px 0}
button{padding:10px 13px;border:0;border-radius:9px;background:#eee;font-size:14px}
.result{border-top:1px solid #eee;padding:10px 0}.ok{color:#187a37}.warn{color:#a65d00}.muted{color:#777}
</style>
</head>
<body>
<h1>ともたよむ｜R18作者かな照合テスト</h1>
<div class="version">v0.1.0｜検証専用・既存データ非変更</div>
<div class="card">
<div id="status">IndexedDB接続中…</div>
<p class="muted">R18作者名を通常の「なろうユーザ検索API」の word 検索にかけ、同名候補が存在するかだけを調べます。これは本人一致の確定判定ではありません。</p>
<button id="run" disabled>▶ まず10人だけ照合</button>
</div>
<div class="card"><b>結果</b><div id="result"></div></div>
<script>
const DB_NAME="tomotaYomuDB",DB_VERSION=1;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readAll(db,name){return new Promise((resolve,reject)=>{const tx=db.transaction(name,"readonly"),st=tx.objectStore(name),r=st.getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function jsonp(url,timeout=20000){return new Promise((resolve,reject)=>{const cb="tyR18Kana_"+Date.now()+"_"+Math.random().toString(36).slice(2);const s=document.createElement("script");let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()};const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"))},timeout);window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error("load error"))};s.src=url+"&callback="+cb;document.body.appendChild(s)})}
function uniqById(rows){const m=new Map();for(const r of rows){const id=String(r.authorId||"").trim();if(id&&!m.has(id))m.set(id,r)}return [...m.values()]}
async function searchName(name){const url="https://api.syosetu.com/userapi/api/?out=jsonp&of=u-n-y-1&word="+encodeURIComponent(name)+"&lim=20";const d=await jsonp(url);return Array.isArray(d)?d.filter((x,i)=>i>0&&x&&x.userid):[]}
let targets=[];
async function load(){try{const db=await openDB();const a=uniqById((await readAll(db,"authors")).filter(x=>x&&String(x.authorType||"").toLowerCase()==="r18"||String(x.authorId||"").toUpperCase().startsWith("X"));targets=a.slice(0,10);document.getElementById("status").textContent="R18作者を"+a.length+"人確認。先頭10人を照合できます。";document.getElementById("run").disabled=false}catch(e){document.getElementById("status").textContent="エラー："+e.message}}
async function run(){const b=document.getElementById("run");b.disabled=true;let html="";for(const a of targets){const name=String(a.authorName||a.writer||"").trim();if(!name)continue;try{const rows=await searchName(name);html+='<div class="result"><b>'+esc(name)+'</b> <span class="muted">（'+esc(a.authorId||"")+'）</span><br><span class="'+(rows.length?"warn":"ok")+'">候補 '+rows.length+'件</span>';if(rows.length)html+="<br>"+rows.map(x=>esc(x.name||"")+"｜"+esc(x.yomikata||"")+"｜ID "+esc(x.userid||"")).join("<br>");html+="</div>"}catch(e){html+='<div class="result"><b>'+esc(name)+'</b><br><span class="warn">ERROR '+esc(e.message)+'</span></div>'}}document.getElementById("result").innerHTML=html;b.disabled=false}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
document.getElementById("run").addEventListener("click",run);load();
</script>
</body></html>
