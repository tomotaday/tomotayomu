<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ 短編検証 N1177MV</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:20px;line-height:1.6;background:#fafafa;color:#222}
main{max-width:720px;margin:auto}.box{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:20px}.big{font-size:22px;font-weight:700}.ok{font-weight:700}
a{word-break:break-all}button{font-size:16px;padding:10px 14px;border:0;border-radius:10px;background:#eee}
pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><main>
<h1>ともたよむ｜短編検証</h1>
<div class="box"><div>検証Nコード</div><div class="big">N1177MV</div></div>
<div id="result" class="box">APIから取得中……</div>
<div class="box"><button id="copy">結果をコピー</button></div>
<script>
const N="N1177MV", API="https://api.syosetu.com/novelapi/api/";
function jsonp(url){
 return new Promise((resolve,reject)=>{
  const cb="jsonp_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const s=document.createElement("script");
  const timer=setTimeout(()=>{cleanup();reject(new Error("APIタイムアウト"));},10000);
  function cleanup(){clearTimeout(timer);s.remove();delete window[cb];}
  window[cb]=d=>{cleanup();resolve(d)};
  s.onerror=()=>{cleanup();reject(new Error("API取得エラー"))};
  s.src=url+"&callback="+cb;
  document.body.appendChild(s);
 });
}
function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function run(){
 const url=API+"?ncode="+N+"&of=n-t-novel_type-ga&lim=1";
 jsonp(url).then(d=>{
  const w=Array.isArray(d)?d[1]:null;
  if(!w) throw new Error("作品情報が取得できませんでした");
  const type=String(w.novel_type??"");
  const total=Number(w.general_all_no??0);
  const short=type==="2";
  const top="https://ncode.syosetu.com/"+N.toLowerCase()+"/";
  const p0=top, p1=short?top:top+"1/";
  document.getElementById("result").innerHTML=
   "<div class='big'>"+(short?"🟣 短編":"📚 連載作品")+"</div>"+
   "<p>novel_type："+esc(type)+"<br>全話数："+esc(total)+"</p>"+
   "<hr><b>ともたよむ想定リンク</b>"+
   "<p>0/1："+(short?"作品トップ":"作品トップ")+"<br><a href='"+esc(p0)+"' target='_blank'>"+esc(p0)+"</a></p>"+
   "<p>1/1："+(short?"作品トップ":"1話")+"<br><a href='"+esc(p1)+"' target='_blank'>"+esc(p1)+"</a></p>"+
   "<p class='ok'>"+(short?"短編なので、0/1・1/1とも作品トップへ飛ばす設定でOK。":"短編ではありません。通常の連載作品として扱います。")+"</p>";
 }).catch(e=>{document.getElementById("result").textContent="取得失敗："+e.message;});
}
document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("result").innerText).then(()=>alert("コピーしました"));
run();
</script></main></body></html>
