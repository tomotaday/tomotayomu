<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜Nコード一覧の安全な出力</title>
<style>
:root{color-scheme:light;--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.55}
main{width:min(100%,720px);margin:auto;padding:20px 14px 40px}h1{font-size:21px;margin:0 0 8px}
p{font-size:14px}.note{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px}
button{font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:10px 12px;color:var(--ink);width:100%;margin:6px 0}
#status{font-size:14px;margin:12px 0;font-weight:600}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.num{font-size:22px;font-weight:800}.label{font-size:11px;color:var(--muted)}
textarea{width:100%;min-height:240px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:13px ui-monospace,monospace}
small{color:var(--muted)}a{color:inherit}
</style>
</head>
<body>
<main>
<h1>📚 ともたよむ｜Nコード一覧の出力</h1>
<p>現在の本棚を調査するため、IndexedDBの作品一覧からNコードだけを読み出します。</p>
<div class="note"><strong>安全設計：</strong>読み取り専用です。本棚・棚配置・読書位置・作者情報への書き込み、更新判定、Atom処理は行いません。このページは、ともたよむと同じGitHub PagesのURL配下で開いてください。</div>
<button id="readBtn">① 本棚からNコードを読み込む</button>
<div id="status" role="status">まだ読み込んでいません。</div>
<div class="stats">
<div class="stat"><div class="num" id="total">—</div><div class="label">作品レコード</div></div>
<div class="stat"><div class="num" id="unique">—</div><div class="label">Nコード（重複除外）</div></div>
<div class="stat"><div class="num" id="missing">—</div><div class="label">Nコードなし</div></div>
</div>
<button id="copyBtn" disabled>② Nコード一覧をコピー</button>
<button id="downloadBtn" disabled>③ Nコード一覧をTXT保存</button>
<label for="output"><strong>出力内容（1行に1コード）</strong></label>
<textarea id="output" readonly placeholder="読み込み後、ここにNコード一覧が表示されます。"></textarea>
<p><small>照合には、この一覧をししょーに渡してください。Nコードのみを出力し、作品名や読書位置などの情報は出力しません。</small></p>
</main>
<script>
const $=id=>document.getElementById(id);
let outputText="";
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("tomotaYomuDB",1);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("本棚データベースを開けません"));
    req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error("本棚DBが存在しないため、空のDBは作成しませんでした。ともたよむ本体を先に開いてください。"));};
  });
}
function readAll(db,storeName){
  return new Promise((resolve,reject)=>{
    if(!db.objectStoreNames.contains(storeName)){reject(new Error("保存領域 "+storeName+" が見つかりません"));return;}
    const rows=[],req=db.transaction(storeName,"readonly").objectStore(storeName).openCursor();
    req.onsuccess=()=>{const cursor=req.result;if(cursor){rows.push(cursor.value);cursor.continue()}else resolve(rows)};
    req.onerror=()=>reject(req.error||new Error(storeName+"の読み込みに失敗しました"));
  });
}
$("readBtn").addEventListener("click",async()=>{
  const btn=$("readBtn");btn.disabled=true;$("status").textContent="読み取り専用で本棚を確認中…";
  try{
    const db=await openDB();
    let rows;
    try{rows=await readAll(db,"works_cache")}finally{db.close()}
    const codes=rows.map(row=>String(row?.ncode||"").trim().toUpperCase()).filter(Boolean);
    const uniqueCodes=[...new Set(codes)].sort((a,b)=>a.localeCompare(b));
    const missing=rows.length-codes.length,duplicates=codes.length-uniqueCodes.length;
    outputText=uniqueCodes.join("\n");
    $("total").textContent=rows.length.toLocaleString("ja-JP");
    $("unique").textContent=uniqueCodes.length.toLocaleString("ja-JP");
    $("missing").textContent=missing.toLocaleString("ja-JP");
    $("output").value=outputText;
    $("copyBtn").disabled=!outputText;$("downloadBtn").disabled=!outputText;
    $("status").textContent="読み込み完了。重複Nコード："+duplicates.toLocaleString("ja-JP")+"件。データベースは読み取り専用で開きました。";
  }catch(e){
    $("status").textContent="読み込み失敗："+(e?.message||String(e))+"。ともたよむ本体と同じGitHub PagesのURL配下で開いているか確認してください。";
  }finally{btn.disabled=false}
});
$("copyBtn").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(outputText);$("status").textContent="Nコード一覧をクリップボードにコピーしました。"}
  catch(e){$("output").focus();$("output").select();$("status").textContent="自動コピーできませんでした。選択された一覧を手動でコピーしてください。"}
});
$("downloadBtn").addEventListener("click",()=>{
  const blob=new Blob([outputText+"\n"],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="tomotayomu-ncodes.txt";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
});
</script>
</body>
</html>
