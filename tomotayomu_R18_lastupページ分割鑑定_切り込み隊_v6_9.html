<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ lastup ページ分割鑑定 切り込み隊 v6.9</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.5}
button{font-size:16px;padding:10px 12px;margin:4px 0;border-radius:10px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<h1>🔎 lastup ページ分割鑑定 v6.9</h1>
<p>R18 APIの <code>lastup + st + lim</code> で、複数ページを安全につなげられるか確認する。</p>

<p class="small">
今回の対象期間は「直近48時間」。
前回のv6.8で allcount=1252 が確認できたため、
st=1 / 501 / 1001 / 1251 を順番に取得する。
</p>

<button id="run">▶ ページ分割テスト開始</button>
<button id="copy">📋 結果をコピー</button>
<button id="clear">🗑 結果クリア</button>
<pre id="log">【待機中】</pre>

<script>
const API="https://api.syosetu.com/novel18api/api/";
const LIM=500;
const starts=[1,501,1001,1251];
let logs=[];

function add(x){
  logs.push(new Date().toLocaleTimeString()+" "+x);
  document.getElementById("log").textContent=logs.join("\\n");
}

function apiUrl(st){
  const end=Math.floor(Date.now()/1000);
  const start=end-48*60*60;
  const cb="tomotaYomuPageTest_"+st+"_"+Date.now();
  return API+"?lastup="+start+"-"+end+
    "&of=n-gl-ga&lim="+LIM+"&st="+st+
    "&out=jsonp&callback="+cb;
}

function jsonp(url, timeout=30000){
  return new Promise((resolve,reject)=>{
    const cb=(url.match(/callback=([^&]+)/)||[])[1];
    const script=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>{
      if(done)return;
      done=true;
      cleanup();
      reject(new Error("timeout"));
    },timeout);

    window[cb]=data=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    function cleanup(){
      delete window[cb];
      script.remove();
    }

    script.src=url;
    script.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      reject(new Error("script error"));
    };
    document.body.appendChild(script);
  });
}

async function run(){
  logs=[];
  add("【開始】R18 / 直近48時間 / stページ分割");
  add("API: "+API);
  add("条件: of=n-gl-ga / lim=500 / JSONP");
  add("st="+starts.join(","));

  const all=[];
  for(const st of starts){
    const t=performance.now();
    const url=apiUrl(st);
    add("【取得開始】st="+st);
    try{
      const data=await jsonp(url);
      const ms=Math.round(performance.now()-t);
      const rows=Array.isArray(data)?data.slice(1):[];
      add("✅ st="+st+" SUCCESS / "+ms+" ms / allcount="+data[0].allcount+" / rows="+rows.length);
      if(rows.length){
        add("  先頭: "+rows[0].ncode+" / "+rows[0].general_lastup);
        add("  末尾: "+rows[rows.length-1].ncode+" / "+rows[rows.length-1].general_lastup);
      }
      all.push(...rows);
    }catch(e){
      add("❌ st="+st+" ERROR: "+e.message);
      break;
    }
  }

  const codes=all.map(x=>x.ncode);
  const unique=[...new Set(codes)];
  const dup=all.length-unique.length;

  add("────────────");
  add("【テスト完了】");
  add("取得総行数: "+all.length);
  add("Nコードユニーク数: "+unique.length);
  add("重複数: "+dup);
  add("期待件数: 1252（v6.8で確認）");
  add("※48時間の結果件数は変動するため、期待件数との差は時刻差による可能性あり。");
  add("判定: stページを連結して取得できるかを確認するテストは完了。");
}

document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
  try{
    await navigator.clipboard.writeText(logs.join("\n"));
    add("📋 コピー完了");
  }catch(e){add("❌ コピー失敗: "+e.message);}
};
document.getElementById("clear").onclick=()=>{
  logs=[];
  document.getElementById("log").textContent="【待機中】";
};
</script>
</body>
</html>
