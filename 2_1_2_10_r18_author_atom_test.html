<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ｜v2.1.2.10 R18作者Atom実験</title><style>body{font-family:-apple-system,sans-serif;margin:16px;line-height:1.55}input,button{font-size:16px;padding:10px;margin:4px 0}button{width:100%}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px}</style></head><body><h2>ともたよむ v2.1.2.10</h2><h3>R18作者XID → X活動報告Atom実験</h3><p>XIDからX活動報告Atomを直接取得できるか確認します。</p><input id="xid" value="X8754CQ"><button onclick="run()">Atomを取得</button><button onclick="copyResult()">診断結果をコピー</button><pre id="out">待機中</pre><script>let last="";async function run(){const xid=(document.getElementById("xid").value||"").trim().toUpperCase();const url="https://api.syosetu.com/writerblog/"+encodeURIComponent(xid)+".Atom";out("取得中…\n"+url);try{const r=await fetch(url,{cache:"no-store"});const text=await r.text();last="【ともたよむ v2.1.2.10｜R18作者Atom実験】\nXID="+xid+"\nHTTP="+r.status+" "+r.statusText+"\n取得文字数="+text.length+"\nURL="+url+"\n\n"+text.slice(0,5000);out(last)}catch(e){last="【ともたよむ v2.1.2.10｜R18作者Atom実験】\nXID="+xid+"\n取得失敗\nエラー="+e.message+"\nURL="+url;out(last)}}function out(s){document.getElementById("out").textContent=s}async function copyResult(){if(!last)return;try{await navigator.clipboard.writeText(last);alert("診断結果をコピーしました")}catch(e){alert("コピーできませんでした")}}</script></body></html>
