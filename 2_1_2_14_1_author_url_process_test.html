<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ v2.1.2.14.1｜作者URL加工実験</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:16px;line-height:1.5}h1{font-size:20px}.box{background:#f5f5f5;border-radius:10px;padding:12px;margin:10px 0}button{font-size:16px;padding:10px 14px;border:0;border-radius:8px;margin:4px 4px 4px 0}pre{white-space:pre-wrap;word-break:break-all}</style></head><body><h1>ともたよむ v2.1.2.14.1</h1><div class="box"><b>作者URL受信 → XID抽出 → R18作者API → 本棚マスター照合</b></div><div id="result"><pre>処理開始中…</pre></div><button onclick="copyResult()">診断結果をコピー</button><script>
const MASTER_KEY="tomotaYomu_v214_works_master";let resultText="";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function show(lines){resultText=lines.join("\n");document.getElementById("result").innerHTML="<pre>"+esc(resultText)+"</pre>"}
function getAuthorUrl(){return new URLSearchParams(location.search).get("authorurl")||""}
function getXid(url){const m=String(url).match(/xmypage\.syosetu\.com\/(x[a-z0-9]+)\/?/i);return m?m[1].toUpperCase():""}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="tomotaYomuCb_"+Date.now();const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("JSONP timeout"))},20000);function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error("JSONP load error"))};s.src=url+"&callback="+cb;document.body.appendChild(s)})}
async function run(){
 const authorUrl=getAuthorUrl(),xid=getXid(authorUrl),lines=["【ともたよむ v2.1.2.14.1｜作者URL加工実験】","受信作者URL="+(authorUrl||"なし"),"抽出XID="+(xid||"抽出できず")];
 show(lines);
 if(!xid)return;
 const api="https://api.syosetu.com/novel18api/api/?out=jsonp&of=n-t-w-gl-ga-nt-e&xid="+encodeURIComponent(xid)+"&lim=500";
 try{
  const data=await jsonp(api),works=Array.isArray(data)?data.filter((x,i)=>i>0&&x.ncode):[];
  lines.push("R18作者API取得件数="+works.length);
  let master={};try{master=JSON.parse(localStorage.getItem(MASTER_KEY)||"{}")}catch(e){}
  lines.push("作品情報マスター="+Object.keys(master).length+"作品");
  const hits=works.filter(w=>master[String(w.ncode||"").toUpperCase()]);
  lines.push("本棚マスター照合="+hits.length+"作品");
  if(hits.length){lines.push("","【照合できた作品】");hits.forEach((w,i)=>{const n=String(w.ncode).toUpperCase();const m=master[n]||{};lines.push((i+1)+" "+n+"｜"+(w.title||m.title||"")+"｜"+(w.writer||m.writer||""))})}
  const set=new Set(Object.keys(master).map(x=>x.toUpperCase())),out=works.filter(w=>!set.has(String(w.ncode||"").toUpperCase()));
  lines.push("","作者API作品のうち本棚外="+out.length+"作品");if(out.length)lines.push("本棚外Nコード="+out.map(w=>String(w.ncode).toUpperCase()).join(", "));
  lines.push("","API="+api);show(lines);
 }catch(e){lines.push("取得失敗="+e.message,"API="+api);show(lines)}
}
async function copyResult(){if(!resultText)return;try{await navigator.clipboard.writeText(resultText);alert("コピーしました")}catch(e){alert("コピーできませんでした")}}
run();
</script></body></html>
