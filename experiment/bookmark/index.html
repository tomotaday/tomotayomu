<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>ともたよむ｜しおりシステム実験室</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
  <p><a href="../../index.html">← 本番INDEXへ戻る</a></p>
  <header>
    <p class="eyebrow">EXPERIMENT / ISOLATED DATABASE</p>
    <h1>📌 しおりシステム実験室</h1>
    <p>本番の本棚とは接続していない、独立した試験環境です。</p>
  </header>
  <section class="notice">
    <strong>安全境界</strong>
    <p>このページは <code>tomotaYomuBookmarkLabDB</code> だけを使用します。本番DB・localStorage・Shortcutにはアクセスしません。</p>
  </section>
  <section class="panel">
    <h2>実験用INDEX</h2>
    <div id="works" class="works"></div>
  </section>
  <section class="panel">
    <h2>保存内容</h2>
    <p id="dbName" class="muted"></p>
    <pre id="records">読み込み中…</pre>
    <button id="refresh" type="button">保存内容を再読込</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="./bookmark-db.js"></script>
<script src="./index.js"></script>
</body>
</html>
