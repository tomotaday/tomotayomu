<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>noteしおり照合テスト</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:20px;background:#f7f5fb;color:#29243a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.6}
main{max-width:620px;margin:auto}.panel{background:#fff;border:1px solid #e5deef;border-radius:16px;padding:18px;margin:14px 0}
h1{font-size:1.35rem;margin:0 0 8px}.muted{color:#716b7d;font-size:.9rem}
label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #cfc5dc;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:12px 15px;margin:8px 6px 0 0;background:#6650a4;color:white;font-size:15px;font-weight:700}
button.secondary{background:#eee9f6;color:#41365c}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f0f8;padding:14px;border-radius:10px;min-height:110px}
.notice{border-left:4px solid #a18bd1;padding-left:12px}.safe{font-weight:700;color:#27734b}
</style>
</head>
<body><main>
<h1>🔖 noteしおり照合テスト</h1>
<p class="muted">専用ブランチの検証ページ。登録済み2マガジンの公開目次JSONを読み込みます。本番本棚・IndexedDB・localStorage・ショートカットには接続しません。</p>
<section class="panel">
<p class="notice">本番の noteArticleKey() と同じURL判定、および本番受信処理と同じ「全マガジンを照合してから一致数で判定する」流れを確認します。しおり保存は実行しません。</p>
<label for="article">照合するnote記事URL</label>
<input id="article" type="url" value="https://note.com/campana/n/n55129b3a4e8a" autocomplete="off">
<div>
<button id="check">2マガジンを照合</button>
<button class="secondary" id="missing">一致なしを確認</button>
<button class="secondary" id="duplicate">複数一致を模擬</button>
<button class="secondary" id="failure">2つ目の目次を読込失敗</button>
</div>
</section>
<section class="panel">
<strong>照合結果</strong>
<div id="result" class="result" role="status" aria-live="polite">まだ照合していません。</div>
</section>
<p class="muted">安全確認：このページは目次JSONの読み取りと画面表示だけです。本番データへの書き込みはありません。複数一致ボタンは、1つ目で見つかった記事キーを2つ目にもあるものとして模擬します。</p>
</main>
<script>
"use strict";
const MAGAZINES=[
  {id:"m8a34f89ccce0",name:"campana のマガジン",url:"https://note.com/campana/m/m8a34f89ccce0",indexUrl:"https://raw.githubusercontent.com/tomotaday/tomotayomu/main/data/note-index-m8a34f89ccce0.json"},
  {id:"m01cdae273ca2",name:"tomotaday のマガジン",url:"https://note.com/tomotaday/m/m01cdae273ca2",indexUrl:"https://raw.githubusercontent.com/tomotaday/tomotayomu/main/data/note-index-m01cdae273ca2.json"}
];
const $=id=>document.getElementById(id);
function noteArticleKey(value){
  try{
    const u=new URL(String(value||""));
    if(u.hostname!=="note.com"&&!u.hostname.endsWith(".note.com"))return "";
    const m=u.pathname.match(/\/n\/([a-z0-9]+)/i);
    return m?m[1]:"";
  }catch(e){return ""}
}
function magazineKeyFromUrl(value){
  const magazine=new URL(String(value||""));
  if(magazine.protocol!=="https:"||(magazine.hostname!=="note.com"&&!magazine.hostname.endsWith(".note.com")))throw new Error("マガジンURLが不正です");
  const m=magazine.pathname.match(/^\/[^/]+\/m\/([a-z0-9]+)/i);
  if(!m)throw new Error("マガジンIDを取得できません");
  return m[1];
}
async function loadNoteIndex(magazine,forceFailure=false){
  if(forceFailure)throw new Error("テスト指定による目次読込失敗: "+magazine.name);
  const response=await fetch(magazine.indexUrl,{cache:"no-store"});
  if(!response.ok)throw new Error(magazine.name+" の目次JSON取得失敗: HTTP "+response.status);
  const data=await response.json();
  if(!Array.isArray(data.items))throw new Error(magazine.name+" の目次データが不正です");
  return data.items;
}
async function run(mode="normal"){
  const output=$("result");output.textContent="照合中…";
  try{
    const articleUrl=$("article").value.trim();
    const articleKey=noteArticleKey(articleUrl);
    if(!articleKey)throw new Error("note記事URLから記事キーを取得できません");
    const matched=[];
    const details=[];
    const compareKey=mode==="missing"?articleKey+"__missing_test__":articleKey;
    for(let i=0;i<MAGAZINES.length;i++){
      const magazine=MAGAZINES[i];
      magazineKeyFromUrl(magazine.url);
      const items=await loadNoteIndex(magazine,mode==="failure"&&i===1);
      const found=items.some(entry=>
        String(entry.key||"").toLowerCase()===compareKey.toLowerCase()||
        noteArticleKey(entry.url).toLowerCase()===compareKey.toLowerCase()
      );
      if(mode==="duplicate"&&i===1&&matched.length===1){
        matched.push(magazine);
      }else if(found){
        matched.push(magazine);
      }
      details.push(magazine.name+": "+items.length+"件読込 / "+(found?"記事キー一致":"一致なし"));
    }
    const lines=["記事キー: "+articleKey,...details,"一致したマガジン数: "+matched.length];
    if(matched.length===1){lines.push("判定: 1件一致","対象: "+matched[0].name,"結果: 保存対象として特定できました（このテストページでは保存しません）");}
    else if(matched.length===0){lines.push("判定: 一致なし","結果: 保存しない");}
    else{lines.push("判定: 複数一致","対象: "+matched.map(x=>x.name).join(" / "),"結果: 誤保存防止のため保存しない");}
    lines.push("本番データへの書き込み: なし");
    output.textContent=lines.join("\n");
  }catch(e){
    output.textContent="照合エラー: "+e.message+"\n結果: 全体を中止して保存しない\n本番データへの書き込み: なし";
  }
}
$("check").addEventListener("click",()=>run());
$("missing").addEventListener("click",()=>run("missing"));
$("duplicate").addEventListener("click",()=>run("duplicate"));
$("failure").addEventListener("click",()=>run("failure"));
</script></body></html>
