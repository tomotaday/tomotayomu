<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#f6f3ed" name="theme-color"/>
<title>ともたよむ｜v2.1.2.5 R18作者情報・原本境界診断</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.55}
main{width:min(100%,720px);margin:auto;padding:18px 14px 40px}
h1{font-size:30px;margin:0 0 4px}
.note{font-size:13px;color:var(--muted);margin-bottom:15px}
button{border:1px solid #c8c0b5;border-radius:8px;background:transparent;padding:5px 9px;font-size:14px;color:var(--ink)}
#apiStatus{font-size:13px;margin:10px 0 15px}
.section{margin:20px 0 8px;font-weight:700;font-size:18px}
.update-empty{color:var(--muted);margin-bottom:16px}
.update-list .card{margin-bottom:10px}
.card{background:var(--card);border:1px solid #aaa195;border-radius:12px;padding:13px;margin:10px 0}
.meta{font-size:12px;color:#555;margin-bottom:8px}
.newMark{font-size:12px}
h2{font-size:15px;line-height:1.45;font-weight:700;margin:0 0 4px}
.author,.ncode{font-size:13px;color:#555}
details{margin-top:9px;font-size:13px}
summary{cursor:pointer}
.synopsis{white-space:pre-wrap;color:#555;margin:7px 0}
.actions{display:flex;gap:10px;margin-top:12px;font-size:13px;flex-wrap:wrap}
.actions a{color:inherit;text-decoration:none;border-bottom:1px solid #aaa}
.hidden{display:none!important}
</style>
<style id="v19-folder-style">
.folderSection{margin:18px 0 22px}
.folderTitle{font-size:17px;font-weight:700;margin:0 0 10px;padding:0 2px}
.folderCards{display:flex;flex-direction:column;gap:10px}
</style>
<style id="v203-fold-style">
.updateDetails{margin:20px 0 8px}
.updateDetails>summary{list-style:none;cursor:pointer;font-size:18px;font-weight:700;padding:3px 2px}
.updateDetails>summary::-webkit-details-marker{display:none}
.updateDetails>summary::before{content:"▸ ";font-size:15px}
.updateDetails[open]>summary::before{content:"▾ ";font-size:15px}
.bookshelfDetails{margin:20px 0 8px}
.bookshelfDetails>summary{list-style:none;cursor:pointer;font-size:22px;font-weight:800;padding:4px 2px}
.bookshelfDetails>summary::-webkit-details-marker{display:none}
.bookshelfDetails>summary::before{content:"▸ ";font-size:18px}
.bookshelfDetails[open]>summary::before{content:"▾ ";font-size:18px}
.folderDetails{margin:14px 0}
.folderDetails>summary{list-style:none;cursor:pointer;font-size:18px;font-weight:700;padding:3px 2px}
.folderDetails>summary::-webkit-details-marker{display:none}
.folderDetails>summary::before{content:"▸ ";font-size:15px}
.folderDetails[open]>summary::before{content:"▾ ";font-size:15px}

.ncode{position:relative;padding-right:48px;min-height:20px}.r18Badge{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:10px;line-height:1;padding:3px 5px;border:1px solid #aaa195;border-radius:5px;color:#666;background:#f6f3ed;letter-spacing:.2px;z-index:2}
</style>
</head>

<body>
<div class="wrap">
  <h1>ともたよむ</h1>
  <div class="ver">v2.1.2.5｜R18作者情報・原本境界診断</div>

  <div class="box">
    <p>R18作品について、Narou API → slimMaster → 保存Master の3段階を比較します。</p>
    <p>目的：作者ID・作者名が、どの段階で崩れているかを確認します。</p>
    <button id="run">R18作者情報を診断する</button>
    <button id="copy">診断結果をコピー</button>
  </div>

  <pre id="out">未実行</pre>
</div>

<script>
"use strict";

const MASTER_KEY="tomotaYomu_v214_works_master";
const API="https://api.syosetu.com/novelapi/api/";
const out=document.getElementById("out");

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="jsonp_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"));},15000);
    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      s.remove();
    }
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error("API error"));};
    s.src=url+"&callback="+cb;
    document.body.appendChild(s);
  });
}

function getMaster(){
  try{return JSON.parse(localStorage.getItem(MASTER_KEY)||"{}");}
  catch(e){return {};}
}

function slimMaster(w){
  return {
    ncode:String(w.ncode||"").toUpperCase(),
    title:w.title||"",
    writer:w.writer||"",
    userid:w.userid??0,
    noveltype:w.noveltype??0,
    end:w.end??0,
    general_lastup:w.general_lastup||"",
    general_all_no:w.general_all_no??0,
    __r18:!!w.__r18
  };
}

function pickR18(master){
  return Object.values(master)
    .filter(w=>w && w.__r18 && w.ncode)
    .slice(0,8);
}

function line(v){
  return String(v ?? "").replace(/\n/g," ");
}

async function run(){
  out.textContent="診断中…";
  const master=getMaster();
  const targets=pickR18(master);
  let result=[];
  result.push("【v2.1.2.5｜R18作者情報・原本境界診断】");
  result.push("保存Master作品数："+Object.keys(master).length);
  result.push("診断対象R18："+targets.length);
  result.push("");

  for(const old of targets){
    const n=String(old.ncode).toLowerCase();
    try{
      // nt,u,w are explicitly requested here.
      const d=await jsonp(API+"?ncode="+encodeURIComponent(n)+"&of=n-t-nt-u-w-e-ga-gl&lim=1");
      const raw=Array.isArray(d)&&d.length>1?d[1]:null;
      const slim=raw?slimMaster({...raw,__r18:true}):null;
      const saved=master[String(old.ncode).toUpperCase()]||null;

      result.push("Nコード："+n.toUpperCase());
      result.push("作品："+line(raw?.title || old.title));
      result.push("API raw      userid="+line(raw?.userid)+" / writer="+line(raw?.writer)+" / noveltype="+line(raw?.noveltype)+" / end="+line(raw?.end));
      result.push("slimMaster   userid="+line(slim?.userid)+" / writer="+line(slim?.writer)+" / noveltype="+line(slim?.noveltype)+" / end="+line(slim?.end));
      result.push("保存Master   userid="+line(saved?.userid)+" / writer="+line(saved?.writer)+" / noveltype="+line(saved?.noveltype)+" / end="+line(saved?.end));
      result.push("");
    }catch(e){
      result.push("Nコード："+n.toUpperCase());
      result.push("API取得エラー："+e.message);
      result.push("");
    }
  }
  out.textContent=result.join("\n");
}

document.getElementById("run").addEventListener("click",run);
document.getElementById("copy").addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(out.textContent);
    alert("診断結果をコピーしました。");
  }catch(e){
    alert("コピーできませんでした。結果を長押ししてコピーしてください。");
  }
});
</script>
</body>

</html>
