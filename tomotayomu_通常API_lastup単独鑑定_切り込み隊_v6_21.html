<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ 通常API lastup 単独鑑定 v6.21</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:16px;line-height:1.5;background:#f7f7f7;color:#222}
h1{font-size:20px}h2{font-size:17px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #bbb}
button{font-size:16px;padding:10px 14px;margin:4px;border-radius:10px;border:1px solid #aaa;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🧪 ともたよむ 通常API lastup 単独鑑定・切り込み隊 v6.21</h1>
<div class="card">
<h2>目的</h2>
<p>通常APIだけを単独で確認する。期間は <b>2026/09/25 00:00 JST → 実行時刻</b>。</p>
<p>allcount が2000を超えた場合だけ時間範囲を分割し、各範囲を st=1/501… で取得する。</p>
<p class="small">本棚照合・R18 API・GASは今回一切実行しない。</p>
</div>
<div class="card">
<button id="run">▶ 通常API鑑定開始</button>
<button id="copy">📋 結果をコピー</button>
<button id="clear">🧹 ログ消去</button>
</div>
<div class="card"><h2>鑑定ログ</h2><pre id="log">【待機中】</pre></div>
<script>
const BASE="https://api.syosetu.com/novelapi/api/";
const START=new Date("2026-09-24T15:00:00.000Z");
const logEl=document.getElementById("log");
function add(s){if(logEl.textContent==="【待機中】")logEl.textContent="";logEl.textContent+=s+"\\n";}
function fmt(d){return d.toISOString().replace(".000Z","Z");}
function makeUrl(from,to,st){
 const p=new URLSearchParams();
 p.set("lastup",Math.floor(from.getTime()/1000)+"-"+Math.floor(to.getTime()/1000));
 p.set("of","n-gl-ga");p.set("lim","500");p.set("st",String(st));p.set("out","json");
 return BASE+"?"+p.toString();
}
async function get(url){
 const t=performance.now();
 try{
  const r=await fetch(url,{cache:"no-store"});
  const body=await r.text();
  const ms=Math.round(performance.now()-t);
  add("HTTP "+r.status+" / "+ms+"ms");
  add("URL: "+url);
  if(!r.ok)throw new Error("HTTP "+r.status+" / "+body.slice(0,300));
  let j;try{j=JSON.parse(body)}catch(e){throw new Error("JSON解析失敗 / "+body.slice(0,300))}
  add("allcount="+(j.allcount??"なし")+" / data="+(Array.isArray(j.data)?j.data.length:"なし"));
  return j;
 }catch(e){
  add("🔴 fetch失敗: "+String(e));
  add("URL: "+url);
  throw e;
 }
}
async function collect(from,to,depth=0){
 add("\\n--- 範囲 "+fmt(from)+" → "+fmt(to)+" ---");
 const first=await get(makeUrl(from,to,1));
 const all=Number(first.allcount||0);
 if(all<=2000){
  let count=Array.isArray(first.data)?first.data.length:0;
  for(let st=501;st<=all;st+=500){
   const j=await get(makeUrl(from,to,st));
   count+=Array.isArray(j.data)?j.data.length:0;
  }
  add("範囲完了: allcount="+all+" / 取得="+count);
  return count;
 }
 if(depth>=20)throw new Error("分割深度超過");
 const mid=new Date((from.getTime()+to.getTime())/2);
 add("allcount "+all+" > 2000 → 時間範囲を二分");
 const a=await collect(from,mid,depth+1);
 const b=await collect(mid,to,depth+1);
 return a+b;
}
async function run(){
 const b=document.getElementById("run");b.disabled=true;logEl.textContent="";
 add("【v6.21 開始】");
 add("通常API単独鑑定");
 add("開始: "+fmt(START)+" = 2026/09/25 00:00 JST");
 const now=new Date();add("終了: "+now.toLocaleString("ja-JP"));
 try{
  const total=await collect(START,now);
  add("\\n総取得行数: "+total);
  add("\\n【テスト完了】");
 }catch(e){
  add("\\n【テスト未完了】");
 }finally{b.disabled=false}
}
document.getElementById("run").onclick=run;
document.getElementById("clear").onclick=()=>logEl.textContent="【待機中】";
document.getElementById("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText(logEl.textContent);
 const b=document.getElementById("copy"),o=b.textContent;b.textContent="✅ コピーしました";setTimeout(()=>b.textContent=o,1200)}
 catch(e){alert("コピーできませんでした。ログを長押ししてコピーしてください。")}
};
</script>
</body>
</html>
