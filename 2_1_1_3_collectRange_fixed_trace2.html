<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ collectRange 固定診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:16px;line-height:1.5}
button{width:100%;padding:14px;margin:8px 0;font-size:16px}
textarea{width:100%;min-height:480px;box-sizing:border-box;font:13px/1.5 monospace}
</style>
</head>
<body>
<h2>🔬 修正後 collectRange 固定診断</h2>
<p>本体の更新処理は実行しません。R18 APIだけを診断します。</p>
<button id="runBtn" type="button">🔬 診断開始</button>
<button id="copyBtn" type="button">📋 テスト結果をコピー</button>
<textarea id="result" readonly></textarea>

<script>
const API="https://api.syosetu.com/novel18api/api/";
const MAX_ST=2000;
const result=document.getElementById("result");
const runBtn=document.getElementById("runBtn");
const copyBtn=document.getElementById("copyBtn");

function log(s){
  result.value += s + "\n";
  result.scrollTop=result.scrollHeight;
}

function range(a,b){
  return Math.floor(a)+"-"+Math.floor(b);
}

function jsonp(url,timeout=15000){
  return new Promise((resolve,reject)=>{
    const cb="tomotaFixedCollect_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>{
      if(done)return;
      done=true;
      cleanup();
      reject(new Error("JSONP timeout"));
    },timeout);

    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      s.remove();
    }

    window[cb]=data=>{
      if(done)return;
      done=true;
      cleanup();
      resolve(data);
    };

    s.onerror=()=>{
      if(done)return;
      done=true;
      cleanup();
      reject(new Error("JSONP script error"));
    };

    s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();
    document.head.appendChild(s);
  });
}

async function collectTrace(a,b,depth=0){
  const u=range(a,b);
  log("COUNT depth="+depth);
  log("  start="+a+" / "+new Date(a*1000).toLocaleString("ja-JP"));
  log("  end  ="+b+" / "+new Date(b*1000).toLocaleString("ja-JP"));
  log("  lastup="+u);

  const d=await jsonp(API+"?lastup="+u+"&of=n-gl-ga-e-e&lim=1&st=1");
  const n=Number(d?.[0]?.allcount||0);
  log("  allcount="+n);

  if(n===0)return [];

  if(n<=MAX_ST){
    const all=[];
    for(let st=1;st<=n;st+=500){
      const lim=Math.min(500,n-st+1);
      log("  DATA st="+st+" lim="+lim);
      const d2=await jsonp(API+"?lastup="+u+"&of=n-gl-ga-e-e&lim="+lim+"&st="+st);
      const rows=Array.isArray(d2)?d2.slice(1).filter(x=>x&&x.ncode):[];
      log("  rows="+rows.length);
      all.push(...rows);
    }
    return all;
  }

  if(depth>=20)throw new Error("lastup時間分割上限");
  const m=Math.floor((a+b)/2);
  log("  → 時間分割");
  const left=await collectTrace(a,m,depth+1);
  const right=await collectTrace(m+1,b,depth+1);
  return left.concat(right);
}

runBtn.addEventListener("click",async()=>{
  result.value="";
  runBtn.disabled=true;
  log("【診断開始】");
  log("ボタン押下 = "+new Date().toLocaleString("ja-JP"));
  log("R18 API = "+API);
  log("────────────");

  try{
    const msA=new Date("2024-08-22T00:00:00+09:00").getTime();
    const msB=new Date("2024-08-23T23:59:59+09:00").getTime();
    const secA=Math.floor(msA/1000);
    const secB=Math.floor(msB/1000);

    log("既知のN6117JHを含む期間");
    log("Unix秒 = "+secA+"-"+secB);
    log("range() = "+range(secA,secB));
    log("期待値一致 = "+(range(secA,secB)==="1724252400-1724425199"));
    log("────────────");

    const rows=await collectTrace(secA,secB);

    log("────────────");
    log("【集計】");
    log("総取得rows = "+rows.length);
    const hit=rows.find(x=>String(x.ncode||"").toUpperCase()==="N6117JH");
    log("N6117JH = "+(hit?"捕捉":"未捕捉"));
    if(hit)log("捕捉データ = "+JSON.stringify({
      ncode:hit.ncode,
      general_lastup:hit.general_lastup,
      general_all_no:hit.general_all_no
    }));
    log("【診断完了】");
  }catch(e){
    log("【ERROR】 "+(e?.message||String(e)));
  }finally{
    runBtn.disabled=false;
  }
});

copyBtn.addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(result.value);
    copyBtn.textContent="✅ コピーしました";
    setTimeout(()=>copyBtn.textContent="📋 テスト結果をコピー",1200);
  }catch(e){
    result.select();
    document.execCommand("copy");
    copyBtn.textContent="✅ コピーしました";
    setTimeout(()=>copyBtn.textContent="📋 テスト結果をコピー",1200);
  }
});

log("ページ読み込み完了。");
log("「🔬 診断開始」を押してください。");
</script>
</body>
</html>
