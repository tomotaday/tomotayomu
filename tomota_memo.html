<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともためも｜ともたよむ</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195;--shelf-card:#fff;--shelf-ink:#252525;--shelf-line:#ddd;--work-card-line:#aaa195}
body[data-theme="seiji"]{--bg:#edf4f1;--card:#f9fcfb;--ink:#20302d;--muted:#64736f;--line:#9aada7;--shelf-card:#f8fcfa;--shelf-ink:#20302d;--shelf-line:#b8c9c4}
body[data-theme="night"]{--bg:#20242a;--card:#2b3038;--ink:#f1f3f4;--muted:#c1c7ce;--line:#59616b;--shelf-card:#303640;--shelf-ink:#f1f3f4;--shelf-line:#555f6b}
body[data-theme="autumn"]{--bg:#f5eee4;--card:#fffaf2;--ink:#3a2b21;--muted:#806d5d;--line:#b8a18d;--shelf-card:#fff8ee;--shelf-ink:#3a2b21;--shelf-line:#cbb49e}
body[data-theme="night"] .panel,body[data-theme="night"] .entry,body[data-theme="night"] button,body[data-theme="night"] input,body[data-theme="night"] textarea,body[data-theme="night"] .modal{color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.5}
main{width:min(100%,720px);margin:auto;padding:16px 14px 42px}a{color:inherit}h1{font-size:22px;margin:10px 0 4px}.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
button,input,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:7px 10px}input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:9px;font-size:16px}textarea{min-height:45vh;resize:vertical;white-space:pre-wrap}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.panel{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.row input{min-width:0}.tree{display:flex;flex-direction:column;gap:6px;margin-top:12px}.entry{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.entryhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 9px;min-height:44px}.entryname{flex:1 1 100%;min-width:0;overflow-wrap:break-word;word-break:normal;white-space:normal;font-size:17px;line-height:1.5}.entryhead button{flex:0 0 auto;font-size:13px;padding:5px 7px;max-width:100%}.children{padding:0 8px 8px 16px}.bodytext{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;padding:10px 2px;max-height:none;overflow:visible}.muted{font-size:12px;color:var(--muted)}.hidden{display:none!important}.crumb{font-size:13px;color:var(--muted);overflow-wrap:break-word}.status{font-size:13px;margin:8px 0;overflow-wrap:break-word}.danger{border-color:#b66;background:#fff5f5}.modalback{position:fixed;inset:0;background:#0007;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px calc(24px + env(safe-area-inset-bottom));z-index:5}.modal{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:680px;margin:0 auto;max-height:none;overflow:visible}body.reader-mode{background:var(--reader-bg,var(--bg));color:var(--reader-ink,var(--ink))}body.reader-mode main{width:100%;max-width:none;margin:0;padding:0}body.reader-mode .toplink,body.reader-mode main>h1,body.reader-mode main>.hint,body.reader-mode main>.panel,body.reader-mode #tree{display:none!important}body.reader-mode #editorBack{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)!important;background:var(--reader-bg,var(--bg))!important;overflow:hidden!important}body.reader-mode .modal{width:100%!important;max-width:none!important;height:100%!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;padding:12px 18px 18px!important;overflow-y:auto!important;background:var(--reader-bg,var(--bg))!important;color:var(--reader-ink,var(--ink))!important;display:flex;flex-direction:column}body.reader-mode #editorTitle{display:none}body.reader-mode .reader-toolbar{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;column-gap:7px;row-gap:4px;padding:6px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}body.reader-mode .reader-name{grid-column:1/-1;grid-row:1;font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;min-width:0;padding:2px 0 4px}body.reader-mode .reader-toolbar button{font-size:13px;line-height:1.2;min-height:34px;padding:5px 9px;border-radius:9px}body.reader-mode .reader-close{font-size:21px;line-height:1;min-width:34px;min-height:34px;padding:3px 7px}body.reader-mode .reader-share{display:inline-flex;align-items:center;justify-content:center;width:34px;min-width:34px;height:34px;padding:0}body.reader-mode .reader-share svg{display:block}body.reader-mode .reader-close{font-size:24px;line-height:1;min-width:42px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--reader-ink,var(--ink))}body.reader-mode #cancelEdit{display:none!important}body.reader-mode .reader-toolbar{position:sticky;top:0;background:var(--reader-bg,var(--bg));z-index:2}body.reader-mode #editName,body.reader-mode label[for="editName"],body.reader-mode label[for="editBody"],body.reader-mode .modal>.muted{display:none!important}body.reader-mode #textAreaWrap{display:flex!important;flex:1;min-height:0;flex-direction:column;margin:0!important}body.reader-mode #editBody{width:100%;flex:1;min-height:65vh;height:auto!important;max-height:none!important;border:0!important;border-radius:0!important;padding:10px 0!important;background:transparent!important;color:var(--reader-ink,var(--ink))!important;-webkit-text-fill-color:var(--reader-ink,var(--ink));font-size:18px;line-height:1.85;resize:none;overflow-y:auto!important}body.reader-mode .actions{margin-top:12px}body.reader-mode #saveItem{display:none!important}.modal h2{font-size:18px;margin:0 0 10px}.modal textarea{min-height:32vh;max-height:42vh}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.toplink{font-size:14px}.memo-dialog-back{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px}.memo-dialog{width:min(100%,420px);max-height:80dvh;overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 32px #0003}.memo-dialog h2{margin:0 0 12px;font-size:20px}.memo-dialog>button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.memo-delete-list{max-height:32dvh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin:10px 0}.memo-delete-list>div{padding:4px 0;overflow-wrap:anywhere}.memo-dialog .actions{display:flex;gap:8px}.memo-dialog .actions button{flex:1}
</style>
</head>
<body>
<main>
<a class="toplink" href="index.html">← ともたよむ本棚へ戻る</a>
<h1>🗂️ ともためも</h1>
<p class="hint">フォルダのように整理する、ローカル保存のメモ棚。見るだけなら編集されません。</p>
<div class="panel">
 <input id="search" type="search" placeholder="名前・本文を検索">
 <div class="toolbar"><button id="newRootFolder">＋ 大項目</button><button id="newRootText">＋ テキスト</button></div>
 <div id="status" class="status" role="status">保存領域を準備しています…</div>
</div>
<div id="tree" class="tree"></div>
<div id="editorBack" class="modalback hidden">
 <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <h2 id="editorTitle">項目</h2>
  <label for="editName">名前</label><input id="editName" maxlength="200">
  <div id="textAreaWrap" class="hidden" style="margin-top:10px"><label for="editBody">テキスト</label><textarea id="editBody" spellcheck="false" placeholder="ここにテキストを貼り付け"></textarea></div>
  <div class="actions"><button id="saveItem">保存</button><button id="cancelEdit">キャンセル</button></div>
  <p class="muted">変更は保存ボタンを押したときだけ反映されます。</p>
 </section>
</div>
<script>
(()=>{'use strict';
const DB_NAME='tomotaMemoDB',DB_VERSION=1,STORE='items';
const $=id=>document.getElementById(id);
let db=null,items=[],editing=null,query='';
function status(s){$('status').textContent=s}
function makeId(){return 'memo_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE)){const st=d.createObjectStore(STORE,{keyPath:'id'});st.createIndex('parentId','parentId',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('メモ保存領域を開けません'))})}
function allItems(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
function put(item){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('保存を中止しました'))})}
function removeMany(ids){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);ids.forEach(id=>st.delete(id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('削除を中止しました'))})}
function descendants(id){const out=[],queue=[id];while(queue.length){const p=queue.shift();out.push(p);items.filter(x=>x.parentId===p).forEach(x=>queue.push(x.id))}return out}
function children(parentId){return items.filter(x=>(x.parentId||null)===(parentId||null)).sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true,sensitivity:'base'}))}
function matches(item){if(!query)return true;const q=query.toLocaleLowerCase();if((item.name||'').toLocaleLowerCase().includes(q)||(item.body||'').toLocaleLowerCase().includes(q))return true;return descendants(item.id).slice(1).some(id=>{const x=items.find(y=>y.id===id);return x&&((x.name||'').toLocaleLowerCase().includes(q)||(x.body||'').toLocaleLowerCase().includes(q))})}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function addButton(parent,label,fn,cls){const b=el('button',cls||'',label);b.type='button';b.addEventListener('click',e=>{e.stopPropagation();fn()});parent.appendChild(b);return b}
function render(){
 const root=$('tree');root.replaceChildren();
 const roots=children(null).filter(matches);
 if(!roots.length){root.appendChild(el('div','panel',query?'一致する項目はありません。':'まだ項目がありません。「＋ 大項目」から始めてね。'));return}
 roots.forEach(item=>root.appendChild(renderItem(item,0)));
}
function renderItem(item,depth){
 const wrap=el('div','entry');wrap.dataset.id=item.id;
 const head=el('div','entryhead'),label=el('div','entryname', (item.type==='folder'?'📁 ':'📄 ')+item.name);head.appendChild(label);
 if(item.type==='text')addButton(head,'開く',()=>viewText(item.id));
 addButton(head,'編集',()=>openEditor(item.id));
 if(item.type==='folder'){addButton(head,'＋フォルダ',()=>openEditor(null,item.id,'folder'));addButton(head,'＋テキスト',()=>openEditor(null,item.id,'text'));}
 addButton(head,'移動',()=>moveItem(item.id));
 addButton(head,'削除',()=>deleteItem(item.id),'danger');
 wrap.appendChild(head);
 if(item.type==='folder'){
   const kids=children(item.id).filter(matches);
   if(kids.length){const list=el('div','children');kids.forEach(k=>list.appendChild(renderItem(k,depth+1)));wrap.appendChild(list)}
   else if(query){wrap.appendChild(el('div','muted','一致項目を含むフォルダ'))}
 }else if(query && item.body.toLocaleLowerCase().includes(query.toLocaleLowerCase())){
   const snippet=el('div','bodytext',item.body.slice(0,240));wrap.appendChild(snippet)
 }
 return wrap;
}
function viewText(id){
 const item=items.find(x=>x.id===id);if(!item)return;
 document.body.classList.add('reader-mode');
 const back=$('editorBack');editing={id,view:true};
 $('editorTitle').textContent=item.name;$('editName').value=item.name;$('editName').disabled=true;
 $('textAreaWrap').classList.remove('hidden');$('editBody').value=item.body||'';$('editBody').readOnly=true;$('editBody').style.height='calc(100dvh - 250px)';$('editBody').style.minHeight='55vh';$('editBody').style.maxHeight='none';$('editName').style.fontSize='18px';
 $('saveItem').classList.add('hidden');$('cancelEdit').textContent='閉じる';back.classList.remove('hidden');let toolbar=$('readerToolbar');if(!toolbar){toolbar=el('div','reader-toolbar');toolbar.id='readerToolbar';const name=el('div','reader-name',item.name);const share=el('button','reader-share','');share.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';share.setAttribute('aria-label','共有');share.title='共有';share.addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:item.name,text:item.body});else{await navigator.clipboard.writeText(item.body);status('本文をコピーしました。')}}catch(e){}});const menu=el('button','','⋯');menu.setAttribute('aria-label','操作メニュー');menu.addEventListener('click',()=>showActionMenu(item.id));const close=el('button','reader-close','×');close.setAttribute('aria-label','閉じる');close.addEventListener('click',closeReader);toolbar.append(name,share,menu,close);back.querySelector('.modal').prepend(toolbar)}else{toolbar.querySelector('.reader-name').textContent=item.name}adjustForKeyboard();
}
function openEditor(id=null,parentId=null,type='text'){
 const item=id?items.find(x=>x.id===id):null;editing={id:id||null,parentId:parentId||null,type:item?item.type:type,view:false};
 $('editorTitle').textContent=item?'項目を編集':(type==='folder'?'フォルダを追加':'テキストを追加');
 $('editName').disabled=false;$('editName').value=item?item.name:'';$('editBody').readOnly=false;$('editBody').value=item?item.body||'':'';
 $('textAreaWrap').classList.toggle('hidden',editing.type!=='text');$('saveItem').classList.remove('hidden');$('cancelEdit').textContent='キャンセル';$('editorBack').classList.remove('hidden');$('editName').focus();
}
async function saveEditor(){
 if(!editing||editing.view)return;const name=$('editName').value.trim();if(!name){alert('名前を入力してね。');return}
 const old=editing.id?items.find(x=>x.id===editing.id):null;
 const item={id:old?old.id:makeId(),parentId:old?old.parentId:editing.parentId,type:old?old.type:editing.type,name,body:(old?old.type:editing.type)==='text'?$('editBody').value:'',createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()};
 try{await put(item);await refresh();$('editorBack').classList.add('hidden');status(old?'保存しました。':'項目を追加しました。')}catch(e){status('保存できませんでした：'+e.message)}
}
function dialogLayer(title){
 let layer=$('memoDialogLayer');if(layer)layer.remove();
 layer=el('div','memo-dialog-back');layer.id='memoDialogLayer';
 const box=el('section','memo-dialog');box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
 box.appendChild(el('h2','',title));layer.appendChild(box);document.body.appendChild(layer);return {layer,box};
}
function showActionMenu(id){
 const item=items.find(x=>x.id===id);if(!item)return;
 const {layer,box}=dialogLayer('操作メニュー');
 const actions=[['編集',()=>{layer.remove();openEditor(item.id)}],['移動',()=>{layer.remove();moveItem(item.id)}],['削除',()=>{layer.remove();deleteItem(item.id)}],['閲覧色設定',()=>{layer.remove();setReaderColors()}],['キャンセル',()=>layer.remove()]];
 actions.forEach(([label,fn])=>addButton(box,label,fn,label==='削除'?'danger':''));
}
async function deleteItem(id){
 const item=items.find(x=>x.id===id);if(!item)return;
 const ids=item.type==='folder'?descendants(id):[id];
 const details=ids.map(x=>items.find(y=>y.id===x)).filter(Boolean);
 const {layer,box}=dialogLayer('削除の確認');
 box.appendChild(el('p','', '「'+item.name+'」を削除しますか？'));
 if(item.type==='folder')box.appendChild(el('p','', 'フォルダ内の項目もすべて削除します。'));
 const list=el('div','memo-delete-list');
 details.slice(0,30).forEach(x=>list.appendChild(el('div','', (x.type==='folder'?'📁 ':'📄 ')+x.name)));
 if(details.length>30)list.appendChild(el('div','muted','…ほか '+(details.length-30)+' 件'));
 box.appendChild(list);box.appendChild(el('p','muted','この操作は取り消せません。'));
 const actions=el('div','actions');
 addButton(actions,'削除する',async()=>{try{await removeMany(ids);layer.remove();await refresh();if(document.body.classList.contains('reader-mode'))closeReader();status(details.length+'項目を削除しました。')}catch(e){status('削除できませんでした：'+(e?.message||String(e)));}},'danger');
 addButton(actions,'キャンセル',()=>layer.remove());
 box.appendChild(actions);
}
async function moveItem(id){
 const item=items.find(x=>x.id===id);if(!item)return;
 const possible=items.filter(x=>x.type==='folder'&&x.id!==id&&!descendants(id).includes(x.id));
 const choices=[{id:'',name:'（大項目・最上位）'},...possible.map(x=>({id:x.id,name:x.name}))];
 const promptText='移動先の番号を入力：\n'+choices.map((x,i)=>i+': '+x.name).join('\n');
 const answer=prompt(promptText,String(Math.max(0,choices.findIndex(x=>x.id===(item.parentId||'')))));
 if(answer===null)return;const n=Number(answer);if(!Number.isInteger(n)||n<0||n>=choices.length){alert('番号が正しくありません。');return}
 try{await put({...item,parentId:choices[n].id||null,updatedAt:Date.now()});await refresh();status('移動しました。')}catch(e){status('移動できませんでした：'+e.message)}
}
async function refresh(){items=await allItems();render()}
function adjustForKeyboard(){
 const vv=window.visualViewport,back=$('editorBack'),modal=back.querySelector('.modal');
 if(!vv||back.classList.contains('hidden'))return;
 back.style.height=vv.height+'px';back.style.top=vv.offsetTop+'px';back.style.bottom='auto';
 modal.style.maxHeight=Math.max(160,vv.height-20)+'px';modal.style.overflowY='auto';
}
window.visualViewport?.addEventListener('resize',adjustForKeyboard);
window.visualViewport?.addEventListener('scroll',adjustForKeyboard);
const originalOpenEditor=openEditor;
openEditor=function(id=null,parentId=null,type='text'){originalOpenEditor(id,parentId,type);setTimeout(()=>{adjustForKeyboard();$('editName').scrollIntoView({block:'nearest'});},80)};
const originalViewText=viewText;
viewText=function(id){originalViewText(id);const modal=$('editorBack').querySelector('.modal');modal.style.maxHeight='calc(100dvh - 24px)';modal.style.overflowY='auto';};

$('newRootFolder').addEventListener('click',()=>openEditor(null,null,'folder'));
$('newRootText').addEventListener('click',()=>openEditor(null,null,'text'));
$('saveItem').addEventListener('click',saveEditor);
function closeReader(){ $('editorBack').classList.add('hidden');document.body.classList.remove('reader-mode');$('editorBack').style.height='';$('editorBack').style.top='';$('editorBack').style.bottom='';const t=$('readerToolbar');if(t)t.remove();}
function setReaderColors(){let saved={};try{saved=JSON.parse(localStorage.getItem('tomotaYomu_reader_colors_v1')||'{}')}catch(e){}const bg=prompt('閲覧画面の背景色（#RRGGBB）',saved.bg||'#cddcf8');if(bg===null)return;const ink=prompt('閲覧画面の文字色（#RRGGBB）',saved.ink||'#08265c');if(ink===null)return;if(!/^#[0-9a-fA-F]{6}$/.test(bg)||!/^#[0-9a-fA-F]{6}$/.test(ink)){alert('色は #RRGGBB 形式で入力してね。');return}localStorage.setItem('tomotaYomu_reader_colors_v1',JSON.stringify({bg,ink}));applyReaderColors();}
function applyReaderColors(){try{const v=JSON.parse(localStorage.getItem('tomotaYomu_reader_colors_v1')||'{}');if(/^#[0-9a-fA-F]{6}$/.test(v.bg||''))document.body.style.setProperty('--reader-bg',v.bg);if(/^#[0-9a-fA-F]{6}$/.test(v.ink||''))document.body.style.setProperty('--reader-ink',v.ink)}catch(e){}}
applyReaderColors();
$('cancelEdit').addEventListener('click',closeReader);
$('search').addEventListener('input',e=>{query=e.target.value.trim();render()});
(async()=>{try{db=await openDB();await refresh();status('ローカル保存領域に接続しました。作品データとは別のデータベースです。');const params=new URLSearchParams(location.search);const target=params.get('item');if(target&&items.some(x=>x.id===target&&x.type==='text'))viewText(target);else if(params.get('new')==='folder')openEditor(null,null,'folder');else if(params.get('new')==='text')openEditor(null,null,'text')}catch(e){status('初期化に失敗しました：'+e.message)}})();
})();
</script>
</main>
<script>
(()=>{try{
 const theme=localStorage.getItem('tomotaYomu_theme')||'default';
 document.body.dataset.theme=['seiji','night','autumn'].includes(theme)?theme:'default';
 const colors=JSON.parse(localStorage.getItem('tomotaYomu_custom_colors_v1')||'null');
 const allowed=['--bg','--card','--ink','--muted','--line','--shelf-card','--shelf-ink','--shelf-line','--work-card-line'];
 if(colors&&typeof colors==='object')for(const k of allowed)if(/^#[0-9a-fA-F]{6}$/.test(colors[k]||''))document.body.style.setProperty(k,colors[k]);
 const family=localStorage.getItem('tomotaYomu_font_family');
 const fonts={standard:'-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif',serif:'"Yu Mincho","Hiragino Mincho ProN",serif',rounded:'"Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif'};
 document.body.style.fontFamily=fonts[family]||fonts.standard;
 }catch(e){console.warn('ともためも表示設定の読込失敗',e)}})();
</script>
</body>
</html>
