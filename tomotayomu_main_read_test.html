<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ・本体側読出しテスト</title>
<style>
body{margin:0;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f7f5ef;color:#222}
main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d8d2c5;border-radius:18px;padding:24px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 24px}
.row{margin:18px 0}.label{color:#777;font-size:14px}
.value{font-size:24px;font-weight:700;margin-top:4px;word-break:break-all}
.status{margin-top:20px;padding:14px;border-radius:12px;background:#f2f0ea;font-weight:700;line-height:1.5}
.note{margin-top:24px;padding:14px;background:#f2f0ea;border-radius:12px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>📚 ともたよむ・本体側読出しテスト</h1>

<div class="row">
  <div class="label">本体側から見えるNコード</div>
  <div class="value" id="ncode">（未検出）</div>
</div>

<div class="row">
  <div class="label">本体側から見える話数</div>
  <div class="value" id="episode">（未検出）</div>
</div>

<div class="status" id="status">確認中…</div>

<div class="note">
これは実験用ページです。<br>
前の「確認→保存テスト」が保存したデータを、同じlocalStorage領域から読めるか確認します。<br>
ともたよむ本体のデータは変更しません。
</div>
</main>

<script>
(() => {
  const raw = localStorage.getItem("tomotaYomu_receive_apply_test");

  if (!raw) {
    document.getElementById("status").textContent =
      "📭 本体側からは保存データを検出できませんでした。";
    return;
  }

  try {
    const data = JSON.parse(raw);
    document.getElementById("ncode").textContent = data.ncode || "（なし）";
    document.getElementById("episode").textContent = data.episode || "（なし）";
    document.getElementById("status").textContent =
      "📖 本体側と同じlocalStorage領域から読み出せました。";
  } catch (e) {
    document.getElementById("status").textContent =
      "⚠️ 保存データはありますが、解析できませんでした。";
  }
})();
</script>
</body>
</html>
