<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ v2.1.1.6 診断⑦ 正式API項目取得</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;background:#f5f5f5;color:#222}
h1{font-size:20px;margin:0 0 8px}
.note{font-size:13px;line-height:1.6;background:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
button{font-size:15px;padding:10px 14px;border:0;border-radius:10px;background:#333;color:#fff;margin:4px 4px 4px 0}
button:disabled{opacity:.5}
#summary{margin:12px 0;font-size:14px}
.card{background:#fff;border-radius:12px;margin:12px 0;padding:12px;box-shadow:0 1px 4px #ccc}
.card h2{font-size:16px;margin:0 0 8px}
.ok{color:#187a18}.ng{color:#b00020}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #ddd;padding:6px;vertical-align:top;word-break:break-word}
th{background:#eee}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<h1>ともたよむ v2.1.1.6 診断⑦ ― 正式API項目取得</h1>

<div class="note">
診断⑥で、<code>of=novel_type</code> のような指定では取得できないことを確認。<br>
今回は公式API仕様の短縮コードを使用します。<br><br>
<code>nt = noveltype（短編/連載）</code><br>
<code>ga = general_all_no（全掲載話数）</code><br>
<code>gl = general_lastup（最終掲載日）</code><br>
<code>nu = novelupdated_at（作品更新日時）</code><br>
<code>i = isstop（長期連載停止）</code>
</div>

<button id="start">⑦ 調査開始</button>
<button id="copy" disabled>📋 調査結果を全部コピー</button>
<div id="summary">待機中</div>
<div id="results"></div>

<script>
const $ = id => document.getElementById(id);

const API_URL = "https://api.syosetu.com/novelapi/api/";
const R18_API_URL = "https://api.syosetu.com/novel18api/api/";

const targets = [
  ["N7035MQ","R18"],
  ["N9801CV","R18"],
  ["N9735HP","R18"],
  ["N0034LU","R18"],
  ["N0073ID","R18"],
  ["N0089JC","R18"],
  ["N0002IK","通常"],
  ["N0030HU","通常"]
];

const OF =
  "n-t-e-w-s-u-g-nt-ga-gl-i-nu";

let report=[];

function loadJsonp(url,cb){
  return new Promise((resolve,reject)=>{
    let done=false;
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      if(done)return;
      done=true; cleanup();
      reject(new Error("タイムアウト"));
    },10000);

    window[cb]=data=>{
      if(done)return;
      done=true; clearTimeout(timer); cleanup(); resolve(data);
    };

    function cleanup(){
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
    }

    script.onerror=()=>{
      if(done)return;
      done=true; clearTimeout(timer); cleanup();
      reject(new Error("JSONP通信エラー"));
    };

    script.src=url;
    document.head.appendChild(script);
  });
}

function getWork(data){
  if(!Array.isArray(data)) return null;
  for(let i=1;i<data.length;i++){
    if(data[i] && typeof data[i]==="object" && !Array.isArray(data[i])) return data[i];
  }
  return null;
}

function show(v){
  if(v===undefined)return "undefined";
  if(v===null)return "null";
  if(typeof v==="string")return v;
  return JSON.stringify(v);
}

async function runOne(ncode,type){
  const base=type==="R18" ? R18_API_URL : API_URL;
  const cb="diag7_"+ncode;
  const url=base
    +"?out=jsonp"
    +"&of="+encodeURIComponent(OF)
    +"&lim=1"
    +"&ncode="+encodeURIComponent(ncode)
    +"&callback="+cb;

  try{
    const data=await loadJsonp(url,cb);
    const work=getWork(data);
    const result={
      ncode,type,api:base,allcount:data?.[0]?.allcount ?? "",
      work
    };
    report.push(result);
    return result;
  }catch(e){
    const result={ncode,type,api:base,error:e.message};
    report.push(result);
    return result;
  }
}

function addCard(r){
  const card=document.createElement("section");
  card.className="card";

  const h=document.createElement("h2");
  h.textContent=r.ncode+" / "+r.type;
  card.appendChild(h);

  if(r.error){
    const p=document.createElement("p");
    p.className="ng";
    p.textContent="取得失敗: "+r.error;
    card.appendChild(p);
    $("results").appendChild(card);
    return;
  }

  const w=r.work||{};
  const table=document.createElement("table");
  table.innerHTML="<tr><th>項目</th><th>取得値</th></tr>";

  [
    ["title","title"],
    ["ncode","ncode"],
    ["noveltype","noveltype（nt）"],
    ["general_all_no","general_all_no（ga）"],
    ["general_lastup","general_lastup（gl）"],
    ["novelupdated_at","novelupdated_at（nu）"],
    ["isstop","isstop（i）"],
    ["end","end"],
    ["story","story"]
  ].forEach(([key,label])=>{
    const tr=document.createElement("tr");
    tr.innerHTML="<td>"+label+"</td><td>"+show(w[key])+"</td>";
    table.appendChild(tr);
  });

  card.appendChild(table);

  const p=document.createElement("p");
  p.className="small";
  p.textContent="Object.keys(work) = "+Object.keys(w).join(", ");
  card.appendChild(p);

  const h3=document.createElement("h3");
  h3.textContent="作品オブジェクト全文";
  card.appendChild(h3);

  const pre=document.createElement("pre");
  pre.textContent=JSON.stringify(w,null,2);
  card.appendChild(pre);

  $("results").appendChild(card);
}

async function run(){
  $("start").disabled=true;
  $("copy").disabled=true;
  $("results").innerHTML="";
  report=[];
  $("summary").textContent="調査中… 8作品を正式なofコードで取得します。";

  for(const [ncode,type] of targets){
    const r=await runOne(ncode,type);
    addCard(r);
  }

  const lines=[];
  lines.push("ともたよむ v2.1.1.6 診断⑦ 正式API項目取得");
  lines.push("==================================================");
  lines.push("of="+OF);

  report.forEach(r=>{
    lines.push("");
    lines.push("["+r.ncode+" / "+r.type+"]");
    lines.push("API = "+r.api);
    if(r.error){
      lines.push("ERROR = "+r.error);
      return;
    }
    lines.push("allcount = "+r.allcount);
    lines.push("Object.keys(work) = "+Object.keys(r.work||{}).join(", "));
    lines.push(JSON.stringify(r.work,null,2));
  });

  window.__copyText=lines.join("\n");
  $("summary").textContent="調査完了。📋「調査結果を全部コピー」で、そのままチャットへ貼れます。";
  $("copy").disabled=false;
  $("start").disabled=false;
}

$("start").onclick=run;

$("copy").onclick=async()=>{
  const text=window.__copyText||"";
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.left="-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  $("summary").textContent="📋 コピーしました。このままチャットに貼れます。";
};
</script>
</body>
</html>
