<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ショートカット起動テスト｜ともたよむ</title>
<style>
body{margin:0;padding:24px 18px;background:#f6f3ed;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.65}
main{max-width:560px;margin:auto}h1{font-size:1.35rem}label{display:block;font-weight:700;margin:20px 0 6px}
input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #c9c3b8;border-radius:10px;font-size:14px;background:white}
a{display:block;margin:18px 0;padding:15px;border-radius:12px;background:#e5f1fc;color:#245b8d;text-align:center;text-decoration:none;font-weight:700}
.note{padding:12px 14px;border-radius:10px;background:white;border:1px solid #e4ded3;font-size:.9rem}
small{color:#666}
</style>
</head>
<body>
<main>
<h1>📚 とよむ＋しおり 起動テスト</h1>
<p>Braveを直接起動するのではなく、Apple公式のURL方式で既存ショートカット「とよむ＋しおり」を呼び出すテストです。</p>
<p class="note">既存ショートカットの内容は変更しません。実際のカクヨムのエピソードURLを入力してから、下のボタンを押してください。</p>
<label for="target">カクヨムのエピソードURL</label>
<input id="target" type="url" value="https://kakuyomu.jp/works/1177354054891965415/episodes/" autocomplete="url" spellcheck="false">
<a href="#" id="run">「とよむ＋しおり」を起動する</a>
<p><small>起動後、ショートカットがBraveを開き、カクヨムのWEB版に移動するか確認してください。</small></p>
</main>
<script>
(function(){
 const shortcutName='とよむ＋しおり';
 const link=document.getElementById('run');
 link.addEventListener('click',function(event){
  event.preventDefault();
  const target=document.getElementById('target').value.trim();
  if(!/^https:\/\/kakuyomu\.jp\/works\/[^/]+\/episodes\/[^/?#]+/i.test(target)){
   alert('作品IDとエピソードIDを含む、カクヨムのエピソードURLを入力してください。');
   return;
  }
  const url='shortcuts://run-shortcut?name='+encodeURIComponent(shortcutName)+'&input=text&text='+encodeURIComponent(target);
  window.location.href=url;
 });
})();
</script>
</body>
</html>
