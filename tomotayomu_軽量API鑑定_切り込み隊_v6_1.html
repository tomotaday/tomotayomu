const BATCH_SIZE=500;

const $=id=>document.getElementById(id);
const logs=[];
let normalData=null,r18Data=null;

function log(s){
  const t=new Date().toLocaleTimeString("ja-JP",{hour12:false});
  logs.push(t+" "+s);
  $("log").textContent=logs.join("\n");
}

function jsonp(url,callbackName,timeout=30000){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>finish(new Error("timeout")),timeout);
    function finish(err,data){
      if(done)return;
      done=true;clearTimeout(timer);
      try{delete window[callbackName]}catch{}
      script.remove();
      err?reject(err):resolve(data);
    }
    window[callbackName]=data=>finish(null,data);
    script.onerror=()=>finish(new Error("JSONP load error"));
    script.src=url;
    document.body.appendChild(script);
  });
}

async function fetchBatch(codes,apiBase,label,batchNo,totalBatches){
  const cb="tomotaYomuV61_"+Math.random().toString(36).slice(2);
  const url=apiBase+"?"+new URLSearchParams({
    ncode:codes.join("-"),
    out:"json",
    of:"n-gl",
    lim:String(BATCH_SIZE),
    callback:cb
  }).toString();
  log(label+" "+batchNo+"/"+totalBatches+" JSONP送信: "+codes.length+"件");
  const started=performance.now();
  const data=await jsonp(url,cb);
  const elapsed=Math.round(performance.now()-started);
  const rows=Array.isArray(data)?data:[];
  return {requested:codes.length,received:rows.length,elapsed,rows};
}

async function runLight(codes,apiBase,label){
  const started=performance.now();
  const batches=[];
  for(let i=0;i<codes.length;i+=BATCH_SIZE){
    const batch=codes.slice(i,i+BATCH_SIZE);
    batches.push(await fetchBatch(batch,apiBase,label,batches.length+1,Math.ceil(codes.length/BATCH_SIZE)));
  }
  const rows=batches.flatMap(x=>x.rows).filter(x=>x&&x.ncode);
  const unique=new Map();
  rows.forEach(x=>unique.set(String(x.ncode).toUpperCase(),x));
  const elapsed=Math.round(performance.now()-started);
  const requested=codes.length;
  const received=rows.length;
  const usable=unique.size;
  const missing=requested-usable;
  return {
    requested,received,usable,missing,elapsed,
    batches:batches.map((x,i)=>({batch:i+1,requested:x.requested,received:x.received,elapsed:x.elapsed})),
    sample:[...unique.values()].slice(0,10).map(x=>({ncode:x.ncode,general_lastup:x.general_lastup})),
    rows:[...unique.values()]
  };
}

function render(result,which){
  const lines=[
    "対象件数: "+result.requested,
    "API取得行数: "+result.received,
    "ユニークNコード: "+result.usable,
    "取得できなかった件数: "+result.missing,
    "総処理時間: "+result.elapsed+" ms",
    "",
    "【バッチ】",
    ...result.batches.map(x=>"第"+x.batch+"回: "+x.requested+"件 → "+x.received+"件 / "+x.elapsed+" ms"),
    "",
    "【先頭10件】",
    ...result.sample.map(x=>x.ncode+" | "+(x.general_lastup||""))
  ];
  $(which==="normal"?"normalResult":"r18Result").textContent=lines.join("\n");
}

async function runNormal(){
  try{
    normalData=await runLight(NORMAL_CODES,"https://api.syosetu.com/novelapi/api/","通常API");
    render(normalData,"normal");
    log("通常API完了: "+normalData.usable+"/"+normalData.requested+"件 / "+normalData.elapsed+"ms");
  }catch(e){
    $("normalResult").textContent="ERROR: "+e.message;
    log("通常API ERROR: "+e.message);
  }
}

async function runR18(){
  try{
    r18Data=await runLight(R18_CODES,"https://api.syosetu.com/novel18api/api/","R18 API");
    render(r18Data,"r18");
    log("R18 API完了: "+r18Data.usable+"/"+r18Data.requested+"件 / "+r18Data.elapsed+"ms");
  }catch(e){
    $("r18Result").textContent="ERROR: "+e.message;
    log("R18 API ERROR: "+e.message);
  }
}

function copyText(){
  const text=[
    "ともたよむ 切り込み隊 v6.1",
    "",
    "【対象】",
    "通常作品: "+NORMAL_CODES.length,
    "R18作品: "+R18_CODES.length,
    "合計: "+(NORMAL_CODES.length+R18_CODES.length),
    "",
    "【通常API】",
    normalData?JSON.stringify(normalData,null,2):"未実行",
    "",
    "【R18 API】",
    r18Data?JSON.stringify(r18Data,null,2):"未実行",
    "",
    "【ログ】",
    logs.join("\n")
  ].join("\n");
  navigator.clipboard?.writeText(text).then(()=>alert("コピーしました！")).catch(()=>fallback(text));
}

function fallback(text){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.left="8px";ta.style.top="8px";
  ta.style.width="calc(100% - 16px)";ta.style.height="70vh";ta.style.zIndex="9999";
  document.body.appendChild(ta);ta.focus();ta.select();
  alert("自動コピーできませんでした。表示された全文を長押ししてコピーしてください。");
}

$("normalBtn").onclick=runNormal;
$("r18Btn").onclick=runR18;
$("bothBtn").onclick=async()=>{await runNormal();await runR18()};
$("copyBtn").onclick=copyText;
