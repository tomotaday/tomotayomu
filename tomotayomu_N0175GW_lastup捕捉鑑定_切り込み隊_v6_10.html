<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ N0175GW lastup捕捉鑑定 切り込み隊 v6.10</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.5}
button{font-size:16px;padding:10px 12px;margin:4px 0;border-radius:10px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<h1>🔎 N0175GW lastup捕捉鑑定 v6.10</h1>
<p>「作品を直接ncode指定」せず、<code>lastup</code>期間検索からN0175GWを捕捉できるか確認する。</p>

<p class="small">
既知値：N0175GW / general_lastup = 2026-09-17 23:09:11 / general_all_no = 210
</p>

<button id="run">▶ N0175GW捕捉テスト開始</button>
<button id="copy">📋 結果をコピー</button>
<button id="clear">🗑 結果クリア</button>
<pre id="log">【待機中】</pre>

<script>
const API="https://api.syosetu.com/novel18api/api/";
const TARGET="N0175GW";
let logs=[];

function add(x){
  logs.push(new Date().toLocaleTimeString()+" "+x);
  document.getElementById("log").textContent=logs.join("\\n");
}
function unixLocal(y,m,d,h,min,s){
  return Math.floor(new Date(y,m-1,d,h,min,s).getTime()/1000);
}
function jsonp(url,timeout=30000){
  return new Promise((resolve,reject)=>{
    const cb=(url.match(/callback=([^&]+)/)||[])[1];
    const script=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>{
      if(done)return; done=true; cleanup(); reject(new Error("timeout"));
    },timeout);
    window[cb]=data=>{
      if(done)return; done=true; clearTimeout(timer); cleanup(); resolve(data);
    };
    function cleanup(){delete window[cb];script.remove();}
    script.src=url;
    script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);cleanup();reject(new Error("script error"));};
    document.body.appendChild(script);
  });
}
async function test(name,start,end,lim){
  const cb="tomotaYomuCapture_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const url=API+"?lastup="+start+"-"+end+"&of=n-gl-ga&lim="+lim+"&out=jsonp&callback="+cb;
  add("【開始】"+name);
  add("URL: "+url);
  const t=performance.now();
  try{
    const data=await jsonp(url);
    const ms=Math.round(performance.now()-t);
    const rows=Array.isArray(data)?data.slice(1):[];
    const hits=rows.filter(x=>String(x.ncode).toUpperCase()===TARGET);
    add("✅ SUCCESS / "+ms+" ms / allcount="+data[0].allcount+" / rows="+rows.length);
    add("N0175GW捕捉: "+(hits.length>0?"YES":"NO"));
    if(hits.length){
      hits.forEach(x=>add("  HIT: "+JSON.stringify(x)));
    }
    return true;
  }catch(e){
    add("❌ ERROR: "+e.message);
    return false;
  }
}
async function run(){
  logs=[];
  add("【開始】R18 / N0175GW lastup捕捉");
  add("対象: "+TARGET);
  add("既知 general_lastup: 2026-09-17 23:09:11");
  add("既知 general_all_no: 210");

  // 既知日時を中央に置く。
  const a=unixLocal(2026,9,17,0,0,0);
  const b=unixLocal(2026,9,18,23,59,59);
  await test("A / 2026-09-17 00:00 ～ 09-18 23:59",a,b,500);

  // 念のため前後を広げる。
  const c=unixLocal(2026,9,1,0,0,0);
  const d=unixLocal(2026,9,20,23,59,59);
  await test("B / 2026-09-01 00:00 ～ 09-20 23:59",c,d,500);

  add("────────────");
  add("【テスト完了】");
  add("A/Bのlastup期間検索からN0175GWを捕捉できるかの鑑定は完了。");
}
document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(logs.join("\n"));add("📋 コピー完了");}
  catch(e){add("❌ コピー失敗: "+e.message);}
};
document.getElementById("clear").onclick=()=>{
  logs=[];document.getElementById("log").textContent="【待機中】";
};
</script>
</body>
</html>
