<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜あらすじ補完</title>
<style>
:root{color-scheme:light;--bg:#f6f3ed;--card:#fffdf9;--ink:#38372f;--muted:#77756b;--line:#e5dfd3;--accent:#56765c;--soft:#eaf0e8;--warn:#fff2d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:0 0 5px}
p{margin:8px 0}
.sub{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
button{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:1rem;font-weight:700;background:var(--accent);color:white;margin-top:12px}
button.secondary{background:#e9e5dc;color:var(--ink)}
button:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:#f2eee5;border-radius:12px;padding:12px}
.num{font-size:1.45rem;font-weight:750;display:block}
.label{font-size:.82rem;color:var(--muted)}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
#log{max-height:240px;overflow:auto;font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere;background:#f2eee5;border-radius:10px;padding:10px}
.note{font-size:.88rem}
.warning{background:var(--warn);border-radius:10px;padding:10px;font-size:.88rem}
</style>
</head>
<body>
<main>
<h1>📖 あらすじ補完</h1>
<p class="sub">ともたよむ｜救済専用ツール</p>
<div class="card">
<p><strong>あらすじが未取得の作品だけ</strong>を公式APIで調べ、既存の作品情報に補完します。</p>
<p class="note">棚所属・読書位置・作者情報などは変更しません。通常の更新処理やAtom自動化にも触れません。</p>
<div class="warning">処理中はこのページを閉じずに待ってね。作品数やAPIの応答状況によって時間がかかることがあります。</div>
<button id="scanBtn">① 本棚を調べる</button>
<div class="stats">
<div class="stat"><span class="num" id="total">—</span><span class="label">作品情報件数</span></div>
<div class="stat"><span class="num" id="missing">—</span><span class="label">あらすじ未取得</span></div>
</div>
<button id="repairBtn" disabled>② 未取得のあらすじを補完</button>
<button id="backBtn" class="secondary">ともたよむ本棚へ戻る</button>
</div>
<div class="card">
<strong>処理状況</strong>
<p id="status" role="status">まず「本棚を調べる」を押してね。</p>
<div id="log">ここに結果が表示されます。</div>
</div>
</main>
<script>
"use strict";
const DB_NAME="tomotaYomuDB";
const DB_VERSION=1;
const API_URL="https://api.syosetu.com/novelapi/api/";
const R18_API_URL="https://api.syosetu.com/novel18api/api/";
const CHUNK_SIZE=300;
let missingWorks=[];
let busy=false;

function setStatus(s){document.getElementById("status").textContent=s}
function logLine(s){const el=document.getElementById("log");if(el.textContent==="ここに結果が表示されます。")el.textContent="";el.textContent+=(el.textContent?"\n":"")+s;el.scrollTop=el.scrollHeight}
function setLog(s){document.getElementById("log").textContent=s}
function setBusy(v){busy=v;document.getElementById("scanBtn").disabled=v;document.getElementById("repairBtn").disabled=v||missingWorks.length===0}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"))})}
function readAll(db,name){return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(name,"readonly")}catch(e){reject(e);return}const out=[],r=tx.objectStore(name).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error(name+"の読込失敗"))})}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="tySynopsisCb_"+Date.now()+"_"+Math.random().toString(36).slice(2);const s=document.createElement("script");let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};const timer=setTimeout(()=>{cleanup();reject(new Error("API応答タイムアウト"))},20000);window[cb]=data=>{cleanup();resolve(data)};s.onerror=()=>{cleanup();reject(new Error("API読み込み失敗"))};s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();document.head.appendChild(s)})}
function ncodeOf(w){return String(w&&w.ncode||"").trim().toUpperCase()}
async function scan(){if(busy)return;setBusy(true);document.getElementById("repairBtn").disabled=true;setLog("");setStatus("IndexedDBの本棚を確認中…");try{const db=await openDB();try{const works=await readAll(db,"works_cache");missingWorks=works.filter(w=>ncodeOf(w)&&!String(w.story||"").trim());document.getElementById("total").textContent=works.length.toLocaleString("ja-JP");document.getElementById("missing").textContent=missingWorks.length.toLocaleString("ja-JP");setStatus(missingWorks.length? "確認完了。未取得作品だけ補完できるよ。":"確認完了。あらすじ未取得の作品は見つかりませんでした。");setLog("確認日時："+new Date().toLocaleString("ja-JP")+"\n作品情報："+works.length+"件\nあらすじ未取得："+missingWorks.length+"件");}finally{db.close()}}catch(e){missingWorks=[];setStatus("確認できませんでした："+(e.message||e));logLine("本棚を変更していません。")}finally{setBusy(false)}}
function chunks(arr,size){const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out}
async function fetchChunk(api,codes){const url=api+"?ncode="+encodeURIComponent(codes.join("-"))+"&of=n-s&lim="+codes.length;const data=await jsonp(url);if(!Array.isArray(data))return [];return data.filter(x=>x&&x.ncode).map(x=>({ncode:ncodeOf(x),story:String(x.story||"")}))}
async function fetchWorksForGroup(items,api,alternateApi,label){const found=new Map();const batches=chunks(items,CHUNK_SIZE);for(let i=0;i<batches.length;i++){setStatus(label+"を取得中… "+(i+1)+"/"+batches.length+"組");const rows=await fetchChunk(api,batches[i].map(ncodeOf));for(const row of rows)if(row.story.trim())found.set(row.ncode,row.story)}const remaining=items.filter(w=>!found.has(ncodeOf(w)));if(remaining.length){const retryBatches=chunks(remaining,CHUNK_SIZE);for(let i=0;i<retryBatches.length;i++){setStatus(label+"の未取得分を別APIで再確認中… "+(i+1)+"/"+retryBatches.length+"組");try{const rows=await fetchChunk(alternateApi,retryBatches[i].map(ncodeOf));for(const row of rows)if(row.story.trim())found.set(row.ncode,row.story)}catch(e){logLine("別APIでの再確認失敗："+(e.message||e))}}}return found}
async function writeStories(stories){const db=await openDB();let saved=0,skipped=0;try{for(const [ncode,story] of stories){await new Promise((resolve,reject)=>{let tx;try{tx=db.transaction("works_cache","readwrite")}catch(e){reject(e);return}const st=tx.objectStore("works_cache");const req=st.get(ncode);req.onsuccess=()=>{const current=req.result;if(!current){skipped++;return}if(String(current.story||"").trim()){skipped++;return}const updated={...current,story};try{if(st.keyPath==null)st.put(updated,ncode);else st.put(updated)}catch(e){try{tx.abort()}catch(_){}reject(e)}};req.onerror=()=>{try{tx.abort()}catch(_){}reject(req.error||new Error(ncode+"の読込失敗"))};tx.oncomplete=()=>{if(req.result&& !String(req.result.story||"").trim())saved++;resolve()};tx.onerror=()=>reject(tx.error||new Error(ncode+"の保存失敗"));tx.onabort=()=>reject(tx.error||new Error(ncode+"の保存中止"))})}return {saved,skipped}}finally{db.close()}}
async function repair(){if(busy||!missingWorks.length)return;const initial=[...missingWorks];if(!confirm("あらすじ未取得の"+initial.length+"作品を調べます。取得できたあらすじだけを保存し、ほかの作品情報は変更しません。実行しますか？"))return;setBusy(true);setLog("");let fetched=new Map();let saved=0;try{const normal=initial.filter(w=>w.__r18!==true);const r18=initial.filter(w=>w.__r18===true);if(normal.length){const m=await fetchWorksForGroup(normal,API_URL,R18_API_URL,"全年齢作品");for(const [k,v] of m)fetched.set(k,v)}if(r18.length){const m=await fetchWorksForGroup(r18,R18_API_URL,API_URL,"R18作品");for(const [k,v] of m)fetched.set(k,v)}logLine("APIであらすじを取得："+fetched.size+"件");if(fetched.size){setStatus("取得したあらすじを本棚に保存中…");const result=await writeStories(fetched);saved=result.saved;logLine("保存："+saved+"件");logLine("保存前に状態が変わっていた等で見送り："+result.skipped+"件")}const notFound=initial.length-fetched.size;logLine("取得できなかった作品："+notFound+"件（既存データは保持）");setStatus("補完処理が完了しました。保存："+saved+"件／取得できず："+notFound+"件");}catch(e){setStatus("処理中にエラーが発生しました："+(e.message||e));logLine("途中まで保存された分はそのまま残っています。もう一度調べると未取得分だけ再実行できます。")}finally{setBusy(false);try{await scan()}catch(_){} }}
document.getElementById("scanBtn").addEventListener("click",scan);
document.getElementById("repairBtn").addEventListener("click",repair);
document.getElementById("backBtn").addEventListener("click",()=>{location.href="./"});
</script>
</body>
</html>
