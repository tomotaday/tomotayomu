<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ｜v2.1.2.5 R18作者XID実験</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;padding:16px;line-height:1.5}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:17px;margin:20px 0 8px}
input,button{font-size:16px;padding:10px;border-radius:8px}
input{width:100%;box-sizing:border-box;margin:4px 0 8px}
button{margin:4px 4px 4px 0}
pre{white-space:pre-wrap;word-break:break-all;background:#f5f5f5;padding:10px;border-radius:8px}
.ok{font-weight:700}
</style>
</head>
<body>
<h1>ともたよむ<br>v2.1.2.5｜R18作者XID実験</h1>

<label>XID</label>
<input id="xid" value="X8754CQ" autocomplete="off">
<div>
<button id="run">作者作品を取得</button>
<button id="copy">診断結果をコピー</button>
</div>

<h2>診断結果</h2>
<pre id="result">未実行</pre>

<h2>作品一覧</h2>
<div id="works">未実行</div>

<script>
const resultEl=document.getElementById("result");
const worksEl=document.getElementById("works");
let lastText="";

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="tomotaYomu_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("JSONP timeout"));},20000);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
    window[cb]=data=>{cleanup();resolve(data);};
    script.onerror=()=>{cleanup();reject(new Error("JSONP load error"));};
    script.src=url+"&callback="+cb;
    document.head.appendChild(script);
  });
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function status(w){
  if(String(w.noveltype)==="2") return "短編";
  return String(w.end)==="0" ? "完結" : "連載中";
}

async function run(){
  const xid=document.getElementById("xid").value.trim().toUpperCase();
  resultEl.textContent="取得中…";
  worksEl.textContent="";
  const url="https://api.syosetu.com/novel18api/api/?out=jsonp&of=n-t-w-gl-ga-nt-e&xid="+encodeURIComponent(xid)+"&lim=500";
  try{
    const data=await jsonp(url);
    const rows=Array.isArray(data)?data:[];
    const works=rows.slice(1);
    const target=works.find(w=>String(w.ncode||"").toUpperCase()==="N4561MJ");
    const lines=[
      "【ともたよむ v2.1.2.5｜R18作者XID実験】",
      "XID="+xid,
      "HTTP=JSONP成功",
      "取得件数="+works.length,
      "N4561MJ="+(target?"あり":"なし"),
      "API="+url
    ];
    lastText=lines.join("\n");
    resultEl.textContent=lastText;
    worksEl.innerHTML=works.length
      ? works.map(w=>"<div style='padding:8px 0;border-bottom:1px solid #ddd'><b>"+esc(w.ncode)+"</b> "+esc(w.title)+"<br>writer="+esc(w.writer)+" / "+status(w)+" / 最終掲載="+esc(w.general_lastup)+" / 全話="+esc(w.general_all_no)+"</div>").join("")
      : "0件";
  }catch(e){
    lastText=[
      "【ともたよむ v2.1.2.5｜R18作者XID実験】",
      "XID="+xid,
      "取得失敗="+e.message,
      "JSONPでR18 APIへ接続しました。",
      "API="+url
    ].join("\n");
    resultEl.textContent=lastText;
    worksEl.textContent="取得できませんでした。";
  }
}

document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
  if(!lastText) lastText=resultEl.textContent;
  await navigator.clipboard.writeText(lastText);
  alert("診断結果をコピーしました。");
};
</script>
</body>
</html>
