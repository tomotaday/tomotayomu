<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ 広域collectRange診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:16px;line-height:1.5}
button{width:100%;padding:14px;margin:8px 0;font-size:16px}
textarea{width:100%;min-height:520px;box-sizing:border-box;font:13px/1.5 monospace}
</style>
</head>
<body>
<h2>🔬 修正後・広域 collectRange 診断</h2>
<p>本体の更新保存・カード更新・更新棚生成は行いません。R18 APIのみ。</p>
<button id="runBtn" type="button">🔬 広域診断開始</button>
<button id="copyBtn" type="button">📋 テスト結果をコピー</button>
<textarea id="result" readonly></textarea>

<script>
const API="https://api.syosetu.com/novel18api/api/";
const MAX_ST=2000;
const result=document.getElementById("result");
const runBtn=document.getElementById("runBtn");
const copyBtn=document.getElementById("copyBtn");

function log(s){
  result.value += s + "\n";
  result.scrollTop=result.scrollHeight;
}

function range(a,b){
  return Math.floor(a)+"-"+Math.floor(b);
}

function jsonp(url,timeout=15000){
  return new Promise((resolve,reject)=>{
    const cb="tomotaWide_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>{
      if(done)return;
      done=true; cleanup();
      reject(new Error("JSONP timeout"));
    },timeout);
    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      s.remove();
    }
    window[cb]=data=>{
      if(done)return;
      done=true; cleanup(); resolve(data);
    };
    s.onerror=()=>{
      if(done)return;
      done=true; cleanup();
      reject(new Error("JSONP script error"));
    };
    s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();
    document.head.appendChild(s);
  });
}

let callNo=0;
let zeroNo=0;
let leafNo=0;
let totalRows=0;
let maxDepth=0;

async function collectWide(a,b,depth=0){
  callNo++;
  maxDepth=Math.max(maxDepth,depth);

  const u=range(a,b);
  log("COUNT #"+callNo+" depth="+depth);
  log("  "+new Date(a*1000).toLocaleString("ja-JP")+" ～ "+new Date(b*1000).toLocaleString("ja-JP"));
  log("  lastup="+u);

  let d;
  try{
    d=await jsonp(API+"?lastup="+u+"&of=n-gl-ga-e-e&lim=1&st=1");
  }catch(e){
    log("  !! COUNT ERROR = "+(e?.message||String(e)));
    throw e;
  }

  const n=Number(d?.[0]?.allcount||0);
  log("  allcount="+n);

  if(n===0){
    zeroNo++;
    return [];
  }

  if(n<=MAX_ST){
    leafNo++;
    const all=[];
    for(let st=1;st<=n;st+=500){
      const lim=Math.min(500,n-st+1);
      log("  DATA st="+st+" lim="+lim);
      let d2;
      try{
        d2=await jsonp(API+"?lastup="+u+"&of=n-gl-ga-e-e&lim="+lim+"&st="+st);
      }catch(e){
        log("  !! DATA ERROR st="+st+" = "+(e?.message||String(e)));
        throw e;
      }
      const rows=Array.isArray(d2)?d2.slice(1).filter(x=>x&&x.ncode):[];
      log("  rows="+rows.length);
      all.push(...rows);
      totalRows+=rows.length;
    }
    return all;
  }

  if(depth>=20)throw new Error("lastup時間分割上限");

  const m=Math.floor((a+b)/2);
  log("  → 時間分割 midpoint="+m);

  const left=await collectWide(a,m,depth+1);
  const right=await collectWide(m+1,b,depth+1);
  return left.concat(right);
}

runBtn.addEventListener("click",async()=>{
  result.value="";
  runBtn.disabled=true;
  callNo=zeroNo=leafNo=totalRows=maxDepth=0;

  log("【広域診断開始】");
  log("本体と同じ考え方で、R18 APIの時間分割だけを検証");
  log("API = "+API);
  log("────────────");

  try{
    const start=Math.floor(new Date("2010-05-18T18:51:08+09:00").getTime()/1000);
    const end=Math.floor(new Date("2026-09-30T04:46:23+09:00").getTime()/1000);

    log("start = "+start+" / "+new Date(start*1000).toLocaleString("ja-JP"));
    log("end   = "+end+" / "+new Date(end*1000).toLocaleString("ja-JP"));
    log("range = "+range(start,end));
    log("────────────");

    const rows=await collectWide(start,end);

    const unique=[...new Map(rows.map(x=>[String(x.ncode||"").toUpperCase(),x])).values()];
    const hit=unique.find(x=>String(x.ncode||"").toUpperCase()==="N6117JH");

    log("────────────");
    log("【集計】");
    log("countRange呼出回数 = "+callNo);
    log("0件期間 = "+zeroNo);
    log("最終葉 = "+leafNo);
    log("最大depth = "+maxDepth);
    log("総取得rows = "+rows.length);
    log("重複除去後 = "+unique.length);
    log("N6117JH = "+(hit?"捕捉":"未捕捉"));
    if(hit)log("N6117JH lastup = "+hit.general_lastup);
    log("【診断完了】");
  }catch(e){
    log("────────────");
    log("【診断中断】");
    log("ERROR = "+(e?.message||String(e)));
    log("この時点までのcountRange呼出回数 = "+callNo);
    log("0件期間 = "+zeroNo);
    log("最終葉 = "+leafNo);
  }finally{
    runBtn.disabled=false;
  }
});

copyBtn.addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(result.value);
    copyBtn.textContent="✅ コピーしました";
    setTimeout(()=>copyBtn.textContent="📋 テスト結果をコピー",1200);
  }catch(e){
    result.select();
    document.execCommand("copy");
    copyBtn.textContent="✅ コピーしました";
    setTimeout(()=>copyBtn.textContent="📋 テスト結果をコピー",1200);
  }
});

log("ページ読み込み完了。");
log("「🔬 広域診断開始」を押してください。");
</script>
</body>
</html>
