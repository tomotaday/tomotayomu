<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜本棚管理</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.5}
main{width:min(100%,720px);margin:auto;padding:20px 14px 44px}
h1{font-size:25px;margin:0 0 3px}.note{font-size:13px;color:var(--muted);margin-bottom:10px}
.source{font-size:12px;padding:7px 9px;border:1px solid #c8c0b5;border-radius:8px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button{border:1px solid #c8c0b5;border-radius:8px;background:transparent;padding:7px 11px;font-size:14px;color:var(--ink)}
#status{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0 14px}
#shelfList{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none}
.head{display:flex;align-items:center;gap:10px;padding:10px 11px;min-height:50px}
.handle{font-size:22px;line-height:1;color:#777;width:30px;text-align:center;user-select:none;-webkit-user-select:none;cursor:grab}
.name{font-size:16px;font-weight:700;flex:1}.name.unused{color:#aaa;font-weight:400}.nameInput{width:100%;border:0;border-bottom:1px solid #c8c0b5;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:2px 0;outline:none}
.order{font-size:12px;color:#999;width:24px;text-align:right}.count{font-size:12px;color:#888;white-space:nowrap}
.deleteBtn{font-size:12px;padding:5px 7px;border-color:#c8c0b5}
.row.dragging{opacity:.45}.row.drop-before{border-top:3px solid #777}.row.drop-after{border-bottom:3px solid #777}
.body{display:none;border-top:1px solid #d5cec4;padding:11px 13px 13px;background:#faf7f1}
.row.open .body{display:block}
.shelfId{font-size:11px;color:#888;margin-bottom:9px;word-break:break-all}
.work{padding:8px 0;border-top:1px solid #ddd5ca}.work:first-child{border-top:0;padding-top:0}
.workTitle{font-size:14px;font-weight:600}.workMeta{font-size:11px;color:#888;margin-top:2px}
.empty{font-size:13px;color:#999}.more{font-size:12px;color:#777;margin-top:8px}
.hint{font-size:12px;color:#777;margin:14px 2px}
</style>
</head>
<body>
<p style="margin:0 0 14px"><a href="index.html" style="display:inline-block;padding:9px 12px;border-radius:8px;background:#eee;color:#111;text-decoration:none">← ともたよむ本棚へ戻る</a></p>

<main>
<h1>📚 本棚管理</h1>
<div class="note">既存のIndexedDBを読み込み、本棚の構成・表示順を管理します。</div>
<div class="source">データ源：tomotaYomuDB → shelf_names / shelf_placement / works_cache　｜　CSV再読込なし</div>
<div class="toolbar"><button id="addBtn" type="button">➕ 本棚を追加</button><button id="saveBtn" type="button">表示順を保存</button><button id="resetBtn" type="button">初期順に戻す</button></div>
<div id="status">IndexedDBから棚情報を読み込み中…</div>
<div id="shelfList"></div>
<div class="hint">➕で本棚を追加できます。棚をタップすると中身を確認できます。☰ は並べ替え用です。棚名はその場で変更できます。📥登録先で作品登録ショートカットの保存先を指定します。登録先は棚名ではなく固定IDに紐づくため、名前変更後も引き継がれます。空棚には削除ボタンが表示されます。</div>
</main>
<script>
const DB_NAME="tomotaYomuDB",DB_VERSION=1;
const STORES={shelves:"shelf_names",placements:"shelf_placement",works:"works_cache"};
const DESIRED_ORDER=["読書中","あ〜お","か〜こ","さ〜そ","た〜と","な〜の","は〜ほ","ま〜も","や〜ん","更新待ち"];
const MIXED_ORDER_KEY="tomotaYomu_mixed_shelf_order_v1";
const SYSTEM_SHELVES=[{key:"system:search",name:"🔎 検索"},{key:"system:authors",name:"👤作者"},{key:"system:works",name:"✨新着作品"},{key:"system:note",name:"📝 note"},{key:"system:tomota-memo",name:"🗂️ ともためも"},
{key:"system:search-excluded",name:"🚫 検索除外"},{key:"system:all",name:"📚 全作品"},{key:"system:history",name:"🗄️ 履歴"},{key:"system:unclassified",name:"未分類"},{key:"system:management",name:"⚙️ 管理設定用"}];
let db=null,shelves=[],placements=[],rows=[],dragRow=null,dragPointerId=null;
let countMap=new Map();

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"))})}
function readAll(name){return new Promise((resolve,reject)=>{const tx=db.transaction(name,"readonly"),st=tx.objectStore(name),out=[];const req=st.openCursor();req.onsuccess=()=>{const c=req.result;if(c){out.push(c.value);c.continue()}else resolve(out)};req.onerror=()=>reject(req.error||new Error(name+"読込失敗"))})}
function shelfText(v){if(!v)return "";const direct=v.shelf_name??v.name??v.title??v.label??v.display_name;if(direct!=null&&String(direct).trim())return String(direct).trim();const hit=Object.values(v).find(x=>typeof x==="string"&&/読書中|未分類|あ〜お|か〜こ|さ〜そ|た〜と|な〜の|は〜ほ|ま〜も|や〜ん|更新待ち/.test(x));return String(hit??"").trim()}
function core(raw){const s=String(raw||"").replace(/[🟠🔵🌀🎈📚⏰]/g,"").replace(/\s+/g,"");if(s.includes("読書中"))return"読書中";if(s.includes("未分類"))return"未分類";for(const k of DESIRED_ORDER.slice(1))if(s.includes(k)||s.includes(k.replace("〜","-")))return k;return""}
function label(c){if(c==="読書中")return"🟠読書中";if(c==="更新待ち")return"⏰更新待ち";if(c==="未分類")return"未分類";return c?"🎈"+c:"（未使用）"}
function getId(v){return String(v?.shelf_id??"").trim()}
function placementShelf(v){return String(v?.shelf_id??v?.shelfId??"").trim()}
function placementN(v){return String(v?.ncode??v?.Ncode??"").trim().toUpperCase()}
function workN(v){return String(v?.ncode??"").trim().toUpperCase()}
function workTitle(v){return String(v?.title??v?.novel_title??v?.name??"（タイトル未取得）").trim()}

function buildIndexes(){
  countMap=new Map();
  placements.forEach(p=>{
    const id=placementShelf(p);if(!id)return;
    countMap.set(id,(countMap.get(id)||0)+1);
  });
}
function setOrderInitial(){
 const customs=[];
 if(shelves.some(v=>Number.isFinite(Number(v.display_order))))shelves.slice().sort((a,b)=>(Number(a.display_order)||999999)-(Number(b.display_order)||999999)).forEach(v=>customs.push({kind:"shelf",shelf:v,core:core(shelfText(v)),key:"custom:"+getId(v)}));
 else{const active=new Map();shelves.forEach(v=>{const id=getId(v),c=core(shelfText(v));if(id&&c&&!active.has(c))active.set(c,v)});const used=new Set();DESIRED_ORDER.forEach(c=>{const v=active.get(c);if(v){customs.push({kind:"shelf",shelf:v,core:c,key:"custom:"+getId(v)});used.add(getId(v))}});shelves.forEach(v=>{const id=getId(v);if(id&&!used.has(id)){customs.push({kind:"shelf",shelf:v,core:core(shelfText(v)),key:"custom:"+id});used.add(id)}})}
 const systems=SYSTEM_SHELVES.map(v=>({kind:"system",key:v.key,name:v.name})),defaults=["system:search","system:authors","system:works","system:note",...customs.map(r=>r.key),"system:all","system:history","system:unclassified","system:management"];
 let saved=[];try{saved=JSON.parse(localStorage.getItem(MIXED_ORDER_KEY)||"[]");if(!Array.isArray(saved))saved=[]}catch(e){saved=[]}
 const lookup=new Map([...systems,...customs].map(r=>[r.key,r])),order=[...saved.filter(k=>lookup.has(k)),...defaults.filter(k=>lookup.has(k)&&!saved.includes(k)),...customs.map(r=>r.key).filter(k=>!saved.includes(k))];
 rows=[];const seen=new Set();order.forEach(k=>{const r=lookup.get(k);if(r&&!seen.has(k)){rows.push(r);seen.add(k)}});[...systems,...customs].forEach(r=>{if(!seen.has(r.key)){rows.push(r);seen.add(r.key)}});
}
function render(){
 const list=document.getElementById("shelfList");list.innerHTML="";
 rows.forEach((r,i)=>{const el=document.createElement("div");el.className="row"+(r.kind==="system"?" systemRow":"");el.dataset.index=String(i);
 const id=r.kind==="shelf"?getId(r.shelf):"",name=r.kind==="system"?r.name:(shelfText(r.shelf)||label(r.core||core(shelfText(r.shelf)))),count=r.kind==="shelf"?(countMap.get(id)||0):0;
 const head=document.createElement("div");head.className="head";const h=document.createElement("div");h.className="handle";h.textContent="☰";h.setAttribute("aria-label","棚を並べ替える");const nm=document.createElement("div");nm.className="name";
 if(r.kind==="system"){const fixed=document.createElement("div");fixed.className="nameInput fixedName";fixed.textContent=name;nm.appendChild(fixed)}else{const inp=document.createElement("input");inp.className="nameInput";inp.type="text";inp.value=name;inp.setAttribute("aria-label","本棚名");inp.addEventListener("click",e=>e.stopPropagation());inp.addEventListener("pointerdown",e=>e.stopPropagation());nm.appendChild(inp)}
 const ct=document.createElement("div");ct.className="count";ct.textContent=r.kind==="system"?"システム棚":count+"作品";const ord=document.createElement("div");ord.className="order";ord.textContent=String(i+1);head.append(h,nm,ct);
 if(r.kind==="shelf"){const targetBtn=document.createElement("button");targetBtn.className="deleteBtn";targetBtn.type="button";targetBtn.textContent=r.shelf.work_add_target===true?"📥登録先✓":"📥登録先";targetBtn.style.borderColor=r.shelf.work_add_target===true?"#4b8b67":"#c8c0b5";targetBtn.addEventListener("click",e=>{e.stopPropagation();setWorkAddTarget(id,name)});head.appendChild(targetBtn);if(count===0){const del=document.createElement("button");del.className="deleteBtn";del.type="button";del.textContent="🗑削除";del.addEventListener("click",e=>{e.stopPropagation();deleteEmptyShelf(id,name)});head.appendChild(del)}}
 head.appendChild(ord);const body=document.createElement("div");body.className="body";const sid=document.createElement("div");sid.className="shelfId";sid.textContent=r.kind==="system"?"固定システム棚。名称変更・削除はできません。":"shelf_id："+id;body.appendChild(sid);const note=document.createElement("div");note.className="empty";note.textContent=r.kind==="system"?"棚の位置だけを変更します。機能や作品の所属判定は変更しません。":(count?"作品情報を表示するには棚をタップしてください。":"この棚に所属する作品はありません");body.appendChild(note);el.append(head,body);h.addEventListener("pointerdown",startDrag);if(r.kind==="shelf")head.addEventListener("click",async e=>{if(e.target===h||e.target.closest("button")||e.target.closest("input"))return;const opening=!el.classList.contains("open");el.classList.toggle("open");if(opening&&count)await loadShelfWorks(id,body)});list.appendChild(el);
 });
}
async function addShelf(){
  const name=prompt("新しい本棚名を入力してください。","仮保存");
  if(name===null)return;
  const newName=String(name).trim();
  if(!newName){document.getElementById("status").textContent="本棚名を空欄にはできません。";return}
  const nameKey=value=>String(value||"").replace(/[🟠🔵🌀🎈📚⏰🔎✍️🗄️⚙️]/gu,"").replace(/\s+/g,"").trim();
  const key=nameKey(newName);
  if(SYSTEM_SHELVES.some(v=>nameKey(v.name)===key)||shelves.some(v=>nameKey(shelfText(v))===key)){document.getElementById("status").textContent="同名の本棚があります：「"+newName+"」";return}
  const id="shelf_"+crypto.randomUUID().replace(/-/g,"").slice(0,12);
  const maxOrder=shelves.reduce((m,v)=>Math.max(m,Number(v.display_order)||0),0);
  const row={shelf_id:id,shelf_name:newName,display_order:maxOrder+1};
  try{
    const tx=db.transaction(STORES.shelves,"readwrite");tx.objectStore(STORES.shelves).put(row);
    await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("追加中止"))});
    shelves.push(row);setOrderInitial();render();document.getElementById("status").textContent=newName+" を追加しました。";
  }catch(e){document.getElementById("status").textContent="追加失敗："+e.message}
}
async function setWorkAddTarget(id,name){
  if(!id)return;
  try{
    const tx=db.transaction(STORES.shelves,"readwrite");
    const st=tx.objectStore(STORES.shelves);
    const updated=shelves.map(v=>({...v,work_add_target:getId(v)===id}));
    updated.forEach(v=>st.put(v));
    await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("登録先変更中止"))});
    shelves=updated;
    const byId=new Map(updated.map(v=>[getId(v),v]));
    rows=rows.map(r=>({...r,shelf:byId.get(getId(r.shelf))||r.shelf}));
    render();
    document.getElementById("status").textContent="作品登録先を「"+name+"」に設定しました。棚名を変更しても、この設定は棚IDについていきます。";
  }catch(e){
    document.getElementById("status").textContent="作品登録先の設定失敗："+e.message;
  }
}
async function deleteEmptyShelf(id,name){
  if(!id)return;
  const ok=confirm(name+" を削除します。\n\nこの棚には作品が0件です。\n棚マスターからのみ削除します。\n\n削除しますか？");
  if(!ok)return;
  try{
    const tx=db.transaction(STORES.shelves,"readwrite");
    tx.objectStore(STORES.shelves).delete(id);
    await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("削除中止"))});
    shelves=shelves.filter(v=>getId(v)!==id);
    rows=rows.filter(r=>r.kind!=="shelf"||getId(r.shelf)!==id);
    document.getElementById("status").textContent=name+" を削除しました。空棚のみ、棚マスターから削除しています。";
    render();
  }catch(e){document.getElementById("status").textContent="削除失敗："+e.message}
}
function clearMarks(){document.querySelectorAll(".row").forEach(x=>x.classList.remove("drop-before","drop-after"))}
function startDrag(e){e.preventDefault();dragRow=e.currentTarget.closest(".row");dragPointerId=e.pointerId;dragRow.classList.add("dragging");dragRow.setPointerCapture?.(dragPointerId);document.addEventListener("pointermove",moveDrag,{passive:false});document.addEventListener("pointerup",endDrag,{once:true});document.addEventListener("pointercancel",endDrag,{once:true})}
function moveDrag(e){if(!dragRow||e.pointerId!==dragPointerId)return;e.preventDefault();clearMarks();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".row");if(!target||target===dragRow)return;const rect=target.getBoundingClientRect();target.classList.add(e.clientY<rect.top+rect.height/2?"drop-before":"drop-after")}
function endDrag(e){if(!dragRow)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".row");clearMarks();const from=Number(dragRow.dataset.index);if(target&&target!==dragRow){let to=Number(target.dataset.index);const rect=target.getBoundingClientRect();if(e.clientY>=rect.top+rect.height/2)to++;const moved=rows.splice(from,1)[0];if(from<to)to--;rows.splice(to,0,moved)}dragRow.classList.remove("dragging");dragRow=null;dragPointerId=null;document.removeEventListener("pointermove",moveDrag);render();document.getElementById("status").textContent="並べ替え中。保存するとIndexedDBへ記録します。"}
async function loadShelfWorks(id,body){
  body.querySelectorAll(".work,.more,.empty").forEach(x=>x.remove());
  const loading=document.createElement("div");loading.className="empty";loading.textContent="作品情報を読み込み中…";body.appendChild(loading);
  try{
    const all=await readAll(STORES.works);const byN=new Map(all.map(w=>[workN(w),w]));
    const ns=placements.filter(p=>placementShelf(p)===id).map(placementN).filter(Boolean);
    const items=ns.map(n=>byN.get(n)).filter(Boolean);
    loading.remove();
    if(!items.length){const e=document.createElement("div");e.className="empty";e.textContent="所属作品の情報が見つかりません。";body.appendChild(e);return}
    items.slice(0,30).forEach(w=>{const d=document.createElement("div");d.className="work";const t=document.createElement("div");t.className="workTitle";t.textContent=workTitle(w);const m=document.createElement("div");m.className="workMeta";m.textContent=workN(w);d.append(t,m);body.appendChild(d)});
    if(items.length>30){const m=document.createElement("div");m.className="more";m.textContent="ほか "+(items.length-30)+"作品";body.appendChild(m)}
  }catch(e){loading.textContent="作品情報の読み込み失敗："+e.message}
}
async function save(){
 const nameKey=value=>String(value||"").replace(/[🟠🔵🌀🎈📚⏰🔎✍️🗄️⚙️]/gu,"").replace(/\s+/g,"").trim();
 const seen=new Set(SYSTEM_SHELVES.map(v=>nameKey(v.name)));
 const rowEls=[...document.querySelectorAll("#shelfList > .row")];
 for(let i=0;i<rows.length;i++){
  const row=rows[i];
  if(row.kind==="system")continue;
  const input=rowEls[i]?.querySelector(".nameInput");
  const name=String(input?.value??shelfText(row.shelf)).trim();
  if(!name)throw new Error("棚名を空欄にはできません。");
  const key=nameKey(name);
  if(key&&seen.has(key))throw new Error("同名の棚があります：「"+name+"」");
  if(key)seen.add(key);
  row.pendingName=name;
 }
 const customRows=rows.filter(r=>r.kind==="shelf");
 const tx=db.transaction(STORES.shelves,"readwrite"),st=tx.objectStore(STORES.shelves);
 customRows.forEach((row,j)=>{
  row.shelf={...row.shelf,shelf_name:row.pendingName,display_order:j+1};
  delete row.pendingName;
  st.put(row.shelf);
 });
 await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("保存中止"))});
 shelves=customRows.map(r=>r.shelf);
 localStorage.setItem(MIXED_ORDER_KEY,JSON.stringify(rows.map(r=>r.key)));
 document.getElementById("status").textContent="保存しました。自由棚とシステム棚を含む全体順を記録しました。";
}
function resetOrder(){localStorage.removeItem(MIXED_ORDER_KEY);setOrderInitial();render();document.getElementById("status").textContent="初期順に戻しました。まだ保存はしていません。"}
async function init(){
  const status=document.getElementById("status");
  try{
    status.textContent="IndexedDB接続中…";
    await openDB();
    status.textContent="棚マスター取得中…";
    shelves=await readAll(STORES.shelves);
    setOrderInitial();
    render();
    status.textContent="棚マスター反映済み："+shelves.length+"棚";
    status.textContent+="　作品数を取得中…";
    placements=await readAll(STORES.placements);
    buildIndexes();
    render();
    status.textContent="本棚管理準備完了："+shelves.length+"棚 / "+placements.length+"配置";
  }catch(e){
    console.error(e);
    status.textContent="読み込み失敗："+e.message;
  }
}
document.getElementById("addBtn").addEventListener("click",()=>addShelf());
document.getElementById("saveBtn").addEventListener("click",()=>save().catch(e=>document.getElementById("status").textContent="保存失敗："+e.message));
document.getElementById("resetBtn").addEventListener("click",resetOrder);init();
</script>
</body>
</html>
