<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ・受信確認</title>
<style>
body{margin:0;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f7f5ef;color:#222}
main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d8d2c5;border-radius:18px;padding:24px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 24px}
.row{margin:18px 0}.label{color:#777;font-size:14px}.value{font-size:24px;font-weight:700;margin-top:4px;word-break:break-all}
.status{margin-top:22px;padding:14px;border-radius:12px;background:#f2f0ea;font-weight:700}
.note{margin-top:24px;padding:14px;background:#f2f0ea;border-radius:12px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>📚 ともたよむ・受信確認</h1>
<div class="row"><div class="label">Nコード</div><div class="value" id="ncode">（未受信）</div></div>
<div class="row"><div class="label">話数</div><div class="value" id="episode">（未受信）</div></div>
<div class="status" id="status">URLの受信データを確認中…</div>
<div class="note">
Shortcutから渡されたURLパラメータを表示するだけの実験ページです。<br>
localStorageへの保存や、ともたよむ本体の変更は行いません。
</div>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const ncode = p.get("ncode") || "";
  const episode = p.get("episode") || "";
  document.getElementById("ncode").textContent = ncode || "（未受信）";
  document.getElementById("episode").textContent = episode || "（未受信）";
  document.getElementById("status").textContent =
    ncode && episode
      ? "📨 URLからNコードと話数を受信しました"
      : "📭 受信データがありません";
})();
</script>
</main>
</body>
</html>
