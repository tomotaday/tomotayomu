<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜本棚管理テスト</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.5}
main{width:min(100%,720px);margin:auto;padding:20px 14px 44px}
h1{font-size:25px;margin:0 0 3px}
.note{font-size:13px;color:var(--muted);margin-bottom:18px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button{border:1px solid #c8c0b5;border-radius:8px;background:transparent;padding:7px 11px;font-size:14px;color:var(--ink)}
#status{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0 14px}
#shelfList{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:50px;touch-action:none}
.handle{font-size:22px;line-height:1;color:#777;width:30px;text-align:center;user-select:none;-webkit-user-select:none;cursor:grab}
.name{font-size:16px;font-weight:700;flex:1}
.name.unused{color:#aaa;font-weight:400}
.order{font-size:12px;color:#999;width:24px;text-align:right}
.row.dragging{opacity:.45}
.row.drop-before{border-top:3px solid #777}
.row.drop-after{border-bottom:3px solid #777}
.hint{font-size:12px;color:#777;margin:14px 2px}
</style>
</head>
<body>
<main>
<h1>📚 本棚管理</h1>
<div class="note">テスト版｜棚の表示順だけを変更します。作品の所属棚は変更しません。</div>
<div class="toolbar">
<button id="saveBtn" type="button">保存する</button>
<button id="resetBtn" type="button">初期順に戻す</button>
</div>
<div id="status">IndexedDBから棚情報を読み込み中…</div>
<div id="shelfList"></div>
<div class="hint">☰ を押したまま動かして、好きな順番に並べ替えます。保存後、index.html側がこの順番を読む設計です。</div>
</main>
<script>
const DB_NAME="tomotaYomuDB";
const DB_VERSION=1;
const STORE="shelf_names";
const DESIRED_ORDER=["読書中","あ〜お","か〜こ","さ〜そ","た〜と","な〜の","は〜ほ","ま〜も","や〜ん","更新待ち"];

let db=null;
let shelves=[];
let rows=[];
let dragRow=null;
let dragPointerId=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onsuccess=()=>{db=r.result;resolve(db)};
    r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"));
  });
}
function readAll(storeName){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readonly"),st=tx.objectStore(storeName),out=[];
    const req=st.openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){out.push(c.value);c.continue()}else resolve(out)};
    req.onerror=()=>reject(req.error||new Error(storeName+"読込失敗"));
  });
}
function shelfText(v){
  if(!v)return "";
  const direct=v.shelf_name??v.name??v.title??v.label??v.display_name;
  if(direct!=null&&String(direct).trim())return String(direct).trim();
  const values=Object.values(v);
  const hit=values.find(x=>typeof x==="string"&&/読書中|未分類|あ〜お|か〜こ|さ〜そ|た〜と|な〜の|は〜ほ|ま〜も|や〜ん|更新待ち/.test(x));
  return String(hit??"").trim();
}
function core(raw){
  const s=String(raw||"").replace(/[🟠🔵🌀🎈📚⏰]/g,"").replace(/\s+/g,"");
  if(s.includes("読書中"))return "読書中";
  if(s.includes("未分類"))return "未分類";
  for(const k of DESIRED_ORDER.slice(1))if(s.includes(k)||s.includes(k.replace("〜","-")))return k;
  return "";
}
function label(c){
  if(c==="読書中")return "🟠読書中";
  if(c==="更新待ち")return "⏰更新待ち";
  if(c==="未分類")return "未分類";
  return c?"🎈"+c:"（未使用）";
}
function getId(v){return String(v?.shelf_id??"").trim()}
function setOrderInitial(){
  const active=new Map();
  shelves.forEach(v=>{
    const id=getId(v),c=core(shelfText(v));
    if(id&&c&&!active.has(c))active.set(c,v);
  });
  const used=new Set();
  rows=[];
  DESIRED_ORDER.forEach(c=>{
    const v=active.get(c);
    if(v){rows.push({kind:"shelf",shelf:v,core:c});used.add(getId(v));}
  });
  shelves.forEach(v=>{
    const id=getId(v);
    if(id&&!used.has(id)&&!rows.some(r=>r.kind==="shelf"&&getId(r.shelf)===id)){
      rows.push({kind:"shelf",shelf:v,core:core(shelfText(v))});
      used.add(id);
    }
  });
  while(rows.length<Math.max(17,shelves.length))rows.push({kind:"unused"});
}
function render(){
  const list=document.getElementById("shelfList");
  list.innerHTML="";
  rows.forEach((r,i)=>{
    const el=document.createElement("div");
    el.className="row";
    el.dataset.index=String(i);
    const n=document.createElement("div");
    n.className="order";
    n.textContent=String(i+1);
    const h=document.createElement("div");
    h.className="handle";
    h.textContent="☰";
    h.setAttribute("aria-label","棚を並べ替える");
    const name=document.createElement("div");
    name.className="name"+(r.kind==="unused"?" unused":"");
    name.textContent=r.kind==="unused"?"（未使用）":label(r.core||core(shelfText(r.shelf)));
    el.append(h,name,n);
    h.addEventListener("pointerdown",startDrag);
    list.appendChild(el);
  });
}
function clearMarks(){document.querySelectorAll(".row").forEach(x=>x.classList.remove("drop-before","drop-after"))}
function startDrag(e){
  e.preventDefault();
  dragRow=e.currentTarget.closest(".row");
  dragPointerId=e.pointerId;
  dragRow.classList.add("dragging");
  dragRow.setPointerCapture?.(dragPointerId);
  document.addEventListener("pointermove",moveDrag,{passive:false});
  document.addEventListener("pointerup",endDrag,{once:true});
  document.addEventListener("pointercancel",endDrag,{once:true});
}
function moveDrag(e){
  if(!dragRow||e.pointerId!==dragPointerId)return;
  e.preventDefault();
  clearMarks();
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".row");
  if(!target||target===dragRow)return;
  const rect=target.getBoundingClientRect();
  target.classList.add(e.clientY<rect.top+rect.height/2?"drop-before":"drop-after");
}
function endDrag(e){
  if(!dragRow)return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".row");
  clearMarks();
  const from=Number(dragRow.dataset.index);
  if(target&&target!==dragRow){
    let to=Number(target.dataset.index);
    const rect=target.getBoundingClientRect();
    if(e.clientY>=rect.top+rect.height/2)to++;
    const moved=rows.splice(from,1)[0];
    if(from<to)to--;
    rows.splice(to,moved);
  }
  dragRow.classList.remove("dragging");
  dragRow=null;
  dragPointerId=null;
  document.removeEventListener("pointermove",moveDrag);
  render();
  document.getElementById("status").textContent="並べ替え中。保存するとIndexedDBへ記録します。";
}
async function save(){
  const order=rows.map((r,i)=>({row:r,order:i+1})).filter(x=>x.row.kind==="shelf");
  const tx=db.transaction(STORE,"readwrite"),st=tx.objectStore(STORE);
  order.forEach(x=>{
    const v={...x.row.shelf,display_order:x.order};
    st.put(v);
  });
  await new Promise((resolve,reject)=>{
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error("保存中止"));
  });
  document.getElementById("status").textContent="保存しました。表示順をIndexedDBに記録しました。";
}
function resetOrder(){
  setOrderInitial();
  render();
  document.getElementById("status").textContent="初期順に戻しました。まだ保存はしていません。";
}
async function init(){
  try{
    await openDB();
    shelves=await readAll(STORE);
    setOrderInitial();
    render();
    document.getElementById("status").textContent="棚情報を読み込みました："+shelves.length+"件";
  }catch(e){
    console.error(e);
    document.getElementById("status").textContent="読み込み失敗："+e.message;
  }
}
document.getElementById("saveBtn").addEventListener("click",()=>save().catch(e=>document.getElementById("status").textContent="保存失敗："+e.message));
document.getElementById("resetBtn").addEventListener("click",resetOrder);
init();
</script>
</body>
</html>
