<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通常API 本体処理追跡</title><style>body{font-family:-apple-system,sans-serif;padding:16px;background:#f7f4ef;color:#222}button{padding:11px 14px;margin:5px 0}pre{white-space:pre-wrap;background:white;padding:12px;border-radius:10px;border:1px solid #bbb;line-height:1.5}</style><h2>🔎 通常API 本体処理追跡</h2><p>通常APIで取得した3作品を、本体と同じ考え方で「取得→本棚一致→基準日判定→更新候補」まで追跡します。</p><button id="run">▶ 追跡開始</button><button id="copy">📋 結果をコピー</button><pre id="out">まだ実行していません。</pre><script>const API="https://api.syosetu.com/novelapi/api/";const NC=["N7998LI","N6106LC","N1028JP"];const BASELINE="2026-09-25T00:00:00+09:00";function jsonp(url){return new Promise((resolve,reject)=>{const cb="x_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),tm=setTimeout(()=>{cl();reject(new Error("JSONP timeout"))},20000);function cl(){clearTimeout(tm);s.remove();try{delete window[cb]}catch(e){}}window[cb]=d=>{cl();resolve(d)};s.onerror=()=>{cl();reject(new Error("JSONP load error"))};s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();document.head.appendChild(s)})}async function run(){const o=document.getElementById("out");o.textContent="追跡中…";try{const u=API+"?ncode="+encodeURIComponent(NC.join("-"))+"&of=n-gl-ga-e-e&lim=500";const d=await jsonp(u);const rows=Array.isArray(d)?d.slice(1):[];const bm=new Set(NC);let s="【通常API 本体処理追跡】\n基準日="+BASELINE+"\n取得行数="+rows.length+"\n\n";rows.forEach((w,i)=>{const n=String(w.ncode||"").toUpperCase();const match=bm.has(n);const last=w.general_lastup||"";const newer=last&&new Date(last.replace(" ","T")).getTime()>new Date(BASELINE).getTime();s+=((i+1)+". "+n+"\n  API取得="+(!!w)+"\n  本棚Nコード一致="+match+"\n  lastup="+last+"\n  基準日より新しい="+newer+"\n  全話="+(w.general_all_no??"")+"\n  end="+(w.end??"")+"\n\n")});s+="【期待する判定】\nN7998LI = 更新対象\nN6106LC = 更新対象\nN1028JP = 更新対象\n\n※このページは本体localStorageを使わず、API→判定経路だけを隔離しています。";o.textContent=s}catch(e){o.textContent="ERROR："+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(document.getElementById("out").textContent);alert("コピーしました")};</script></html>
