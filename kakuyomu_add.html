<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜カクヨム作品登録</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195;--accent:#e9e4f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:24px 16px 48px}
h1{font-size:25px;margin:8px 0 4px}.note{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.status{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea,select{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical}#rawText{height:145px;min-height:110px}#workUrl{height:48px}h2{font-size:19px;margin:0 0 12px}.step{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:3px}.sectionTitle{margin:0 0 10px}.fieldHint{font-size:12px;color:var(--muted);margin:4px 0 0}
button{display:block;width:100%;min-height:50px;margin-top:14px;padding:12px 14px;border:1px solid #81769b;border-radius:10px;background:var(--accent);color:#302747;font:inherit;font-weight:800}
button:disabled{opacity:.55}
.small{font-size:12px;color:var(--muted)}
.preview{padding:12px;background:#f5f1fa;border-radius:10px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<p><a href="index.html">← ともたよむ本棚へ戻る</a></p>
<h1>📚 カクヨム作品登録</h1>
<div class="note">カクヨム作品情報ページからコピーしたテキストを貼り付け、内容を確認して登録します。登録すると、ともたよむの本棚に作品カードが追加されます。</div>

<section class="card">
<div class="step">STEP 1</div>
<h2 class="sectionTitle">作品情報を貼り付け</h2>
<label for="rawText">カクヨムからコピーした作品情報</label>
<textarea id="rawText" rows="5" placeholder="ここに作品情報テキストを貼り付け"></textarea>
</section>
<section class="card">
<div class="step">STEP 2</div>
<h2 class="sectionTitle">作品URLを貼り付け</h2>
<label for="workUrl">カクヨム作品ページのURL</label>
<input id="workUrl" type="url" inputmode="url" placeholder="https://kakuyomu.jp/works/作品ID">
<div class="fieldHint">作品ページのURLをコピーして貼り付けてね。作品IDは自動で取り出します。</div>

</section>
<section class="card">
<div class="step">STEP 3</div>
<h2 class="sectionTitle">作品情報を読み込む</h2>
<button id="parseButton" type="button">作品情報を読み込んで解析</button>
<div id="parseStatus" class="status" aria-live="polite"></div>
</section>
<section class="card">
<div class="step">STEP 4</div>
<h2 class="sectionTitle">解析結果を確認・修正</h2>
<label for="workId">作品ID（URLから自動取得）</label><input id="workId" autocomplete="off" readonly placeholder="URLから自動取得">

<label for="workTitle">作品タイトル</label><input id="workTitle" autocomplete="off">
<label for="authorName">作者名</label><input id="authorName" autocomplete="off">
<label for="authorHandle">作者ハンドル</label><input id="authorHandle" autocomplete="off" placeholder="@ユーザー名">
<label for="synopsis">あらすじ</label><textarea id="synopsis" rows="5"></textarea>
<label for="tags">タグ</label><textarea id="tags" rows="2" placeholder="タグを改行または読点で区切って入力"></textarea>
<label for="workStatus">作品状態</label><input id="workStatus" placeholder="完結済・連載中など">
<label for="episodeCount">総話数</label><input id="episodeCount" inputmode="numeric" placeholder="例：1132">
<label for="characterCount">文字数</label><input id="characterCount" inputmode="numeric" placeholder="例：3966011">
<label for="updatedAt">最終更新日</label><input id="updatedAt" placeholder="例：2026年9月30日">
<label>新規登録先（本棚管理の設定）</label><div id="targetShelf" class="fieldHint">登録先を読み込み中…</div>
<div id="preview" class="preview" hidden></div>
<div class="step">STEP 5</div>
<button id="saveButton" type="button">確認した内容を本棚に登録する</button>
<div id="saveStatus" class="status" aria-live="polite"></div>
</section>
</main>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB";
const $=id=>document.getElementById(id);
function message(id,text,error=false){$(id).textContent=text;$(id).style.color=error?"#9b3d32":""}
function getWorkId(url){
  const m=String(url||"").trim().match(/^https:\/\/(?:www\.)?kakuyomu\.jp\/works\/(\d+)(?:[/?#]|$)/i);
  return m?m[1]:"";
}
function normalizeCount(s){const m=String(s||"").replace(/,/g,"").match(/\d+/);return m?Number(m[0]):0}
function extractDate(s){
  const m=String(s||"").match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
  return m?m[1]+"-"+String(Number(m[2])).padStart(2,"0")+"-"+String(Number(m[3])).padStart(2,"0"):String(s||"").trim();
}
function parseKakuyomu(raw){
  const text=String(raw||"").replace(/\r/g,"").replace(/[\u200e\u200f\u202a-\u202e]/g,"");
  const lines=text.split("\n").map(x=>x.trim().replace(/^[•・▪◦]\s*/,"")).filter(Boolean);
  const data={url:"",id:"",title:"",author:"",handle:"",synopsis:"",tags:[],status:"",episodes:0,characters:0,updatedAt:""};

  // 共有テキストに作品URLが含まれる場合だけIDを抽出する。URLがなければ手入力で補う。
  const url=text.match(/https?:\/\/kakuyomu\.jp\/works\/(\d+)/i);
  if(url){data.url=url[0];data.id=url[1]}

  // 作品タイトル・作者名は「1話目から読む」の直前に並ぶページ見出しから取得する。
  const readIndex=lines.findIndex(x=>x.includes("1話目から読む"));
  if(readIndex>=2){
    data.title=lines[readIndex-2]||"";
    data.author=(lines[readIndex-1]||"").replace(/^作者[:：]\s*/,"");
  }

  // ページ上部のナビゲーションにも「概要」があるため、
  // 作品紹介本文に近い、タグ・作品状態より前の最後の「概要」を採用する。
  const statusIndex=lines.findIndex(x=>/(完結済|連載中|連載|短編)/.test(x)&&/全?\s*[\d,]+\s*(話|エピソード)/.test(x));
  const tagIndex=lines.findIndex(x=>x==="タグ");
  const synopsisLimit=[statusIndex,tagIndex].filter(i=>i>=0);
  const synopsisEnd=synopsisLimit.length?Math.min(...synopsisLimit):lines.length;
  let overview=-1;
  for(let i=synopsisEnd-1;i>=0;i--){
    if(lines[i]==="概要"){overview=i;break;}
  }
  if(overview>=0){
    data.synopsis=lines.slice(overview+1,synopsisEnd)
      .filter(x=>!["関連小説","詳細","概要"].includes(x))
      .join("\n").trim();
  }

  if(statusIndex>=0){
    const line=lines[statusIndex];
    data.status=(line.match(/完結済|連載中|連載|短編/)||[])[0]||"";
    const n=line.match(/全?\s*([\d,]+)\s*(?:話|エピソード)/);
    if(n)data.episodes=normalizeCount(n[1]);
  }
  const chars=text.match(/([\d,]+)文字/);
  if(chars)data.characters=normalizeCount(chars[1]);
  const date=text.match(/(\d{4}年\s*\d{1,2}月\s*\d{1,2}日)更新/);
  if(date)data.updatedAt=extractDate(date[1]);

  // 作者ハンドルは作品ページ本文の先頭側にある最初の @表記を採用。
  const handle=text.match(/@([A-Za-z0-9_-]+)/);
  if(handle)data.handle="@"+handle[1];

  const tagStart=lines.findIndex(x=>x==="タグ");
  if(tagStart>=0){
    const tagEnd=lines.findIndex((x,i)=>i>tagStart&&(x==="書籍化情報"||x==="おすすめレビュー"||x==="関連小説"));
    data.tags=lines.slice(tagStart+1,tagEnd<0?tagStart+8:tagEnd)
      .filter(x=>x.length<80&&!/^(レビュー|感想|小説情報)/.test(x));
  }
  return data;
}
function applyData(d){
  $("workUrl").value=d.url||$("workUrl").value;
  $("workId").value=d.id||getWorkId($("workUrl").value);
  $("workTitle").value=d.title||"";
  $("authorName").value=d.author||"";
  $("authorHandle").value=d.handle||"";
  $("synopsis").value=d.synopsis||"";
  $("tags").value=(d.tags||[]).join("\n");
  $("workStatus").value=d.status||"";
  $("episodeCount").value=d.episodes||"";
  $("characterCount").value=d.characters||"";
  $("updatedAt").value=d.updatedAt||"";
  $("preview").hidden=false;
  $("preview").textContent="抽出結果\n作品ID："+(d.id||"未取得")+"\nタイトル："+(d.title||"未取得")+"\n作者："+(d.author||"未取得")+"\n総話数："+(d.episodes||"未取得")+"\n文字数："+(d.characters||"未取得");
}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME);r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("新DBが未作成です"))};r.onsuccess=()=>{const db=r.result;if(db.version!==2||!db.objectStoreNames.contains("works")||!db.objectStoreNames.contains("shelves")){db.close();reject(new Error("新DB構造が想定外です"));return}resolve(db)};r.onerror=()=>reject(r.error||new Error("新DBを開けません"))})}
function readAll(db,name){return new Promise((resolve,reject)=>{const out=[],r=db.transaction(name,"readonly").objectStore(name).openCursor();r.onsuccess=()=>{if(r.result){out.push(r.result.value);r.result.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error(name+"読込失敗"))})}
async function loadShelves(){
  let db;
  try{
    db=await openDB();
    const rows=await readAll(db,"shelves");
    const target=rows.find(x=>x&&x.work_add_target===true);
    $("targetShelf").textContent=target?String(target.shelf_name||"選択中の本棚")+"（本棚管理で変更）":"未分類（通常棚に登録先チェックなし）";
  }catch(e){$("targetShelf").textContent="登録先を読み込めませんでした："+e.message;message("saveStatus","登録先を読み込めません："+e.message,true)}
  finally{if(db)db.close()}
}
$("parseButton").addEventListener("click",()=>{
  const raw=$("rawText").value.trim(),url=$("workUrl").value.trim(),id=getWorkId(url);
  if(!raw){message("parseStatus","STEP 1：作品情報テキストを貼り付けてね。",true);return}
  if(!id){$("workId").value="";message("parseStatus","STEP 2：カクヨム作品ページのURLを貼り付けてね。\n例：https://kakuyomu.jp/works/作品ID",true);$("workUrl").focus();return}
  $("workId").value=id;
  const d=parseKakuyomu(raw);d.url=url;d.id=id;applyData(d);
  const missing=[];if(!d.title)missing.push("作品タイトル");if(!d.author)missing.push("作者名");
  message("parseStatus","作品情報を解析しました。"+(missing.length?"\n確認・入力が必要："+missing.join("、"):"\n基本項目を抽出できました。下のフォームを確認してね。"),missing.length>0);
});
$("workUrl").addEventListener("input",()=>{$("workId").value=getWorkId($("workUrl").value)});
$("saveButton").addEventListener("click",()=>{
 try{
  const url=$("workUrl").value.trim(),id=$("workId").value.trim()||getWorkId(url);
  const title=$("workTitle").value.trim(),author=$("authorName").value.trim();
  if(!/^https:\/\/kakuyomu\.jp\/works\/\d+(?:[/?#]|$)/i.test(url)||!id)throw new Error("カクヨムの作品URLを確認してください。");
  if(id!==getWorkId(url))throw new Error("作品IDと作品URLが一致しません。");
  if(!title||!author)throw new Error("作品タイトルと作者名は必須です。");
  const draft={
   workId:id,url,title,author,handle:$("authorHandle").value.trim(),
   synopsis:$("synopsis").value.trim(),
   tags:$("tags").value.split(/[\n,、]+/).map(x=>x.trim()).filter(Boolean),
   status:$("workStatus").value.trim(),
   characterCount:normalizeCount($("characterCount").value),
   updatedAt:extractDate($("updatedAt").value)
  };
  sessionStorage.setItem("tomotaYomuKakuyomuDraft_v1",JSON.stringify(draft));
  message("saveStatus","作品情報を引き渡します。目次取得結果を照合するページへ移動します。");
  $("saveButton").disabled=true;
  location.href="app/kakuyomu/kakuyomu_write.html";
 }catch(e){message("saveStatus","⚠️ 次へ進めません："+e.message,true)}
});
// 新DBへの書き込みは kakuyomu_write.html に集約する。
</script>
</body>
</html>
