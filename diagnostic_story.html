<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ story取得確認</title><body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.6"><h2>🔬 story取得確認</h2><p>同じNコードについて、現在のof指定とstory(s)を明示した指定を比較します。</p><button id="run" style="font-size:16px;padding:10px 14px">比較開始</button><button id="copy" style="font-size:16px;padding:10px 14px">結果をコピー</button><pre id="out" style="white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px"></pre><script>
const API="https://api.syosetu.com/novelapi/api/", NS=["N6106LC","N1028JP","N7998LI"];
function jsonp(url){return new Promise((resolve,reject)=>{const cb="storydiag_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),t=setTimeout(()=>{s.remove();delete window[cb];reject(new Error("JSONP timeout"))},20000);window[cb]=d=>{clearTimeout(t);s.remove();delete window[cb];resolve(d)};s.onerror=()=>{clearTimeout(t);s.remove();delete window[cb];reject(new Error("JSONP error"))};s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();document.head.appendChild(s)})}
async function get(of,n){const d=await jsonp(API+"?ncode="+n+"&of="+of+"&lim=1");return Array.isArray(d)?d.slice(1)[0]:null}
async function run(){const o=document.getElementById("out");o.textContent="比較中…";try{let lines=["【story取得比較】","現在: n-gl-ga-e-e","変更候補: n-s-gl-ga-e-e",""];for(const n of NS){const a=await get("n-gl-ga-e-e",n),b=await get("n-s-gl-ga-e-e",n);lines.push(n);lines.push("現在 → story="+(a?.story?"取得あり":"空/なし")+" / title="+(a?.title||"—"));lines.push("s追加 → story="+(b?.story?"取得あり":"空/なし")+" / title="+(b?.title||"—"));lines.push("");}o.textContent=lines.join("\n")}catch(e){o.textContent="診断失敗: "+e.message}}document.getElementById("run").onclick=run;document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("out").textContent);alert("コピーしました")}catch(e){alert("コピーできませんでした")}};
</script></body></html>
