<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ collectRange 診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.5}
button{font-size:16px;padding:10px 12px;margin:4px 0;border-radius:10px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>🔎 collectRange N6117JH 診断</h1>
<p>ともたよむ本体と同じ lastup取得方式を、N6117JHの既知期間で単独検証する。</p>
<button id="run">▶ 診断開始</button>
<button id="copy">📋 結果をまとめてコピー</button>
<pre id="log">【待機中】</pre>
<script>
const API="https://api.syosetu.com/novel18api/api/";
const TARGET="N6117JH";
const START=new Date("2024-08-22T00:00:00+09:00").getTime();
const END=new Date("2024-08-23T23:59:59+09:00").getTime();
const MAX_ST=2000;
let logs=[];
function add(x){logs.push(new Date().toLocaleTimeString()+" "+x);document.getElementById("log").textContent=logs.join("\n");}
function range(a,b){return Math.floor(a/1000)+"-"+Math.floor(b/1000);}
function jsonp(url){return new Promise((resolve,reject)=>{
 const cb="tomotaYomuDiag_"+Date.now()+"_"+Math.random().toString(36).slice(2);
 const s=document.createElement("script");
 const timer=setTimeout(()=>{cleanup();reject(new Error("JSONP timeout"))},20000);
 function cleanup(){clearTimeout(timer);try{s.remove()}catch(e){};try{delete window[cb]}catch(e){}}
 window[cb]=d=>{cleanup();resolve(d)};
 s.onerror=()=>{cleanup();reject(new Error("JSONP load error"))};
 s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();
 document.head.appendChild(s);
});}
async function countRange(base,a,b){
 const url=base+"?lastup="+range(a,b)+"&of=n-gl-ga-e-e&lim=1&st=1";
 add("countRange URL="+url);
 const d=await jsonp(url);
 add("countRange allcount="+Number(d?.[0]?.allcount||0));
 return Number(d?.[0]?.allcount||0);
}
async function collectRange(base,a,b,depth=0){
 const n=await countRange(base,a,b);
 if(n===0)return [];
 if(n<=MAX_ST){
   let out=[];
   for(let st=1;st<=n;st+=500){
     const lim=Math.min(500,n-st+1);
     const url=base+"?lastup="+range(a,b)+"&of=n-gl-ga-e-e&lim="+lim+"&st="+st;
     add("data st="+st+" lim="+lim);
     const d=await jsonp(url);
     const rows=(d||[]).filter(x=>x.ncode);
     add("  rows="+rows.length+" / first="+(rows[0]?.ncode||"なし"));
     out.push(...rows);
   }
   return out;
 }
 if(depth>20)throw new Error("lastup時間分割上限");
 const m=Math.floor((a+b)/2);
 add("時間分割 depth="+depth);
 return (await collectRange(base,a,m,depth+1)).concat(await collectRange(base,m+1,b,depth+1));
}
async function run(){
 logs=[];
 add("【開始】本体collectRange方式の単独診断");
 add("対象="+TARGET);
 add("期間=2024/08/22 00:00 ～ 2024/08/23 23:59");
 try{
   const rows=await collectRange(API,START,END);
   const hits=rows.filter(x=>String(x.ncode).toUpperCase()===TARGET);
   add("────────────");
   add("collectRange総取得="+rows.length);
   add("N6117JH捕捉="+hits.length);
   if(hits[0])add("捕捉データ="+JSON.stringify({ncode:hits[0].ncode,general_lastup:hits[0].general_lastup,general_all_no:hits[0].general_all_no}));
   add("【診断完了】");
 }catch(e){add("【診断中断】"+e.message);}
}
document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
 const text=["【ともたよむ collectRange N6117JH 診断】","",logs.join("\n")].join("\n");
 try{await navigator.clipboard.writeText(text);document.getElementById("copy").textContent="✅ コピーしました";}
 catch(e){alert("コピーできませんでした。結果欄を長押ししてコピーしてください。");}
};
</script>
</body>
</html>
