<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜カクヨム作品編集</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195;--accent:#e9e4f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:24px 16px 48px}h1{font-size:24px;margin:8px 0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:700;margin:12px 0 4px}input,textarea,select{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{resize:vertical}
button{display:block;width:100%;min-height:50px;margin-top:16px;padding:12px;border:1px solid #81769b;border-radius:10px;background:var(--accent);color:#302747;font:inherit;font-weight:800}
.status{white-space:pre-wrap;margin-top:10px}.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body><main>
<p><a href="../../index.html">← ともたよむ本棚へ戻る</a></p>
<h1>📘 カクヨム作品の内容を編集</h1>
<div class="card">
<label for="title">作品タイトル</label><input id="title">
<label for="author">作者名</label><input id="author">
<label for="handle">作者ハンドル</label><input id="handle">
<label for="synopsis">あらすじ</label><textarea id="synopsis" rows="6"></textarea>
<label for="tags">タグ（改行区切り）</label><textarea id="tags" rows="3"></textarea>
<label for="status">作品状態</label><input id="status" placeholder="完結済・連載中など">
<label for="episodes">総話数</label><input id="episodes" inputmode="numeric">
<label for="characters">文字数</label><input id="characters" inputmode="numeric">
<label for="updated">最終更新日</label><input id="updated">
<div class="muted" id="workId"></div>
<button id="save">変更を保存する</button>
<div class="status" id="status" aria-live="polite"></div>
</div></main>
<script>
"use strict";
const KEY="tomotaYomu_kakuyomu_works_v1";
const id=new URLSearchParams(location.search).get("id")||"";
const $=x=>document.getElementById(x);
let item=null;
function items(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function num(v){const n=Number(String(v||"").replace(/,/g,""));return Number.isFinite(n)&&n>=0?Math.floor(n):0}
function say(t,bad=false){$("status").textContent=t;$("status").style.color=bad?"#9b3d32":""}
function init(){
 item=items().find(x=>String(x.id)===id);
 if(!item){say("作品データが見つかりません。",true);$("save").disabled=true;return}
 $("title").value=item.title||"";$("author").value=item.author||"";$("handle").value=item.authorHandle||"";
 $("synopsis").value=item.synopsis||"";$("tags").value=(item.tags||[]).join("\n");$("status").value=item.status||"";
 $("episodes").value=Number(item.episodeCount)||0;
 $("characters").value=Number(item.characterCount)||0;$("updated").value=item.updatedAt||"";
 $("workId").textContent="作品ID："+item.id;
}
$("save").addEventListener("click",()=>{
 if(!item)return;
 const total=num($("episodes").value);
 const all=items(),i=all.findIndex(x=>String(x.id)===id);if(i<0){say("作品データが見つかりません。",true);return}
 all[i]={...all[i],title:$("title").value.trim(),author:$("author").value.trim(),authorHandle:$("handle").value.trim(),synopsis:$("synopsis").value.trim(),tags:$("tags").value.split(/[\n,、]+/).map(x=>x.trim()).filter(Boolean),status:$("status").value.trim(),episodeCount:total,characterCount:num($("characters").value),updatedAt:$("updated").value.trim()};
 localStorage.setItem(KEY,JSON.stringify(all));say("保存しました。本棚へ戻ります。");setTimeout(()=>location.href="../../index.html",700);
});
init();
</script></body></html>
