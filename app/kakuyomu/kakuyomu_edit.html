<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜カクヨム作品編集</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195;--accent:#e9e4f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:24px 16px 48px}h1{font-size:24px;margin:8px 0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:700;margin:12px 0 4px}input,textarea,select{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{resize:vertical}
button{display:block;width:100%;min-height:50px;margin-top:16px;padding:12px;border:1px solid #81769b;border-radius:10px;background:var(--accent);color:#302747;font:inherit;font-weight:800}
.status{white-space:pre-wrap;margin-top:10px}.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body><main>
<p><a href="../../index.html">← ともたよむ本棚へ戻る</a></p>
<h1>📘 カクヨム作品の内容を編集</h1>
<div class="card">
<label for="title">作品タイトル</label><input id="title">
<label for="author">作者名</label><input id="author">
<label for="handle">作者ハンドル</label><input id="handle">
<label for="synopsis">あらすじ</label><textarea id="synopsis" rows="6"></textarea>
<label for="tags">タグ（改行区切り）</label><textarea id="tags" rows="3"></textarea>
<label for="workStatus">作品状態</label><input id="workStatus" placeholder="完結済・連載中など">
<label for="episodes">総話数</label><input id="episodes" inputmode="numeric">
<label for="characters">文字数</label><input id="characters" inputmode="numeric">
<label for="updated">最終更新日</label><input id="updated">
<div class="muted" id="workId"></div>
<button id="save">変更を保存する</button>
<div class="status" id="saveStatus" aria-live="polite"></div>
</div></main>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB";
const id=new URLSearchParams(location.search).get("id")||"";
const $=x=>document.getElementById(x);
let item=null;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME);r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("新DBが未作成です"))};r.onsuccess=()=>{const db=r.result;if(db.version!==2||!db.objectStoreNames.contains("works")){db.close();reject(new Error("新DB構造が想定外です"));return}resolve(db)};r.onerror=()=>reject(r.error||new Error("新DBを開けません"))})}
function num(v){const n=Number(String(v||"").replace(/,/g,""));return Number.isFinite(n)&&n>=0?Math.floor(n):0}
function say(t,bad=false){$("saveStatus").textContent=t;$("saveStatus").style.color=bad?"#9b3d32":""}
async function init(){
 let db;
 try{
  db=await openDB();const key="kakuyomu:"+id;
  item=await new Promise((resolve,reject)=>{const req=db.transaction("works","readonly").objectStore("works").get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});
  if(!item){say("新DBに作品データが見つかりません。",true);$("save").disabled=true;return}
  const v=item.siteData?.legacyFields||{};
  $("title").value=item.title||"";$("author").value=item.authorName||"";$("handle").value=item.authorId||v.authorHandle||"";
  $("synopsis").value=item.synopsis||item.siteData?.synopsis||v.synopsis||"";
  $("tags").value=(item.tags||item.siteData?.tags||v.tags||[]).join("\n");$("workStatus").value=item.status||v.status||"";
  $("episodes").value=Number(item.episodeCount)||0;$("characters").value=Number(item.characterCount||item.siteData?.characterCount||v.characterCount)||0;$("updated").value=item.updatedAt||v.updatedAt||"";
  $("workId").textContent="作品ID："+(item.workId||id);
 }catch(e){say("読み込み失敗："+e.message,true);$("save").disabled=true}
 finally{if(db)db.close()}
}
$("save").addEventListener("click",async()=>{
 if(!item)return;const btn=$("save");btn.disabled=true;let db;
 try{
  const updated={...item,title:$("title").value.trim(),authorName:$("author").value.trim(),authorId:$("handle").value.trim(),status:$("workStatus").value.trim(),episodeCount:num($("episodes").value),characterCount:num($("characters").value),updatedAt:$("updated").value.trim(),synopsis:$("synopsis").value.trim(),siteData:{...(item.siteData||{}),synopsis:$("synopsis").value.trim(),tags:$("tags").value.split(/[\n,、]+/).map(x=>x.trim()).filter(Boolean),characterCount:num($("characters").value),legacyFields:{...(item.siteData?.legacyFields||{}),authorHandle:$("handle").value.trim(),tags:$("tags").value.split(/[\n,、]+/).map(x=>x.trim()).filter(Boolean)}}};
  db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction("works","readwrite");tx.objectStore("works").put(updated);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("保存失敗"));tx.onabort=()=>reject(tx.error||new Error("保存中止"))});item=updated;say("新DBへ保存しました。本棚へ戻ると作品カードに反映されます。");
 }catch(e){say("保存できませんでした："+e.message,true)}finally{if(db)db.close();btn.disabled=false}
});
init();
</script></body></html>
