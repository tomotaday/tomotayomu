<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜カクヨム作品登録（書き込み）</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195;--accent:#e9e4f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:22px 16px 48px}
h1{font-size:24px;margin:8px 0 4px}.note{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
button{display:block;width:100%;min-height:48px;margin-top:14px;padding:11px 14px;border:1px solid #81769b;border-radius:10px;background:var(--accent);color:#302747;font:inherit;font-weight:800}
button:disabled{opacity:.5}
.status{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.small{font-size:12px;color:var(--muted)}
.good{color:#276749}.bad{color:#9b3d32}
.episode-list{max-height:260px;overflow:auto;padding-left:28px;font-size:13px}
.episode-list li{padding:3px 0}
.summary{padding:10px;background:#f5f1fa;border-radius:9px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<p><a href="../../index.html">← ともたよむ本棚へ戻る</a></p>
<h1>📚 カクヨム作品登録｜書き込み</h1>
<p class="note">取得・検証済みの目次を確認し、明示的な操作で新DBへ登録する専用ページです。ここでは目次を取得し直したり、既存作品を上書きしたりしません。</p>

<section class="card">
<h2>1. 取得結果</h2>
<div id="tocStatus" class="status" aria-live="polite">取得結果を確認しています…</div>
<button id="importInfoButton" type="button">作品情報を取り込む</button>
<p class="small">目次の取得結果を先に確認できます。作品情報は必要なときに取り込んでください。</p>
<div id="tocSummary" class="summary" hidden></div>
<details id="episodeDetails" hidden>
<summary>目次の内容を確認</summary>
<ol id="episodeList" class="episode-list"></ol>
</details>
</section>

<section class="card">
<h2>2. 登録する作品情報</h2>
<label for="workId">作品ID</label><input id="workId" readonly>
<label for="workUrl">作品URL</label><input id="workUrl" readonly>
<label for="title">作品タイトル</label><input id="title" autocomplete="off">
<label for="author">作者名</label><input id="author" autocomplete="off">
<label for="authorHandle">作者ハンドル</label><input id="authorHandle" autocomplete="off">
<label for="synopsis">あらすじ</label><textarea id="synopsis" rows="4"></textarea>
<label for="tags">タグ（改行区切り）</label><textarea id="tags" rows="3"></textarea>
<label for="status">作品状態</label><input id="status">
<label for="characterCount">文字数</label><input id="characterCount" inputmode="numeric">
<label for="updatedAt">最終更新日</label><input id="updatedAt" placeholder="YYYY-MM-DD">
<label>総話数</label><div id="totalCount" class="status">目次検証後に確定</div>
<label>登録先</label><div id="targetShelf" class="status">本棚設定を確認しています…</div>
<p class="small">総話数は検証済みTOC JSONの件数だけを使用します。入力欄から変更できません。</p>
<button id="saveButton" type="button" disabled>確認した内容を新DBへ登録</button>
<div id="saveStatus" class="status" aria-live="polite"></div>
</section>
</main>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB";
const DRAFT_KEY="tomotaYomuKakuyomuDraft_v1";
const $=id=>document.getElementById(id);
let draft=null,toc=null,targetShelf=null,dbReady=false,saving=false;
function showStatus(id,text,kind=""){const el=$(id);el.textContent=text;el.className="status "+kind}
function getQuery(){return new URLSearchParams(location.search)}
function validId(v){return /^\d+$/.test(String(v||""))}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME);req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error("新DBが未作成です"))};req.onsuccess=()=>{const db=req.result;if(db.version!==2||!db.objectStoreNames.contains("works")||!db.objectStoreNames.contains("shelves")){db.close();reject(new Error("新DB構造が想定外です"))}else resolve(db)};req.onerror=()=>reject(req.error||new Error("新DBを開けません"))})}
function readAll(db,store){return new Promise((resolve,reject)=>{const out=[],req=db.transaction(store,"readonly").objectStore(store).openCursor();req.onsuccess=()=>{const c=req.result;if(c){out.push(c.value);c.continue()}else resolve(out)};req.onerror=()=>reject(req.error||new Error(store+"読込失敗"))})}
async function loadDraft(){
 const raw=sessionStorage.getItem(DRAFT_KEY);
 if(!raw)return null;
 const value=JSON.parse(raw);
 if(!value||!validId(value.workId)||!/^https:\/\/kakuyomu\.jp\/works\/\d+/.test(value.url||""))throw new Error("登録用データの作品IDまたはURLが不正です。");
 if(value.workId!==String((value.url.match(/\/works\/(\d+)/)||[])[1]||""))throw new Error("作品IDとURLが一致しません。");
 return value;
}
function applyDraft(value){
 draft=value;
 $("workId").value=value.workId;$("workUrl").value=value.url;
 $("title").value=value.title||"";$("author").value=value.author||"";
 $("authorHandle").value=value.handle||"";$("synopsis").value=value.synopsis||"";
 $("tags").value=Array.isArray(value.tags)?value.tags.join("\n"):"";
 $("status").value=value.status||"";$("characterCount").value=value.characterCount||"";
 $("updatedAt").value=value.updatedAt||"";
}
async function loadAndVerify(){
 const q=getQuery(),requestId=String(q.get("request_id")||"");
 if(!/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$/.test(requestId))throw new Error("request_idが指定されていません。");
 const base="https://raw.githubusercontent.com/tomotaday/tomotayomu/main/";
 let result=null,lastHttp=0;
 for(let attempt=0;attempt<60;attempt++){
  const resultRes=await fetch(base+"data/kakuyomu-toc-requests/"+encodeURIComponent(requestId)+".json?ts="+Date.now(),{cache:"no-store"});
  lastHttp=resultRes.status;
  if(resultRes.ok){
   result=await resultRes.json();
   if(result.status==="success"||result.status==="failure")break;
  }else if(resultRes.status!==404){
   throw new Error("取得結果の確認に失敗しました（HTTP "+resultRes.status+"）。");
  }
  showStatus("tocStatus","GitHub Actionsの目次取得結果を待っています…（"+(attempt+1)+"/60）");
  await new Promise(resolve=>setTimeout(resolve,5000));
 }
 if(!result)throw new Error("目次取得結果が5分以内に公開されませんでした（HTTP "+lastHttp+"）。");
 if(result.request_id!==requestId)throw new Error("取得結果のrequest_idが一致しません。");
 if(result.status!=="success")throw new Error("目次取得に失敗しています："+String(result.error||"理由不明"));
 const workId=String(result.work_id||"");
 if(!validId(workId))throw new Error("取得結果の作品IDが不正です。");
 if(draft&&String(draft.workId)!==workId)throw new Error("作品情報と取得結果の作品IDが一致しません。");
 const expectedTocPath="data/kakuyomu-toc-requests/"+requestId+".toc.json";
 if(result.toc_path!==expectedTocPath)throw new Error("今回のリクエストに対応する目次ファイルではありません。");
 const tocRes=await fetch(base+expectedTocPath+"?ts="+Date.now(),{cache:"no-store"});
 if(!tocRes.ok)throw new Error("目次JSONを読み込めません（HTTP "+tocRes.status+"）。");
 const data=await tocRes.json();
 if(String(data.work_id)!==workId||!Array.isArray(data.episodes))throw new Error("目次JSONの形式または作品IDが不正です。");
 if(Number(data.public_episode_count)!==data.episodes.length||Number(data.extracted_count)!==data.episodes.length)throw new Error("目次JSONの話数検証に失敗しました。");
 if(Number(result.extracted_count)!==data.episodes.length||Number(result.public_episode_count)!==data.episodes.length)throw new Error("取得結果と目次JSONの話数が一致しません。");
 const ids=new Set();
 data.episodes.forEach((ep,i)=>{if(Number(ep.number)!==i+1||!String(ep.episode_id||"")||ids.has(String(ep.episode_id)))throw new Error("目次の話数順またはエピソードIDに異常があります（"+(i+1)+"件目）。");ids.add(String(ep.episode_id));});
 return data;
}
async function init(){
 try{
  // 先にGitHub Actionsの取得結果を読み込む。作品情報draftは必須にしない。
  draft=await loadDraft();
  toc=await loadAndVerify();
  const requestId=getQuery().get("request_id");
  $("tocSummary").hidden=false;
  $("tocSummary").textContent="作品："+(toc.title||(draft&&draft.title)||"作品情報未取込")+"\n作品ID："+toc.work_id+"\n総話数："+toc.episodes.length.toLocaleString("ja-JP")+"話\nrequest_id："+requestId+"\n検証：公表話数・抽出件数・連番・重複IDの確認済み";
  $("totalCount").textContent=toc.episodes.length.toLocaleString("ja-JP")+"話（TOC JSON確定値）";
  $("episodeDetails").hidden=false;
  $("episodeList").replaceChildren(...toc.episodes.map(ep=>{const li=document.createElement("li");li.textContent=ep.title||("第"+ep.number+"話");return li;}));
  showStatus("tocStatus","✅ 目次取得結果と作品ID・話数を照合しました。","good");

  if(draft)applyDraft(draft);
  else{
   $("workId").value=String(toc.work_id);
   $("workUrl").value="https://kakuyomu.jp/works/"+String(toc.work_id);
   showStatus("saveStatus","作品情報はまだ取り込まれていません。下の「作品情報を取り込む」から進んでください。");
  }

  const db=await openDB();
  try{
   const shelves=await readAll(db,"shelves");
   targetShelf=shelves.find(x=>x&&x.work_add_target===true)||null;
   $("targetShelf").textContent=targetShelf?String(targetShelf.shelf_name||"指定本棚")+"（本棚管理で選択中）":"未分類（通常棚に登録先チェックなし）";
   dbReady=true;
  }finally{db.close()}

  $("importInfoButton").addEventListener("click",()=>{
   location.href="../../kakuyomu_add.html?request_id="+encodeURIComponent(requestId)+"&work_id="+encodeURIComponent(toc.work_id);
  });
  const ready=!!draft&&!!$("title").value.trim()&&!!$("author").value.trim()&&dbReady;
  $("saveButton").disabled=!ready;
  if(draft&&!ready)showStatus("saveStatus","作品タイトルと作者名を確認してください。");
 }catch(e){
  showStatus("tocStatus","⚠️ 目次を表示できませんでした。\n"+e.message,"bad");
  $("saveButton").disabled=true;
  $("importInfoButton").disabled=true;
 }
}
$("saveButton").addEventListener("click",async()=>{
 if(saving||!dbReady||!toc||!draft)return;
 saving=true;$("saveButton").disabled=true;
 let db;
 try{
  const id="kakuyomu:"+draft.workId;
  db=await openDB();
  const exists=await new Promise((resolve,reject)=>{const req=db.transaction("works","readonly").objectStore("works").get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error("重複確認失敗"))});
  if(exists)throw new Error("この作品は既に新DBに登録されています。既存データは変更していません。");
  const title=$("title").value.trim(),author=$("author").value.trim();
  if(!title||!author)throw new Error("作品タイトルと作者名は必須です。");
  const tags=$("tags").value.split(/[\\n,、]+/).map(x=>x.trim()).filter(Boolean);
  const now=new Date().toISOString();
  const item={
   id,site:"kakuyomu",workId:draft.workId,title,authorName:author,authorId:$("authorHandle").value.trim(),
   url:draft.url,shelfId:String(targetShelf?.shelf_id||""),
   updatedAt:$("updatedAt").value.trim(),status:$("status").value.trim(),
   episodeCount:toc.episodes.length,
   reading:{position:null,isRead:null},
   bookmark:{url:"",episodeId:"",position:0},
   siteData:{synopsis:$("synopsis").value.trim(),tags,characterCount:Number($("characterCount").value)||0,
    kakuyomuToc:{workId:toc.work_id,publicEpisodeCount:toc.episodes.length,extractedCount:toc.episodes.length},
    legacyFields:{id:draft.workId,title,author,authorHandle:$("authorHandle").value.trim(),url:draft.url,
     synopsis:$("synopsis").value.trim(),tags,status:$("status").value.trim(),
     episodeCount:toc.episodes.length,characterCount:Number($("characterCount").value)||0,
     updatedAt:$("updatedAt").value.trim(),shelfId:String(targetShelf?.shelf_id||""),site:"kakuyomu",createdAt:now}
   }
  };
  await new Promise((resolve,reject)=>{const tx=db.transaction("works","readwrite");tx.objectStore("works").add(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("保存失敗"));tx.onabort=()=>reject(tx.error||new Error("保存中止"))});
  sessionStorage.removeItem(DRAFT_KEY);
  showStatus("saveStatus","✅ 新DBへ登録しました。\\n"+title+"\\n総話数："+toc.episodes.length+"話\\n本棚へ戻ります…","good");
  setTimeout(()=>location.href="../../index.html",900);
 }catch(e){showStatus("saveStatus","⚠️ 登録できませんでした。\\n"+e.message,"bad");$("saveButton").disabled=false}
 finally{if(db)db.close();saving=false}
});
init();
</script>
</body>
</html>
