<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ed"><title>ともたよむ｜変更登録</title>
<style>:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}main{width:min(100%,720px);margin:auto;padding:24px 16px 48px}h1{font-size:26px;margin:12px 0 6px}.note{font-size:13px;color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}label{display:block;font-weight:700;margin:12px 0 4px}input,textarea{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.readonly-url{background:#eeeae3;color:#666;border-color:#c8c0b5}textarea{resize:vertical}button,a.button{display:inline-block;margin:14px 8px 0 0;padding:10px 14px;background:#fffdf9;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;text-decoration:none}button.primary{font-weight:700;background:#e9e2d6}#status{white-space:pre-wrap;margin-top:14px;font-size:14px}.ncode{font-size:14px;color:var(--muted)}</style></head>
<body><main><a href="../../index.html">← ともたよむ本棚へ戻る</a><h1>✏️ 変更登録</h1><p class="note">作品カードから引き継いだNコードの登録済みデータを読み込み、修正内容を本棚の作品情報に保存します。棚の配置と読書位置は維持します。</p>
<p class="note">使い方：本棚の「🚫検索除外」一覧を開き、対象作品の「✏️ 内容を編集」からこの画面を開いてください。作品ごとのNコードを使って登録済み情報を読み込みます。</p>
<section class="card"><div id="ncode" class="ncode">Nコードを読み込み中…</div>
<label for="title">作品タイトル</label><input id="title" autocomplete="off"><label for="writer">作者名</label><input id="writer" autocomplete="off"><label for="authorId">作者ID（通常：数字／R18：英数字）</label><input id="authorId" autocomplete="off" autocapitalize="characters"><label for="sourceUrl">取得元URL（変更不可）</label><input id="sourceUrl" autocomplete="url" readonly aria-readonly="true" class="readonly-url"><small class="note">作品を特定するURLです。確認・コピーはできますが、変更できません。</small><label for="story">あらすじ</label><textarea id="story" rows="5"></textarea><label for="statusValue">作品状態（連載中・完結・短編）</label><input id="statusValue"><label for="episodeCount">エピソード数</label><input id="episodeCount" inputmode="numeric"><label for="genreText">ジャンル</label><input id="genreText"><label for="publishedAt">掲載日時（YYYY/MM/DD HH:mm）</label><input id="publishedAt" placeholder="2023/09/01 14:05"><label for="latestAt">最新掲載日時（YYYY/MM/DD HH:mm）</label><input id="latestAt" placeholder="2023/09/01 14:14"><label for="disclosure">開示設定</label><input id="disclosure"><button id="save" class="primary" type="button">変更を保存</button><a class="button" href="../../index.html">本棚へ戻る</a><div id="status" role="status">登録済みデータを読み込んでいます…</div></section></main>
<script>
"use strict";
const DB_NAME="tomotaYomuWorksDB",ncode=(new URLSearchParams(location.search).get("ncode")||"").trim().toUpperCase(),el=id=>document.getElementById(id);let original=null;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME);r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("新DBが未作成です"))};r.onsuccess=()=>{const db=r.result;if(db.version!==2||!db.objectStoreNames.contains("works")){db.close();reject(new Error("新DB構造が想定外です"));return}resolve(db)};r.onerror=()=>reject(r.error||new Error("新DBを開けません"))})}
function getRow(db,key){return new Promise((resolve,reject)=>{const r=db.transaction("works","readonly").objectStore("works").get("narou:"+key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error||new Error("作品読込失敗"))})}
function statusText(w){if(Number(w.noveltype)===2)return "短編";if(Number(w.end)===0)return "完結";return "連載中";}
function dateValue(v){
 const s=String(v||"").trim();if(!s)return "";
 let m=s.match(/^(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日(?:\s*(\d{1,2})\s*時\s*(\d{1,2})\s*分)?$/);
 if(!m)m=s.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::\d{2})?)?$/);
 if(!m)return s;
 const y=m[1],mo=m[2].padStart(2,"0"),d=m[3].padStart(2,"0"),h=String(m[4]||"00").padStart(2,"0"),mi=String(m[5]||"00").padStart(2,"0");
 const dt=new Date(Number(y),Number(mo)-1,Number(d),Number(h),Number(mi));
 if(dt.getFullYear()!==Number(y)||dt.getMonth()!==Number(mo)-1||dt.getDate()!==Number(d)||Number(h)>23||Number(mi)>59)throw new Error("日付が正しくありません："+s);
 return y+"/"+mo+"/"+d+" "+h+":"+mi;
}
function canonicalDateValue(v,label){
 const normalized=dateValue(v);
 if(!/^\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}$/.test(normalized))throw new Error(label+"を「YYYY/MM/DD HH:mm」または「YYYY年 MM月DD日 HH時mm分」で入力してください。");
 return normalized;
}
function setStatus(s){el("status").textContent=s;}
function legacyOf(w){
 const legacy=w.siteData?.legacyFields||{};
 return {
  ...legacy,
  ncode:String(w.workId||ncode),
  title:w.title||"",
  writer:w.authorName||"",
  userid:w.authorId??"",
  source_url:w.url||"",
  story:w.synopsis||"",
  general_all_no:w.episodeCount??"",
  general_firstup:w.publishedAt||legacy.general_firstup||"",
  general_lastup:w.lastPublishedAt||legacy.general_lastup||"",
  genre_text:legacy.genre_text||"",
  disclosure:legacy.disclosure||"",
  end:w.siteData?.end,
  noveltype:w.siteData?.noveltype,
  __r18:w.siteData?.isR18===true||legacy.__r18===true
 };
}
function fill(w){
 const v=legacyOf(w);
 el("title").value=v.title;
 el("writer").value=v.writer;
 el("authorId").value=v.userid==null?"":String(v.userid);
 el("sourceUrl").value=v.source_url;
 el("story").value=v.story;
 el("statusValue").value=String(w.status||"");
 el("episodeCount").value=v.general_all_no==null?"":String(v.general_all_no);
 el("genreText").value=v.genre_text;
 el("publishedAt").value=dateValue(w.publishedAt||v.general_firstup);
 el("latestAt").value=dateValue(w.lastPublishedAt||v.general_lastup);
 el("disclosure").value=v.disclosure;
}
async function init(){
 if(!/^N\d+[A-Z]+$/.test(ncode)){
  el("ncode").textContent="Nコード未指定";
  el("save").disabled=true;
  setStatus("作品カードから「内容を編集」を開いてください。");
  return;
 }
 el("ncode").textContent="Nコード："+ncode;
 try{
  const db=await openDB();
  try{original=await getRow(db,ncode)}finally{db.close()}
  if(!original){
   el("save").disabled=true;
   setStatus("新DBに登録済み作品が見つかりません。");
   return;
  }
  if(original.deletedAt){
   el("save").disabled=true;
   setStatus("ごみばこ内の作品は変更登録できません。先に本棚へ復元してください。");
   return;
  }
  fill(original);
  setStatus("新DBの登録済みデータを読み込みました。修正して保存できます。");
 }catch(e){
  el("save").disabled=true;
  setStatus("読み込み失敗："+e.message);
 }
}
el("save").addEventListener("click",async()=>{
 const btn=el("save");btn.disabled=true;let db;
 try{
  if(!original)throw new Error("登録済みデータがありません");
  const authorId=el("authorId").value.trim();
  if(authorId&&!/^[A-Za-z0-9_-]+$/.test(authorId))throw new Error("作者IDは英数字で入力してください");
  const count=(id,label)=>{
   const raw=el(id).value.trim();
   if(!raw)return 0;
   // 表示上の桁区切り・単位（例：280,362文字）を除去して数値化する。
   const v=raw.replace(/,/g,"").replace(/\s*(?:文字|字|話)$/,"").trim();
   if(!/^\d+$/.test(v))throw new Error(label+"は数字で入力してください");
   const n=Number(v);
   if(!Number.isSafeInteger(n))throw new Error(label+"が大きすぎます");
   return n;
  };
  const title=el("title").value.trim();
  if(!title)throw new Error("作品タイトルを入力してください");
  const status=el("statusValue").value.trim();
  if(!status)throw new Error("作品状態を入力してください");
  const published=canonicalDateValue(el("publishedAt").value,"掲載日時");
  const latest=canonicalDateValue(el("latestAt").value,"最新掲載日時");
  const episodeCount=count("episodeCount","話数");
  const end=status.includes("完結")?0:1;
  const noveltype=status.includes("短編")?2:1;
  const sourceUrl=original.url||el("sourceUrl").value.trim();
  const legacy={
   ...legacyOf(original),
   title,writer:el("writer").value.trim(),userid:authorId||0,
   source_url:sourceUrl,story:el("story").value,
   general_all_no:episodeCount,episode_count:episodeCount,
general_firstup:published,
   general_lastup:latest,latest_episode_at:latest,novelupdated_at:latest,
   genre_text:el("genreText").value.trim(),disclosure:el("disclosure").value.trim(),
   end,noveltype
  };
  delete legacy.character_count;
  const updated={
   ...original,
   title,
   authorName:legacy.writer,
   authorId:authorId||"",
   url:sourceUrl,
   synopsis:legacy.story,
   episodeCount,
   publishedAt:published,
   lastPublishedAt:latest,
   status:status.includes("短編")?"短編":status.includes("完結")?"完結":"連載中",
   siteData:{...(original.siteData||{}),end,noveltype,legacyFields:legacy}
  };
  db=await openDB();
  await new Promise((resolve,reject)=>{
   const tx=db.transaction("works","readwrite");
   tx.objectStore("works").put(updated);
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error||new Error("保存失敗"));
   tx.onabort=()=>reject(tx.error||new Error("保存中止"));
  });
  original=updated;
  setStatus("新DBへ保存しました。棚所属・bookmark・読書位置は維持されています。本棚へ戻ると作品カードに反映されます。");
 }catch(e){
  setStatus("保存できませんでした："+e.message);
 }finally{
  if(db)db.close();
  btn.disabled=false;
 }
});
init();
</script></body></html>
