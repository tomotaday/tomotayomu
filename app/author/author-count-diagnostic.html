<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜作者数診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.65;margin:0;padding:20px;color:#222;background:#f7f8fa}
main{max-width:760px;margin:auto;background:white;border-radius:16px;padding:20px}
h1{font-size:22px}button{font-size:17px;padding:14px 20px;border:0;border-radius:10px;background:#176b35;color:white}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:14px;border-radius:10px;font-size:13px}
.note{color:#555;font-size:14px}
</style>
</head>
<body><main>
<h1>🔎 作者数診断（読み取り専用・詳細版）</h1>
<p>tomotaYomuWorksDB v2 の works を読み取り専用で集計します。作品データの追加・変更・削除は行いません。</p>
<button id="run">診断を実行</button>
<p id="status" class="note">ボタンを押してください。</p>
<pre id="result">診断結果はここに表示されます。</pre>
</main>
<script>
const DB_NAME="tomotaYomuWorksDB";
const ncode=v=>String(v||"").trim().toUpperCase();
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME);r.onupgradeneeded=()=>{r.transaction.abort();reject(new Error("DB version mismatch; aborted"))};r.onsuccess=()=>{const db=r.result;if(db.version!==2||!db.objectStoreNames.contains("works")){db.close();reject(new Error("DB version/store mismatch"));return}resolve(db)};r.onerror=()=>reject(r.error||new Error("DB open failed"))})}
function readAll(db){return new Promise((resolve,reject)=>{const st=db.transaction("works","readonly").objectStore("works"),out=[],r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error("cursor failed"))})}
document.getElementById("run").addEventListener("click",async()=>{
 const status=document.getElementById("status"),out=document.getElementById("result");
 status.textContent="読み取り中…";out.textContent="";
 let db;
 try{
  db=await openDB();const all=await readAll(db);db.close();db=null;
  const narou=all.filter(w=>w&&w.site==="narou");
  const withId=narou.filter(w=>String(w.authorId??"").trim());
  const authorKey=w=>String(w.authorId??"").trim();
  const typeKey=w=>(w.authorType==="r18"?"r18":"normal")+":"+authorKey(w);
  const rawType=w=>w.authorType===undefined?"(undefined)":w.authorType===null?"(null)":String(w.authorType)===""?"(empty)":String(w.authorType);
  const unique=(arr,keyFn)=>new Set(arr.map(keyFn).filter(Boolean)).size;
  const ids=new Map();
  for(const w of withId){
   const id=authorKey(w),bucket=ids.get(id)||{types:new Set(),raw:new Set(),samples:[]};
   bucket.types.add(w.authorType==="r18"?"r18":"normal");
   bucket.raw.add(rawType(w));
   if(bucket.samples.length<4)bucket.samples.push({
    ncode:w.workId||w.ncode||"(Nコード不明)",
    authorType:rawType(w),
    siteDataIsR18:w.siteData?.isR18===true,
    legacyR18:w.legacy?.__r18===true
   });
   ids.set(id,bucket);
  }
  const mixed=[...ids.entries()].filter(([,v])=>v.types.size>1).sort((a,b)=>a[0].localeCompare(b[0]));
  const rawCounts=new Map();
  for(const w of withId){const k=rawType(w);rawCounts.set(k,(rawCounts.get(k)||0)+1)}
  const rawLines=[...rawCounts.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+"："+v+"作品");
  const flags={
   siteDataTrue:withId.filter(w=>w.siteData?.isR18===true).length,
   siteDataFalse:withId.filter(w=>w.siteData?.isR18===false).length,
   legacyTrue:withId.filter(w=>w.legacy?.__r18===true).length,
   legacyFalse:withId.filter(w=>w.legacy?.__r18===false).length
  };
  const mixedLines=mixed.map(([id,v])=>{
   const types=[...v.types].sort().join(" / ");
   const raw=[...v.raw].sort().join(", ");
   return "作者ID："+id+"\n  JSON判定種別："+types+"\n  生のauthorType："+raw+"\n  作品例："+v.samples.map(s=>s.ncode+" [type="+s.authorType+", siteData.isR18="+s.siteDataIsR18+", legacy.__r18="+s.legacyR18+"]").join(" ; ");
  });
  const result=[
   "【全体の比較】",
   "なろう作品総数："+narou.length,
   "作者IDあり作品数："+withId.length,
   "作者IDのみの重複なし："+unique(withId,authorKey),
   "種別＋作者IDの重複なし："+unique(withId,typeKey),
   "差分："+(unique(withId,typeKey)-unique(withId,authorKey)),
   "",
   "【生のauthorType内訳：作品数】",
   ...rawLines,
   "",
   "【R18判定フラグ内訳：作品数】",
   "siteData.isR18 === true："+flags.siteDataTrue,
   "siteData.isR18 === false："+flags.siteDataFalse,
   "legacy.__r18 === true："+flags.legacyTrue,
   "legacy.__r18 === false："+flags.legacyFalse,
   "",
   "【同じ作者IDに normal/r18 の両方が現れるケース】",
   "該当作者ID数："+mixed.length,
   ...(mixedLines.length?mixedLines:["該当なし"]),
   "",
   "※JSON判定種別は現在のJSON出力と同じく、authorTypeが厳密に'r18'ならr18、それ以外はnormalとして集計。"
  ];
  out.textContent=result.join("\n");
  status.textContent="診断完了。読み取り専用で集計しました。";
 }catch(e){if(db)db.close();status.textContent="診断失敗："+e.message}
});
</script></body></html>
