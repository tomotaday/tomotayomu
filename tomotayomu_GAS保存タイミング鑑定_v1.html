<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ GAS保存タイミング鑑定</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;padding:18px;background:#f7f7f7;color:#222}
h1{font-size:20px;margin:0 0 12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
.big{font-size:28px;font-weight:700}
button{font-size:17px;padding:12px 16px;border:0;border-radius:12px;background:#222;color:#fff}
.small{font-size:13px;color:#666;line-height:1.5}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;line-height:1.5}
.ok{font-weight:700}
</style>
</head>
<body>
<h1>🧪 ともたよむ GAS保存タイミング鑑定</h1>

<div class="card">
  <div class="small">今回の目的</div>
  <div>ショートカットの<strong>1つ目のメッセージ表示後、すぐ別ページへ移動</strong>しても、GASへの保存が成立しているか確認する。</div>
</div>

<div class="card">
  <div class="small">対象作品</div>
  <div class="big">N0175GW</div>
  <div>現在の表示：<span id="current">--</span> / 210話</div>
</div>

<div class="card">
  <div class="small">GAS確認結果</div>
  <div id="gasResult">まだ確認していません</div>
  <div class="small" id="checkedAt"></div>
</div>

<div class="card">
  <button id="check">🔄 GASを今すぐ確認</button>
</div>

<div class="card">
  <div class="small">自動復帰確認</div>
  <div id="returnCount">復帰処理：0回</div>
  <div id="visibilityCount">visibilitychange：0回</div>
</div>

<div class="card">
  <div class="small">鑑定ログ</div>
  <div id="log"></div>
</div>

<script>
const NCODE="N0175GW";
const TOTAL=210;
const GAS_URL="https://script.google.com/macros/s/AKfycbxbvywLmy4aWh-_u_o_iDVDq_7AMxf9K2wPY-BhXphGbnaBp0JZ4R78_eplmYfXH3obHA/exec";

let current=Number(localStorage.getItem("tomotayomu_gas_timing_current")||0);
let returns=Number(localStorage.getItem("tomotayomu_gas_timing_returns")||0);
let vc=Number(localStorage.getItem("tomotayomu_gas_timing_vc")||0);

const $=id=>document.getElementById(id);

function render(){
  $("current").textContent=current||"--";
  $("returnCount").textContent="復帰処理："+returns+"回";
  $("visibilityCount").textContent="visibilitychange："+vc+"回";
}
function log(s){
  const t=new Date().toLocaleTimeString();
  $("log").textContent=t+"  "+s+"\n"+$("log").textContent;
}

async function checkGAS(reason){
  log("GAS確認開始："+reason);
  try{
    const res=await fetch(GAS_URL+"?ncode="+encodeURIComponent(NCODE),{cache:"no-store"});
    const text=await res.text();
    $("gasResult").textContent=text;
    $("checkedAt").textContent="確認："+new Date().toLocaleString();
    log("GAS応答："+text);

    const m=text.match(/^READ\\s+([A-Z0-9]+)\\s+(\\d+)$/);
    if(m && m[1]===NCODE){
      current=Number(m[2]);
      localStorage.setItem("tomotayomu_gas_timing_current",String(current));
      render();
      log("読書位置を反映："+current+"話");
    }
  }catch(e){
    $("gasResult").textContent="通信エラー";
    $("checkedAt").textContent=String(e);
    log("GAS通信エラー："+e);
  }
}

$("check").addEventListener("click",()=>checkGAS("手動確認"));

document.addEventListener("visibilitychange",()=>{
  vc++;
  localStorage.setItem("tomotayomu_gas_timing_vc",String(vc));
  log("visibilitychange："+document.visibilityState);

  if(document.visibilityState==="visible"){
    returns++;
    localStorage.setItem("tomotayomu_gas_timing_returns",String(returns));
    render();
    checkGAS("復帰");
  }
});

render();
log("ページ起動");
</script>
</body>
</html>
