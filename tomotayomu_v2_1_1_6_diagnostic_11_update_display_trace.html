<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ v2.1.1.6 診断11 更新棚表示判定</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.55}
button{font-size:16px;padding:10px 14px;margin:4px 0;border-radius:10px;border:1px solid #bbb;background:#fff}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
.ok{font-weight:700}
</style>
<h1>診断11：更新棚表示判定</h1>
<p>保存済みの更新候補について、「本棚にあるか」「読書位置」「読了」「未分類」「🆙表示」を確認します。<br>この診断は localStorage を変更しません。</p>
<button id="run">① 表示判定を調べる</button>
<button id="copy">📋 結果をコピー</button>
<pre id="out">待機中</pre>
<script>
const $=id=>document.getElementById(id);
const CAND="tomotaYomu_v214_update_candidates";
const READ="tomotaYomu_v211_reading";
const TARGETS=["N6106LC","N1028JP","N7998LI","N3192IO","N7730MO","N1444KS","N3627MQ","N7035MQ","N4786HS","N1916KJ","N0753HR"];
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function readingFor(n){const x=load(READ,{}); return Object.prototype.hasOwnProperty.call(x,n)?x[n]:null}
function norm(v){return String(v??"").toUpperCase()}
function run(){
 const cand=load(CAND,{});
 const lines=[];
 lines.push("=== 診断11：更新棚表示判定 ===");
 lines.push("origin = "+location.origin);
 lines.push("");
 lines.push("候補保存数 = "+Object.keys(cand).length);
 lines.push("");
 for(const n0 of TARGETS){
   const n=norm(n0), candidate=cand[n]||null;
   const card=document.querySelector(".__dummy__");
   // この診断ページ自体には本棚カードがないため、本棚所属は candidate の保存対象であることを確認する。
   // さらに本体が保持する latest_works の有無も併記する。
   const latest=load("tomotaYomu_v214_latest_works",{});
   const latestWork=latest[n]||null;
   const current=readingFor(n);
   const total=latestWork?.general_all_no ?? null;
   const totalNum=Number(total||0);
   const readNum=current==null?null:Number(current);
   const finished=readNum!=null && totalNum>0 && readNum>=totalNum;
   const unread=readNum==null || totalNum<=0 || readNum<totalNum;
   const classified=latestWork ? !String(latestWork.__folder||"").includes("未分類") : null;
   lines.push("■ "+n);
   lines.push("  candidate = "+(candidate||"—"));
   lines.push("  latest_works = "+(latestWork?"あり":"なし"));
   lines.push("  reading = "+(current==null?"未保存(null)":current));
   lines.push("  total = "+(total==null?"不明":total));
   lines.push("  本体旧条件 unread = "+(current!=null && totalNum>0 && readNum<totalNum));
   lines.push("  0話/未保存を未読扱いなら unread = "+unread);
   lines.push("  読了判定 = "+finished);
   lines.push("  ★この診断で確認できる暫定🆙 = "+(!!candidate && unread));
   lines.push("");
 }
 lines.push("【重要】");
 lines.push("このページ自身には本棚カードが存在しないため、「本棚所属」は DOM では判定できません。");
 lines.push("候補保存と最新作品情報、読書位置を使って更新棚条件の最後の判定を確認します。");
 lines.push("本体仕様では『本棚に入っている作品だけが更新確認対象』です。");
 $("out").textContent=lines.join("\n");
}
$("run").onclick=run;
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);alert("コピーしました")}catch(e){alert("コピーできませんでした。結果を長押ししてコピーしてください")}};
</script></html>
