<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ v2.1.2.2｜作者情報API→Master境界診断</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;line-height:1.55;background:#f7f7f7;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.ok{color:#16833a}.bad{color:#b42318}button{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid #aaa;background:#fff}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}.ver{font-size:12px;color:#666}</style></head><body><h1>ともたよむ</h1><div class="ver">v2.1.2.2｜API→Master境界診断</div><div class="box"><b>目的</b><br>API生データ → 保存直前のslimMaster → localStorage Master を同じ作品で比較します。<br><b>保存・削除・カード変更は一切しません。</b></div><button id="run">診断開始</button> <button id="copy">診断結果をコピー</button><div id="out" class="box">待機中</div><script>
const API_URL="https://api.syosetu.com/novelapi/api/";
const R18_API_URL="https://api.syosetu.com/novel18api/api/";
const MASTER_KEY="tomotaYomu_v214_works_master";
const TARGETS=["N0753HR","N7998LI","N6106LC","N1028JP","N6066KQ","N8462KW"];
function jsonp(url){return new Promise((resolve,reject)=>{const cb="tomotaYomu_v2122_"+Date.now()+"_"+Math.random().toString(36).slice(2);const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("JSONP timeout"))},20000);function cleanup(){clearTimeout(timer);try{s.remove()}catch(e){}try{delete window[cb]}catch(e){}}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error("JSONP load error"))};s.src=url+"&out=jsonp&callback="+cb+"&_cb="+Date.now();document.head.appendChild(s)})}
async function fetchOne(base,n){const d=await jsonp(base+"?ncode="+encodeURIComponent(n)+"&of=n-t-u-w-nt-e-ga-gl&lim=1");return Array.isArray(d)?d.find(x=>String(x.ncode||"").toUpperCase()===n):null}
function slimMaster(w){return {ncode:w.ncode??"",title:w.title??"",writer:w.writer??"",keyword:w.keyword??"",genre:w.genre??"",userid:w.userid??0,noveltype:w.noveltype??0,end:w.end??0,isstop:w.isstop??0,general_lastup:w.general_lastup??"",general_all_no:w.general_all_no??0,story:w.story??"",novelupdated_at:w.novelupdated_at??"",__r18:!!w.__r18}}
function status(w){if(String(w.noveltype??"").trim()==="2")return"🟣 短編";return String(w.end)==="0"?"🔵 完結":"🟢 連載中"}
function loadMaster(){try{return JSON.parse(localStorage.getItem(MASTER_KEY)||"{}")||{}}catch(e){return{__error:String(e)}}}
function pick(master,n){return master[n]||master[n.toUpperCase()]||null}
async function run(){const out=document.getElementById("out");out.innerHTML="取得中…";const master=loadMaster();let html="<h2>v2.1.2.2｜作者情報API→Master境界診断</h2>";html+="<div>Masterキー: <b>"+MASTER_KEY+"</b> / 保存件数: <b>"+Object.keys(master).length+"</b></div>";for(const n of TARGETS){html+="<div class='box'><h3>"+n+"</h3>";try{let w=await fetchOne(API_URL,n);let r=false;if(!w){w=await fetchOne(R18_API_URL,n);r=true;if(w)w.__r18=true}if(!w){html+="<div class='bad'>API対象一致なし</div>"}else{const slim=slimMaster(w);const m=pick(master,n);html+="<div class='ok'>API取得あり（"+(r?"R18":"全年齢")+"）</div>";html+="<p><b>API status:</b> "+status(w)+"</p>";html+="<pre>API raw = "+JSON.stringify({ncode:w.ncode,userid:w.userid,writer:w.writer,noveltype:w.noveltype,end:w.end,general_all_no:w.general_all_no,general_lastup:w.general_lastup,keys:Object.keys(w)},null,2)+"</pre>";html+="<pre>slimMaster直後 = "+JSON.stringify({ncode:slim.ncode,userid:slim.userid,writer:slim.writer,noveltype:slim.noveltype,end:slim.end,general_all_no:slim.general_all_no,general_lastup:slim.general_lastup,__r18:slim.__r18},null,2)+"</pre>";if(m){html+="<p><b>保存済みMaster status:</b> "+status(m)+"</p><pre>Master = "+JSON.stringify({ncode:m.ncode,userid:m.userid,writer:m.writer,noveltype:m.noveltype,end:m.end,general_all_no:m.general_all_no,general_lastup:m.general_lastup,__r18:m.__r18},null,2)+"</pre>";const same=String(m.noveltype)===String(slim.noveltype)&&String(m.end)===String(slim.end)&&String(m.userid)===String(slim.userid)&&String(m.writer)===String(slim.writer);html+="<div class='"+(same?"ok":"bad")+"'><b>API→slim→Master作品・作者情報一致: "+(same?"YES":"NO")+"</b></div>"}else html+="<div class='bad'>保存済みMasterに対象なし</div>"} }catch(e){html+="<div class='bad'>ERROR: "+String(e)+"</div>"}html+="</div>"}out.innerHTML=html}
document.getElementById("run").onclick=run;document.getElementById("copy").onclick=async()=>{const t=document.getElementById("out").innerText;try{await navigator.clipboard.writeText(t);alert("コピーしました")}catch(e){alert("コピーできませんでした")}};
</script></body></html>
