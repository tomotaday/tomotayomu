<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ R18 lastup 鑑定・切り込み隊 v6.8</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;line-height:1.5;background:#f7f7f7;color:#222}
h1{font-size:20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}
button{font-size:16px;padding:10px 12px;margin:4px;border:1px solid #bbb;border-radius:9px;background:#fff}
input{font-size:15px;padding:8px;width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px;min-height:180px}
</style></head><body>
<h1>🔎 R18 lastup 鑑定・切り込み隊 v6.8</h1>
<p>R18 APIの「lastup=期間指定」が現在通るかを確認する。今回、GASは使わない。</p>
<div class="card"><b>テストA：過去7日</b><br><button id="btn7">▶ lastup=sevenday</button></div>
<div class="card"><b>テストB：指定期間</b>
<label>開始</label><input id="from" type="datetime-local"><label>終了</label><input id="to" type="datetime-local">
<button id="btnRange">▶ 指定期間で試す</button></div>
<div class="card"><b>テストC：N0175GW探索</b><br><button id="btnN">▶ 直近30日からN0175GWを探す</button></div>
<div class="card"><button id="copy">📋 ししょー用に結果をコピー</button><button id="clear">🗑 結果クリア</button><pre id="log"></pre></div>
<script>
const API="https://api.syosetu.com/novel18api/api/";let seq=0,lines=[];
function log(s){lines.push(new Date().toLocaleTimeString()+" "+s);document.getElementById("log").textContent=lines.join("\n")}
function pad(n){return String(n).padStart(2,"0")}
function lv(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function ts(d){return Math.floor(d.getTime()/1000)}
function call(params,label){
 return new Promise((resolve,reject)=>{
  const cb="tomotaYomuLastupTest_"+(++seq),script=document.createElement("script"),start=Date.now();
  const url=API+"?"+new URLSearchParams({...params,out:"jsonp",callback:cb});
  const timer=setTimeout(()=>{cleanup();reject(new Error("TIMEOUT / 60000 ms"))},60000);
  function cleanup(){clearTimeout(timer);script.remove();try{delete window[cb]}catch(e){}}
  window[cb]=data=>{const elapsed=Date.now()-start;cleanup();resolve({data,elapsed,url})};
  script.src=url;script.onerror=()=>{cleanup();reject(new Error("SCRIPT ERROR"))};document.body.appendChild(script);
  log("【開始】"+label);log("URL: "+url);
 })
}
async function run(params,label){
 try{const r=await call(params,label),rows=Array.isArray(r.data)?r.data:[],works=rows.slice(1);
  log("✅ SUCCESS / "+r.elapsed+" ms");log("allcount: "+(rows[0]?.allcount??"—"));log("取得作品数: "+works.length);
  log("先頭10件: "+JSON.stringify(works.slice(0,10),null,2));return works;
 }catch(e){log("❌ "+e.message)}
}
btn7.onclick=()=>run({lastup:"sevenday",of:"n-gl-ga",lim:"100"},"R18 / lastup=sevenday / of=n-gl-ga / lim=100");
btnRange.onclick=()=>{const f=new Date(from.value),t=new Date(to.value);if(isNaN(f)||isNaN(t)||t<=f){log("⚠ 期間指定を確認してください");return}run({lastup:ts(f)+"-"+ts(t),of:"n-gl-ga",lim:"100"},"R18 / 指定期間")};
btnN.onclick=async()=>{const t=new Date(),f=new Date(t.getTime()-30*86400000),w=await run({lastup:ts(f)+"-"+ts(t),of:"n-gl-ga",lim:"500"},"R18 / 直近30日 / N0175GW探索");if(w)log("N0175GW存在確認: "+w.some(x=>String(x.ncode||"").toUpperCase()==="N0175GW"))};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(lines.join("\n"));log("📋 コピー完了")}catch(e){log("❌ コピー失敗: "+e.message)}};
clear.onclick=()=>{lines=[];log("")};
const now=new Date(),old=new Date(now.getTime()-48*3600000);from.value=lv(old);to.value=lv(now);log("【準備完了】R18 lastup 鑑定");log("API: "+API);
</script></body></html>
