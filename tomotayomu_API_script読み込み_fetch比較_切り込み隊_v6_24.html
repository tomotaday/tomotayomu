<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ API script読み込み・fetch比較 v6.24</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:16px;line-height:1.5;background:#f7f7f7;color:#222}
h1{font-size:20px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #bbb}
button{font-size:16px;padding:10px 14px;margin:4px;border-radius:10px;border:1px solid #aaa;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🧪 ともたよむ API script読み込み・fetch比較 v6.24</h1>

<div class="card">
<h2>目的</h2>
<p>v6.23で「直接アクセスは成功・fetchはLoad failed」だったため、同じDocuments環境で<strong>scriptタグによる読み込み</strong>を試す。</p>
<p>今回もAPIは軽い1件取得条件。R18・本棚・GASは使用しない。</p>
</div>

<div class="card">
<h2>① script読み込み</h2>
<button id="scriptTest">▶ script読み込みを実行</button>
<pre id="scriptLog">【未実行】</pre>
</div>

<div class="card">
<h2>② fetch</h2>
<button id="fetchTest">▶ fetchを実行</button>
<pre id="fetchLog">【未実行】</pre>
</div>

<div class="card">
<h2>③ 直接アクセス</h2>
<p><a id="direct" target="_blank" rel="noopener">通常APIを直接開く</a></p>
</div>

<div class="card">
<button id="copy">📋 全結果をコピー</button>
<button id="clear">🧹 結果を消去</button>
<pre id="allLog">【待機中】</pre>
</div>

<script>
const API="https://api.syosetu.com/novelapi/api/?lastup=sevenday&of=n-gl-ga&lim=1&st=1&out=json";
document.getElementById("direct").href=API;
const scriptLog=document.getElementById("scriptLog");
const fetchLog=document.getElementById("fetchLog");
const allLog=document.getElementById("allLog");

function stamp(){return new Date().toLocaleString("ja-JP");}
function append(s){if(allLog.textContent==="【待機中】")allLog.textContent="";allLog.textContent+=s+"\\n";}

document.getElementById("scriptTest").onclick=()=>{
 scriptLog.textContent="【実行開始 "+stamp()+"】";
 append("===== script読み込み =====");
 append("開始: "+stamp());
 append("URL: "+API);
 const old=document.getElementById("apiScript");
 if(old)old.remove();
 const s=document.createElement("script");
 s.id="apiScript";
 s.src=API+"&_cb="+Date.now();
 s.onload=()=>{
   scriptLog.textContent+="\\nloadイベント: 発生";
   append("loadイベント: 発生");
   append("判定: 🟢 scriptタグは読み込み完了");
 };
 s.onerror=(e)=>{
   scriptLog.textContent+="\\nerrorイベント: 発生";
   append("errorイベント: 発生");
   append("判定: 🔴 scriptタグ読み込み失敗");
 };
 document.head.appendChild(s);
};

document.getElementById("fetchTest").onclick=async()=>{
 fetchLog.textContent="【実行開始 "+stamp()+"】";
 append("===== fetch =====");
 append("開始: "+stamp());
 append("URL: "+API);
 const t=performance.now();
 try{
  const r=await fetch(API,{cache:"no-store"});
  const body=await r.text();
  fetchLog.textContent+="\\nHTTP "+r.status+" / "+body.slice(0,300);
  append("HTTP "+r.status+" / "+Math.round(performance.now()-t)+"ms");
  append("本文先頭: "+body.slice(0,300));
  append("判定: 🟢 fetch成功");
 }catch(e){
  fetchLog.textContent+="\\n🔴 "+String(e);
  append("🔴 fetch失敗: "+String(e)+" / "+Math.round(performance.now()-t)+"ms");
  append("判定: 🔴 fetch失敗");
 }
};

document.getElementById("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText(allLog.textContent);document.getElementById("copy").textContent="✅ コピーしました";setTimeout(()=>document.getElementById("copy").textContent="📋 全結果をコピー",1200)}
 catch(e){alert("コピーできませんでした。ログを長押ししてコピーしてください。")}
};
document.getElementById("clear").onclick=()=>{
 scriptLog.textContent="【未実行】";fetchLog.textContent="【未実行】";allLog.textContent="【待機中】";
};
</script>
</body>
</html>
