<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ GAS復帰テスト v1</title>
<style>
body{margin:0;background:#f6f4ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;padding:22px 18px 16px;border-bottom:1px solid #ddd}
h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;color:#777}
main{padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.big{font-size:23px;font-weight:800}.result{font-size:17px;font-weight:700;margin-top:8px;word-break:break-all}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.note{font-size:13px;color:#777;line-height:1.6}
#log{white-space:pre-wrap;font:12px monospace;max-height:250px;overflow:auto}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;background:#ddd}
</style>
</head>
<body>
<header>
<h1>📚 ともたよむ GAS復帰テスト v1</h1>
<div class="sub">復帰検知 → GAS読書位置取得の実験</div>
</header>
<main>
<div class="card">
<div class="big" id="state">現在：表示中</div>
<div class="result" id="result">まだGAS確認なし</div>
</div>

<div class="card">
<div class="row"><span>対象Nコード</span><strong>N0175GW</strong></div>
<div class="row"><span>復帰検知回数</span><strong id="resumeCount">0</strong></div>
<div class="row"><span>GAS確認回数</span><strong id="gasCount">0</strong></div>
<div class="row"><span>最後の取得値</span><strong id="lastValue">---</strong></div>
</div>

<div class="card">
<div class="note">
このページを表示したまま、Braveの別ページまたは別アプリへ移動してください。<br>
このページへ戻ると、復帰を検知してGASへN0175GWの読書位置を1回問い合わせます。
</div>
</div>

<div class="card"><div id="log">ログなし</div></div>
<button id="reset">リセット</button>
</main>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbxbvywLmy4aWh-_u_o_iDVDq_7AMxf9K2wPY-BhXphGbnaBp0JZ4R78_eplmYfXH3obHA/exec";
const NCODE="N0175GW";
const KEY="tomotayomu_gas_resume_test_v1";
const data={resumeCount:0,gasCount:0,lastValue:"",log:[]};
let wasHidden=false;
let checking=false;

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)Object.assign(data,s)}catch(e){}
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
  document.getElementById("state").textContent="現在："+(document.visibilityState==="visible"?"表示中":"非表示");
  document.getElementById("resumeCount").textContent=data.resumeCount;
  document.getElementById("gasCount").textContent=data.gasCount;
  document.getElementById("lastValue").textContent=data.lastValue||"---";
  document.getElementById("log").textContent=data.log.length?data.log.join("\n"):"ログなし";
}
function log(t){
  const n=new Date().toLocaleTimeString("ja-JP",{hour12:false});
  data.log.unshift(n+"  "+t);data.log=data.log.slice(0,80);
}
async function checkGAS(){
  if(checking)return;
  checking=true;
  data.resumeCount++;
  data.gasCount++;
  log("★ 復帰検知 → GAS確認開始");
  render();
  try{
    const res=await fetch(GAS_URL+"?ncode="+encodeURIComponent(NCODE),{cache:"no-store"});
    const text=await res.text();
    data.lastValue=text;
    log("GAS応答: "+text);
    document.getElementById("result").textContent="✅ "+text;
  }catch(e){
    data.lastValue="ERROR";
    log("GAS通信エラー: "+e.message);
    document.getElementById("result").textContent="❌ GAS通信エラー";
  }finally{
    checking=false;
    save();
    render();
  }
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    wasHidden=true;log("hidden");save();render();
  }else{
    log("visible");
    if(wasHidden){
      wasHidden=false;
      checkGAS();
    }else{
      save();render();
    }
  }
});
document.getElementById("reset").addEventListener("click",()=>{
  localStorage.removeItem(KEY);location.reload();
});
load();render();
</script>
</body>
</html>
