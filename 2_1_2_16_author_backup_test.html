<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ v2.1.2.16｜作者図鑑バックアップ実験</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:16px;line-height:1.5}h1{font-size:20px}.box{background:#f5f5f5;border-radius:10px;padding:12px;margin:10px 0}button{font-size:16px;padding:10px 14px;border:0;border-radius:8px;margin:4px 4px 4px 0}pre{white-space:pre-wrap;word-break:break-all}input{font-size:16px}</style></head><body><h1>ともたよむ v2.1.2.16</h1><div class="box"><b>作者図鑑データのバックアップ／復元実験</b><br>対象：tomotaYomu_v215_author_registry</div><div id="result"><pre>読み込み中…</pre></div><button onclick="backup()">バックアップJSONを保存</button><button onclick="copyBackup()">バックアップをコピー</button><br><label>復元JSONを選択：<input id="file" type="file" accept=".json,application/json" onchange="restoreFile()"></label><script>
const KEY="tomotaYomu_v215_author_registry";let registry={};let backupText="";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function load(){try{registry=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){registry={}};render()}
function render(msg){const n=Object.keys(registry).length;document.getElementById("result").innerHTML="<pre>"+esc((msg?msg+"\n\n":"")+"作者図鑑登録数="+n+"人\n保存キー="+KEY+(n?("\n\nXID一覧="+Object.keys(registry).join(", ")):""))+"</pre>"}
function makeBackup(){const payload={format:"tomotaYomu-author-registry-backup",version:"1",createdAt:new Date().toISOString(),registry:registry};return JSON.stringify(payload,null,2)}
async function backup(){
 backupText=makeBackup();
 const file=new File([backupText],"tomotayomu_author_registry_backup.json",{type:"application/json"});
 if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
  try{await navigator.share({title:"ともたよむ 作者図鑑バックアップ",text:"作者図鑑バックアップJSON",files:[file]});render("共有シートを開きました");return}catch(e){if(e.name==="AbortError"){render("共有シートを閉じました");return}}
 }
 if(navigator.share){
  try{await navigator.share({title:"ともたよむ 作者図鑑バックアップ",text:backupText});render("共有シートを開きました（ファイル共有非対応）");return}catch(e){if(e.name==="AbortError"){render("共有シートを閉じました");return}}
 }
 render("この環境では共有シートを開けません。");
}
async function copyBackup(){backupText=makeBackup();try{await navigator.clipboard.writeText(backupText);render("バックアップJSONをクリップボードへコピーしました")}catch(e){render("コピー失敗："+e.message)}}
function restoreFile(){const f=document.getElementById("file").files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(p.format!=="tomotaYomu-author-registry-backup"||!p.registry||typeof p.registry!=="object")throw new Error("このバックアップ形式ではありません");registry=p.registry;localStorage.setItem(KEY,JSON.stringify(registry));render("バックアップを復元しました")}catch(e){render("復元失敗："+e.message)}};reader.readAsText(f)}
load();
</script></body></html>
