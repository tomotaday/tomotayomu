<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ともたよむ｜作品日付診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;padding:16px;line-height:1.5;background:#fafafa;color:#222}
h1{font-size:20px;margin:0 0 4px}.version{font-size:12px;color:#888;margin-bottom:12px}
input{font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;width:180px;text-transform:uppercase}
button{font-size:15px;padding:10px 14px;border:0;border-radius:8px;background:#eee;margin-left:6px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}
.warn{background:#fff8d8;border-radius:10px;padding:12px}
.row{padding:7px 0;border-bottom:1px solid #eee}.key{font-weight:600}.val{word-break:break-all}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;font-size:12px}
small{color:#777}
</style>
</head>
<body>
<h1>ともたよむ｜作品日付診断</h1>
<div class="version">v2.1.2.18</div>
<p>APIと作品マスターの日付フィールドを比較します。</p>

<div class="card">
<input id="ncode" placeholder="N7729EK">
<button id="run">診断</button>
</div>

<div id="result"></div>

<div style="margin:12px 0">
<button id="copy">診断結果をコピー</button>
</div>

<script>
const VERSION="2.1.2.18";
const MASTER_KEY="tomotaYomu_v214_works_master";
const OF="n-t-w-s-g-gl-ga-e-nt-u-w";
let lastText="";

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function readMaster(){
  try{return JSON.parse(localStorage.getItem(MASTER_KEY)||"{}")}catch(e){return {}}
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="tyCheckCb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let done=false;
    const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()};
    const timer=setTimeout(()=>{cleanup();reject(new Error("API timeout"))},20000);
    window[cb]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error("API load error"))};
    s.src=url+"&callback="+cb;
    document.body.appendChild(s);
  });
}
function row(k,v){return '<div class="row"><span class="key">'+esc(k)+'</span><br><span class="val">'+esc(v===""?"(空)":v)+'</span></div>'}
function fmt(v){return v?String(v).replace("T"," "):"(空)"}

async function diagnose(){
  const n=String(document.getElementById("ncode").value||"").trim().toUpperCase();
  if(!n){document.getElementById("result").innerHTML='<div class="warn">Nコードを入力してください。</div>';return}
  const result=document.getElementById("result");
  result.innerHTML='<div class="warn">API取得中…</div>';
  try{
    const api="https://api.syosetu.com/novel18api/api/?out=jsonp&of="+OF+"&ncode="+encodeURIComponent(n)+"&lim=1";
    const data=await jsonp(api);
    const w=Array.isArray(data)&&data.length>1?data[1]:null;
    if(!w)throw new Error("APIから作品が返りませんでした。");
    const master=readMaster();
    const m=master[n]||null;
    const fields=["ncode","title","writer","noveltype","end","general_lastup","novelupdated_at","general_all_no","isstop","userid"];
    const apiRows=fields.map(k=>row("API."+k,k==="general_lastup"||k==="novelupdated_at"?fmt(w[k]):w[k]??"")).join("");
    const masterRows=m?fields.map(k=>row("MASTER."+k,k==="general_lastup"||k==="novelupdated_at"?fmt(m[k]):m[k]??"")).join(""):'<div class="warn">このブラウザの作品マスターにはNコードがありません。</div>';
    const latest=fmt(w.general_lastup);
    const updated=fmt(w.novelupdated_at);
    const lines=[
      "ともたよむ v"+VERSION+"｜作品日付診断",
      "Nコード："+n,
      "API general_lastup："+latest,
      "API novelupdated_at："+updated,
      "MASTER general_lastup："+fmt(m?.general_lastup),
      "MASTER novelupdated_at："+fmt(m?.novelupdated_at),
      "API title："+(w.title||""),
      "API writer："+(w.writer||"")
    ];
    lastText=lines.join("\n");
    result.innerHTML=
      '<div class="card"><h2>API</h2>'+apiRows+'</div>'+
      '<div class="card"><h2>作品マスター</h2>'+masterRows+'</div>'+
      '<div class="card"><h2>日付の比較</h2>'+
      row("API｜general_lastup（最新話更新日時）",latest)+
      row("API｜novelupdated_at（作品情報更新日時）",updated)+
      row("MASTER｜general_lastup",fmt(m?.general_lastup))+
      row("MASTER｜novelupdated_at",fmt(m?.novelupdated_at))+
      '</div>'+
      '<details class="card"><summary>API生データを見る</summary><pre>'+esc(JSON.stringify(w,null,2))+'</pre></details>';
  }catch(e){
    lastText="ともたよむ v"+VERSION+"｜作品日付診断\nエラー："+e.message;
    result.innerHTML='<div class="warn">⚠️ '+esc(e.message)+'</div>';
  }
}
document.getElementById("run").addEventListener("click",diagnose);
document.getElementById("ncode").addEventListener("keydown",e=>{if(e.key==="Enter")diagnose()});
document.getElementById("copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(lastText);document.getElementById("copy").textContent="コピーしました";setTimeout(()=>document.getElementById("copy").textContent="診断結果をコピー",1500)}
  catch(e){document.getElementById("copy").textContent="コピーできませんでした"}
});
const q=new URLSearchParams(location.search).get("ncode");
if(q){document.getElementById("ncode").value=q;diagnose();}
</script>
</body>
</html>
