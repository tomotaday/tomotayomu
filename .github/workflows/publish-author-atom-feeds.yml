name: Publish author Atom feeds

on:
  workflow_dispatch:
    inputs:
      author_list_json:
        description: "Compact JSON exported from author-export.html. Leave empty to use the saved list."
        required: false
        type: string
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: author-atom-feed-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update source author list when supplied
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.author_list_json != '' }}
        env:
          AUTHOR_LIST_JSON: ${{ inputs.author_list_json }}
        run: |
          python - <<'PY'
          import json, os, re
          raw = os.environ["AUTHOR_LIST_JSON"]
          data = json.loads(raw)
          authors = data.get("authors")
          if not isinstance(authors, list) or not authors:
              raise SystemExit("Incoming author list is empty or invalid")
          id_re = re.compile(r"^(?:[0-9]+|X[0-9A-Z]+)$", re.I)
          clean, seen = [], set()
          for item in authors:
              aid = str(item.get("author_id", "")).strip()
              typ = item.get("author_type")
              if not id_re.fullmatch(aid) or typ not in ("normal", "r18"):
                  raise SystemExit(f"Invalid author record: {aid!r}/{typ!r}")
              key = (typ, aid.upper() if aid[:1].upper() == "X" else aid)
              if key in seen:
                  continue
              seen.add(key)
              clean.append({"author_id": aid, "author_type": typ})
          output = {
              "schema_version": 1,
              "source": "tomotaYomuDB.authors",
              "exported_at": str(data.get("exported_at", "")),
              "author_count": len(clean),
              "authors": clean,
          }
          with open("data/author-list.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Updated source author list: {len(clean)} unique authors")
          PY

      - name: Validate source author list
        run: |
          test -s data/author-list.json
          python -c "import json; d=json.load(open('data/author-list.json', encoding='utf-8')); assert isinstance(d.get('authors'), list) and d['authors']"

      - name: Fetch feeds
        env:
          AUTHOR_LIST_PATH: data/author-list.json
          OUTPUT_PATH: data/atom/author-feeds.json
        run: python scripts/publish_author_atom_feeds.py

      - name: Commit changed feed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/author-list.json data/atom/author-feeds.json
          if git diff --cached --quiet; then
            echo "Feed snapshot unchanged."
          else
            git commit -m "chore: refresh author list and Atom feed snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Feed snapshots pushed successfully (attempt $attempt)."
                exit 0
              fi
              echo "Push attempt $attempt failed; will fetch and rebase before retrying."
            done
            echo "Unable to push feed snapshots after 3 attempts."
            exit 1
          fi

      - name: Upload feed snapshot for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-atom-feeds
          path: data/atom/author-feeds.json
          if-no-files-found: warn
          retention-days: 7

