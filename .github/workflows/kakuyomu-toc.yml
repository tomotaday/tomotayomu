name: カクヨム目次取得

on:
  workflow_dispatch:
    inputs:
      work_url:
        description: "カクヨム作品URL（作品IDだけでも可）"
        required: true
        default: "https://kakuyomu.jp/works/1177354054891965415"

permissions:
  contents: write

jobs:
  fetch-toc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch work page and extract episode order
        env:
          WORK_URL: ${{ inputs.work_url }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import re
          import urllib.request
          from urllib.parse import urlparse

          raw_input = os.environ["WORK_URL"].strip()
          if re.fullmatch(r"\d+", raw_input):
              work_id = raw_input
          else:
              parsed = urlparse(raw_input)
              match_id = re.fullmatch(r"/works/(\d+)/?", parsed.path)
              if parsed.scheme not in ("http", "https") or parsed.hostname not in ("kakuyomu.jp", "www.kakuyomu.jp") or not match_id:
                  raise SystemExit("カクヨム作品URL（https://kakuyomu.jp/works/作品ID）を入力してください")
              work_id = match_id.group(1)

          url = f"https://kakuyomu.jp/works/{work_id}"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; TomotaYomuTOCTest/1.0)"}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          match = re.search(
              r"<script[^>]+id=[\"']__NEXT_DATA__[\"'][^>]*>(.*?)</script>",
              html,
              re.S
          )
          if not match:
              raise SystemExit("__NEXT_DATA__ が見つかりません。ページ構造変更の可能性があります。")

          next_data = json.loads(match.group(1))
          page_props = next_data.get("props", {}).get("pageProps", {})
          apollo = page_props.get("__APOLLO_STATE__")
          if not isinstance(apollo, dict):
              raise SystemExit("__APOLLO_STATE__ が見つかりません。")

          work = apollo.get(f"Work:{work_id}")
          if not isinstance(work, dict):
              raise SystemExit(f"Work:{work_id} が見つかりません。")

          toc = work.get("tableOfContentsV2") or work.get("tableOfContents") or []
          if not isinstance(toc, list) or not toc:
              raise SystemExit("目次データが見つかりません。")

          def resolve(value):
              if isinstance(value, dict) and "__ref" in value:
                  return apollo.get(value["__ref"])
              return value if isinstance(value, dict) else None

          episodes = []
          seen = set()

          def walk_toc(items):
              for item_ref in items or []:
                  item = resolve(item_ref)
                  if not item:
                      continue

                  # Chapter/TOC node: episodeUnions holds ordered episode refs.
                  unions = item.get("episodeUnions")
                  if isinstance(unions, list):
                      for episode_ref in unions:
                          episode = resolve(episode_ref)
                          if not episode:
                              continue
                          episode_id = str(episode.get("id") or "")
                          typename = episode.get("__typename", "")
                          if not episode_id or typename == "EmptyEpisode" or episode_id in seen:
                              continue
                          seen.add(episode_id)
                          episodes.append({
                              "number": len(episodes) + 1,
                              "episode_id": episode_id,
                              "title": episode.get("title") or "",
                              "published_at": episode.get("publishedAt") or "",
                              "url": f"https://kakuyomu.jp/works/{work_id}/episodes/{episode_id}"
                          })

                  # Some TOC versions nest further TOC nodes.
                  nested = item.get("tableOfContents") or item.get("children")
                  if isinstance(nested, list):
                      walk_toc(nested)

          walk_toc(toc)

          if not episodes:
              raise SystemExit("目次からエピソードを抽出できませんでした。")

          expected = work.get("publicEpisodeCount")
          print(f"作品: {work.get('title', '')}")
          print(f"作品ID: {work_id}")
          print(f"サイト公表話数: {expected}")
          print(f"抽出話数: {len(episodes)}")
          print("先頭10件:")
          for row in episodes[:10]:
              print(f'{row["number"]}: {row["episode_id"]} {row["title"]}')

          with open("kakuyomu_toc.json", "w", encoding="utf-8") as f:
              json.dump({
                  "work_id": work_id,
                  "title": work.get("title", ""),
                  "public_episode_count": expected,
                  "extracted_count": len(episodes),
                  "episodes": episodes
              }, f, ensure_ascii=False, indent=2)

          with open("kakuyomu_toc.csv", "w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=["number", "episode_id", "title", "published_at", "url"])
              writer.writeheader()
              writer.writerows(episodes)

          # Compare the first 10 known IDs only for the dedicated reference work.
          known_reference_work_id = "1177354054891965415"
          known_first_ten = [
              "16816927860524242968",
              "1177354054891965429",
              "1177354054891965448",
              "1177354054891965464",
              "1177354054891965484",
              "1177354054898104784",
              "16816927860263910947",
              "16816927860263970990",
              "16816927860264015134",
              "16816927860264077825",
          ]
          actual_first_ten = [row["episode_id"] for row in episodes[:10]]
          if work_id == known_reference_work_id and actual_first_ten != known_first_ten:
              raise SystemExit(
                  "先頭10話のID・順序が検証値と一致しません。"
                  f" expected={known_first_ten} actual={actual_first_ten}"
              )

          if expected is not None and int(expected) != len(episodes):
              raise SystemExit(
                  "公表話数と抽出件数が一致しません。JSON保存を中止します。"
                  f" 公表={expected} 抽出={len(episodes)}"
              )
          PY

      - name: Upload TOC result
        uses: actions/upload-artifact@v4
        with:
          name: kakuyomu-toc
          path: |
            kakuyomu_toc.json
            kakuyomu_toc.csv
          if-no-files-found: error
          retention-days: 7

      - name: Save TOC JSON to repository
        env:
          WORK_URL: ${{ inputs.work_url }}
        run: |
          WORK_ID="$(python -c 'import json; print(json.load(open("kakuyomu_toc.json", encoding="utf-8"))["work_id"])')"
          mkdir -p data/kakuyomu-toc
          mv kakuyomu_toc.json "data/kakuyomu-toc/${WORK_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/kakuyomu-toc/${WORK_ID}.json"
          if git diff --cached --quiet; then
            echo "目次JSONに変更はありません。"
          else
            git commit -m "カクヨム目次更新: ${WORK_ID}"
            git push
          fi
