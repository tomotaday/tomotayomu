name: noteマガジン目次取得（汎用）

on:
  workflow_dispatch:
    inputs:
      magazine_url:
        description: "共有シートから受け取ったnoteマガジンURL（例：https://note.com/tomotaday/m/m01cdae273ca2）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-note-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: note APIから目次を最終ページまで取得
        uses: actions/github-script@v7
        env:
          MAGAZINE_URL: ${{ inputs.magazine_url }}
        with:
          script: |
            const keyMatch = (process.env.MAGAZINE_URL || '').trim();
            let parsed;
            try { parsed = new URL(keyMatch); } catch { throw new Error('マガジンURLを読み取れません'); }
            if (parsed.protocol !== 'https:' || parsed.hostname !== 'note.com') {
              throw new Error('https://note.com/ のURLを指定してください');
            }
            const match = parsed.pathname.match(/^\/([a-zA-Z0-9_-]+)\/m\/([a-zA-Z0-9]+)\/?$/);
            if (!match) throw new Error('マガジンURLの形式が不正です。/ユーザーID/m/マガジンID の形式が必要です');
            const author = match[1];
            const key = match[2];
            const magazineUrl = `https://note.com/${author}/m/${key}`;

            const base = `https://note.com/api/v1/layout/magazine/${key}/section?page=`;
            const all = [];
            const pageCounts = [];
            const seen = new Set();
            const duplicates = [];
            let lastPage = null;
            let title = key;
            let authorName = '';

            // マガジン詳細APIから表示名・作者名を取得（取得できなくても目次取得は継続）。
            const pickText = (...values) => values.find(v => typeof v === 'string' && v.trim())?.trim() || '';
            const readJson = async (url) => {
              try {
                const response = await fetch(url, {
                  headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'tomotayomu-note-magazine-index/1.0'
                  }
                });
                if (!response.ok) {
                  core.warning(`Metadata API returned HTTP ${response.status}: ${url}`);
                  return {};
                }
                return await response.json();
              } catch (error) {
                core.warning(`Metadata API could not be read: ${url} (${error.message})`);
                return {};
              }
            };
            const detailJson = await readJson(`https://note.com/api/v1/magazines/${key}`);
            const detail = detailJson?.data || {};
            const detailMagazine = detail.magazine || detail.magazine_layout || {};
            const detailUser = detail.user || detail.creator || detailMagazine.user || detailMagazine.creator || {};
            title = pickText(detail.name, detail.title, detailMagazine.name, detailMagazine.title, title);
            authorName = pickText(
              detailUser.nickname, detailUser.name, detailUser.display_name,
              detailMagazine.user_nickname, detailMagazine.creator_name
            );

            for (let page = 1; page <= 30; page++) {
              core.info(`Fetching magazine ${key}, page ${page}`);
              const response = await fetch(base + page, {
                headers: {
                  'Accept': 'application/json',
                  'User-Agent': 'tomotayomu-note-magazine-index/1.0'
                }
              });
              if (!response.ok) throw new Error(`Page ${page}: HTTP ${response.status}`);
              const json = await response.json();
              const data = json?.data || {};
              const section = data.section ?? data.page_layout?.section;
              if (!section || !Array.isArray(section.contents)) {
                throw new Error(`Page ${page}: note APIの応答形式が想定と異なります`);
              }

              // API応答にマガジン名が含まれていれば採用。見つからない場合はIDを仮表示名にする。
              title = pickText(data.magazine?.name, data.magazine?.title, data.magazine_layout?.name, data.name, title);
              const pageMagazine = data.magazine || data.magazine_layout || {};
              const pageUser = pageMagazine.user || pageMagazine.creator || data.user || data.creator || {};
              authorName = authorName || pickText(
                pageUser.nickname, pageUser.name, pageUser.display_name,
                pageMagazine.user_nickname, pageMagazine.creator_name
              );
              pageCounts.push(section.contents.length);
              section.contents.forEach((item, index) => {
                const note = item.note || {};
                const itemKey = item.key || note.key || '';
                const name = item.name || note.name || '(タイトルなし)';
                if (itemKey && seen.has(itemKey)) duplicates.push(itemKey);
                if (itemKey) seen.add(itemKey);
                all.push({
                  page,
                  positionOnPage: index + 1,
                  key: itemKey,
                  name,
                  url: itemKey ? `https://note.com/${author}/n/${itemKey}` : '',
                  publish_at: item.publish_at || note.publish_at || note.published_at || ''
                });
              });
              core.info(`Page ${page}: ${section.contents.length} items; is_last_page=${section.is_last_page}`);
              if (section.is_last_page === true) {
                lastPage = page;
                break;
              }
            }
            if (lastPage === null) throw new Error('30ページ以内に最終ページへ到達しませんでした');
            if (all.length === 0) throw new Error('記事が0件でした。空の取得結果で既存データを上書きしないため保存を中止します');

            const result = {
              magazine: title,
              authorName,
              magazineKey: key,
              authorId: author,
              magazineUrl,
              fetchedAt: new Date().toISOString(),
              lastPage,
              pageCounts,
              totalItems: all.length,
              uniqueKeys: seen.size,
              duplicateKeys: [...new Set(duplicates)],
              items: all
            };
            const outputPath = `data/note-index-${key}.json`;
            const encoded = Buffer.from(JSON.stringify(result, null, 2), 'utf8').toString('base64');
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: outputPath,
                ref: context.ref.replace('refs/heads/', '')
              });
              if (existing.data && !Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: outputPath,
              message: `Update note magazine index: ${key}`,
              content: encoded,
              ...(existingSha ? { sha: existingSha } : {}),
              branch: context.ref.replace('refs/heads/', '')
            });

            await core.summary
              .addHeading('noteマガジン目次取得')
              .addTable([
                [{data:'項目',header:true},{data:'結果',header:true}],
                ['マガジン', title],
                ['作者名', authorName || 'API応答から取得できず'],
                ['マガジンID', key],
                ['noteユーザーID', author],
                ['最終ページ', String(lastPage)],
                ['ページごとの件数', pageCounts.join(', ')],
                ['取得記事数', String(all.length)],
                ['ユニーク記事キー数', String(seen.size)],
                ['重複キー数', String(new Set(duplicates).size)],
                ['保存先', outputPath]
              ])
              .write();
            core.setOutput('output_path', outputPath);
