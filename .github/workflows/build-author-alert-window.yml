name: Build author alert window preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: author-alert-window-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build compact 90-day preview data
        run: python scripts/build_author_alerts_window.py

      - name: Commit preview data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atom/author-alerts-window.json
          if git diff --cached --quiet; then
            echo "Preview data unchanged."
          else
            git commit -m "chore: build compact author alert window preview"
            git push origin HEAD:main
          fi

      - name: Upload preview data
        uses: actions/upload-artifact@v4
        with:
          name: author-alert-window-preview
          path: data/atom/author-alerts-window.json
          retention-days: 7
