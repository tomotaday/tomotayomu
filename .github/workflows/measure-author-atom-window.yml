name: Measure author Atom 7-day snapshot

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Keep entries within this many days"
        required: true
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main (read only)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Measure current and trimmed snapshots
        env:
          DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          source = Path("data/atom/author-feeds.json")
          raw = source.read_bytes()
          data = json.loads(raw)
          days = int(os.environ["DAYS"])
          if not 1 <= days <= 365:
              raise SystemExit("days must be between 1 and 365")

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=days)
          total = recent = old = undated = 0
          trimmed = dict(data)
          trimmed_authors = []
          per_feed = []

          for author in data.get("authors", []):
              new_author = dict(author)
              new_feeds = []
              for feed in author.get("feeds", []):
                  new_feed = dict(feed)
                  kept = []
                  feed_total = feed_recent = 0
                  for entry in feed.get("entries", []):
                      total += 1
                      feed_total += 1
                      stamp = entry.get("updated") or entry.get("published") or ""
                      try:
                          parsed = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                          if parsed.tzinfo is None:
                              parsed = parsed.replace(tzinfo=timezone.utc)
                      except Exception:
                          undated += 1
                          continue
                      if parsed >= cutoff:
                          kept.append(entry)
                          recent += 1
                          feed_recent += 1
                      else:
                          old += 1
                  new_feed["entries"] = kept
                  new_feed["entry_count"] = len(kept)
                  new_feeds.append(new_feed)
                  per_feed.append({
                      "author_id": author.get("author_id"),
                      "author_type": author.get("author_type"),
                      "kind": feed.get("kind"),
                      "before": feed_total,
                      "after": feed_recent
                  })
              new_author["feeds"] = new_feeds
              trimmed_authors.append(new_author)

          trimmed["authors"] = trimmed_authors
          trimmed["measurement"] = {
              "window_days": days,
              "measured_at": now.isoformat(),
              "cutoff": cutoff.isoformat(),
              "note": "Measurement only. Source file was not modified; no repository commit is made."
          }
          compact = json.dumps(trimmed, ensure_ascii=False, separators=(",", ":")).encode("utf-8") + b"\n"
          Path("author-feeds-window.json").write_bytes(compact)

          before = len(raw)
          after = len(compact)
          report = {
              "window_days": days,
              "measured_at": now.isoformat(),
              "source_file": str(source),
              "source_bytes": before,
              "window_bytes": after,
              "saved_bytes": before - after,
              "saved_percent": round((before-after) / before * 100, 2) if before else 0,
              "total_entries": total,
              "kept_entries": recent,
              "excluded_older_entries": old,
              "excluded_undated_entries": undated,
              "author_count": len(data.get("authors", [])),
              "feed_count": sum(len(a.get("feeds", [])) for a in data.get("authors", [])),
              "per_feed": per_feed
          }
          Path("atom-window-measurement.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          for key, value in report.items():
              if key != "per_feed":
                  print(f"{key}: {value}")
          PY

      - name: Upload measurement files (no repository changes)
        uses: actions/upload-artifact@v4
        with:
          name: author-atom-7day-measurement
          path: |
            atom-window-measurement.json
            author-feeds-window.json
          retention-days: 7
