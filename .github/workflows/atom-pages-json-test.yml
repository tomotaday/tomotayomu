name: Test publish Atom JSON to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      author_ids:
        description: "Comma-separated Narou author IDs"
        required: true
        default: "1826746,64980"
        type: string

permissions:
  contents: write

jobs:
  publish-test-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out isolated Atom test scripts
        uses: actions/checkout@v4
        with:
          ref: test/github-actions-atom
          path: test-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Atom feeds and generate Pages JSON
        env:
          AUTHOR_IDS: ${{ inputs.author_ids }}
          OUTPUT_PATH: pages-test/atom/authors.json
        run: python test-source/scripts/atom_batch_test.py

      - name: Commit JSON to main for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-test/atom/authors.json
          if git diff --cached --quiet; then
            echo "JSON is unchanged; no commit needed."
          else
            git commit -m "test: publish Atom JSON to GitHub Pages"
            git push origin HEAD:main
          fi

      - name: Upload JSON artifact for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atom-pages-json-test
          path: pages-test/atom/authors.json
          if-no-files-found: warn
          retention-days: 7
