name: Test Narou Atom via GitHub Actions

on:
  workflow_dispatch:
    inputs:
      author_id:
        description: "Narou author ID (default: 1826746)"
        required: false
        default: "1826746"
        type: string

permissions:
  contents: write

jobs:
  atom-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: test/github-actions-atom

      - name: Fetch Atom feeds and generate JSON
        env:
          AUTHOR_ID: ${{ inputs.author_id }}
          OUTPUT_PATH: atom-test-result/author-${{ inputs.author_id }}.json
        run: python3 scripts/atom_test.py

      - name: Copy JSON to a static test-data path
        env:
          AUTHOR_ID: ${{ inputs.author_id }}
        run: |
          mkdir -p test-data/atom
          cp "atom-test-result/author-${AUTHOR_ID}.json" "test-data/atom/author-${AUTHOR_ID}.json"

      - name: Commit generated JSON to the isolated test branch
        env:
          AUTHOR_ID: ${{ inputs.author_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "test-data/atom/author-${AUTHOR_ID}.json"
          if git diff --cached --quiet; then
            echo "JSON is unchanged; no commit needed."
          else
            git commit -m "test: publish Atom JSON for author ${AUTHOR_ID}"
            git push origin HEAD:test/github-actions-atom
          fi

      - name: Upload JSON result even if a feed fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atom-test-author-${{ inputs.author_id }}
          path: atom-test-result/author-${{ inputs.author_id }}.json
          if-no-files-found: warn
          retention-days: 7
