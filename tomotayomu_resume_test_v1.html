<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ともたよむ 復帰検知テスト v1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px 14px;background:#fff;border-bottom:1px solid #e5e1d8}h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;color:#777}
main{padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000d}
.title{font-size:18px;font-weight:700;margin-bottom:7px}.meta{font-size:13px;color:#777;margin-bottom:12px}
.resume{display:block;text-decoration:none;text-align:center;background:#eee;padding:12px;border-radius:12px;color:#222;font-weight:700}
.status{font-size:18px;font-weight:700}.counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.count{background:#f3f3f3;border-radius:10px;padding:10px}.count small{display:block;color:#777;font-size:12px}.count strong{font-size:22px}
#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;max-height:220px;overflow:auto}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px}.reset{background:#ddd}.note{font-size:13px;color:#777;line-height:1.6}
</style></head><body>
<header><h1>📚 ともたよむ 復帰検知テスト v1</h1><div class="sub">index.html もどき・復帰検知だけを実験</div></header>
<main>
<div class="card"><div class="title">🟠 読書中</div><div class="meta">テスト作品 ／ 58 / 210話</div>
<a class="resume" href="https://ncode.syosetu.com/n0175gw/58/" target="_self">続きから　📖 58 / 210話</a></div>
<div class="card"><div class="status" id="status">現在：表示中</div><div class="counts">
<div class="count"><small>visibilitychange</small><strong id="vc">0</strong></div>
<div class="count"><small>focus</small><strong id="focus">0</strong></div>
<div class="count"><small>pageshow</small><strong id="pageshow">0</strong></div>
<div class="count"><small>pagehide</small><strong id="pagehide">0</strong></div>
</div></div>
<div class="card"><div class="note">「続きから」でBraveの作品ページへ移動し、そこからこのページへ戻ってください。戻ったときに復帰イベントが検知されれば、カウントとログが増えます。</div></div>
<div class="card"><div id="log">ログなし</div></div>
<button class="reset" id="reset">リセット</button>
</main>
<script>
const KEY="tomotayomu_resume_test_v1";
const state={vc:0,focus:0,pageshow:0,pagehide:0,log:[]};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)Object.assign(state,s)}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){document.getElementById("status").textContent="現在："+(document.visibilityState==="visible"?"表示中":"非表示");document.getElementById("vc").textContent=state.vc;document.getElementById("focus").textContent=state.focus;document.getElementById("pageshow").textContent=state.pageshow;document.getElementById("pagehide").textContent=state.pagehide;document.getElementById("log").textContent=state.log.length?state.log.join("\n"):"ログなし"}
function record(type,detail=""){const now=new Date().toLocaleTimeString("ja-JP",{hour12:false});state[type]++;state.log.unshift(now+"  "+type+(detail?"  "+detail:""));state.log=state.log.slice(0,80);save();render()}
document.addEventListener("visibilitychange",()=>record("vc","state="+document.visibilityState));
window.addEventListener("focus",()=>record("focus"));
window.addEventListener("pageshow",e=>record("pageshow","persisted="+e.persisted));
window.addEventListener("pagehide",()=>record("pagehide"));
document.getElementById("reset").addEventListener("click",()=>{localStorage.removeItem(KEY);location.reload()});
load();render();
</script></body></html>
