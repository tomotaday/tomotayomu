<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ 実験⑨ 更新棚保存データ調査</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;line-height:1.45;background:#f7f7f7;color:#222}h1{font-size:20px}button{font-size:16px;padding:10px 14px;margin:4px;border:0;border-radius:9px;background:#222;color:#fff}.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #ddd}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}.small{font-size:13px;color:#666}.key{font-weight:bold;word-break:break-all}</style></head><body><h1>🔬 実験⑨「更新棚」保存データ調査</h1><div class="card"><b>目的</b><p>本番と同じGitHub Pages上で、localStorageに何が保存されているか確認する。</p><p class="small">今回は長文を一括コピーしない。必要な項目を1個ずつコピーする。</p></div><button id="run">▶ 調査開始</button><div id="summary" class="card">待機中</div><div id="results"></div><script>
const $=id=>document.getElementById(id);
const known=["tomotaYomu_v214_global_baseline","tomotaYomu_v214_update_candidates","tomotaYomu_v214_latest_works","tomotaYomu_v211_update_baseline","tomotaYomu_v211_reading","tomotaYomu_v211_active_ncode","tomotaYomu_v211_last_check"];
function pretty(v){try{return JSON.stringify(JSON.parse(v),null,2)}catch(e){return v}}
async function copyText(t,b){try{await navigator.clipboard.writeText(t);b.textContent="✅ コピー済み"}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.focus();x.select();document.execCommand("copy");x.remove();b.textContent="✅ コピー済み"}setTimeout(()=>b.textContent="📋 これだけコピー",1500)}
function run(){
 $("results").innerHTML="";
 const all=[];for(let i=0;i<localStorage.length;i++)all.push(localStorage.key(i));
 const present=known.filter(k=>localStorage.getItem(k)!==null);
 $("summary").innerHTML="<b>調査完了</b><br>localStorage項目数: "+localStorage.length+"<br>既知キー: "+present.length+"/"+known.length+"<br>その他のキー: "+all.filter(k=>!known.includes(k)).length+"<p class='small'>👇 下の「必要な項目だけ」を順番にコピーして送ってね。全部はいらない。</p>";
 const c=document.createElement("div");c.className="card";c.innerHTML="<b>① localStorageキー一覧</b><button id='copyKeys'>📋 これだけコピー</button><pre id='keys'></pre>";$("results").appendChild(c);
 $("keys").textContent=all.length?all.join("\n"):"(なし)";
 $("copyKeys").onclick=()=>copyText("=== localStorage key一覧 ===\n"+$("keys").textContent,$("copyKeys"));
 for(const k of known){
   const v=localStorage.getItem(k),d=document.createElement("div");d.className="card";
   d.innerHTML="<div class='key'>② "+k+"</div><button>📋 これだけコピー</button><pre></pre>";
   d.querySelector("pre").textContent=v===null?"(未保存)":pretty(v);
   const b=d.querySelector("button");b.onclick=()=>copyText("["+k+"]\n"+d.querySelector("pre").textContent,b);
   $("results").appendChild(d);
 }
 const note=document.createElement("div");note.className="card";note.innerHTML="<b>③ その他のキー</b><pre id='extra'></pre><button id='copyExtra'>📋 これだけコピー</button>";$("results").appendChild(note);
 const extra=all.filter(k=>!known.includes(k));$("extra").textContent=extra.length?extra.join("\n"):"(なし)";
 $("copyExtra").onclick=()=>copyText("=== その他のキー ===\n"+$("extra").textContent,$("copyExtra"));
}
$("run").onclick=run;
</script></body></html>
