<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ともたよむ 実験⑨ 更新棚保存データ調査</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;line-height:1.45;background:#f7f7f7;color:#222}h1{font-size:20px}button{font-size:16px;padding:10px 14px;margin:4px;border:0;border-radius:9px;background:#222;color:#fff}.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #ddd}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}.small{font-size:13px;color:#666}</style></head><body><h1>🔬 実験⑨「更新棚」保存データ調査</h1><div class="card"><b>目的</b><p>本番のともたよむと同じGitHub Pages上で、localStorageに実際に保存されている更新関連データを確認する。</p><p class="small">今回はコードを推測せず、「何が保存されているか」を先に確認する。</p></div><button id="run">▶ 調査開始</button><button id="copy">📋 コピペちゃん</button><div id="summary" class="card">待機中</div><div id="results"></div><h2>📋 コピー用調査結果</h2><pre id="out">まだ実行していません。</pre><script>const $=id=>document.getElementById(id);const known=["tomotaYomu_v214_global_baseline","tomotaYomu_v214_update_candidates","tomotaYomu_v214_latest_works","tomotaYomu_v211_update_baseline","tomotaYomu_v211_reading","tomotaYomu_v211_active_ncode","tomotaYomu_v211_last_check"];function pretty(v){try{return JSON.stringify(JSON.parse(v),null,2)}catch(e){return v}}function run(){const lines=["実験⑨「更新棚」保存データ調査","origin = "+location.origin,"pathname = "+location.pathname,"","=== localStorage key一覧 ==="];for(let i=0;i<localStorage.length;i++)lines.push(localStorage.key(i));lines.push("","=== 既知キー ===");for(const k of known){const v=localStorage.getItem(k);lines.push("["+k+"]");lines.push(v===null?"(未保存)":pretty(v));lines.push("")}const extra=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!known.includes(k))extra.push(k)}$("summary").innerHTML="<b>調査完了</b><br>localStorage項目数: "+localStorage.length+"<br>既知キー: "+known.filter(k=>localStorage.getItem(k)!==null).length+"/"+known.length+"<br>その他のキー: "+extra.length;$("results").innerHTML="";const c=document.createElement("div");c.className="card";c.innerHTML="<b>重要</b><p>このページが本番と同じGitHub Pages originなら、本番アプリと共有されるlocalStorageを読み取れる。</p><p class='small'>もし0件なら、Brave/PWAなど実行場所が違う可能性がある。</p>";$("results").appendChild(c);$("out").textContent=lines.join("\n")}$("run").onclick=run;$("copy").onclick=async()=>{const t=$("out").textContent;try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}$("copy").textContent="✅ コピーしました";setTimeout(()=>$("copy").textContent="📋 コピペちゃん",1500)}</script></body></html>
