<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed">
<title>ともたよむ｜作品登録</title>
<style>
:root{--bg:#f6f3ed;--card:#fffdf9;--ink:#252525;--muted:#777;--line:#aaa195}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.6}
main{width:min(100%,720px);margin:auto;padding:22px 16px 48px}h1{font-size:25px;margin:10px 0 6px}.note{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
label{display:block;font-weight:700;margin:12px 0 4px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}input,select{width:100%}button{font-weight:700;margin-top:10px;width:100%;background:#eee8dd}button:disabled{opacity:.55}
.status{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}.result{border-top:1px solid #ddd5ca;margin-top:14px;padding-top:12px}.row{margin:9px 0}.key{font-size:12px;color:var(--muted)}.value{overflow-wrap:anywhere;white-space:pre-wrap}.error{color:#9b3d32;font-weight:700}.ok{color:#276749;font-weight:700}
</style>
</head>
<body><main>
<p><a href="index.html">← ともたよむ本棚へ戻る</a></p>
<h1>📚 作品登録</h1>
<p class="note">ショートカットからNコードを受け取り、APIで作品情報を取得できたら、本棚管理で指定した「📥登録先」へ自動登録します。</p>
<section class="card">
<label for="ncode">Nコード</label><input id="ncode" autocomplete="off" placeholder="例：N9622MV">
<button id="fetchBtn" type="button">作品情報を取得</button>
<div id="status" class="status" aria-live="polite" style="margin-top:12px">ショートカットから開くとNコードが自動入力されます。</div>
<div id="result" class="result" hidden></div>
<div id="saveArea" hidden><div id="targetShelf" class="status"></div></div>
<div id="saveStatus" class="status" aria-live="polite" style="margin-top:12px"></div>
</section>
<p class="muted">APIで作品情報を取得できなかった場合は、原因を推測せず取得失敗だけを表示します。</p>
</main>
<script>
"use strict";
const DB_NAME="tomotaYomuDB",DB_VERSION=1;
const API_URL="https://api.syosetu.com/novelapi/api/";
const R18_API_URL="https://api.syosetu.com/novel18api/api/";
const $=id=>document.getElementById(id);
let fetchedWork=null, fetchedR18=false, shelfRows=[], saveBusy=false;
function normalizeNcode(raw){const m=String(raw||"").trim().match(/N[0-9]{1,}[A-Z]{1,5}/i);return m?m[0].toUpperCase():"";}
function setStatus(text,cls=""){$("status").className="status "+cls;$("status").textContent=text;}
function setSaveStatus(text,cls=""){$("saveStatus").className="status "+cls;$("saveStatus").textContent=text;}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="tomotaRegisterV2_"+Date.now()+"_"+Math.random().toString(36).slice(2),script=document.createElement("script");let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}script.remove()};const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"))},20000);window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error("load error"))};script.src=url+"&callback="+cb;document.body.appendChild(script)});}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("IndexedDBを開けません"));});}
function readAll(db,name){return new Promise((resolve,reject)=>{const tx=db.transaction(name,"readonly"),out=[],r=tx.objectStore(name).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else resolve(out)};r.onerror=()=>reject(r.error||new Error(name+"の読込失敗"));});}
function putRow(tx,store,row,key){const st=tx.objectStore(store);return st.keyPath==null?st.put(row,key):st.put(row);}
function statusText(w){if(Number(w.noveltype)===2)return "短編";if(Number(w.end)===0)return "完結";if(Number(w.end)===1)return "連載中";return "不明";}
const GENRES={"0":"未選択","101":"異世界〔恋愛〕","102":"現実世界〔恋愛〕","201":"ハイファンタジー〔ファンタジー〕","202":"ローファンタジー〔ファンタジー〕","301":"純文学〔文芸〕","302":"ヒューマンドラマ〔文芸〕","303":"歴史〔文芸〕","304":"推理〔文芸〕","305":"ホラー〔文芸〕","306":"アクション〔文芸〕","307":"コメディー〔文芸〕","401":"VRゲーム〔SF〕","402":"宇宙〔SF〕","403":"空想科学〔SF〕","404":"パニック〔SF〕","9901":"童話〔その他〕","9902":"詩〔その他〕","9903":"エッセイ〔その他〕","9904":"リプレイ〔その他〕","9999":"その他〔その他〕","9801":"ノンジャンル〔ノンジャンル〕"};
function showWork(w){const fields=[["Nコード",w.ncode],["作品タイトル",w.title],["作者名",w.writer],["あらすじ",w.story],["作品状態",statusText(w)],["エピソード数",w.general_all_no],["初回掲載日時",w.general_firstup],["最新掲載日時",w.general_lastup],["文字数",w.length==null?null:Number(w.length).toLocaleString("ja-JP")+" 字"],["ジャンル",GENRES[String(w.genre)]||"未対応・未設定"]];const box=$("result");box.replaceChildren();box.hidden=false;for(const [label,value] of fields){const row=document.createElement("div");row.className="row";const k=document.createElement("div");k.className="key";k.textContent=label;const v=document.createElement("div");v.className="value";v.textContent=value==null||value===""?"（取得データなし）":String(value);row.append(k,v);box.append(row);}}
async function loadShelves(){const db=await openDB();try{shelfRows=await readAll(db,"shelf_names");}finally{db.close()}const target=shelfRows.find(s=>s&&s.work_add_target===true);if(!target)throw new Error("本棚管理で「📥登録先」を指定してください。");return target;}
async function run(){const ncode=normalizeNcode($("ncode").value);$("result").hidden=true;$("saveArea").hidden=true;$("saveStatus").textContent="";fetchedWork=null;if(!ncode){setStatus("Nコードを確認してください。","error");return;}$("ncode").value=ncode;$("fetchBtn").disabled=true;setStatus(ncode+" の作品情報を取得しています…");try{const fields="n-t-s-w-gf-gl-ga-nt-e-l-g";let found=null;for(const [base,isR18] of [[API_URL,false],[R18_API_URL,true]]){try{const data=await jsonp(base+"?out=jsonp&of="+fields+"&ncode="+encodeURIComponent(ncode)+"&lim=1");const hit=Array.isArray(data)?data.find(x=>x&&x.ncode):null;if(hit){found=hit;fetchedR18=isR18;break;}}catch(e){/* 次のAPIも確認する */}}if(!found){setStatus("⚠️ APIから作品情報を取得できませんでした。","error");return;}fetchedWork={...found,ncode:String(found.ncode||ncode).toUpperCase(),writer:String(found.writer||""),story:String(found.story||""),general_all_no:Number(found.general_all_no||0),general_firstup:found.general_firstup||"",general_lastup:found.general_lastup||"",noveltype:Number(found.noveltype||1),end:Number(found.end??1),length:Number(found.length||0),genre:Number(found.genre||0),userid:Number(found.userid||0),__r18:fetchedR18};showWork(fetchedWork);$("saveArea").hidden=false;try{const target=await loadShelves();$("targetShelf").textContent="登録先："+String(target.shelf_name??target.name??target.title??"指定本棚");await saveToTarget(target);}catch(e){setStatus("作品情報は取得できましたが、自動登録できませんでした。","error");setSaveStatus("登録失敗："+e.message,"error");}}catch(e){setStatus("⚠️ APIから作品情報を取得できませんでした。","error");}finally{$("fetchBtn").disabled=false;}}
async function saveToTarget(target){if(saveBusy)return;saveBusy=true;setSaveStatus("指定先の本棚へ自動登録しています…");try{if(!fetchedWork)throw new Error("作品情報がありません。");const db=await openDB();try{const oldWork=await new Promise((resolve,reject)=>{const r=db.transaction("works_cache","readonly").objectStore("works_cache").get(fetchedWork.ncode);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error||new Error("既存作品の確認に失敗しました"));});if(oldWork){setSaveStatus("この作品はすでに作品情報に登録されています。既存データは変更していません。");return;}const placements=await readAll(db,"shelf_placement");if(placements.some(p=>String(p?.ncode||"").toUpperCase()===fetchedWork.ncode)){setSaveStatus("この作品はすでに本棚に登録されています。既存データは変更していません。");return;}const novelHost=fetchedR18?"novel18.syosetu.com":"ncode.syosetu.com";const work={...fetchedWork,source_url:"https://"+novelHost+"/"+fetchedWork.ncode+"/"};const tx=db.transaction(["works_cache","shelf_placement","authors"],"readwrite");putRow(tx,"works_cache",work,fetchedWork.ncode);putRow(tx,"shelf_placement",{ncode:fetchedWork.ncode,shelf_id:String(target.shelf_id)},fetchedWork.ncode);if(work.userid){putRow(tx,"authors",{ncode:fetchedWork.ncode,writer:work.writer,authorName:work.writer,authorId:String(work.userid),authorType:fetchedR18?"r18":"normal",authorUrl:"https://"+novelHost+"/"+String(work.userid)+"/"},fetchedWork.ncode);}await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("保存に失敗しました"));tx.onabort=()=>reject(tx.error||new Error("保存が中止されました"));});setSaveStatus("自動登録しました："+String(target.shelf_name??target.name??target.title??"指定本棚")+"。","ok");}finally{db.close();}}catch(e){setSaveStatus("登録失敗："+e.message,"error");}finally{saveBusy=false;}}
$("fetchBtn").addEventListener("click",run);
const params=new URLSearchParams(location.search);const incoming=normalizeNcode(params.get("ncode")||params.get("code")||"");if(incoming){$("ncode").value=incoming;run();}
</script></body></html>
